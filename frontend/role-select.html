<script>
  // Apply saved theme before first paint — no flash
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem("cd_theme") || "{}");
      var dark = t.mode === "dark" || (t.mode === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      document.documentElement.setAttribute("data-accent", t.accent || "green");
    } catch (e) {}
  })();
</script>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* ---- Background Mesh ---- */
  .bg-mesh {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    overflow: hidden;
  }
  .bg-mesh::before {
    content: "";
    position: absolute;
    top: -30%; left: -20%;
    width: 70vw; height: 70vw;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
    animation: drift1 18s ease-in-out infinite alternate;
  }
  .bg-mesh::after {
    content: "";
    position: absolute;
    bottom: -20%; right: -10%;
    width: 60vw; height: 60vw;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
    animation: drift2 22s ease-in-out infinite alternate;
  }
  @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(5vw, 3vh); } }
  @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-4vw, -5vh); } }

  /* ---- Layout ---- */
  .page-wrap {
    position: relative; z-index: 1;
    flex: 1;
    display: flex; flex-direction: column;
    min-height: 100vh;
  }
