<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Choose Your Role — CampusDine</title>
<link rel="icon" type="image/png" href="/images/landing/logo-green.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Apply saved theme before first paint — no flash
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem("cd_theme") || "{}");
      var dark = t.mode === "dark" || (t.mode === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      document.documentElement.setAttribute("data-accent", t.accent || "green");
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #F0F4F1;
    --panel: #FFFFFF;
    --ink: #1F2937;
    --ink-soft: #6B7280;
    --line: #E5E7EB;
    --gold: #4F7F5F;
    --gold-hover: #3f664c;
    --gold-soft: #e6ede9;
    --gold-bright: #3f664c;
    --teal-deep: #213528;
    --accent-glow: rgba(79,127,95,0.18);
    --accent-shadow: rgba(63,102,76,0.5);
    --accent-border: #c7d6cc;
  }
  html[data-accent="blue"]   { --gold:#2F76B8; --gold-hover:#276198; --gold-soft:#e2ecf5; --gold-bright:#276198; --teal-deep:#14324d; --accent-border:#bcd3e8; --accent-glow:rgba(47,118,184,0.18); --accent-shadow:rgba(39,97,152,0.5); --bg:#EEF4FA; }
