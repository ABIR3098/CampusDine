<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Choose Your Role — CampusDine</title>
<link rel="icon" type="image/png" href="/images/landing/logo-green.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Apply saved theme before first paint — no flash
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem("cd_theme") || "{}");
      var dark = t.mode === "dark" || (t.mode === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      document.documentElement.setAttribute("data-accent", t.accent || "green");
    } catch (e) {}
  })();
