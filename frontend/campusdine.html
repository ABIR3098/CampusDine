<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusDine — Smart Campus Canteen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Hind+Siliguri:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg: #F5F7FA;
    --panel: #FFFFFF;
    --ink: #1F2937;
    --ink-soft: #6B7280;
    --teal: #16A34A;
    --teal-deep: #14532D;
    --gold: #16A34A;
    --gold-bright: #15803D;
    --gold-deep: #15803D;
    --gold-soft: #DCFCE7;
    --brick: #DC2626;
    --leaf: #16A34A;
    --line: #E5E7EB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', 'Hind Siliguri', ui-sans-serif, system-ui, sans-serif;
  }
  .font-display{font-family:'Plus Jakarta Sans', 'Hind Siliguri', ui-sans-serif, system-ui, sans-serif;}
  .font-mono{font-family:'JetBrains Mono', ui-monospace, monospace;}
  .gold-text{ color: var(--gold-deep); }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:8px;}

  .ticket{
    position:relative;
    background: linear-gradient(135deg, #16A34A 0%, #15803D 100%);
    color:#FFFFFF;
    border-radius: 12px;
    overflow:visible;
    box-shadow: 0 6px 16px -8px rgba(21,128,61,0.6);
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:18px; height:18px;
    background: var(--bg);
    border-radius:50%;
  }
  .ticket::before{ left:-9px; }
  .ticket::after{ right:-9px; }
  .ticket .perf{ border-left: 2px dashed rgba(255,255,255,0.45); }

  .tab-btn{
    font-weight:600;
    transition: all .15s ease;
  }
  .tab-btn.active{
    background: var(--gold);
    color: #FFFFFF;
  }
  .tab-btn:not(.active){
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .tab-btn:not(.active):hover{
    border-color: var(--gold);
    color: var(--gold-deep);
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.05);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .card:hover{
    border-color: #BBF7D0;
    box-shadow: 0 4px 12px rgba(16,24,40,0.06);
  }

  .btn-primary{
    background: var(--gold);
    color: #FFFFFF;
    font-weight:600;
    font-size:.9em;
    border-radius:8px;
    transition: background .15s ease, transform .1s ease;
  }
  .btn-primary:hover{ background: var(--gold-deep); }
  .btn-primary:active{ transform: scale(.98); }
  .btn-primary:disabled{ background:#D1D5DB; color:#9CA3AF; cursor:not-allowed; transform:none; }

  .btn-gold{
    background: #FFFFFF;
    border: 1px solid var(--gold);
    color: var(--gold-deep);
    font-weight:600;
    font-size:.9em;
  }
  .btn-gold:hover{ background: var(--gold); color: #FFFFFF; }
  .btn-gold:disabled{ border-color:#D1D5DB; color:#9CA3AF; background:#F3F4F6; cursor:not-allowed; }

  .stepper-dot{
    width:14px;height:14px;border-radius:50%;
    background:var(--line);
    border:2px solid var(--line);
  }
  .stepper-dot.done{ background:var(--gold); border-color:var(--gold); }
  .stepper-dot.current{ background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 5px rgba(22,163,74,0.18); }

  .cal-cell{
    aspect-ratio:1/1;
    border-radius:8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer;
    user-select:none;
    border:1px solid var(--line);
    transition: transform .1s ease, border-color .15s ease;
    background:var(--panel);
    color: var(--ink);
  }
  .cal-cell:hover{ transform: translateY(-2px); border-color: var(--gold); }
  .cal-full{ background: var(--gold); color:#FFFFFF; border-color:var(--gold); }
  .cal-half{ background: var(--gold-soft); color:var(--teal-deep); border-color:var(--gold); }

  .fade-in{ animation: fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .low-stock-banner{
    background: #FEF2F2;
    border: 1px solid #FECACA;
  }

  .error-banner{ background:#FEF2F2; color:#B91C1C; border:1px solid #FECACA; }
  .success-banner{ background:#F0FDF4; color:#15803D; border:1px solid #BBF7D0; }

  #print-area{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #print-area, #print-area *{ visibility:visible; }
    #print-area{
      display:block; position:absolute; left:0; top:0; width:100%;
      display:flex; justify-content:center; padding:32px 16px;
    }
    .receipt{
      width:320px; border:1.5px dashed #9CA3AF; border-radius:14px;
      padding:22px 20px; font-family:'Plus Jakarta Sans', 'Hind Siliguri', ui-sans-serif, sans-serif;
      color:#111827;
    }
    .receipt-row{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; }
    .receipt-divider{ border-top:1px dashed #9CA3AF; margin:12px 0; }
  }

  .chip{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .chip:hover{ border-color: var(--gold); color: var(--gold-deep); }
  .chip.active-chip{
    background: var(--gold);
    color: #FFFFFF;
    border-color: var(--gold);
  }

  .logo-badge{
    background: var(--gold);
    border-radius: 10px;
  }

  .divider-flourish{ display:flex; align-items:center; justify-content:center; gap:14px; color: var(--gold); }
  .divider-flourish::before, .divider-flourish::after{
    content:""; flex:1; max-width:80px; border-bottom:1px solid var(--line);
  }

  input, select, textarea{ background: #FFFFFF; color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  button:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

/* ---------------- Constants ---------------- */
const DEFAULT_API_BASE = (window.location.origin && window.location.origin !== "null")
  ? window.location.origin
  : "http://localhost:5000";
const LOW_STOCK_THRESHOLD = 10;
const CATEGORIES = [
  { id: "heavy", label: "Heavy meals" },
  { id: "snacks", label: "Snacks" },
  { id: "drinks", label: "Drinks" },
];
const STATUSES = ["Received", "Cooking", "Ready"];

/* ---------------- API helper ---------------- */
async function api(apiBase, path, { method = "GET", body, token } = {}) {
  const res = await fetch(`${apiBase}${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

/* ---------------- Small icon set (inline SVG, no deps) ---------------- */
const Icon = ({ path, className = "w-5 h-5", fill = "none", style }) => (
  <svg viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2"
       strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
    <path d={path} />
  </svg>
);
const I = {
  menu: "M3 6h18M3 12h18M3 18h18",
  cart: "M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L22 8H6",
  clock: "M12 2a10 10 0 1 0 .001 20.001A10 10 0 0 0 12 2Zm1 5v5l4 2",
  wallet: "M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Zm14 3h.01M3 9h18",
  calendar: "M8 2v4M16 2v4M3 9h18M4 4h16a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z",
  dashboard: "M4 4h7v7H4V4Zm9 0h7v4h-7V4Zm0 7h7v9h-7v-9ZM4 14h7v6H4v-6Z",
  box: "M21 8L12 3 3 8l9 5 9-5Zm0 0v8l-9 5-9-5V8m18 0-9 5-9-5",
  chart: "M4 19V5M4 19h16M8 15v4M12 11v8M16 7v12",
  bell: "M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9ZM13.7 21a2 2 0 0 1-3.4 0",
  plus: "M12 5v14M5 12h14",
  minus: "M5 12h14",
  check: "M20 6 9 17l-5-5",
  arrow: "M5 12h14M13 5l7 7-7 7",
  logout: "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
  user: "M20 21a8 8 0 1 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z",
  ticket: "M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z",
  plug: "M9 7V2m6 5V2M6 7h12l-1 6a5 5 0 0 1-10 0L6 7Zm4 11v3h4v-3",
  star: "M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.5 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8L12 2.5Z",
  chevronLeft: "M15 18l-6-6 6-6",
  chevronRight: "M9 18l6-6-6-6",
  lock: "M12 15.5v2M7 10.5V7.5a5 5 0 0 1 10 0v3M5.5 10.5h13a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1Z",
  shield: "M12 2 4 5v6c0 5 3.4 8.5 8 9 4.6-.5 8-4 8-9V5l-8-3Zm-2 9.2 1.6 1.6L15.5 9",
  x: "M18 6 6 18M6 6l12 12",
  printer: "M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6Z",
  edit: "M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z",
};

/* ---------------- Helpers ---------------- */
const taka = (n) => `৳${Number(n || 0).toLocaleString("en-BD")}`;
function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); } // month is 1-12 here
function monthLabel(ym) {
  const [y, m] = ym.split("-");
  return new Date(Number(y), Number(m) - 1).toLocaleString("default", { month: "short" });
}

/* ---------------- Login / Register screen ---------------- */
function Login({ apiBase, setApiBase, onAuth }) {
  const [mode, setMode] = useState("login"); // 'login' | 'register' | 'forgot'
  const [role, setRole] = useState(null);
  const [name, setName] = useState("");
  const [externalId, setExternalId] = useState("");
  const [password, setPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [resetMsg, setResetMsg] = useState(null);
  const [showAdvanced, setShowAdvanced] = useState(false);
  const authRef = useRef(null);

  const roleOptions = [
    { key: "student", label: "Student", desc: "Order meals, track pickup, manage your subscription.", icon: I.user },
    { key: "teacher", label: "Teacher / Staff", desc: "Same convenience, faculty meal rate.", icon: I.user },
    { key: "admin", label: "Canteen Admin", desc: "Run the counter — orders, stock, reports.", icon: I.dashboard },
  ];

  const features = [
    { title: "Token-Based Pickup", desc: "Order ahead and skip the queue — just collect your food with your token." },
    { title: "Digital Wallet", desc: "Cashless payments, instant top-ups, and a fully transparent transaction history." },
    { title: "Auto Subscription Billing", desc: "Your monthly meal bill, calculated automatically and accurately." },
    { title: "Live Order Tracking", desc: "Know exactly where your order stands, in real time — no refresh needed." },
  ];

  const sampleMenu = [
    { name: "Tehari", tag: "Rice & Meat", price: "৳ 80", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80" },
    { name: "Chicken Roll", tag: "Savory Snack", price: "৳ 50", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80" },
    { name: "Vintage Cold Brew", tag: "Beverage", price: "৳ 35", img: "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?auto=format&fit=crop&w=500&q=80" },
  ];

  const scrollToAuth = () => authRef.current && authRef.current.scrollIntoView({ behavior: "smooth", block: "start" });

  const submit = async () => {
    setError(null);
    if (!externalId || !password || (mode === "register" && !name)) {
      setError("Please fill in all fields.");
      return;
    }
    setBusy(true);
    try {
      const data = mode === "login"
        ? await api(apiBase, "/api/auth/login", { method: "POST", body: { externalId, password } })
        : await api(apiBase, "/api/auth/register", { method: "POST", body: { name, externalId, role, password } });
      onAuth(data.token, data.user);
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const submitReset = async () => {
    setError(null); setResetMsg(null);
    if (!externalId || !newPassword) { setError("Please fill in all fields."); return; }
    if (newPassword.length < 6) { setError("Password must be at least 6 characters."); return; }
    setBusy(true);
    try {
      await api(apiBase, "/api/auth/reset-password", { method: "POST", body: { externalId, newPassword } });
      setMode("login");
      setPassword("");
      setNewPassword("");
      setResetMsg("Password updated — log in with your new password.");
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const pillTab = (key, label) => (
    <button onClick={() => { setMode(key); setError(null); }}
      className="flex-1 py-2.5 rounded-full text-xs font-700 transition-all"
      style={mode === key
        ? { background: "var(--gold)", color: "#FFFFFF" }
        : { color: "var(--ink-soft)" }}>
      {label}
    </button>
  );

  return (
    <div className="min-h-screen">
      {/* Announcement bar */}
      <div className="text-center py-2 px-4 text-xs font-500"
        style={{ background: "var(--gold-soft)", color: "var(--teal-deep)", borderBottom: "1px solid var(--line)" }}>
        Welcome to CampusDine — order food from your campus canteen
      </div>

      {/* Sticky nav */}
      <header className="sticky top-0 z-30 backdrop-blur" style={{ background: "rgba(255,255,255,0.92)", borderBottom: "1px solid var(--line)" }}>
        <div className="max-w-6xl mx-auto px-6 py-3.5 flex items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="logo-badge w-10 h-10 rounded-full grid place-items-center">
              <Icon path={I.ticket} className="w-5 h-5" style={{ color: "var(--gold)" }} />
            </div>
            <div>
              <span className="font-display gold-text text-lg font-800 block leading-none">CampusDine</span>
              <span className="text-[10px] block mt-0.5" style={{ color: "var(--ink-soft)" }}>Campus Canteen</span>
            </div>
          </div>
          <nav className="hidden md:flex items-center gap-8 text-sm font-500" style={{ color: "var(--ink-soft)" }}>
            <a href="#menu" style={{ color: "inherit" }} onMouseOver={e => e.currentTarget.style.color = "var(--gold)"} onMouseOut={e => e.currentTarget.style.color = "var(--ink-soft)"}>Menu</a>
            <a href="#about" style={{ color: "inherit" }} onMouseOver={e => e.currentTarget.style.color = "var(--gold)"} onMouseOut={e => e.currentTarget.style.color = "var(--ink-soft)"}>About Us</a>
            <a href="#contact" style={{ color: "inherit" }} onMouseOver={e => e.currentTarget.style.color = "var(--gold)"} onMouseOut={e => e.currentTarget.style.color = "var(--ink-soft)"}>Contact</a>
          </nav>
          <button onClick={scrollToAuth} className="btn-primary px-5 py-2 rounded-lg text-xs">Sign In</button>
        </div>
      </header>

      {/* Hero */}
      <section className="relative py-24 px-6 text-center overflow-hidden">
        <div className="absolute inset-0 -z-10" style={{ background: "radial-gradient(ellipse 60% 50% at 50% 0%, rgba(22,163,74,0.10), transparent)" }}></div>
        <div className="max-w-3xl mx-auto space-y-6">
          <div className="inline-block px-4 py-1.5 rounded-full text-xs font-600" style={{ border: "1px solid var(--line)", color: "var(--gold)" }}>
            Smart Campus Canteen
          </div>
          <h1 className="font-display text-4xl sm:text-5xl font-800 leading-tight" style={{ color: "var(--ink)" }}>
            Order Ahead. Skip The Line.<br /><span className="gold-text">Eat Fresh, Every Day.</span>
          </h1>
          <p className="max-w-xl mx-auto text-[15px] leading-relaxed" style={{ color: "var(--ink-soft)" }}>
            Enjoy hassle-free food ordering, automatic subscription billing, and a cashless wallet —
            all on one platform, even during the busiest hours of campus life.
          </p>
          <div className="flex flex-wrap justify-center gap-4 pt-2">
            <button onClick={scrollToAuth} className="btn-primary px-8 py-3 rounded-lg">Get Started</button>
            <a href="#menu" className="btn-gold px-8 py-3 rounded-lg inline-block">Explore Menu</a>
          </div>
        </div>
      </section>

      {/* Features banner */}
      <section className="border-y py-10" style={{ borderColor: "var(--line)", background: "#FFFFFF" }}>
        <div className="max-w-6xl mx-auto px-6 grid grid-cols-2 md:grid-cols-4 gap-8 text-center">
          {features.map(f => (
            <div key={f.title} className="space-y-1.5">
              <h4 className="font-display font-700 text-sm" style={{ color: "var(--gold)" }}>{f.title}</h4>
              <p className="text-xs leading-relaxed" style={{ color: "var(--ink-soft)" }}>{f.desc}</p>
            </div>
          ))}
        </div>
      </section>

      {/* Menu preview */}
      <section id="menu" className="max-w-6xl mx-auto px-6 py-20">
        <div className="text-center mb-12 space-y-3">
          <p className="font-display text-xs uppercase" style={{ color: "var(--gold)" }}>Popular Items</p>
          <h2 className="font-display text-3xl font-800" style={{ color: "var(--ink)" }}>A Taste of Our Menu</h2>
          <div className="divider-flourish text-sm max-w-xs mx-auto">❖</div>
        </div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
          {sampleMenu.map(item => (
            <div key={item.name} className="card overflow-hidden">
              <div className="h-36 overflow-hidden" style={{ background: "var(--gold-soft)" }}>
                <img src={item.img} alt={item.name} className="w-full h-full object-cover" style={{ opacity: 1 }} />
              </div>
              <div className="p-4">
                <div className="font-display font-700 text-sm" style={{ color: "var(--ink)" }}>{item.name}</div>
                <div className="text-xs mb-2" style={{ color: "var(--ink-soft)" }}>{item.tag}</div>
                <div className="font-mono text-sm" style={{ color: "var(--gold)" }}>{item.price}</div>
              </div>
            </div>
          ))}
          <div className="card flex flex-col items-center justify-center text-center p-6 gap-3">
            <Icon path={I.menu} className="w-7 h-7" style={{ color: "var(--gold)" }} />
            <div className="font-display font-700 text-sm" style={{ color: "var(--ink)" }}>More on the full menu</div>
            <p className="text-xs" style={{ color: "var(--ink-soft)" }}>Log in to see live prices, stock &amp; order instantly.</p>
          </div>
        </div>
      </section>

      {/* About */}
      <section id="about" className="border-t py-20 px-6" style={{ borderColor: "var(--line)", background: "rgba(22,163,74,0.05)" }}>
        <div className="max-w-2xl mx-auto text-center space-y-5">
          <p className="font-display text-xs uppercase" style={{ color: "var(--gold)" }}>About Us</p>
          <h2 className="font-display text-3xl font-800" style={{ color: "var(--ink)" }}>Why CampusDine</h2>
          <div className="divider-flourish text-sm max-w-xs mx-auto">❖</div>
          <p className="leading-relaxed text-[15px]" style={{ color: "var(--ink-soft)" }}>
            Long canteen queues, paper tokens, and hand-calculated subscription bills — CampusDine exists to
            remove exactly these frustrations. With digital tokens, real-time order tracking, automatic
            billing, and a cashless wallet, we've built a refined, hassle-free dining experience built
            around campus life.
          </p>
        </div>
      </section>

      {/* Auth */}
      <section ref={authRef} className="py-20 px-6">
        <div className="max-w-md mx-auto">
          <div className="text-center mb-8 space-y-2">
            <p className="font-display text-xs uppercase" style={{ color: "var(--gold)" }}>Login / Register</p>
            <h2 className="font-display text-2xl font-800" style={{ color: "var(--ink)" }}>Sign In To CampusDine</h2>
          </div>

          <div className="card p-8 fade-in">
            {!role ? (
              <div className="space-y-3">
                {roleOptions.map((r) => (

/* ---------------- Menu & Order tab ---------------- */
function MenuOrder({ menu, cart, setCart, placeOrder, walletBalance, busy, onToggleFavorite }) {
  const [cat, setCat] = useState("heavy");
  const [search, setSearch] = useState("");
  const [sortBy, setSortBy] = useState("default");
  const [favoritesOnly, setFavoritesOnly] = useState(false);
  const filtered = menu
    .filter(i => i.category === cat)
    .filter(i => !favoritesOnly || i.is_favorite)
    .filter(i => {
      const q = search.trim().toLowerCase();
      if (!q) return true;
      return i.name.toLowerCase().includes(q) || (i.bn && i.bn.includes(search.trim()));
    })
    .sort((a, b) => {
      if (sortBy === "priceAsc") return a.price - b.price;
      if (sortBy === "priceDesc") return b.price - a.price;
      if (sortBy === "name") return a.name.localeCompare(b.name);
      return 0; // "default" — keep the server's category/name ordering
    });
  const [payMethod, setPayMethod] = useState("wallet");
  const [scheduleLater, setScheduleLater] = useState(false);
  const [pickupTime, setPickupTime] = useState("");

  // Feature: pre-order — a student can pick a slot up to 4h ahead (min 10min from now).
  // These bounds are hints for the native time input; the server enforces the real rule.
  const fmtHHMM = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const pickupNow = new Date();
  pickupNow.setSeconds(0, 0); // whole-minute precision — must match the server's rounding exactly
  const pickupMin = new Date(pickupNow.getTime() + 10 * 60000);
  const pickupMax = new Date(pickupNow.getTime() + 4 * 3600000);
  const pickupCrossesMidnight = pickupMin.getDate() !== pickupMax.getDate();

  const add = (item) => setCart(prev => {
    const existing = prev.find(p => p.id === item.id);
    if (existing) return prev.map(p => p.id === item.id ? { ...p, qty: p.qty + 1 } : p);
    return [...prev, { ...item, qty: 1 }];
  });
  const dec = (item) => setCart(prev => prev
    .map(p => p.id === item.id ? { ...p, qty: p.qty - 1 } : p)
    .filter(p => p.qty > 0));

  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const canPay = payMethod === "cash" || walletBalance >= total;
  const canCheckout = canPay && (!scheduleLater || pickupTime);

  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2">
        <div className="flex gap-2 mb-5">
          {CATEGORIES.map(c => (
            <button key={c.id} onClick={() => setCat(c.id)}
              className={`tab-btn px-4 py-2 rounded-full text-sm ${cat === c.id ? "active" : ""}`}>
              {c.label}
            </button>
          ))}
        </div>
        <div className="flex flex-col sm:flex-row gap-2 mb-5">
          <input type="text" value={search} onChange={e => setSearch(e.target.value)}
            placeholder="Search menu (e.g. khichuri, চা)…"
            className="flex-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
          <select value={sortBy} onChange={e => setSortBy(e.target.value)}
            className="px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }}>
            <option value="default">Sort: Default</option>
            <option value="priceAsc">Price: Low to High</option>
            <option value="priceDesc">Price: High to Low</option>
            <option value="name">Name: A-Z</option>
          </select>
          <label className="flex items-center gap-1.5 text-sm px-3 py-2 rounded-lg border cursor-pointer select-none whitespace-nowrap"
            style={{ borderColor: "var(--line)", color: favoritesOnly ? "var(--gold)" : "var(--ink-soft)" }}>
            <input type="checkbox" checked={favoritesOnly} onChange={e => setFavoritesOnly(e.target.checked)} />
            <Icon path={I.star} className="w-4 h-4" fill={favoritesOnly ? "currentColor" : "none"} />
            Favorites
          </label>
        </div>
        {filtered.length === 0 && (
          <p className="text-sm mb-4" style={{ color: "var(--ink-soft)" }}>No items match "{search}" in this category.</p>
        )}
        <div className="grid sm:grid-cols-2 gap-4">
          {filtered.map(item => {
            const out = item.stock <= 0;
            const inCart = cart.find(c => c.id === item.id);
            return (
              <div key={item.id} className={`card p-4 flex flex-col ${out ? "opacity-50" : ""}`}>
                <div className="flex items-start justify-between">
                  <div>
                    <div className="font-display font-700" style={{ color: "var(--gold)" }}>{item.name}</div>
                    <div className="text-xs uppercase tracking-wide" style={{ color: "var(--ink-soft)" }}>{item.category}</div>
                  </div>
                  <div className="flex items-center gap-1.5">
                    {item.tag && !out && (
                      <span className="text-[10px] font-mono px-2 py-1 rounded-full" style={{ background: "var(--gold-soft)", color: "var(--teal-deep)" }}>
                        {item.tag}
                      </span>
                    )}
                    <button onClick={() => onToggleFavorite(item.id, item.is_favorite)}
                      title={item.is_favorite ? "Remove from favorites" : "Add to favorites"}
                      className="w-7 h-7 rounded-full grid place-items-center transition-colors hover:bg-black/5">
                      <Icon path={I.star} className="w-4 h-4" fill={item.is_favorite ? "currentColor" : "none"}
                        style={{ color: "var(--gold)" }} />
                    </button>
                  </div>
                </div>
                <div className="mt-3 flex items-center justify-between">
                  <span className="font-mono font-600 text-lg">{taka(item.price)}</span>
                  {out ? (
                    <span className="text-xs font-600" style={{ color: "var(--brick)" }}>Out of stock</span>
                  ) : inCart ? (
                    <div className="flex items-center gap-2">
                      <button onClick={() => dec(item)} className="w-7 h-7 rounded-full grid place-items-center border" style={{ borderColor: "var(--line)" }}><Icon path={I.minus} className="w-3.5 h-3.5" /></button>
                      <span className="font-mono w-5 text-center">{inCart.qty}</span>
                      <button onClick={() => add(item)} className="w-7 h-7 rounded-full grid place-items-center text-white" style={{ background: "var(--teal)" }}><Icon path={I.plus} className="w-3.5 h-3.5" /></button>
                    </div>
                  ) : (
                    <button onClick={() => add(item)} className="btn-primary px-3 py-1.5 rounded-lg text-sm">Add</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div>
        <div className="card p-5 sticky top-20">
          <div className="font-display font-700 flex items-center gap-2 mb-4" style={{ color: "var(--gold)" }}>
            <Icon path={I.cart} className="w-5 h-5" /> Your cart
          </div>
          {cart.length === 0 ? (
            <p className="text-sm" style={{ color: "var(--ink-soft)" }}>Nothing here yet — add items from the menu.</p>
          ) : (
            <div className="space-y-2 mb-4">
              {cart.map(i => (
                <div key={i.id} className="flex justify-between text-sm">
                  <span>{i.name} × {i.qty}</span>
                  <span className="font-mono">{taka(i.price * i.qty)}</span>
                </div>
              ))}
            </div>
          )}
          <div className="border-t pt-3 mb-4" style={{ borderColor: "var(--line)" }}>
            <div className="flex justify-between font-700">
              <span>Total</span>
              <span className="font-mono">{taka(total)}</span>
            </div>
          </div>
          {cart.length > 0 && (
            <>
              <div className="mb-4">
                <label className="flex items-center gap-2 text-sm mb-2">
                  <input type="checkbox" checked={scheduleLater} onChange={e => setScheduleLater(e.target.checked)} />
                  Schedule pickup for later
                </label>
                {scheduleLater && (
                  <>
                    <input type="time" value={pickupTime} onChange={e => setPickupTime(e.target.value)}
                      min={pickupCrossesMidnight ? undefined : fmtHHMM(pickupMin)}
                      max={pickupCrossesMidnight ? undefined : fmtHHMM(pickupMax)}
                      className="w-full px-3 py-2 rounded-lg border font-mono" style={{ borderColor: "var(--line)" }} />
                    <p className="text-xs mt-1" style={{ color: "var(--ink-soft)" }}>
                      Pick a time between {fmtHHMM(pickupMin)} and {fmtHHMM(pickupMax)}.
                    </p>
                  </>
                )}
              </div>
              <div className="flex gap-2 mb-4 text-sm">
                <button onClick={() => setPayMethod("wallet")}
                  className={`flex-1 py-2 rounded-lg border ${payMethod === "wallet" ? "text-white" : ""}`}
                  style={payMethod === "wallet" ? { background: "var(--teal)", borderColor: "var(--teal)" } : { borderColor: "var(--line)" }}>
                  Wallet
                </button>
                <button onClick={() => setPayMethod("cash")}
                  className={`flex-1 py-2 rounded-lg border ${payMethod === "cash" ? "text-white" : ""}`}
                  style={payMethod === "cash" ? { background: "var(--teal)", borderColor: "var(--teal)" } : { borderColor: "var(--line)" }}>
                  Cash on pickup
                </button>
              </div>
              {payMethod === "wallet" && !canPay && (
                <p className="text-xs mb-3" style={{ color: "var(--brick)" }}>Insufficient wallet balance — top up or pay cash.</p>
              )}
              <button disabled={!canCheckout || busy} onClick={() => placeOrder(cart, payMethod, scheduleLater ? pickupTime : null)}
                className="btn-primary w-full py-2.5 rounded-xl">
                {busy ? "Placing order…" : "Checkout — get token"}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

  return (
    <div className="mt-4 pt-4 border-t" style={{ borderColor: "var(--line)" }}>

function TrackOrder({ orders, onSubmitFeedback, feedbackBusy, onCancel, cancelBusy }) {
  const [printOrder, setPrintOrder] = useState(null);

  // Feature: print receipt — render the chosen order into a hidden #print-area,
  // then trigger the browser print dialog; the CSS above hides everything else.
  useEffect(() => {
    if (!printOrder) return;
    const clear = () => setPrintOrder(null);
    window.addEventListener("afterprint", clear);
    const t = setTimeout(() => window.print(), 50);
    return () => { clearTimeout(t); window.removeEventListener("afterprint", clear); };
  }, [printOrder]);

  if (orders.length === 0) {
    return <div className="card p-10 text-center" style={{ color: "var(--ink-soft)" }}>No orders yet — place one from the Menu &amp; Order tab.</div>;
  }
  return (
    <div className="space-y-6 max-w-2xl">
      {printOrder && (
        <div id="print-area">
          <div className="receipt">
            <div className="text-center mb-1">
              <div className="font-display font-800" style={{ fontSize: 18 }}>🍽 CampusDine</div>
              <div style={{ fontSize: 11, color: "#6B7280", letterSpacing: 1 }}>ORDER RECEIPT</div>
            </div>
            <div className="receipt-divider" />
            <div className="text-center" style={{ marginBottom: 10 }}>
              <div style={{ fontSize: 10, color: "#6B7280" }}>PICKUP TOKEN</div>
              <div className="font-mono font-800" style={{ fontSize: 30, letterSpacing: 2 }}>{printOrder.token}</div>
            </div>
            <div className="receipt-row"><span>Status</span><span style={{ fontWeight: 600 }}>{printOrder.status}</span></div>
            <div className="receipt-row"><span>Payment</span><span>{printOrder.payment_method === "wallet" ? "Wallet" : "Cash on pickup"}</span></div>
            {printOrder.pickup_time && (
              <div className="receipt-row"><span>Scheduled pickup</span><span>{new Date(printOrder.pickup_time).toLocaleString()}</span></div>
            )}
            <div className="receipt-row"><span>Printed</span><span>{new Date().toLocaleString()}</span></div>
            <div className="receipt-divider" />
            {printOrder.items.map((i, idx) => (
              <div key={idx} className="receipt-row"><span>{i.name} ×{i.qty}</span><span>{taka(i.price * i.qty)}</span></div>
            ))}
            <div className="receipt-divider" />
            <div className="receipt-row" style={{ fontSize: 15, fontWeight: 800 }}><span>Total</span><span>{taka(printOrder.total)}</span></div>
            <div className="text-center" style={{ marginTop: 16, fontSize: 11, color: "#6B7280" }}>
              Show this token at the counter · Thank you!
            </div>
          </div>
        </div>
      )}
      {orders.map(o => {
        const stepIndex = STATUSES.indexOf(o.status);
        const isCancelled = o.status === "Cancelled";
        return (
          <div key={o.token} className="card overflow-hidden">
            <div className="ticket p-5 flex items-center justify-between">
              <div className="perf pl-4">
                <div className="text-xs opacity-70">Pickup token</div>
                <div className="font-mono text-2xl font-700 tracking-wide">{o.token}</div>
              </div>
              <div className="text-right">
                <div className="text-xs opacity-70">Total</div>

                  className="text-xs px-3 py-1.5 rounded-lg border font-600 flex items-center gap-1.5 transition-colors hover:bg-black/5"

                  <Icon path={I.printer} className="w-3.5 h-3.5" style={{ color: "var(--gold)" }} />
                  Print receipt

                  <button disabled={cancelBusy} onClick={() => onCancel(o.id)}
                    className="text-xs px-3 py-1.5 rounded-lg border font-600"
                    style={{ borderColor: "var(--brick)", color: "var(--brick)" }}>
                    Cancel order

              {o.status === "Ready" && (
                <OrderFeedback order={o} onSubmit={onSubmitFeedback} busy={feedbackBusy} />
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------- Meal calendar tab ---------------- */
function MealCalendar({ role, year, month, calendar, bill, onToggle, onPrevMonth, onNextMonth, onJumpToday, isCurrentMonth }) {
  const total = daysInMonth(year, month);
  const monthName = new Date(year, month - 1).toLocaleString("default", { month: "long" });
  const firstWeekday = new Date(year, month - 1, 1).getDay();
  const now = new Date();
  const todayDay = now.getDate();
  const isThisMonthShown = now.getFullYear() === year && (now.getMonth() + 1) === month;

  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2 card p-5">
        <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
          <div className="flex items-center gap-2">
            <button onClick={onPrevMonth} aria-label="Previous month"
                    className="w-8 h-8 rounded-lg border flex items-center justify-center transition-colors"
                    style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
              <Icon path={I.chevronLeft} className="w-4 h-4" />
            </button>
            <div className="font-display font-700 text-lg min-w-[150px] text-center" style={{ color: "var(--gold)" }}>{monthName} {year}</div>
            <button onClick={onNextMonth} aria-label="Next month"
                    className="w-8 h-8 rounded-lg border flex items-center justify-center transition-colors"
                    style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
              <Icon path={I.chevronRight} className="w-4 h-4" />
            </button>
            {!isCurrentMonth && (
              <button onClick={onJumpToday} className="text-[11px] font-600 rounded-lg px-2 py-1 ml-1 border transition-colors"
                      style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
                Today
              </button>
            )}
          </div>
          <div className="text-xs" style={{ color: "var(--ink-soft)" }}>Tap a day to cycle: Off → Full → Half</div>
        </div>
        <div className="grid grid-cols-7 gap-2 mb-2 text-xs text-center font-600" style={{ color: "var(--ink-soft)" }}>
          {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => <div key={i}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-2">
          {Array.from({ length: firstWeekday }).map((_, i) => <div key={"e" + i}></div>)}
          {Array.from({ length: total }).map((_, i) => {
            const day = i + 1;
            const status = calendar[day] || "off";
            const isToday = isThisMonthShown && day === todayDay;
            return (
              <div key={day} onClick={() => onToggle(day, status)}
                className={`cal-cell text-sm font-600 ${status === "full" ? "cal-full" : status === "half" ? "cal-half" : ""} ${isToday ? "cal-today" : ""}`}>
                {day}
              </div>
            );
          })}
        </div>
        <div className="flex gap-4 mt-4 text-xs" style={{ color: "var(--ink-soft)" }}>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded" style={{ background: "var(--teal)" }}></span> Full meal</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded" style={{ background: "var(--gold)" }}></span> Half meal</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border" style={{ borderColor: "var(--line)" }}></span> Off</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border" style={{ borderColor: "var(--gold-bright)", boxShadow: "0 0 0 2px var(--gold-bright)" }}></span> Today</span>
        </div>
      </div>

      <div className="card p-5 h-fit">
        <div className="font-display font-700 mb-4" style={{ color: "var(--gold)" }}>Monthly bill</div>
        <div className="space-y-2 text-sm mb-4">
          <div className="flex justify-between"><span>Full meal days ({taka(bill.fullRate)} each)</span><span className="font-mono">{bill.fullDays}</span></div>
          <div className="flex justify-between"><span>Half meal days ({taka(bill.halfRate)} each)</span><span className="font-mono">{bill.halfDays}</span></div>
        </div>
        <div className="border-t pt-3" style={{ borderColor: "var(--line)" }}>
          <div className="flex justify-between font-700 text-lg">
            <span>Total</span><span className="font-mono">{taka(bill.total)}</span>
          </div>
        </div>
        <p className="text-xs mt-3" style={{ color: "var(--ink-soft)" }}>Calculated live by the server — {role === "teacher" ? "faculty" : "student"} rate applied.</p>
      </div>
    </div>
  );
}

const PAY_CATEGORIES = [
  {
    key: "mobile", label: "Mobile Banking", color: "#E2136E",
    options: [
      { key: "bkash", label: "bKash", color: "#E2136E" },
      { key: "nagad", label: "Nagad", color: "#F6921E" },
    ],
  },
  {
    key: "banking", label: "Banking", color: "#4C9A6A",
    options: [
      { key: "dbbl", label: "Dutch-Bangla Bank", color: "#0033A0" },
      { key: "brac", label: "BRAC Bank", color: "#4C9A6A" },
      { key: "city", label: "City Bank", color: "#9A6F0D" },
      { key: "islami", label: "Islami Bank Bangladesh", color: "#2E6FDB" },
      { key: "sonali", label: "Sonali Bank", color: "#C0392B" },
    ],
  },
  { key: "card", label: "Card", color: "#2E6FDB", options: null },
];

function PaymentModal({ amount, onClose, onConfirm, busy }) {
  const [step, setStep] = useState("category"); // category -> method -> confirm -> processing
  const [category, setCategory] = useState(null);
  const [choice, setChoice] = useState(null); // { key, label }
  const [err, setErr] = useState(null);

  const pickCategory = (cat) => {
    setCategory(cat);
    if (cat.options) {
      setStep("method");
    } else {
      setChoice({ key: cat.key, label: cat.label });
      setStep("confirm");
    }
  };

  const pickMethod = (opt) => {
    setChoice(opt);
    setStep("confirm");
  };

  const confirmPay = async () => {
    setErr(null);
    setStep("processing");
    try {
      await onConfirm(choice.key);
      setStep("success");
    } catch (e) {
      setErr(e.message || "Payment failed");
      setStep("confirm");
    }
  };

  const goBack = () => {
    if (step === "method") { setStep("category"); setCategory(null); }
    else if (step === "confirm") { setStep(category?.options ? "method" : "category"); setChoice(null); }
  };

  const title = step === "category" ? "Choose payment method"
    : step === "method" ? category.label
    : step === "confirm" ? "Confirm top-up"
    : step === "success" ? "Payment successful"
    : "Processing payment";

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(17,24,39,0.5)" }}>
      <div className="card w-full max-w-sm p-5 relative">
        {step !== "processing" && (
          <button onClick={onClose} className="absolute top-3 right-3 text-sm opacity-60 hover:opacity-100">✕</button>
        )}
        <div className="font-display font-700 mb-1" style={{ color: "var(--gold)" }}>{title}</div>
        <div className="text-xs mb-4" style={{ color: "var(--ink-soft)" }}>Amount: <span className="font-mono">{taka(amount)}</span></div>

        {step === "category" && (
          <div className="space-y-2">
            {PAY_CATEGORIES.map(c => (
              <button key={c.key} onClick={() => pickCategory(c)}
                className="w-full flex items-center justify-between px-4 py-3 rounded-lg border text-sm font-500"
                style={{ borderColor: "var(--line)" }}>
                <span className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full" style={{ background: c.color }} />
                  {c.label}
                </span>
                <span style={{ color: "var(--ink-soft)" }}>›</span>
              </button>
            ))}
          </div>
        )}

        {step === "method" && (
          <div className="space-y-2">
            {category.options.map(o => (
              <button key={o.key} onClick={() => pickMethod(o)}
                className="w-full flex items-center justify-between px-4 py-3 rounded-lg border text-sm font-500"
                style={{ borderColor: "var(--line)" }}>
                <span className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full" style={{ background: o.color }} />
                  {o.label}
                </span>
                <span style={{ color: "var(--ink-soft)" }}>›</span>
              </button>
            ))}
            <button onClick={goBack} className="w-full py-2 rounded-lg border text-sm mt-1" style={{ borderColor: "var(--line)" }}>Back</button>
          </div>
        )}

        {step === "confirm" && (
          <div>
            <p className="text-sm mb-4">
              Top up <span className="font-mono font-600">{taka(amount)}</span> via <span className="font-600">{choice.label}</span>?
            </p>
            {err && <p className="text-xs mb-3" style={{ color: "var(--brick)" }}>{err}</p>}
            <div className="flex gap-2">
              <button onClick={goBack} className="flex-1 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }}>No</button>
              <button disabled={busy} onClick={confirmPay} className="flex-1 btn-primary py-2 rounded-lg text-sm">Yes, top up</button>
            </div>
          </div>
        )}

        {step === "processing" && (
          <div className="py-6 text-center text-sm" style={{ color: "var(--ink-soft)" }}>
            Confirming payment with {choice?.label}…
          </div>
        )}

        {step === "success" && (
          <div className="py-4 text-center">
            <div className="mx-auto mb-3 w-12 h-12 rounded-full flex items-center justify-center text-2xl"
              style={{ background: "var(--leaf)", color: "#fff" }}>✓</div>
            <p className="text-sm mb-1">
              <span className="font-mono font-600">{taka(amount)}</span> has been added to your wallet
            </p>
            <p className="text-xs mb-4" style={{ color: "var(--ink-soft)" }}>Paid via {choice?.label}</p>
            <button onClick={onClose} className="btn-primary w-full py-2 rounded-lg text-sm">Done</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- Admin: Orders queue ---------------- */
function AdminOrders({ orders, advance }) {
  if (orders.length === 0) {
    return <div className="card p-10 text-center" style={{ color: "var(--ink-soft)" }}>Queue is empty.</div>;
  }
  // Feature: pre-order — ASAP orders (no pickup_time) need attention first,
  // then scheduled ones soonest-first, so the kitchen sees what's coming up next.
  const sorted = [...orders].sort((a, b) => {
    if (!a.pickup_time && !b.pickup_time) return b.id - a.id;
    if (!a.pickup_time) return -1;
    if (!b.pickup_time) return 1;
    return new Date(a.pickup_time) - new Date(b.pickup_time);
  });
  return (
    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
      {sorted.map(o => (
        <div key={o.token} className="card p-4">
          <div className="flex justify-between items-start mb-2">
            <span className="font-mono font-700 text-lg" style={{ color: "var(--gold)" }}>{o.token}</span>
            <span className="text-xs px-2 py-1 rounded-full font-600" style={{
              background: o.status === "Ready" ? "var(--leaf)" : o.status === "Cooking" ? "var(--gold)" : o.status === "Cancelled" ? "var(--brick)" : "var(--line)",
              color: o.status === "Received" ? "var(--ink)" : "#fff"
            }}>{o.status}</span>
          </div>
          {o.pickup_time && (
            <div className="text-xs mb-2 font-600" style={{ color: "var(--teal)" }}>
              Pickup: {new Date(o.pickup_time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
            </div>
          )}
          <div className="text-sm mb-3" style={{ color: "var(--ink-soft)" }}>
            {o.items.map(i => `${i.name} ×${i.qty}`).join(", ")}
          </div>
          <div className="flex justify-between items-center">
            <span className="font-mono text-sm">{taka(o.total)}</span>
            {o.status === "Cancelled" ? (
              <span className="text-xs flex items-center gap-1" style={{ color: "var(--brick)" }}><Icon path={I.x} className="w-4 h-4" /> Cancelled</span>
            ) : o.status !== "Ready" ? (
              <button onClick={() => advance(o.id)} className="btn-primary px-3 py-1.5 rounded-lg text-xs flex items-center gap-1">
                Advance <Icon path={I.arrow} className="w-3.5 h-3.5" />
              </button>
            ) : (
              <span className="text-xs flex items-center gap-1" style={{ color: "var(--leaf)" }}><Icon path={I.check} className="w-4 h-4" /> Done</span>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------------- Profile tab (all roles) ---------------- */
function ProfileField({ label, value, placeholder }) {
  return (
    <div>
      <div className="text-xs uppercase tracking-wide mb-1" style={{ color: "var(--ink-soft)" }}>{label}</div>
      <div className="text-sm font-600" style={{ color: value ? "var(--ink)" : "var(--ink-soft)" }}>
        {value || placeholder || "Not set"}
      </div>

}
function ProfileInput({ label, value, onChange, placeholder }) {
  return (
    <div>
      <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{label}</label>
      <input value={value} onChange={onChange} placeholder={placeholder}
        className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
    </div>

}
function ProfileTab({ user, call, onUpdated }) {
  const [editing, setEditing] = useState(false);
  const [profile, setProfile] = useState({
    name: user.name, phone: "", address: "", department: "", fatherPhone: "", roomNumber: "", hallId: null,
  });
  const [walletBalance, setWalletBalance] = useState(user.walletBalance);
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [success, setSuccess] = useState(null);

  const loadProfile = () => call("/api/auth/me").then(data => {
    setProfile({
      name: data.name, phone: data.phone || "", address: data.address || "",
      department: data.department || "", fatherPhone: data.fatherPhone || "",
      roomNumber: data.roomNumber || "", hallId: data.hallId || null,
    });
    setWalletBalance(data.walletBalance);
  }).catch(() => {});

  useEffect(() => { loadProfile(); }, []);

  const save = async () => {
    setError(null); setSuccess(null);
    if (!profile.name.trim()) { setError("Name can't be empty."); return; }
    if (newPassword && newPassword.length < 6) { setError("New password must be at least 6 characters."); return; }
    if (newPassword && !currentPassword) { setError("Enter your current password to set a new one."); return; }
    setBusy(true);
    try {
      const body = {
        name: profile.name, phone: profile.phone, address: profile.address,
        department: profile.department, fatherPhone: profile.fatherPhone, roomNumber: profile.roomNumber,
      };
      if (newPassword) { body.currentPassword = currentPassword; body.newPassword = newPassword; }
      const data = await call("/api/auth/me", { method: "PUT", body });
      onUpdated(data);
      setProfile(p => ({ ...p, hallId: data.hallId || p.hallId }));
      setCurrentPassword(""); setNewPassword("");
      setSuccess("Profile updated.");
      setEditing(false);
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const cancelEdit = () => {
    setError(null); setCurrentPassword(""); setNewPassword("");
    setEditing(false);
    loadProfile();
  };

  return (
    <div className="max-w-lg">
      <div className="card p-6">
        <div className="flex items-center justify-between mb-5">
          <div className="font-display font-700 text-lg" style={{ color: "var(--gold)" }}>My Profile</div>
          {!editing && (
            <button onClick={() => setEditing(true)}
              className="text-xs px-3 py-1.5 rounded-lg border font-600 flex items-center gap-1.5 transition-colors hover:bg-black/5"
              style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>
              <Icon path={I.edit} className="w-3.5 h-3.5" style={{ color: "var(--gold)" }} />
              Edit Profile
            </button>
          )}
        </div>
        <div className="space-y-4">
          {editing ? (
            <ProfileInput label="Full Name" value={profile.name} onChange={e => setProfile({ ...profile, name: e.target.value })} />
          ) : (
            <ProfileField label="Full Name" value={profile.name} />
          )}

          <div className="grid grid-cols-2 gap-4">
            {editing ? (
              <>
                <ProfileInput label="Phone" value={profile.phone} placeholder="01XXXXXXXXX"
                  onChange={e => setProfile({ ...profile, phone: e.target.value })} />
                <ProfileInput label="Father's Phone" value={profile.fatherPhone} placeholder="01XXXXXXXXX"
                  onChange={e => setProfile({ ...profile, fatherPhone: e.target.value })} />
              </>
            ) : (
              <>
                <ProfileField label="Phone" value={profile.phone} />
                <ProfileField label="Father's Phone" value={profile.fatherPhone} />
              </>
            )}
          </div>

          {editing ? (
            <ProfileInput label="Address" value={profile.address} placeholder="Present address"
              onChange={e => setProfile({ ...profile, address: e.target.value })} />
          ) : (
            <ProfileField label="Address" value={profile.address} />
          )}

          {editing ? (
            <ProfileInput label="Department" value={profile.department} placeholder="e.g. CSE"
              onChange={e => setProfile({ ...profile, department: e.target.value })} />
          ) : (
            <ProfileField label="Department" value={profile.department} />
          )}

          <div className="grid grid-cols-2 gap-4">
            <div>
              <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>ID Number</label>
              <input value={user.externalId} disabled
                className="w-full px-4 py-2.5 rounded-xl border opacity-60" style={{ borderColor: "var(--line)" }} />
            </div>
            <div>
              <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>Role</label>
              <input value={user.role} disabled
                className="w-full px-4 py-2.5 rounded-xl border opacity-60 capitalize" style={{ borderColor: "var(--line)" }} />
            </div>
          </div>

          {user.role === "student" && (
            <div className="border-t pt-4" style={{ borderColor: "var(--line)" }}>
              <div className="text-xs uppercase tracking-wide mb-3" style={{ color: "var(--ink-soft)" }}>Hall Residence</div>
              <div className="grid grid-cols-2 gap-4">
                {editing ? (
                  <ProfileInput label="Room Number" value={profile.roomNumber} placeholder="e.g. 312"
                    onChange={e => setProfile({ ...profile, roomNumber: e.target.value })} />
                ) : (
                  <ProfileField label="Room Number" value={profile.roomNumber} placeholder="Not a hall resident" />
                )}
                <div>
                  <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>Hall ID</label>
                  <input value={profile.hallId || "—"} disabled
                    className="w-full px-4 py-2.5 rounded-xl border opacity-60 font-mono" style={{ borderColor: "var(--line)" }} />
                </div>
              </div>
              {!profile.hallId && (
                <p className="text-xs mt-2" style={{ color: "var(--ink-soft)" }}>Save a room number to get a fixed Hall ID.</p>
              )}
            </div>
          )}

          {user.role !== "admin" && (
            <div className="ticket p-4">
              <div className="perf pl-4">
                <div className="text-xs opacity-70">Wallet Balance</div>
                <div className="font-mono text-xl font-700">{taka(walletBalance)}</div>
              </div>
            </div>
          )}

          {editing && (
            <div className="border-t pt-4" style={{ borderColor: "var(--line)" }}>
              <div className="text-xs uppercase tracking-wide mb-3" style={{ color: "var(--ink-soft)" }}>Change Password (optional)</div>
              <div className="space-y-2">
                <input value={currentPassword} onChange={e => setCurrentPassword(e.target.value)} type="password" placeholder="Current password"
                  className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                <input value={newPassword} onChange={e => setNewPassword(e.target.value)} type="password" placeholder="New password"
                  className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
              </div>
            </div>
          )}

          {error && <p className="text-sm" style={{ color: "#DC2626" }}>{error}</p>}
          {success && <p className="text-sm" style={{ color: "var(--leaf)" }}>{success}</p>}

          {editing && (
            <div className="flex gap-2">
              <button disabled={busy} onClick={save} className="btn-primary flex-1 py-2.5 rounded-xl">
                {busy ? "Saving…" : "Save Changes"}
              </button>
              <button disabled={busy} onClick={cancelEdit}
                className="px-5 py-2.5 rounded-xl border font-600 text-sm"
                style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>
                Cancel
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------- App root ---------------- */
function App() {
  const [apiBase, setApiBase] = useState(DEFAULT_API_BASE);
  const [session, setSession] = useState(null); // { token, user:{id,name,role,walletBalance} }
  const [tab, setTab] = useState("menu");
  const [error, setError] = useState(null);
  const [success, setSuccess] = useState(null);
  const [busy, setBusy] = useState(false);
  const [connected, setConnected] = useState(false);

  const [menu, setMenu] = useState([]);
  const [cart, setCart] = useState([]);
  const [orders, setOrders] = useState([]);
  const [wallet, setWallet] = useState({ balance: 0, transactions: [] });
  const [calendar, setCalendar] = useState({});
  const [bill, setBill] = useState({ fullDays: 0, halfDays: 0, fullRate: 0, halfRate: 0, total: 0 });
  const [overview, setOverview] = useState({});
  const [trend, setTrend] = useState([]);
  const [forecast, setForecast] = useState({});
  const [feedbackSummary, setFeedbackSummary] = useState({ average: 0, count: 0, entries: [] });
  const [feedbackBusy, setFeedbackBusy] = useState(false);

  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth() + 1);
  const isCurrentMonth = year === now.getFullYear() && month === now.getMonth() + 1;

  const goPrevMonth = () => {
    if (month === 1) { setYear(y => y - 1); setMonth(12); } else { setMonth(m => m - 1); }
  };
  const goNextMonth = () => {
    if (month === 12) { setYear(y => y + 1); setMonth(1); } else { setMonth(m => m + 1); }
  };
  const goToday = () => { setYear(now.getFullYear()); setMonth(now.getMonth() + 1); };

  const socketRef = useRef(null);
  const showError = (e) => { setSuccess(null); setError(typeof e === "string" ? e : e.message); };
  const showSuccess = (msg) => { setError(null); setSuccess(msg); };

  const call = (path, opts) => api(apiBase, path, { ...opts, token: session && session.token });

  const mapMenu = (rows) => rows.map(m => ({ ...m, bn: m.name_bn }));
  const mapWallet = (data) => ({
    balance: data.balance,
    transactions: data.transactions.map(t => ({ label: t.label, amount: t.amount, time: new Date(t.created_at).toLocaleString() })),
  });
  const mapCalendar = (rows) => {
    const map = {};
    rows.forEach(r => { map[new Date(r.the_date).getDate()] = r.status; });
    return map;
  };

  const refreshMenu = async () => setMenu(mapMenu(await call("/api/menu")));

  const toggleFavorite = async (itemId, isFavorite) => {
    try {
      await call(`/api/menu/${itemId}/favorite`, { method: isFavorite ? "DELETE" : "POST" });
      await refreshMenu();
    } catch (e) { showError(e); }
  };
  const refreshWallet = async () => setWallet(mapWallet(await call("/api/wallet")));
  const refreshCalendar = async () => {
    setCalendar(mapCalendar(await call(`/api/calendar?year=${year}&month=${month}`)));
    setBill(await call(`/api/calendar/bill?year=${year}&month=${month}`));
  };
  const refreshMyOrders = async () => setOrders(await call("/api/orders/mine"));
  const refreshAdminOrders = async () => setOrders(await call("/api/orders"));
  const refreshOverview = async () => setOverview(await call("/api/admin/overview"));
  const refreshReports = async () => {
    setTrend(await call("/api/admin/reports/revenue-trend"));
    setForecast(await call("/api/admin/reports/forecast"));
  };
  const refreshFeedback = async () => setFeedbackSummary(await call("/api/admin/feedback"));

  const onAuth = (token, user) => {
    setSession({ token, user });
    setTab(user.role === "admin" ? "overview" : "menu");
  };
  const logout = () => {
    if (socketRef.current) socketRef.current.disconnect();
    setSession(null); setCart([]); setError(null);
  };

  // Initial data load after login
  useEffect(() => {
    if (!session) return;
    (async () => {
      try {
        if (session.user.role === "admin") {
          await Promise.all([refreshMenu(), refreshAdminOrders(), refreshOverview(), refreshReports(), refreshFeedback()]);
        } else {
          await Promise.all([refreshMenu(), refreshMyOrders(), refreshWallet()]);
        }
      } catch (e) { showError(e); }
    })();
  }, [session]);

  // Refetch the meal calendar & bill whenever the visible month changes
  useEffect(() => {
    if (!session || session.user.role === "admin") return;
    refreshCalendar().catch(showError);
  }, [session, year, month]);

  // Live updates via Socket.io
  useEffect(() => {
    if (!session) return;
    const socket = io(apiBase, { auth: { token: session.token } });
    socketRef.current = socket;
    socket.on("connect", () => setConnected(true));
    socket.on("disconnect", () => setConnected(false));
    socket.on("order:new", (order) => {
      if (session.user.role === "admin") setOrders(prev => [order, ...prev]);
    });
    socket.on("order:update", (order) => {
      setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: order.status } : o));
    });
    return () => socket.disconnect();
  }, [session, apiBase]);

  const placeOrder = async (cartItems, paymentMethod, pickupTime) => {
    setBusy(true); setError(null);
    try {
      await call("/api/orders", {
        method: "POST",
        body: { items: cartItems.map(c => ({ id: c.id, qty: c.qty })), paymentMethod, pickupTime: pickupTime || undefined },
      });
      setCart([]);
      await Promise.all([refreshMyOrders(), refreshMenu(), paymentMethod === "wallet" ? refreshWallet() : Promise.resolve()]);
      setTab("track");
    } catch (e) { showError(e); } finally { setBusy(false); }
  };

  const advanceOrder = async (id) => {
    try {
      await call(`/api/orders/${id}/advance`, { method: "PATCH" });
      await refreshAdminOrders();
    } catch (e) { showError(e); }
  };

  const cancelOrder = async (id) => {
    setBusy(true); setError(null); setSuccess(null);
    try {
      const cancelled = await call(`/api/orders/${id}/cancel`, { method: "PATCH" });
      await Promise.all([refreshMyOrders(), refreshMenu(), refreshWallet()]);
      showSuccess(
        cancelled.payment_method === "wallet"
          ? `Order ${cancelled.token} cancelled — ${taka(cancelled.total)} refunded to your wallet.`
          : `Order ${cancelled.token} cancelled.`
      );
    } catch (e) { showError(e); } finally { setBusy(false); }
  };

  const submitFeedback = async (orderId, rating, comment) => {
    setFeedbackBusy(true); setError(null);
    try {
      await call(`/api/orders/${orderId}/feedback`, { method: "POST", body: { rating, comment } });
      await refreshMyOrders();
    } catch (e) { showError(e); } finally { setFeedbackBusy(false); }
  };

  const topUp = async (amount, method) => {
    setBusy(true); setError(null);
    try {
      await call("/api/wallet/topup", { method: "POST", body: { amount, method } });
    } catch (e) { showError(e); throw e; } finally { setBusy(false); }
    // The top-up already succeeded on the server; a refresh hiccup shouldn't look like a failed payment.
    try { await refreshWallet(); } catch (e) { showError(e); }
  };

  const toggleDay = async (day, currentStatus) => {
    const next = currentStatus === "off" ? "full" : currentStatus === "full" ? "half" : "off";
    try {
      await call(`/api/calendar/${day}`, { method: "PUT", body: { year, month, status: next } });
      await refreshCalendar();
    } catch (e) { showError(e); }
  };

  const updateMenuItem = async (id, patch) => {
    try {
      await call(`/api/menu/${id}`, { method: "PUT", body: patch });
      await refreshMenu();
    } catch (e) { showError(e); }
  };
  const addMenuItem = async (item) => {
    try {
      await call("/api/menu", { method: "POST", body: item });
      await refreshMenu();
    } catch (e) { showError(e); }
  };

  if (!session) return <Login apiBase={apiBase} setApiBase={setApiBase} onAuth={onAuth} />;

  const userTabs = [
    { key: "menu", label: "Menu & Order", icon: I.menu },
    { key: "track", label: "Track Order", icon: I.clock },
    { key: "calendar", label: "Meal Calendar", icon: I.calendar },
    { key: "wallet", label: "Wallet", icon: I.wallet },
    { key: "profile", label: "My Profile", icon: I.user },
  ];
  const adminTabs = [
    { key: "overview", label: "Overview", icon: I.dashboard },
    { key: "adminMenu", label: "Menu", icon: I.box },
    { key: "adminOrders", label: "Orders", icon: I.ticket },
    { key: "reports", label: "Reports", icon: I.chart },
    { key: "feedback", label: "Feedback", icon: I.star },
    { key: "profile", label: "My Profile", icon: I.user },
  ];

  return (
    <div className="min-h-screen">
      <TopBar role={session.user.role} name={session.user.name}
        tabs={session.user.role === "admin" ? adminTabs : userTabs}
        active={tab} setActive={setTab} onLogout={logout} connected={connected} />
      <div className="max-w-6xl mx-auto p-5 fade-in" key={tab}>
        {error && (
          <div className="error-banner rounded-xl px-4 py-3 mb-5 text-sm flex justify-between items-center">
            <span>{error}</span>
            <button onClick={() => setError(null)} className="font-700">✕</button>
          </div>
        )}
        {success && (
          <div className="success-banner rounded-xl px-4 py-3 mb-5 text-sm flex justify-between items-center">
            <span>{success}</span>
            <button onClick={() => setSuccess(null)} className="font-700">✕</button>
          </div>
        )}

        {session.user.role !== "admin" && tab === "menu" && (
          <MenuOrder menu={menu} cart={cart} setCart={setCart} placeOrder={placeOrder} walletBalance={wallet.balance} busy={busy} onToggleFavorite={toggleFavorite} />
        )}
        {session.user.role !== "admin" && tab === "track" && (
          <TrackOrder orders={orders} onSubmitFeedback={submitFeedback} feedbackBusy={feedbackBusy} onCancel={cancelOrder} cancelBusy={busy} />
        )}
        {session.user.role !== "admin" && tab === "calendar" && (
          <MealCalendar role={session.user.role} year={year} month={month} calendar={calendar} bill={bill} onToggle={toggleDay}
                        onPrevMonth={goPrevMonth} onNextMonth={goNextMonth} onJumpToday={goToday} isCurrentMonth={isCurrentMonth} />
        )}
        {session.user.role !== "admin" && tab === "wallet" && (
          <WalletTab balance={wallet.balance} topUp={topUp} transactions={wallet.transactions} busy={busy} />
        )}

        {session.user.role === "admin" && tab === "overview" && <AdminOverview overview={overview} orders={orders} />}
        {session.user.role === "admin" && tab === "adminMenu" && (
          <AdminMenu menu={menu} updateItem={updateMenuItem} addItem={addMenuItem} busy={busy} />
        )}
        {session.user.role === "admin" && tab === "adminOrders" && <AdminOrders orders={orders} advance={advanceOrder} />}
        {session.user.role === "admin" && tab === "reports" && <AdminReports trend={trend} forecast={forecast} />}
        {session.user.role === "admin" && tab === "feedback" && <AdminFeedback summary={feedbackSummary} />}

        {tab === "profile" && (
          <ProfileTab user={session.user} call={call}
            onUpdated={(u) => setSession(s => ({ ...s, user: { ...s.user, name: u.name, walletBalance: u.walletBalance } }))} />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
