<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusDine — Smart Campus Canteen</title>
<link rel="icon" type="image/png" href="/images/landing/logo-green.png" />
<link rel="stylesheet" href="landing.css" />
<link rel="stylesheet" href="/hall/hall.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Hind+Siliguri:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="/hall/files.js"></script>
<script src="/hall/loader.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Saved theme (light / dark / auto + accent colour) is applied before the page paints, so there is no flash.
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem("cd_theme") || "{}");
      var dark = t.mode === "dark" || (t.mode === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      document.documentElement.setAttribute("data-accent", t.accent || "green");
    } catch (e) {}
  })();
</script>
<style>
  /* ---- Theme: light is the default; <html data-theme="dark"> and data-accent="blue|orange|purple|rose" override it ---- */
  :root{
    --bg: #F5F7FA;
    --panel: #FFFFFF;
    --ink: #1F2937;
    --ink-soft: #6B7280;
    --line: #E5E7EB;
    --panel-glass: rgba(255,255,255,0.92);
    --panel-soft: rgba(255,255,255,0.6);
    --input-bg: #FFFFFF;
    --hover: rgba(0,0,0,0.05);
    --scroll: #D1D5DB;
    --disabled-bg: #D1D5DB; --disabled-fg: #9CA3AF; --disabled-soft: #F3F4F6;
    --danger-bg: #FEF2F2; --danger-fg: #B91C1C; --danger-border: #FECACA;
    --ok-bg: #F0FDF4; --ok-fg: #15803D; --ok-border: #BBF7D0;
    --warn-bg: #FFFBEB; --warn-fg: #92400E; --warn-border: #FDE68A;
    --brick: #DC2626;
    --leaf: #16A34A;
    /* accent colour (Sage Green by default) */
    --teal: #4F7F5F;
    --gold: #4F7F5F;
    --gold-bright: #3f664c;
    --gold-deep: #3f664c;
    --gold-hover: #3f664c;
    --teal-deep: #213528;
    --gold-soft: #e6ede9;
    --accent-border: #c7d6cc;
    --accent-glow: rgba(79,127,95,0.18);
    --accent-shadow: rgba(63,102,76,0.6);
  }
  html[data-accent="blue"]  { --teal:#2F76B8; --gold:#2F76B8; --gold-bright:#276198; --gold-deep:#276198; --gold-hover:#276198; --teal-deep:#14324d; --gold-soft:#e2ecf5; --accent-border:#bcd3e8; --accent-glow:rgba(47,118,184,0.18); --accent-shadow:rgba(39,97,152,0.6); }
  html[data-accent="orange"]{ --teal:#EA580C; --gold:#EA580C; --gold-bright:#C2410C; --gold-deep:#C2410C; --gold-hover:#C2410C; --teal-deep:#7C2D12; --gold-soft:#FFEDD5; --accent-border:#FED7AA; --accent-glow:rgba(234,88,12,0.18);  --accent-shadow:rgba(194,65,12,0.6); }
  html[data-accent="purple"] { --teal:#7A5CA8; --gold:#7A5CA8; --gold-bright:#674c8f; --gold-deep:#674c8f; --gold-hover:#674c8f; --teal-deep:#332647; --gold-soft:#ece8f3; --accent-border:#d4cbe3; --accent-glow:rgba(122,92,168,0.18); --accent-shadow:rgba(103,76,143,0.6); }
  html[data-accent="rose"]  { --teal:#D0537A; --gold:#D0537A; --gold-bright:#c53662; --gold-deep:#c53662; --gold-hover:#c53662; --teal-deep:#601a30; --gold-soft:#f8e7ec; --accent-border:#f0c8d4; --accent-glow:rgba(208,83,122,0.18); --accent-shadow:rgba(197,54,98,0.6); }

  html[data-theme="dark"]{
    color-scheme: dark;
    --bg: #0B1220;
    --panel: #111A2B;
    --ink: #E5E7EB;
    --ink-soft: #9AA4B2;
    --line: #243044;
    --panel-glass: rgba(11,18,32,0.9);
    --panel-soft: rgba(255,255,255,0.04);
    --input-bg: #0D1626;
    --hover: rgba(255,255,255,0.08);
    --scroll: #334155;
    --disabled-bg: #263244; --disabled-fg: #6B7280; --disabled-soft: #1A2436;
    --danger-bg: #2A1215; --danger-fg: #FCA5A5; --danger-border: #5B1F24;
    --ok-bg: #0F2A1B; --ok-fg: #86EFAC; --ok-border: #1F5130;
    --warn-bg: #2A210A; --warn-fg: #FCD34D; --warn-border: #5C4510;
    --brick: #EF4444;
    --teal: #5f9872; --gold: #5f9872;
    --gold-bright: #a7c8b2; --gold-deep: #a7c8b2; --gold-hover: #3f664c;
    --teal-deep: #c6dcce; --gold-soft: #152129; --accent-border: #233836;
    --accent-glow: rgba(79,127,95,0.25); --accent-shadow: rgba(0,0,0,0.5);
  }
  html[data-theme="dark"][data-accent="blue"] { --teal:#468ac9; --gold:#468ac9; --gold-bright:#8db9e2; --gold-deep:#8db9e2; --gold-hover:#276198; --teal-deep:#b6d2ec; --gold-soft:#102035; --accent-border:#183555; --accent-glow:rgba(47,118,184,0.25); }
  html[data-theme="dark"][data-accent="orange"]{ --teal:#EA580C; --gold:#EA580C; --gold-bright:#FB923C; --gold-deep:#FB923C; --gold-hover:#C2410C; --teal-deep:#FDBA74; --gold-soft:#3A1D0B; --accent-border:#7C2D12; --accent-glow:rgba(234,88,12,0.25); }
  html[data-theme="dark"][data-accent="purple"] { --teal:#9077b6; --gold:#9077b6; --gold-bright:#b3a2cd; --gold-deep:#b3a2cd; --gold-hover:#674c8f; --teal-deep:#cec3df; --gold-soft:#1b1c33; --accent-border:#322c50; --accent-glow:rgba(122,92,168,0.25); }
  html[data-theme="dark"][data-accent="rose"] { --teal:#d3698a; --gold:#d3698a; --gold-bright:#e08fa8; --gold-deep:#e08fa8; --gold-hover:#c53662; --teal-deep:#ebb7c7; --gold-soft:#271b2d; --accent-border:#502940; --accent-glow:rgba(208,83,122,0.25); }
  html[data-theme="dark"] .hover\:bg-black\/5:hover{ background-color: var(--hover) !important; }
  /* Tailwind's default border colour is light grey; keep un-styled borders on the dark palette */
  html[data-theme="dark"] :is(.border, .border-t, .border-b, .border-y, .border-l, .border-r){ border-color: var(--line); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    transition: background-color .25s ease, color .25s ease;
    background:var(--bg);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', 'Hind Siliguri', ui-sans-serif, system-ui, sans-serif;
  }
  .font-display{font-family:'Plus Jakarta Sans', 'Hind Siliguri', ui-sans-serif, system-ui, sans-serif;}
  .font-mono{font-family:'JetBrains Mono', ui-monospace, monospace;}
  .gold-text{ color: var(--gold-deep); }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;}

  .ticket{
    position:relative;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-hover) 100%);
    color:#FFFFFF;
    border-radius: 12px;
    overflow:visible;
    box-shadow: 0 6px 16px -8px var(--accent-shadow);
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:18px; height:18px;
    background: var(--bg);
    border-radius:50%;
  }
  .ticket::before{ left:-9px; }
  .ticket::after{ right:-9px; }
  .ticket .perf{ border-left: 2px dashed rgba(255,255,255,0.45); }

  /* ---- Enhanced Modern Navigation & Tab System ---- */
  .no-scrollbar{ scrollbar-width:none; -ms-overflow-style:none; }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .nav-track{
    background: var(--panel-glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    gap: 3px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .nav-pill{
    position:relative; flex-shrink:0;
    display:inline-flex; align-items:center; gap:7px;
    padding:8px 14px; border-radius:10px;
    font-size:12.5px; font-weight:600; white-space:nowrap;
    color: var(--ink-soft);
    transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .nav-pill:hover{ color: var(--gold-deep); background: var(--hover); transform: translateY(-1px); }
  .nav-pill.active{
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-hover) 100%);
    color:#FFFFFF;
    box-shadow: 0 4px 14px -3px var(--accent-shadow);
    border-radius: 10px;
  }
  .nav-pill .nav-label{ display:none; }
  .nav-pill.active .nav-label{ display:inline; }
  @media (min-width: 1100px){ .nav-pill .nav-label{ display:inline; } }
  
  /* Phones: native app style bottom floating bar with smooth scroll */
  .mobile-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    background: var(--panel-glass);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-top:1px solid var(--line);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
  }
  .mobile-nav .nav-track{ width:100%; border:0; background:transparent; padding:0; border-radius:0; gap:2px; box-shadow:none; }
  .mobile-nav .nav-pill{
    flex:0 0 auto; min-width:54px; flex-direction:column; gap:2px;
    padding:6px 6px; font-size:9.5px; border-radius:12px; justify-content:center;
  }
  .mobile-nav .nav-pill .nav-label{ display:inline; font-size: 9.5px; }
  .mobile-nav .nav-pill.active{ background: linear-gradient(135deg, var(--gold) 0%, var(--gold-hover) 100%); }
  .mobile-nav .nav-badge{ position:absolute; top:2px; right:8px; }
  .nav-badge{
    min-width:16px; height:16px; padding:0 4px; border-radius:999px;
    display:inline-grid; place-items:center;
    font-size:10px; font-weight:700; line-height:1;
    background: var(--brick); color:#FFFFFF;
  }
  .avatar-dot{
    width:34px; height:34px; border-radius:999px; flex-shrink:0;
    place-items:center;
    font-weight:700; font-size:13px; color:#FFFFFF;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-hover) 100%);
  }
  .rating-bar{ height:8px; border-radius:999px; background: var(--line); overflow:hidden; }
  .rating-bar > span{ display:block; height:100%; border-radius:999px; background: var(--gold); transition: width .4s ease; }

  /* Filter category tabs (Menu, Orders, etc.) */
  .tab-btn{
    font-weight:600;
    padding:8px 16px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tab-btn.active{
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-hover) 100%);
    color: #FFFFFF;
    box-shadow: 0 4px 12px -3px var(--accent-shadow);
    border-color: transparent;
  }
  .tab-btn:not(.active){
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .tab-btn:not(.active):hover{
    border-color: var(--gold);
    color: var(--gold-deep);
    background: var(--gold-soft);
    transform: translateY(-1px);
  }

  /* Innovative Cards with depth & smooth elevation */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow: 0 2px 8px rgba(16,24,40,0.04), 0 1px 2px rgba(16,24,40,0.02);
    transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .card:hover{
    border-color: var(--accent-border);
    box-shadow: 0 8px 24px -4px rgba(16,24,40,0.08), 0 2px 6px -1px rgba(16,24,40,0.04);
  }

  .btn-primary{
    background: var(--gold);
    color: #FFFFFF;
    font-weight:600;
    font-size:.9em;
    border-radius:8px;
    transition: background .15s ease, transform .1s ease;
  }
  .btn-primary:hover{ background: var(--gold-hover); }
  .btn-primary:active{ transform: scale(.98); }
  .btn-primary:disabled{ background:var(--disabled-bg); color:var(--disabled-fg); cursor:not-allowed; transform:none; }

  .btn-gold{
    background: var(--panel);
    border: 1px solid var(--gold);
    color: var(--gold-deep);
    font-weight:600;
    font-size:.9em;
  }
  .btn-gold:hover{ background: var(--gold); color: #FFFFFF; }
  .btn-gold:disabled{ border-color:var(--disabled-bg); color:var(--disabled-fg); background:var(--disabled-soft); cursor:not-allowed; }

  .stepper-dot{
    width:14px;height:14px;border-radius:50%;
    background:var(--line);
    border:2px solid var(--line);
  }
  .stepper-dot.done{ background:var(--gold); border-color:var(--gold); }
  .stepper-dot.current{ background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 5px var(--accent-glow); }

  .cal-cell{
    aspect-ratio:1/1;
    border-radius:8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer;
    user-select:none;
    border:1px solid var(--line);
    transition: transform .1s ease, border-color .15s ease;
    background:var(--panel);
    color: var(--ink);
  }
  .cal-cell:hover{ transform: translateY(-2px); border-color: var(--gold); }
  .cal-full{ background: var(--gold); color:#FFFFFF; border-color:var(--gold); }
  .cal-half{ background: var(--gold-soft); color:var(--teal-deep); border-color:var(--gold); }

  .fade-in{ animation: fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .low-stock-banner{
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
  }

  .error-banner{ background:var(--danger-bg); color:var(--danger-fg); border:1px solid var(--danger-border); }
  .success-banner{ background:var(--ok-bg); color:var(--ok-fg); border:1px solid var(--ok-border); }
  .warn-banner{ background:var(--warn-bg); color:var(--warn-fg); border:1px solid var(--warn-border); }

  /* top bar log out button (all restaurants) */
  .cd-divider{ width:1px; height:24px; background:var(--line); margin:0 4px; }
  .cd-logout{ display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 10px; border-radius:10px; border:1px solid var(--danger-border); background:var(--panel); color:var(--danger-fg); font-size:.8rem; font-weight:600; cursor:pointer; flex-shrink:0; transition:background .15s, transform .1s; }
  .cd-logout:hover{ background:var(--danger-bg); }
  .cd-logout:active{ transform:scale(.97); }
  .cd-logout-text{ display:none; }
  @media (min-width:1100px){ .cd-logout{ padding:0 12px; } .cd-logout-text{ display:inline; } }

  #print-area{ display:none; }
  #print-sheet{ display:none; }
  @page{ margin:14mm; }
  @media print{
    html, html[data-theme="dark"] body{ background:#FFFFFF !important; color:#111827 !important; }
    body *{ visibility:hidden; }
    #print-area, #print-area *{ visibility:visible; }
    #print-area{
      display:block; position:absolute; left:0; top:0; width:100%;
      display:flex; justify-content:center; padding:32px 16px;
    }
    .receipt{
      background:#FFFFFF; width:320px; border:1.5px dashed #9CA3AF; border-radius:14px;
      padding:22px 20px; font-family:'Plus Jakarta Sans', 'Hind Siliguri', ui-sans-serif, sans-serif;
      color:#111827;
    }
    .receipt-row{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; }
    .receipt-divider{ border-top:1px dashed #9CA3AF; margin:12px 0; }
    .no-print{ display:none !important; }
    body.printing-sheet > #root{ display:none !important; }
    body.printing-sheet #print-sheet, body.printing-sheet #print-sheet *{ visibility:visible; }
    body.printing-sheet #print-sheet{ display:block !important; }
    #print-sheet{ font-family:'Plus Jakarta Sans','Hind Siliguri',ui-sans-serif,sans-serif; color:#111827; background:#FFFFFF; font-size:12px; line-height:1.45; }
    #print-sheet *{ color:#111827; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #print-sheet h1{ font-size:20px; margin:0 0 2px; }
    #print-sheet h2{ font-size:13px; margin:16px 0 6px; padding-bottom:3px; border-bottom:1px solid #9CA3AF; break-after:avoid; }
    #print-sheet .ps-meta{ color:#4B5563; font-size:11px; margin-bottom:14px; }
    #print-sheet .ps-empty{ color:#6B7280; font-size:11.5px; margin:4px 0; }
    #print-sheet .ps-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
    #print-sheet .ps-tile{ border:1px solid #D1D5DB; border-radius:6px; padding:6px 9px; break-inside:avoid; }
    #print-sheet .ps-k{ font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:#6B7280; }
    #print-sheet .ps-v{ font-size:15px; font-weight:700; font-family:ui-monospace,Menlo,Consolas,monospace; }
    #print-sheet table{ width:100%; border-collapse:collapse; font-size:11.5px; }
    #print-sheet th, #print-sheet td{ padding:4px 6px; border-bottom:1px solid #E5E7EB; text-align:left; vertical-align:top; }
    #print-sheet th{ background:#F3F4F6; font-weight:700; }
    #print-sheet .num{ text-align:right; white-space:nowrap; font-family:ui-monospace,Menlo,Consolas,monospace; }
    #print-sheet thead{ display:table-header-group; }
    #print-sheet tr{ break-inside:avoid; page-break-inside:avoid; }
    #print-sheet .ps-bar{ height:8px; min-width:2px; background:#374151; border-radius:2px; }
  }

  .chip{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .chip:hover{ border-color: var(--gold); color: var(--gold-deep); }
  .chip.active-chip{
    background: var(--gold);
    color: #FFFFFF;
    border-color: var(--gold);
  }

  .logo-badge{
    background: var(--gold);
    border-radius: 10px;
  }

  /* CampusDine logo after login: the same picture as the front page (follows the accent colour) */
  .cd-logo{ display:block; flex:none; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:#fffdf7 url(/images/landing/logo-green.png) center/cover no-repeat; }
  html[data-accent="blue"] .cd-logo{ background-image:url(/images/landing/logo-blue.png); }
  html[data-accent="purple"] .cd-logo{ background-image:url(/images/landing/logo-purple.png); }
  html[data-accent="rose"] .cd-logo{ background-image:url(/images/landing/logo-rose.png); }
  html[data-accent="orange"] .cd-logo{ background-image:url(/images/landing/logo.png); }
  .cd-logo-lg{ width:72px; height:72px; }

  /* Role Option Cards */
  .role-option{
    background:var(--panel);
    border-radius: 14px !important;
    border: 1.5px solid var(--line) !important;
    transition: all .22s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 2px 6px rgba(16,24,40,0.03);
  }
  .role-option:hover{
    border-color:var(--gold) !important;
    background: var(--gold-soft);
    transform: translateY(-3px) scale(1.015);
    box-shadow: 0 10px 24px -2px var(--accent-glow);
  }

  /* ---- Innovative Smart Campus Dining Features CSS ---- */
  /* Anti-fraud live laser scan on QR */
  .qr-laser-wrap {
    position: relative; overflow: hidden; display: inline-block;
    border-radius: 14px; padding: 6px; background: #fff;
    border: 2px solid var(--accent-border); box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  .qr-laser-beam {
    position: absolute; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, #22c55e, #16a34a, transparent);
    box-shadow: 0 0 10px #22c55e;
    animation: qrScan 2.2s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 2;
  }
  @keyframes qrScan { 0% { top: 6px; } 100% { top: calc(100% - 22px); } }

  /* Busy-o-Meter Styles */
  .busy-meter-pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 14px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700;
  }
  .busy-low { background: rgba(34, 197, 94, 0.12); color: #15803d; border: 1px solid rgba(34, 197, 94, 0.3); }
  .busy-mod { background: rgba(245, 158, 11, 0.14); color: #b45309; border: 1px solid rgba(245, 158, 11, 0.35); }
  .busy-peak { background: rgba(239, 68, 68, 0.14); color: #b91c1c; border: 1px solid rgba(239, 68, 68, 0.35); }

  /* Scratch Card Box */
  .scratch-card-box {
    background: linear-gradient(135deg, var(--gold-soft), var(--panel));
    border: 2px dashed var(--gold);
    border-radius: 18px;
    padding: 22px;
    text-align: center;
    cursor: pointer;
    transition: all .2s ease;
  }
  .scratch-card-box:hover { transform: scale(1.02); box-shadow: 0 10px 25px var(--accent-glow); }
  .scratch-cover {
    background: linear-gradient(135deg, #334155, #1e293b);
    color: #fff;
    border-radius: 14px;
    padding: 28px 16px;
    font-weight: 800;
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.1);
  }

  /* Foodie Badges */
  .badge-chip {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 14px;
    border: 1.5px solid var(--line);
    background: var(--panel);
    transition: all .2s ease;
  }
  .badge-chip.unlocked {
    border-color: var(--gold);
    background: var(--gold-soft);
  }
  .badge-chip.locked { opacity: 0.45; filter: grayscale(1); }

  /* Emergency SOS Pulse */
  @keyframes sosPulse {
    0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6); }
    70% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
    100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
  }
  .btn-sos {
    background: #dc2626; color: #fff;
    animation: sosPulse 1.8s infinite;
    font-weight: 800; font-size: 13px;
    padding: 8px 16px; border-radius: 12px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    border: none; transition: transform .15s ease;
  }
  .btn-sos:hover { transform: scale(1.05); }

  /* Floating Reward Button */
  .floating-reward-btn {
    position: fixed; right: 20px; bottom: 85px; z-index: 40;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff; font-weight: 800; font-size: 13px;
    padding: 10px 18px; border-radius: 999px;
    box-shadow: 0 6px 20px rgba(217,119,6,0.35);
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; border: 2px solid #fff;
    transition: all .22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .floating-reward-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 10px 28px rgba(217,119,6,0.5); }
  @media (max-width: 640px) { .floating-reward-btn { bottom: 70px; right: 14px; padding: 8px 14px; font-size: 11.5px; } }

  /* ---- Innovative Rider Dashboard & Real-time Styles ---- */
  .rider-metric-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    position: relative;
    overflow: hidden;
    transition: all .2s ease;
    box-shadow: 0 2px 8px rgba(16,24,40,0.04);
  }
  .rider-metric-card:hover {
    border-color: var(--accent-border);
    box-shadow: 0 8px 24px rgba(16,24,40,0.08);
    transform: translateY(-2px);
  }
  .rider-status-card {
    border-radius: 14px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all .25s ease;
  }
  .rider-status-card.active {
    background: rgba(22,163,74,0.09);
    border: 1.5px solid rgba(22,163,74,0.3);
  }
  .rider-status-card.inactive {
    background: var(--panel-soft);
    border: 1.5px solid var(--line);
  }
  @keyframes radarPulse {
    0% { box-shadow: 0 0 0 0 rgba(22,163,74,0.5); }
    70% { box-shadow: 0 0 0 10px rgba(22,163,74,0); }
    100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); }
  }
  .rider-radar-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #16A34A;
    animation: radarPulse 1.8s infinite;
    flex-shrink: 0;
  }
  .rider-radar-off {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--ink-soft);
    flex-shrink: 0;
  }
  .rider-order-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    transition: all .2s ease;
    box-shadow: 0 2px 6px rgba(16,24,40,0.03);
  }
  .rider-order-card:hover {
    border-color: var(--accent-border);
    box-shadow: 0 6px 18px rgba(16,24,40,0.07);
    transform: translateY(-1px);
  }
  .order-status-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 12px; border-radius: 999px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .order-status-badge.received { background: rgba(59,130,246,0.12); color: #1d4ed8; }
  .order-status-badge.cooking { background: rgba(245,158,11,0.14); color: #92400e; }
  .order-status-badge.ready { background: rgba(22,163,74,0.14); color: #15803d; }
  .order-status-badge.assigned { background: rgba(249,115,22,0.14); color: #9a3412; }
  .order-status-badge.accepted { background: rgba(139,92,246,0.14); color: #6d28d9; }
  .shift-btn-active {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-radius: 12px;
    background: rgba(220,38,38,0.1); color: #B91C1C;
    border: 1.5px solid rgba(220,38,38,0.3);
    font-weight: 700; font-size: 13.5px; cursor: pointer;
    transition: all .18s ease;
  }
  .shift-btn-active:hover { background: rgba(220,38,38,0.18); transform: translateY(-1px); }
  .shift-btn-inactive {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-radius: 12px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-hover) 100%);
    color: #FFFFFF;
    border: 1.5px solid var(--gold);
    font-weight: 700; font-size: 13.5px; cursor: pointer;
    transition: all .18s ease;
    box-shadow: 0 4px 12px -2px var(--accent-shadow);
  }
  .shift-btn-inactive:hover { transform: translateY(-1px); box-shadow: 0 6px 16px -2px var(--accent-shadow); }

  .divider-flourish{ display:flex; align-items:center; justify-content:center; gap:14px; color: var(--gold); }
  .divider-flourish::before, .divider-flourish::after{
    content:""; flex:1; max-width:80px; border-bottom:1px solid var(--line);
  }

  input, select, textarea{ background: var(--input-bg); color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  button:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/*chat-ui*/
.chat-shell{display:grid;gap:16px;height:min(76vh,720px);min-height:480px}
.chat-shell[data-admin="1"]{grid-template-columns:320px minmax(0,1fr)}
.chat-inbox{display:flex;flex-direction:column;overflow:hidden;padding:0}
.chat-inbox-head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.chat-search{width:100%;margin-top:10px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--input-bg);color:var(--ink);font-size:13px;outline:none}

.chat-inbox-list{flex:1;overflow-y:auto;padding:6px}
.chat-item{display:flex;gap:12px;width:100%;text-align:left;padding:10px;border-radius:12px;transition:background .15s}
.chat-item:hover{background:var(--hover)}
.chat-item.active{background:var(--gold-soft)}
.chat-item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chat-item-top,.chat-item-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-item-name{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chat-item-last{font-size:12.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item-role{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
.chat-badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--gold);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.chat-panel{display:flex;flex-direction:column;overflow:hidden;padding:0;min-height:0}
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.chat-back{display:none;width:34px;height:34px;border-radius:999px;place-items:center;color:var(--ink)}
.chat-pill{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:600;white-space:nowrap}
.chat-error{padding:8px 16px;font-size:13px;color:var(--brick)}
.chat-scroll{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.chat-day{display:flex;justify-content:center;margin:14px 0 8px}
.chat-day span{font-size:11px;padding:3px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink-soft)}
.chat-row{display:flex;align-items:flex-end;gap:8px;justify-content:flex-start}
.chat-row.mine{justify-content:flex-end}
.chat-bubble{max-width:min(78%,520px);padding:8px 12px 6px;font-size:14px;line-height:1.45;animation:chatIn .18s ease;border-radius:18px}
.chat-bubble p{white-space:pre-wrap;word-break:break-word;margin:0}
.chat-bubble.first{margin-top:8px}
.chat-bubble.theirs{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:6px}
.chat-bubble.theirs.last{border-bottom-left-radius:18px;border-bottom-left-radius:4px}
.chat-bubble.mine{background:linear-gradient(135deg,var(--gold),var(--gold-hover));color:#fff;border-bottom-right-radius:6px}
.chat-bubble.mine.last{border-bottom-right-radius:4px}
.chat-bubble.pending{opacity:.6}
.chat-name{font-size:11px;font-weight:700;color:var(--gold);margin-bottom:2px}
.chat-meta{display:block;text-align:right;font-size:10px;margin-top:2px;opacity:.7}
.chat-empty{margin:auto;text-align:center;max-width:320px;color:var(--ink-soft);font-size:14px}
.chat-empty-icon{width:64px;height:64px;margin:0 auto 12px;border-radius:999px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.chat-quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chat-quick button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;transition:all .15s}
.chat-quick button:hover{border-color:var(--gold);color:var(--gold)}
.chat-composer{display:flex;align-items:flex-end;gap:10px;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel)}
.chat-input-wrap{flex:1;position:relative}
.chat-input-wrap textarea{width:100%;resize:none;max-height:120px;padding:10px 16px;border-radius:22px;border:1px solid var(--line);background:var(--input-bg);color:var(--ink);font-size:14px;line-height:1.4;outline:none;display:block}
.chat-input-wrap textarea:focus{border-color:var(--gold)}
.chat-count{position:absolute;right:14px;bottom:-16px;font-size:10px;color:var(--ink-soft)}
.chat-send{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;background:var(--gold);color:#fff;flex-shrink:0;transition:transform .1s,opacity .15s}
.chat-send:hover:not(:disabled){transform:scale(1.06)}
.chat-send:disabled{background:var(--disabled-bg);color:var(--disabled-fg);cursor:not-allowed}
@keyframes chatIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:900px){
  .chat-shell[data-admin="1"]{grid-template-columns:1fr}
  .chat-shell[data-admin="1"][data-mobile-chat="0"] .chat-panel{display:none}
  .chat-shell[data-admin="1"][data-mobile-chat="1"] .chat-inbox{display:none}
  .chat-shell[data-admin="1"] .chat-back{display:grid}
  .chat-pill{display:none}
}

.chat-searchbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);animation:chatIn .15s ease}
.chat-searchbar input{flex:1;min-width:0;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--input-bg);color:var(--ink);font-size:13px;outline:none}
.chat-searchbar input:focus{border-color:var(--gold)}
.chat-search-count{font-size:12px;color:var(--ink-soft);white-space:nowrap;min-width:64px;text-align:right}
.chat-searchbar button{width:28px;height:28px;border-radius:999px;color:var(--ink-soft);font-size:11px}
.chat-searchbar button:hover:not(:disabled){background:var(--hover)}
.chat-searchbar button:disabled{opacity:.35;cursor:default}
mark.chat-hit{background:#fde047;color:#111;border-radius:3px;padding:0 1px}
.chat-row.search-current .chat-bubble{box-shadow:0 0 0 2px var(--gold)}
.chat-row.search-current mark.chat-hit{background:#f59e0b}

/*chat-ui14*/
.chat-bubble{position:relative}
.chat-react-wrap{position:relative;align-self:center}
.chat-react-btn{width:26px;height:26px;border-radius:999px;color:var(--ink-soft);font-size:15px;line-height:1;opacity:0;transition:opacity .12s,background .12s}
.chat-row:hover .chat-react-btn,.chat-react-btn:focus-visible,.chat-react-wrap.open .chat-react-btn{opacity:1}
@media (hover:none){.chat-react-btn{opacity:.55}}
.chat-react-btn:hover{background:var(--hover)}
.chat-reactbar{position:absolute;z-index:7;display:flex;gap:2px;padding:5px 6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.2);animation:chatIn .12s ease;white-space:nowrap}
.chat-reactbar.up{bottom:calc(100% + 6px)}
.chat-reactbar.down{top:calc(100% + 6px)}
.chat-reactbar.mine{right:0}
.chat-reactbar.theirs{left:0}
.chat-reactbar button{width:34px;height:34px;border-radius:999px;font-size:20px;transition:transform .12s,background .12s}
.chat-reactbar button:hover{transform:scale(1.25);background:var(--gold-soft)}
.chat-reactbar button.on{background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--gold)}
.chat-bubble.has-react{margin-bottom:14px}
.chat-reactions{position:absolute;bottom:-13px;display:flex;gap:4px}
.chat-bubble.mine .chat-reactions{right:10px}
.chat-bubble.theirs .chat-reactions{left:10px}
.chat-pill-react{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.12);font-size:12px;line-height:1.5;color:var(--ink);cursor:pointer}
.chat-pill-react.mine{border-color:var(--gold);background:var(--gold-soft)}
.chat-pill-react b{font-size:11px;font-weight:600;color:var(--ink-soft)}

/*chat-ui15*/
.chat-bc-open{display:block;width:100%;margin-top:10px;padding:8px 12px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-size:13px;font-weight:600;text-align:center;transition:background .15s,color .15s}
.chat-bc-open:hover{background:var(--gold);color:#fff}
.chat-bc-tag{display:inline-block;margin-bottom:4px;font-size:11px;font-weight:700;color:var(--gold)}
.chat-bubble.mine .chat-bc-tag{color:#fff;opacity:.92}
.chat-bc-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;animation:chatIn .15s ease}
.chat-bc-modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);color:var(--ink);border-radius:18px;padding:18px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.chat-bc-head{display:flex;align-items:center;justify-content:space-between}
.chat-bc-head h3{font-size:17px;font-weight:700;margin:0}
.chat-bc-head button{width:30px;height:30px;border-radius:999px;color:var(--ink-soft)}
.chat-bc-head button:hover{background:var(--hover)}
.chat-bc-sub{font-size:12.5px;color:var(--ink-soft);margin:4px 0 12px}
.chat-bc-note.err{color:var(--brick)}
.chat-bc-send{padding:9px 18px;border-radius:999px;background:var(--gold);color:#fff;font-size:13px;font-weight:700;transition:opacity .15s}
.chat-bc-send:disabled{background:var(--disabled-bg);color:var(--disabled-fg);cursor:not-allowed}
.chat-bc-history{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.chat-bc-history h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 6px}
.chat-bc-history div{padding:6px 0;font-size:13px}
.chat-bc-history small{display:block;color:var(--ink-soft);font-size:11.5px}

.input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--input-bg);color:var(--ink);width:100%;outline:none}.input:focus{border-color:var(--teal)}

async function api(apiBase, path, { method = "GET", body, token } = {}) {
  const res = await fetch(`${apiBase}${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

// Draws a QR code as inline SVG (black on white, so scanners work in dark theme too).
// Uses the small "qrcode-generator" library loaded in <head>; if it failed to load we show the plain token instead.
function QrCode({ value, size = 120, dim = false }) {
  const qr = useMemo(() => {
    try {
      if (typeof window.qrcode !== "function" || !value) return null;
      const q = window.qrcode(0, "M");
      q.addData(String(value));
      q.make();
      const n = q.getModuleCount();
      let d = "";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c},${r}h1v1h-1z`;
      return { n, d };
    } catch (e) { return null; }
  }, [value]);
  if (!qr) return null;
  const pad = 4;
  return (
    <svg role="img" aria-label="QR code" width={size} height={size} viewBox={`${-pad} ${-pad} ${qr.n + pad * 2} ${qr.n + pad * 2}`}
      shapeRendering="crispEdges" style={{ background: "#fff", borderRadius: 8, flexShrink: 0, opacity: dim ? 0.3 : 1 }}>
      <rect x={-pad} y={-pad} width={qr.n + pad * 2} height={qr.n + pad * 2} fill="#fff" />
      <path d={qr.d} fill="#000" />
    </svg>
  );
}

function FullMenuCard({ onLogin }) {
  const [open, setOpen] = useState(false); // the card shows its two buttons
  const [page, setPage] = useState(null); // null | "special" | "book"
  // Menu Book is its own page with its own address (#menu-book), so the browser back button works too
  const closePage = () => {
    if (window.location.hash === "#menu-book") {
      try { window.history.replaceState(null, "", window.location.pathname + window.location.search); } catch (e) { window.location.hash = ""; }
    }
    setPage(null);
  };
  const openBook = () => { window.location.hash = "menu-book"; setPage("book"); };
  // the 3D book opens on top of the Menu Book page (see menu-book.js); the View Menu button hides while it is open
  const [bookOpen, setBookOpen] = useState(false);
  const viewMenu = () => { if (window.CampusDineMenuBook) window.CampusDineMenuBook.open(); };
  useEffect(() => {
    const onToggle = (e) => setBookOpen(!!(e.detail && e.detail.open));
    document.addEventListener("menubook:toggle", onToggle);
    return () => document.removeEventListener("menubook:toggle", onToggle);
  }, []);
  // the book opens by itself (cover first, then it swings open); View Menu brings it back after it is closed with the cross
  useEffect(() => {
    if (page !== "book" || !window.CampusDineMenuBook) return;
    const t = setTimeout(() => window.CampusDineMenuBook.open(), 350);
    return () => clearTimeout(t);
  }, [page]);
  // leaving the Menu Book page (Back, Esc, browser back) also closes the book
  useEffect(() => {
    if (page !== "book" && window.CampusDineMenuBook && window.CampusDineMenuBook.isOpen()) window.CampusDineMenuBook.close();
  }, [page]);
  useEffect(() => {
    const sync = () => {
      if (window.location.hash === "#menu-book") setPage("book");
      else setPage(p => (p === "book" ? null : p));
    };
    sync();
    window.addEventListener("hashchange", sync);
    return () => window.removeEventListener("hashchange", sync);
  }, []);
  useEffect(() => {
    if (!page) return;
    const onKey = (e) => { if (e.key === "Escape" && !e.defaultPrevented) closePage(); };   // Esc inside the open book only closes the book
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    window.addEventListener("keydown", onKey);
    return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };
  }, [page]);

  const closeX = (
    <button type="button" className="cdl-fm-x" onClick={() => setPage(null)} aria-label={tx("more.close")}>&times;</button>
  );

  let overlay = null;
  if (page === "special") {
    overlay = ReactDOM.createPortal(
      <div className="cdl-promo-backdrop darker" onClick={() => setPage(null)} role="dialog" aria-modal="true" aria-label={tx("more.sp")}>
        <div className="cdl-promo-modal cdl-promo-wide" onClick={(e) => e.stopPropagation()}>
          <button type="button" className="cdl-promo-close" onClick={() => setPage(null)} aria-label={tx("more.close")}>&times;</button>
          <img className="cdl-promo-img" src="images/promo/special-offer-today.png" alt="CampusDine today's special offer discount" />
        </div>
      </div>, document.body);
  } else if (page === "book") {
    overlay = ReactDOM.createPortal(
      <div className={"cdl-fm-page cdl-fm-book" + (bookOpen ? " is-reading" : "")} role="dialog" aria-modal="true" aria-label={tx("more.mb")}>
        <div className="cdl-fm-bar">
          <button type="button" className="cdl-fm-backbtn" onClick={closePage}>&larr; {tx("more.back")}</button>
        </div>
        <button type="button" className="cdl-fm-viewbtn" hidden={bookOpen} onClick={viewMenu}>&#128214; {tx("more.view")}</button>
      </div>, document.body);
  }

  return (
    <div className="card cdl-fm-card flex flex-col items-center justify-center text-center p-6 gap-3"
      role={open ? undefined : "button"} tabIndex={open ? undefined : 0}
      onClick={() => { if (!open) setOpen(true); }}
      onKeyDown={(e) => { if (!open && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); setOpen(true); } }}>
      <Icon path={I.menu} className="w-7 h-7" style={{ color: "var(--gold)" }} />
      <div className="font-display font-700 text-sm" style={{ color: "var(--ink)" }}>{tx("more")}</div>
      {open ? (
        <div className="cdl-fm-actions">
          <button type="button" className="cdl-fm-btn primary" onClick={() => setPage("special")}>{tx("more.sp")}</button>
          <button type="button" className="cdl-fm-btn ghost" onClick={openBook}>{tx("more.mb")}</button>
          <button type="button" className="cdl-fm-back" onClick={(e) => { e.stopPropagation(); setOpen(false); }}>&larr; {tx("more.back")}</button>
        </div>
      ) : (
        <p className="text-xs" style={{ color: "var(--ink-soft)" }}>{tx("more.d")}</p>
      )}
      {overlay}
    </div>
  );
}

// Promotional popup: appears 1 second after the front page loads, dark backdrop, cross button to close
function PromoPopup() {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setOpen(true), 1000);
    return () => clearTimeout(t);
  }, []);
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    window.addEventListener("keydown", onKey);
    return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };
  }, [open]);
  if (!open) return null;
  return (
    <div className="cdl-promo-backdrop" onClick={() => setOpen(false)} role="dialog" aria-modal="true" aria-label="Today's special offer">

}

function Login({ apiBase, setApiBase, onAuth, onToggleLang }) {
  const [mode, setMode] = useState("login"); // 'login' | 'register' | 'forgot'
  const [role, setRole] = useState(() => {
    try {
      const p = new URLSearchParams(window.location.search);
      const r = p.get("role");
      if (r && ["student", "teacher", "admin", "rider"].includes(r)) return r;
    } catch (_) {}
    return null;
  });

  // Read ?role= from URL parameter (e.g. from /role-select.html) and smooth scroll to auth box
  useEffect(() => {
    try {
      const p = new URLSearchParams(window.location.search);
      const r = p.get("role");
      if (r && ["student", "teacher", "admin", "rider"].includes(r)) {
        setRole(r);
        if (r === "admin") setMode("login");
        setTimeout(() => {
          if (authRef.current) authRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
        }, 150);
      }
    } catch (_) {}
  }, []);
  const [name, setName] = useState("");
  const [externalId, setExternalId] = useState("");
  const [password, setPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [email, setEmail] = useState("");
  const [accountType, setAccountType] = useState("regular"); // 'regular' | 'hall'
  const [hallName, setHallName] = useState("");
  const [roomNumber, setRoomNumber] = useState("");
  /* Feature: referral code */
  const [referralCode, setReferralCode] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [taken, setTaken] = useState({ email: false, externalId: false });
  const [newPassword, setNewPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [resetMsg, setResetMsg] = useState(null);
  const [showAdvanced, setShowAdvanced] = useState(false);
  const authRef = useRef(null);
  // new landing header: mobile menu, language dropdown, dark-mode button
  const [navOpen, setNavOpen] = useState(false);
  const [langOpen, setLangOpen] = useState(false);
  const [themeKey, setThemeKey] = useState(0);
  const [isDark, setIsDark] = useState(() => document.documentElement.getAttribute("data-theme") === "dark");
  useEffect(() => {
    const sync = () => setIsDark(document.documentElement.getAttribute("data-theme") === "dark");
    const mo = new MutationObserver(sync);
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    const closeLang = () => setLangOpen(false);
    document.addEventListener("click", closeLang);
    return () => { mo.disconnect(); document.removeEventListener("click", closeLang); };
  }, []);
  const toggleDark = () => {
    const t = readTheme();
    const next = { ...t, mode: document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark" };
    applyTheme(next);
    try { localStorage.setItem("cd_theme", JSON.stringify(next)); } catch (e) {}
    setThemeKey(k => k + 1); // re-read the saved theme in the colour picker
  };

  // Email OTP (sign-up verification + password reset). The server says whether it is switched on.
  const [otpRequired, setOtpRequired] = useState(false);
  const [otp, setOtp] = useState("");
  const [otpSent, setOtpSent] = useState(false);     // sign-up: code has been mailed
  const [resetSent, setResetSent] = useState(false); // forgot password: code has been mailed
  const [otpDev, setOtpDev] = useState(false);       // server has no SMTP: code is in the server console
  const [cooldown, setCooldown] = useState(0);       // seconds until "Resend" works again
  const [loginChallenge, setLoginChallenge] = useState(null); // login 2FA: { challenge, email (masked) } after the password step

  useEffect(() => {
    let alive = true;
    api(apiBase, "/api/auth/config").then(c => { if (alive) setOtpRequired(!!c.otpRequired); }).catch(() => {});
    return () => { alive = false; };
  }, [apiBase]);

  useEffect(() => {
    if (cooldown <= 0) return;
    const t = setTimeout(() => setCooldown(c => c - 1), 1000);
    return () => clearTimeout(t);
  }, [cooldown]);

  // Changing the email (or switching tab / role) throws away a half-finished OTP step
  useEffect(() => { setOtpSent(false); setResetSent(false); setOtp(""); setOtpDev(false); }, [email, mode, role]);
  // Login 2FA step is dropped when the person goes back, switches tab/role or edits the ID
  useEffect(() => { setLoginChallenge(null); }, [externalId, mode, role]);

  const roleOptions = [
    { key: "student", label: tx("role.student.l"), desc: tx("role.student.d"), icon: I.user },
    { key: "teacher", label: tx("role.teacher.l"), desc: tx("role.teacher.d"), icon: I.user },
    { key: "admin", label: tx("role.admin.l"), desc: tx("role.admin.d"), icon: I.dashboard },
    { key: "rider", label: "Delivery Rider", desc: "Share your live location with teachers while on duty.", icon: I.ticket },
    { key: "hall_admin", label: "Hall Admin", desc: "Manage hall services, complaints, notices and operations.", icon: I.dashboard },
  ];

  const sampleMenu = [
    { name: tx("sm.tehari"), tag: tx("sm.tehari.t"), price: "৳ " + num(80), img: "/images/popular/tehari.jpg" },
    { name: tx("sm.roll"), tag: tx("sm.roll.t"), price: "৳ " + num(50), img: "/images/popular/chicken-roll.jpg" },
    { name: tx("sm.brew"), tag: tx("sm.brew.t"), price: "৳ " + num(35), img: "/images/popular/cold-brew.jpg" },
  ];

  const scrollToAuth = () => {
    window.location.href = "/role-select.html";
  };

  const submit = async () => {
    setError(null);
    const id = externalId.trim();
    if (mode === "login") {
      if (!id || !password) { setError(tx("err.fill")); return; }
      if (loginChallenge && !/^\d{6}$/.test(otp.trim())) { setError(tx("otp.err")); return; }
    } else {
      if (!name.trim() || !email.trim() || !id || !password || !confirmPassword) { setError(tx("err.fill")); return; }
      if (!EMAIL_RE.test(email.trim())) { setError(tx("err.email")); return; }
      if (!ID_RE.test(id)) { setError(tx("err.id")); return; }
      if (password.length < 6) { setError(tx("err.pw6")); return; }
      if (password !== confirmPassword) { setError(tx("err.pwmatch")); return; }
      if (role !== "rider" && accountType === "hall" && (!hallName.trim() || !roomNumber.trim())) { setError(tx("err.hall")); return; }
      if (otpRequired && otpSent && !/^\d{6}$/.test(otp.trim())) { setError(tx("otp.err")); return; }
    }
    setBusy(true);
    try {
      // Step 1 of sign-up with OTP: mail the code, then wait for the person to type it
      if (mode === "register" && otpRequired && !otpSent) {
        const r = await api(apiBase, "/api/auth/otp/send-signup", { method: "POST", body: { email: email.trim(), externalId: id } });
        setOtpSent(true); setOtp(""); setCooldown(60); setOtpDev(r.emailed === false);
        return;
      }
      const data = mode === "login"
        ? (loginChallenge
            ? await api(apiBase, "/api/auth/login/verify", { method: "POST", body: { challenge: loginChallenge.challenge, otp: otp.trim() } })
            : await api(apiBase, "/api/auth/login", { method: "POST", body: { externalId: id, password, role } }))
        : await api(apiBase, "/api/auth/register", { method: "POST", body: {
            name: name.trim(), email: email.trim(), externalId: id, role, password,
            accountType: role === "rider" ? "regular" : accountType, hallName: role === "rider" ? "" : hallName.trim(), roomNumber: role === "rider" ? "" : roomNumber.trim(),
            otp: otpRequired ? otp.trim() : undefined,
            referralCode: referralCode.trim() || undefined,
          } });
      // Password was right but this account needs an emailed code: show the code box instead of logging in
      if (data.otpRequired) {
        setLoginChallenge({ challenge: data.challenge, email: data.email });
        setOtp(""); setCooldown(data.resendIn || 60); setOtpDev(data.emailed === false);
        return;
      }
      onAuth(data.token, data.user);
    } catch (e) {
      // Expired login session: go back to the password step
      if (/expired|again/i.test(e.message) && loginChallenge) { setLoginChallenge(null); setOtp(""); }
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const resendLoginCode = async () => {
    if (!loginChallenge) return;
    setError(null); setBusy(true);
    try {
      const r = await api(apiBase, "/api/auth/login/resend", { method: "POST", body: { challenge: loginChallenge.challenge } });
      setOtp(""); setCooldown(r.resendIn || 60); setOtpDev(r.emailed === false);
    } catch (e) { setError(e.message); } finally { setBusy(false); }
  };

  // Tell the person right away if the ID / email already has an account
  const checkTaken = async (field) => {
    const v = field === "email" ? email.trim().toLowerCase() : externalId.trim();
    if (!v || (field === "email" ? !EMAIL_RE.test(v) : !ID_RE.test(v))) return;
    try {
      const r = await api(apiBase, `/api/auth/availability?${field === "email" ? "email" : "externalId"}=${encodeURIComponent(v)}`);
      setTaken(t => ({ ...t, [field]: field === "email" ? !!r.emailTaken : !!r.externalIdTaken }));
    } catch (_) { /* the real check happens on submit */ }
  };

  const pwStrength = (() => {
    let score = 0;
    if (password.length >= 8) score++;
    if (/[A-Za-z]/.test(password) && /\d/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password) || (/[a-z]/.test(password) && /[A-Z]/.test(password))) score++;
    return password.length < 6 ? 0 : Math.max(1, score);
  })();
  const strengthLabel = pwStrength <= 1 ? tx("pw.weak") : pwStrength === 2 ? tx("pw.ok") : tx("pw.strong");
  const strengthColor = pwStrength <= 1 ? "#DC2626" : pwStrength === 2 ? "#D97706" : "var(--leaf)";

  const resendSignupCode = async () => {
    setError(null); setBusy(true);
    try {
      const r = await api(apiBase, "/api/auth/otp/send-signup", { method: "POST", body: { email: email.trim(), externalId: externalId.trim() } });
      setOtp(""); setCooldown(60); setOtpDev(r.emailed === false);
    } catch (e) { setError(e.message); } finally { setBusy(false); }
  };

  // Forgot password, step 1: mail a reset code (the server answers the same whether or not the account exists)
  const sendResetCode = async () => {
    setError(null); setResetMsg(null);
    if (!externalId.trim() || !email.trim()) { setError(tx("err.fill")); return; }
    if (!EMAIL_RE.test(email.trim())) { setError(tx("err.email")); return; }
    setBusy(true);
    try {
      await api(apiBase, "/api/auth/forgot-password", { method: "POST", body: { externalId: externalId.trim(), email: email.trim() } });
      setResetSent(true); setOtp(""); setCooldown(60); setResetMsg(tx("reset.sent"));
    } catch (e) { setError(e.message); } finally { setBusy(false); }
  };

  const submitReset = async () => {
    setError(null); setResetMsg(null);
    if (!externalId.trim() || !email.trim() || !newPassword) { setError(tx("err.fill")); return; }
    if (!EMAIL_RE.test(email.trim())) { setError(tx("err.email")); return; }
    if (newPassword.length < 6) { setError(tx("err.pw6")); return; }
    if (otpRequired && !/^\d{6}$/.test(otp.trim())) { setError(tx("otp.err")); return; }
    setBusy(true);
    try {
      await api(apiBase, "/api/auth/reset-password", { method: "POST", body: { externalId: externalId.trim(), email: email.trim(), newPassword, otp: otpRequired ? otp.trim() : undefined } });
      setOtp(""); setResetSent(false);
      setMode("login");
      setPassword("");
      setNewPassword("");
      setResetMsg(tx("reset.ok"));
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const otpBox = (onResend, shownEmail, hintText) => (
    <div className="rounded-xl border p-3 space-y-2" style={{ borderColor: "var(--line)", background: "var(--bg)" }}>
      <p className="text-xs" style={{ color: "var(--ink-soft)" }}>{tx("otp.sent", { e: shownEmail || email.trim() })}</p>
      <label className="text-xs uppercase tracking-wide block" style={{ color: "var(--ink-soft)" }}>{tx("otp.label")}</label>
      <input value={otp} inputMode="numeric" autoComplete="one-time-code" maxLength={6} placeholder={tx("otp.ph")}
        onChange={e => setOtp(e.target.value.replace(/\D/g, "").slice(0, 6))}
        className="w-full px-4 py-2.5 rounded-xl border text-center text-xl font-700" style={{ borderColor: "var(--line)", letterSpacing: "0.5em" }} />
      <div className="flex items-center justify-between gap-2 text-xs">
        <span style={{ color: "var(--ink-soft)" }}>{hintText || tx("otp.change")}</span>
        <button type="button" disabled={busy || cooldown > 0} onClick={onResend}
          className="font-600 shrink-0" style={{ color: cooldown > 0 ? "var(--ink-soft)" : "var(--gold)" }}>
          {cooldown > 0 ? tx("otp.resendin", { s: cooldown }) : tx("otp.resend")}
        </button>
      </div>
      {otpDev && <p className="text-[11px]" style={{ color: "var(--ink-soft)" }}>{tx("otp.devhint")}</p>}
    </div>
  );

  const pillTab = (key, label) => (
    <button onClick={() => { setMode(key); setError(null); }}
      className="flex-1 py-2.5 rounded-full text-xs font-700 transition-all"
      style={mode === key
        ? { background: "var(--gold)", color: "#FFFFFF" }
        : { color: "var(--ink-soft)" }}>
      {label}
    </button>
  );

  return (
    <div className="min-h-screen">
      <PromoPopup />
      {/* New CampusDine front: announcement bar, header and hero (styles live in landing.css, all scoped under .cdl) */}
      <div className="cdl" data-lang={CURRENT_LANG}>
        <svg width="0" height="0" style={{ position: "absolute" }} aria-hidden="true">
          <defs>
          <symbol id="cdl-i-mega" viewBox="0 0 24 24"><path d="M3 10v4a1 1 0 0 0 1 1h2l5 4V5L6 9H4a1 1 0 0 0-1 1Zm13-2.5a5 5 0 0 1 0 9M19 4a9 9 0 0 1 0 16" fill="currentColor" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></symbol>
          <symbol id="cdl-i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 1.500-2.100-.5-1.200.2-2.400 1.600-2.400H17a4 4 0 0 0 4-4c0-5-4-9.500-9-9.500Z" fill="none" stroke="currentColor" strokeWidth="1.800" strokeLinejoin="round"/><circle cx="7.500" cy="11" r="1.300" fill="currentColor"/><circle cx="10.500" cy="7" r="1.300" fill="currentColor"/><circle cx="15" cy="7.500" r="1.300" fill="currentColor"/></symbol>

            {!role ? (
              <div className="space-y-3">
                <div className="mb-2 text-center">
                  <a href="/role-select.html" className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-700 transition-colors"

                      <Icon path={r.icon} className="w-5 h-5" style={{ color: "var(--teal-deep)" }} />

                  </button>

                    </div>

                            <div className="text-sm font-700">{label}</div>
                            <div className="text-[11px] mt-0.5 opacity-80">{desc}</div>
                          </button>

                      </div>
                    </div>

                    <div className="rounded-xl border p-3 space-y-3" style={{ borderColor: "var(--line)", background: "var(--bg)" }}>

                        </div>
                      </div>
                      <p className="text-[11px]" style={{ color: "var(--ink-soft)" }}>{tx("hall.signup.note")}</p>

                  {resetMsg && mode === "login" && <p className="text-sm" style={{ color: "var(--leaf)" }}>{resetMsg}</p>}

                    {busy ? tx("wait") : mode === "login" ? (loginChallenge ? tx("otp.verifylogin") : tx("login"))
                      : (otpRequired ? (otpSent ? tx("otp.verify") : tx("otp.sendcode")) : tx("createlogin"))}

/* Feature: your usual */
// the (up to) 3 menu items this student has ordered in the most separate orders; unavailable items are skipped
function pickUsual(pastOrders, menu) {
  const counts = new Map();
  for (const o of pastOrders || []) {
    if (o.status === "Cancelled") continue;
    for (const name of new Set((o.items || []).map(i => i.name))) counts.set(name, (counts.get(name) || 0) + 1);
  }
  return [...counts.entries()]
    .sort((a, b) => b[1] - a[1])
    .map(([name, n]) => ({ item: menu.find(m => m.name === name), n }))
    .filter(x => x.item && x.item.availability === "available" && Number(x.item.stock) > 0)
    .slice(0, 3);
}
function UsualPanel({ pastOrders, menu, cart, add }) {

function CanteenBusyOMeter() {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(t);
  }, []);

  const hour = now.getHours();
  const min = now.getMinutes();
  const timeNum = hour + min / 60;

  let label = "🟢 Low Rush (~5 min wait)";
  let dotColor = "bg-emerald-500";
  let cls = "busy-low";

  if (timeNum >= 12.75 && timeNum <= 14.25) {
    label = "🔴 Peak Lunch Rush (~25-30 min wait)";
    dotColor = "bg-red-500";
    cls = "busy-peak";
  } else if ((timeNum >= 8.75 && timeNum <= 10.0) || (timeNum >= 16.5 && timeNum <= 17.5)) {
    label = "🟡 Moderate Rush (~12-15 min wait)";
    dotColor = "bg-amber-500";
    cls = "busy-mod";
  }

  return (
    <div className={`busy-meter-pill ${cls}`} title="Estimated wait time based on campus class breaks">
      <span className={`w-2 h-2 rounded-full ${dotColor} animate-pulse`} />
      <span>Live Crowd: <strong>{label}</strong></span>
    </div>
  );
}

function BudgetMealPlannerModal({ menu, onAddToCart, onClose }) {
  const [budget, setBudget] = useState(80);
  const [pref, setPref] = useState("all");

  const combos = useMemo(() => {
    const valid = menu.filter(m => m.stock > 0 && m.availability !== "sold_out");
    const filtered = valid.filter(m => {
      if (pref === "veg") return !!m.is_veg;
      if (pref === "drinks") return m.category === "drinks";
      return true;
    });

    const results = [];
    for (let i = 0; i < filtered.length; i++) {
      for (let j = i + 1; j < filtered.length; j++) {
        const cost = filtered[i].price + filtered[j].price;
        if (cost <= budget) {
          results.push({
            items: [filtered[i], filtered[j]],
            cost,
            savings: Math.max(0, budget - cost),
            label: `${filtered[i].name} + ${filtered[j].name}`
          });
        }
      }
    }
    return results.sort((a, b) => b.cost - a.cost).slice(0, 4);
  }, [menu, budget, pref]);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm fade-in">
      <div className="card p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto space-y-4">

          <div className="flex justify-between items-center text-sm font-700">
            <span>Your Target Budget:</span>
            <span className="text-lg font-display" style={{ color: "var(--gold)" }}>৳{budget}</span>
          </div>
          <input type="range" min="30" max="200" step="5" value={budget} onChange={e => setBudget(Number(e.target.value))}
            className="w-full accent-emerald-600 cursor-pointer" />
          <div className="flex gap-2 pt-1 flex-wrap">
            {[40, 60, 80, 100, 130].map(amt => (
              <button key={amt} onClick={() => setBudget(amt)}
                className={`px-2.5 py-1 rounded-lg text-xs font-700 border ${budget === amt ? "btn-primary" : ""}`}
                style={budget === amt ? {} : { borderColor: "var(--line)", background: "var(--panel)" }}>
                ৳{amt}

        </div>

        <div className="flex gap-2">
          {[
            { id: "all", label: "🍽 All Food" },
            { id: "veg", label: "🌱 Veg Only" },
            { id: "drinks", label: "☕ Drinks" }
          ].map(p => (
            <button key={p.id} onClick={() => setPref(p.id)}
              className={`px-3 py-1.5 rounded-full text-xs font-700 border ${pref === p.id ? "btn-primary" : ""}`}
              style={pref === p.id ? {} : { borderColor: "var(--line)", background: "var(--panel)" }}>
              {p.label}
            </button>
          ))}
        </div>

        <div className="space-y-2.5 pt-1">

// slides: [{ key, tag, title, text, cta?, onCta?, img?, tone? }]
function PromoSlider({ slides }) {
  const [i, setI] = useState(0);
  const [paused, setPaused] = useState(false);
  const touchX = useRef(null);
  const n = slides.length;
  useEffect(() => { if (i >= n) setI(0); }, [n]);
  useEffect(() => {
    if (n < 2 || paused) return;
    const t = setInterval(() => setI(x => (x + 1) % n), 5000);
    return () => clearInterval(t);
  }, [n, paused]);
  if (n === 0) return null;
  const go = (d) => setI(x => (x + d + n) % n);
  const tones = {
    green: "linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%)",
    warm: "linear-gradient(135deg, #F59E0B 0%, #B45309 100%)",
    rose: "linear-gradient(135deg, #E11D48 0%, #881337 100%)",
    blue: "linear-gradient(135deg, #2563EB 0%, #1E3A8A 100%)",
    violet: "linear-gradient(135deg, #7C3AED 0%, #4C1D95 100%)",
  };
  return (
    <div className="mb-5 relative overflow-hidden rounded-2xl select-none" style={{ height: 160 }}
      onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)}
      onTouchStart={e => { touchX.current = e.touches[0].clientX; }}
      onTouchEnd={e => { if (touchX.current == null) return; const dx = e.changedTouches[0].clientX - touchX.current; if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); touchX.current = null; }}>
      <div className="flex h-full" style={{ width: `${n * 100}%`, transform: `translateX(-${(i * 100) / n}%)`, transition: "transform .5s ease" }}>
        {slides.map(sl => (
          <div key={sl.key} className="h-full flex items-center justify-between gap-4 px-6 text-white" style={{ width: `${100 / n}%`, background: tones[sl.tone] || tones.green }}>
            <div className="min-w-0">
              <span className="text-[10px] uppercase tracking-widest font-700 px-2 py-0.5 rounded-full" style={{ background: "rgba(255,255,255,0.2)" }}>{sl.tag}</span>
              <div className="font-display font-800 text-xl sm:text-2xl mt-2 leading-tight">{sl.title}</div>
              <div className="text-sm opacity-90 mt-1 line-clamp-2">{sl.text}</div>
              {sl.cta && <button onClick={sl.onCta} className="mt-3 px-3 py-1.5 rounded-lg text-xs font-700" style={{ background: "#fff", color: "#111" }}>{sl.cta}</button>}
            </div>
            {sl.img && <img src={sl.img} alt="" className="hidden sm:block rounded-xl object-cover shrink-0" style={{ width: 110, height: 110, background: "rgba(255,255,255,0.15)" }}
              onError={e => { e.target.style.display = "none"; }} />}
          </div>
        ))}
      </div>
      {n > 1 && (
        <>
          <button aria-label="Previous" onClick={() => go(-1)} className="absolute left-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full grid place-items-center text-white" style={{ background: "rgba(0,0,0,0.3)" }}><Icon path={I.chevronLeft} className="w-4 h-4" /></button>
          <button aria-label="Next" onClick={() => go(1)} className="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-full grid place-items-center text-white" style={{ background: "rgba(0,0,0,0.3)" }}><Icon path={I.chevronRight} className="w-4 h-4" /></button>
          <div className="absolute bottom-2 left-0 right-0 flex justify-center gap-1.5">
            {slides.map((sl, k) => <button key={sl.key} aria-label={"Slide " + (k + 1)} onClick={() => setI(k)} className="rounded-full" style={{ width: k === i ? 18 : 6, height: 6, background: "#fff", opacity: k === i ? 1 : 0.5, transition: "all .3s" }} />)}
          </div>
        </>
      )}
    </div>
  );
}

/* Feature: kitchen note chips */
const NOTE_CHIPS = ["chip.lessspicy", "chip.noonion", "chip.extrasauce", "chip.lessoil", "chip.nosugar", "chip.packsep"];
function noteHas(note, text) {
  return note.split(",").some(p => p.trim().toLowerCase() === text.toLowerCase());
}
function noteToggle(note, text) {
  const parts = note.split(",").map(p => p.trim()).filter(Boolean);
  const i = parts.findIndex(p => p.toLowerCase() === text.toLowerCase());
  if (i >= 0) { parts.splice(i, 1); return parts.join(", "); }
  const added = parts.concat(text).join(", ");
  return added.length > 200 ? note : added; // no room left: leave the note as it is
}
/* Feature: time greeting */
function mealSlot(h) {
  if (h >= 5 && h < 11) return { meal: "breakfast", cat: "snacks" };
  if (h >= 11 && h < 15) return { meal: "lunch", cat: "heavy" };
  if (h >= 15 && h < 18) return { meal: "snack", cat: "snacks" };
  if (h >= 18 && h < 22) return { meal: "dinner", cat: "heavy" };
  return { meal: "late", cat: "drinks" };
}
function greetingFor(h) {
  if (h >= 5 && h < 12) return { key: "morning", icon: "☀️" };
  if (h >= 12 && h < 17) return { key: "afternoon", icon: "🌤️" };
  if (h >= 17 && h < 21) return { key: "evening", icon: "🌆" };
  return { key: "night", icon: "🌙" };
}
