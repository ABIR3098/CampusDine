<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusDine — Smart Campus Canteen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Hind+Siliguri:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg: #06080E;
    --panel: #0E1420;
    --ink: #ECE7DA;
    --ink-soft: #93A0B4;
    --teal: #3A0B12;
    --teal-deep: #230509;
    --gold: #D4AF37;
    --gold-bright: #F0D78C;
    --gold-deep: #9A6F0D;
    --gold-soft: #F3E0B6;
    --brick: #C0392B;
    --leaf: #4C9A6A;
    --line: rgba(212,175,55,0.2);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', 'Hind Siliguri', ui-sans-serif, system-ui, sans-serif;
    background-image:
      radial-gradient(ellipse at top, rgba(58,11,18,0.35), transparent 60%),
      radial-gradient(circle at 1px 1px, rgba(212,175,55,0.09) 1px, transparent 0);
    background-size: auto, 22px 22px;
  }
  .font-display{font-family:'Cinzel', 'Hind Siliguri', serif; letter-spacing:.02em;}
  .font-mono{font-family:'JetBrains Mono', ui-monospace, monospace;}
  .gold-text{
    background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 50%, var(--gold-deep) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  .ticket{
    position:relative;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
    color:#EFE6D8;
    border-radius: 6px;
    border: 1px solid var(--line);
    overflow:visible;
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:18px; height:18px;
    background: var(--bg);
    border-radius:50%;
  }
  .ticket::before{ left:-9px; }
  .ticket::after{ right:-9px; }
  .ticket .perf{
    border-left: 2px dashed rgba(212,175,55,0.3);
  }

  .tab-btn{
    font-family:'Cinzel', serif;
    font-weight:600;
    letter-spacing:.03em;
    transition: all .15s ease;
  }
  .tab-btn.active{
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
    color: var(--teal-deep);
  }
  .tab-btn:not(.active){
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .tab-btn:not(.active):hover{
    border-color: var(--gold);
    color: var(--gold-bright);
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .card:hover{
    border-color: rgba(212,175,55,0.4);
  }

  .btn-primary{
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
    color: var(--teal-deep);
    font-family:'Cinzel',serif;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    font-size:.85em;
    border-radius:6px;
    transition: transform .1s ease, filter .15s ease;
  }
  .btn-primary:hover{ filter:brightness(1.1); transform: translateY(-1px); }
  .btn-primary:active{ transform: translateY(0px) scale(.98); }
  .btn-primary:disabled{ background:#3A3F4C; color:#8A93A6; cursor:not-allowed; transform:none; filter:none; }

  .btn-gold{
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-bright);
    font-family:'Cinzel',serif;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    font-size:.85em;
  }
  .btn-gold:hover{ background: var(--gold); color: var(--teal-deep); }

  .stepper-dot{
    width:14px;height:14px;border-radius:50%;
    background:var(--line);
    border:2px solid var(--line);
  }
  .stepper-dot.done{ background:var(--gold); border-color:var(--gold); }
  .stepper-dot.current{ background:var(--gold-bright); border-color:var(--gold-bright); box-shadow:0 0 0 5px rgba(212,175,55,0.18); }

  .cal-cell{
    aspect-ratio:1/1;
    border-radius:6px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer;
    user-select:none;
    border:1px solid var(--line);
    transition: transform .1s ease, border-color .15s ease;
    background:var(--panel);
    color: var(--ink);
  }
  .cal-cell:hover{ transform: translateY(-2px); border-color: var(--gold); }
  .cal-full{ background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%); color:#EFE6D8; border-color:var(--teal); }
  .cal-half{ background: rgba(212,175,55,0.14); color:var(--gold-bright); border-color:var(--gold); }
  .cal-today{
    position:relative;
    box-shadow: 0 0 0 2px var(--gold-bright);
    border-color: var(--gold-bright) !important;
  }
  .cal-today::after{
    content:"";
    position:absolute;
    bottom:4px;
    width:5px; height:5px;
    border-radius:50%;
    background: var(--gold-bright);
  }

  .fade-in{ animation: fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .low-stock-banner{
    background: repeating-linear-gradient(135deg, rgba(192,57,43,0.16), rgba(192,57,43,0.16) 10px, rgba(192,57,43,0.08) 10px, rgba(192,57,43,0.08) 20px);
    border: 1px solid rgba(192,57,43,0.35);
  }

  .error-banner{ background:rgba(192,57,43,0.14); color:#F0A99C; border:1px solid rgba(192,57,43,0.4); }

  .chip{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .chip:hover{ border-color: var(--gold); color: var(--gold-bright); }
  .chip.active-chip{
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
    color: var(--teal-deep);
    border-color: var(--gold);
  }

  .logo-badge{
    border: 1px solid var(--gold);
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
    box-shadow: 0 4px 20px -6px rgba(212,175,55,0.35);
  }

  .divider-flourish{ display:flex; align-items:center; justify-content:center; gap:14px; color: var(--gold); }
  .divider-flourish::before, .divider-flourish::after{
    content:""; flex:1; max-width:80px; border-bottom:1px solid var(--line);
  }

  input, select, textarea{ background: var(--panel); color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  button:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

/* ---------------- Constants ---------------- */
const DEFAULT_API_BASE = (window.location.origin && window.location.origin !== "null")
  ? window.location.origin
  : "http://localhost:5000";
const LOW_STOCK_THRESHOLD = 10;
const CATEGORIES = [
  { id: "heavy", label: "Heavy meals" },
  { id: "snacks", label: "Snacks" },
  { id: "drinks", label: "Drinks" },
];
const STATUSES = ["Received", "Cooking", "Ready"];

/* ---------------- API helper ---------------- */
async function api(apiBase, path, { method = "GET", body, token } = {}) {
  const res = await fetch(`${apiBase}${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

/* ---------------- Small icon set (inline SVG, no deps) ---------------- */
const Icon = ({ path, className = "w-5 h-5", fill = "none", style }) => (
  <svg viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2"
       strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
    <path d={path} />
  </svg>
);
const I = {
  menu: "M3 6h18M3 12h18M3 18h18",
  cart: "M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L22 8H6",
  clock: "M12 2a10 10 0 1 0 .001 20.001A10 10 0 0 0 12 2Zm1 5v5l4 2",
  wallet: "M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Zm14 3h.01M3 9h18",
  calendar: "M8 2v4M16 2v4M3 9h18M4 4h16a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z",
  dashboard: "M4 4h7v7H4V4Zm9 0h7v4h-7V4Zm0 7h7v9h-7v-9ZM4 14h7v6H4v-6Z",
  box: "M21 8L12 3 3 8l9 5 9-5Zm0 0v8l-9 5-9-5V8m18 0-9 5-9-5",
  chart: "M4 19V5M4 19h16M8 15v4M12 11v8M16 7v12",
  bell: "M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9ZM13.7 21a2 2 0 0 1-3.4 0",
  plus: "M12 5v14M5 12h14",
  minus: "M5 12h14",
  check: "M20 6 9 17l-5-5",
  arrow: "M5 12h14M13 5l7 7-7 7",
  logout: "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
  user: "M20 21a8 8 0 1 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z",
  ticket: "M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z",
  plug: "M9 7V2m6 5V2M6 7h12l-1 6a5 5 0 0 1-10 0L6 7Zm4 11v3h4v-3",
  star: "M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.5 6.1 20.6l1.3-6.6-4.9-4.6 6.6-.8L12 2.5Z",
  chevronLeft: "M15 18l-6-6 6-6",
  chevronRight: "M9 18l6-6-6-6",
  lock: "M12 15.5v2M7 10.5V7.5a5 5 0 0 1 10 0v3M5.5 10.5h13a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1Z",
  shield: "M12 2 4 5v6c0 5 3.4 8.5 8 9 4.6-.5 8-4 8-9V5l-8-3Zm-2 9.2 1.6 1.6L15.5 9",
  x: "M18 6 6 18M6 6l12 12",
};

/* ---------------- Helpers ---------------- */
const taka = (n) => `৳${Number(n || 0).toLocaleString("en-BD")}`;
function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); } // month is 1-12 here
function monthLabel(ym) {
  const [y, m] = ym.split("-");
  return new Date(Number(y), Number(m) - 1).toLocaleString("default", { month: "short" });
}

/* ---------------- Login / Register screen ---------------- */
function Login({ apiBase, setApiBase, onAuth }) {
  const [mode, setMode] = useState("login"); // 'login' | 'register' | 'forgot'
  const [role, setRole] = useState(null);
  const [name, setName] = useState("");
  const [externalId, setExternalId] = useState("");
  const [password, setPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [resetMsg, setResetMsg] = useState(null);
  const [showAdvanced, setShowAdvanced] = useState(false);
  const authRef = useRef(null);

  const roleOptions = [
    { key: "student", label: "Student", desc: "Order meals, track pickup, manage your subscription.", icon: I.user },
    { key: "teacher", label: "Teacher / Staff", desc: "Same convenience, faculty meal rate.", icon: I.user },
    { key: "admin", label: "Canteen Admin", desc: "Run the counter — orders, stock, reports.", icon: I.dashboard },
  ];

  const features = [
    { title: "Token-Based Pickup", desc: "Order ahead and skip the queue — just collect your food with your token." },
    { title: "Digital Wallet", desc: "Cashless payments, instant top-ups, and a fully transparent transaction history." },
    { title: "Auto Subscription Billing", desc: "Your monthly meal bill, calculated automatically and accurately." },
    { title: "Live Order Tracking", desc: "Know exactly where your order stands, in real time — no refresh needed." },
  ];

  const sampleMenu = [
    { name: "Tehari", tag: "Rice & Meat", price: "৳ 80", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80" },
    { name: "Chicken Roll", tag: "Savory Snack", price: "৳ 50", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80" },
    { name: "Vintage Cold Brew", tag: "Beverage", price: "৳ 35", img: "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?auto=format&fit=crop&w=500&q=80" },
  ];

  const scrollToAuth = () => authRef.current && authRef.current.scrollIntoView({ behavior: "smooth", block: "start" });

  const submit = async () => {
    setError(null);
    if (!externalId || !password || (mode === "register" && !name)) {
      setError("Please fill in all fields.");
      return;
    }
    setBusy(true);
    try {
      const data = mode === "login"
        ? await api(apiBase, "/api/auth/login", { method: "POST", body: { externalId, password } })
        : await api(apiBase, "/api/auth/register", { method: "POST", body: { name, externalId, role, password } });
      onAuth(data.token, data.user);
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const submitReset = async () => {
    setError(null); setResetMsg(null);
    if (!externalId || !newPassword) { setError("Please fill in all fields."); return; }
    if (newPassword.length < 6) { setError("Password must be at least 6 characters."); return; }
    setBusy(true);
    try {
      await api(apiBase, "/api/auth/reset-password", { method: "POST", body: { externalId, newPassword } });
      setMode("login");
      setPassword("");
      setNewPassword("");
      setResetMsg("Password updated — log in with your new password.");
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const pillTab = (key, label) => (
    <button onClick={() => { setMode(key); setError(null); }}
      className="flex-1 py-2.5 rounded-full text-xs font-display font-700 uppercase tracking-wide transition-all"
      style={mode === key
        ? { background: "linear-gradient(135deg, var(--gold), var(--gold-deep))", color: "var(--teal-deep)" }
        : { color: "var(--ink-soft)" }}>
      {label}
    </button>
  );

  return (
    <div className="min-h-screen">
      {/* Announcement bar */}
      <div className="text-center py-2 px-4 text-xs tracking-widest uppercase font-display"
        style={{ background: "linear-gradient(90deg, var(--teal-deep), var(--teal), var(--teal-deep))", color: "var(--gold-bright)", borderBottom: "1px solid var(--line)" }}>
        ✨ A Premium Campus Dining Experience — Welcome To CampusDine ✨
      </div>

      {/* Sticky nav */}
      <header className="sticky top-0 z-30 backdrop-blur" style={{ background: "rgba(6,8,14,0.85)", borderBottom: "1px solid var(--line)" }}>
        <div className="max-w-6xl mx-auto px-6 py-3.5 flex items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="logo-badge w-10 h-10 rounded-full grid place-items-center">
              <Icon path={I.ticket} className="w-5 h-5" style={{ color: "var(--gold)" }} />
            </div>
            <div>
              <span className="font-display gold-text text-lg font-800 block leading-none">CampusDine</span>
              <span className="text-[9px] uppercase tracking-[0.25em] block mt-0.5" style={{ color: "var(--ink-soft)" }}>The Campus Kitchen</span>
            </div>
          </div>
          <nav className="hidden md:flex items-center gap-8 text-xs uppercase tracking-widest font-display" style={{ color: "var(--ink-soft)" }}>
            <a href="#menu" style={{ color: "inherit" }} onMouseOver={e => e.currentTarget.style.color = "var(--gold)"} onMouseOut={e => e.currentTarget.style.color = "var(--ink-soft)"}>Menu</a>
            <a href="#about" style={{ color: "inherit" }} onMouseOver={e => e.currentTarget.style.color = "var(--gold)"} onMouseOut={e => e.currentTarget.style.color = "var(--ink-soft)"}>Our Story</a>
            <a href="#contact" style={{ color: "inherit" }} onMouseOver={e => e.currentTarget.style.color = "var(--gold)"} onMouseOut={e => e.currentTarget.style.color = "var(--ink-soft)"}>Contact</a>
          </nav>
          <button onClick={scrollToAuth} className="btn-primary px-5 py-2 rounded-lg text-xs">Sign In</button>
        </div>
      </header>

      {/* Hero */}
      <section className="relative py-24 px-6 text-center overflow-hidden">
        <div className="absolute inset-0 -z-10" style={{ background: "radial-gradient(ellipse 60% 50% at 50% 0%, rgba(58,11,18,0.4), transparent)" }}></div>
        <div className="max-w-3xl mx-auto space-y-6">
          <div className="inline-block px-4 py-1.5 rounded-full text-xs font-display uppercase tracking-[0.25em]" style={{ border: "1px solid var(--line)", color: "var(--gold)" }}>
            Est. 2026 — Fine Campus Culinary
          </div>
          <h1 className="font-display text-4xl sm:text-5xl font-800 leading-tight" style={{ color: "var(--ink)" }}>
            Order Ahead. Skip The Line.<br /><span className="gold-text italic">Dine Like Royalty.</span>
          </h1>
          <p className="max-w-xl mx-auto text-[15px] leading-relaxed" style={{ color: "var(--ink-soft)" }}>
            Enjoy hassle-free food ordering, automatic subscription billing, and a cashless wallet —
            all on one platform, even during the busiest hours of campus life.
          </p>
          <div className="flex flex-wrap justify-center gap-4 pt-2">
            <button onClick={scrollToAuth} className="btn-primary px-8 py-3 rounded-lg">Get Started</button>
            <a href="#menu" className="btn-gold px-8 py-3 rounded-lg inline-block">Explore Menu</a>
          </div>
        </div>
      </section>

      {/* Features banner */}
      <section className="border-y py-10" style={{ borderColor: "var(--line)", background: "rgba(212,175,55,0.03)" }}>
        <div className="max-w-6xl mx-auto px-6 grid grid-cols-2 md:grid-cols-4 gap-8 text-center">
          {features.map(f => (
            <div key={f.title} className="space-y-1.5">
              <h4 className="font-display font-700 text-sm" style={{ color: "var(--gold)" }}>{f.title}</h4>
              <p className="text-xs leading-relaxed" style={{ color: "var(--ink-soft)" }}>{f.desc}</p>
            </div>
          ))}
        </div>
      </section>

      {/* Menu preview */}
      <section id="menu" className="max-w-6xl mx-auto px-6 py-20">
        <div className="text-center mb-12 space-y-3">
          <p className="font-display text-xs uppercase tracking-[0.3em]" style={{ color: "var(--gold)" }}>Crafted With Care</p>
          <h2 className="font-display text-3xl font-800" style={{ color: "var(--ink)" }}>A Taste of Our Menu</h2>
          <div className="divider-flourish text-sm max-w-xs mx-auto">❖</div>
        </div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
          {sampleMenu.map(item => (
            <div key={item.name} className="card overflow-hidden">
              <div className="h-36 overflow-hidden" style={{ background: "var(--teal-deep)" }}>
                <img src={item.img} alt={item.name} className="w-full h-full object-cover" style={{ opacity: 0.88 }} />
              </div>
              <div className="p-4">
                <div className="font-display font-700 text-sm" style={{ color: "var(--ink)" }}>{item.name}</div>
                <div className="text-xs mb-2" style={{ color: "var(--ink-soft)" }}>{item.tag}</div>
                <div className="font-mono text-sm" style={{ color: "var(--gold)" }}>{item.price}</div>
              </div>
            </div>
          ))}
          <div className="card flex flex-col items-center justify-center text-center p-6 gap-3">
            <Icon path={I.menu} className="w-7 h-7" style={{ color: "var(--gold)" }} />
            <div className="font-display font-700 text-sm" style={{ color: "var(--ink)" }}>More on the full menu</div>
            <p className="text-xs" style={{ color: "var(--ink-soft)" }}>Log in to see live prices, stock &amp; order instantly.</p>
          </div>
        </div>
      </section>

      {/* About */}
      <section id="about" className="border-t py-20 px-6" style={{ borderColor: "var(--line)", background: "rgba(58,11,18,0.15)" }}>
        <div className="max-w-2xl mx-auto text-center space-y-5">
          <p className="font-display text-xs uppercase tracking-[0.3em]" style={{ color: "var(--gold)" }}>Our Story</p>
          <h2 className="font-display text-3xl font-800" style={{ color: "var(--ink)" }}>Why CampusDine</h2>
          <div className="divider-flourish text-sm max-w-xs mx-auto">❖</div>
          <p className="leading-relaxed text-[15px]" style={{ color: "var(--ink-soft)" }}>
            Long canteen queues, paper tokens, and hand-calculated subscription bills — CampusDine exists to

/* ---------------- Menu & Order tab ---------------- */
function MenuOrder({ menu, cart, setCart, placeOrder, walletBalance, busy }) {
  const [cat, setCat] = useState("heavy");
  const filtered = menu.filter(i => i.category === cat);
  const [payMethod, setPayMethod] = useState("wallet");

  const add = (item) => setCart(prev => {
    const existing = prev.find(p => p.id === item.id);
    if (existing) return prev.map(p => p.id === item.id ? { ...p, qty: p.qty + 1 } : p);
    return [...prev, { ...item, qty: 1 }];
  });
  const dec = (item) => setCart(prev => prev
    .map(p => p.id === item.id ? { ...p, qty: p.qty - 1 } : p)
    .filter(p => p.qty > 0));

  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const canPay = payMethod === "cash" || walletBalance >= total;

  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2">
        <div className="flex gap-2 mb-5">
          {CATEGORIES.map(c => (
            <button key={c.id} onClick={() => setCat(c.id)}
              className={`tab-btn px-4 py-2 rounded-full text-sm ${cat === c.id ? "active" : ""}`}>
              {c.label}
            </button>
          ))}
        </div>
        <div className="grid sm:grid-cols-2 gap-4">
          {filtered.map(item => {
            const out = item.stock <= 0;
            const inCart = cart.find(c => c.id === item.id);
            return (
              <div key={item.id} className={`card p-4 flex flex-col ${out ? "opacity-50" : ""}`}>
                <div className="flex items-start justify-between">
                  <div>
                    <div className="font-display font-700" style={{ color: "var(--gold)" }}>{item.name}</div>
                    <div className="text-xs uppercase tracking-wide" style={{ color: "var(--ink-soft)" }}>{item.category}</div>
                  </div>
                  {item.tag && !out && (
                    <span className="text-[10px] font-mono px-2 py-1 rounded-full" style={{ background: "var(--gold-soft)", color: "var(--teal-deep)" }}>
                      {item.tag}
                    </span>
                  )}
                </div>
                <div className="mt-3 flex items-center justify-between">
                  <span className="font-mono font-600 text-lg">{taka(item.price)}</span>
                  {out ? (
                    <span className="text-xs font-600" style={{ color: "var(--brick)" }}>Out of stock</span>
                  ) : inCart ? (
                    <div className="flex items-center gap-2">
                      <button onClick={() => dec(item)} className="w-7 h-7 rounded-full grid place-items-center border" style={{ borderColor: "var(--line)" }}><Icon path={I.minus} className="w-3.5 h-3.5" /></button>
                      <span className="font-mono w-5 text-center">{inCart.qty}</span>
                      <button onClick={() => add(item)} className="w-7 h-7 rounded-full grid place-items-center text-white" style={{ background: "var(--teal)" }}><Icon path={I.plus} className="w-3.5 h-3.5" /></button>
                    </div>
                  ) : (
                    <button onClick={() => add(item)} className="btn-primary px-3 py-1.5 rounded-lg text-sm">Add</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div>
        <div className="card p-5 sticky top-20">
          <div className="font-display font-700 flex items-center gap-2 mb-4" style={{ color: "var(--gold)" }}>
            <Icon path={I.cart} className="w-5 h-5" /> Your cart
          </div>
          {cart.length === 0 ? (
            <p className="text-sm" style={{ color: "var(--ink-soft)" }}>Nothing here yet — add items from the menu.</p>
          ) : (
            <div className="space-y-2 mb-4">
              {cart.map(i => (
                <div key={i.id} className="flex justify-between text-sm">
                  <span>{i.name} × {i.qty}</span>
                  <span className="font-mono">{taka(i.price * i.qty)}</span>
                </div>
              ))}
            </div>
          )}
          <div className="border-t pt-3 mb-4" style={{ borderColor: "var(--line)" }}>
            <div className="flex justify-between font-700">
              <span>Total</span>
              <span className="font-mono">{taka(total)}</span>
            </div>
          </div>
          {cart.length > 0 && (
            <>
              <div className="flex gap-2 mb-4 text-sm">
                <button onClick={() => setPayMethod("wallet")}
                  className={`flex-1 py-2 rounded-lg border ${payMethod === "wallet" ? "text-white" : ""}`}
                  style={payMethod === "wallet" ? { background: "var(--teal)", borderColor: "var(--teal)" } : { borderColor: "var(--line)" }}>
                  Wallet
                </button>
                <button onClick={() => setPayMethod("cash")}
                  className={`flex-1 py-2 rounded-lg border ${payMethod === "cash" ? "text-white" : ""}`}
                  style={payMethod === "cash" ? { background: "var(--teal)", borderColor: "var(--teal)" } : { borderColor: "var(--line)" }}>
                  Cash on pickup
                </button>
              </div>
              {payMethod === "wallet" && !canPay && (
                <p className="text-xs mb-3" style={{ color: "var(--brick)" }}>Insufficient wallet balance — top up or pay cash.</p>
              )}
              <button disabled={!canPay || busy} onClick={() => placeOrder(cart, payMethod)}
                className="btn-primary w-full py-2.5 rounded-xl">
                {busy ? "Placing order…" : "Checkout — get token"}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function OrderFeedback({ order, onSubmit, busy }) {
  const [rating, setRating] = useState(0);
  const [comment, setComment] = useState("");

  if (order.feedback) {
    return (
      <div className="mt-4 pt-4 border-t" style={{ borderColor: "var(--line)" }}>
        <div className="flex items-center gap-2 mb-1">
          <StarPicker value={order.feedback.rating} onChange={() => {}} size="w-4 h-4" />
          <span className="text-xs" style={{ color: "var(--ink-soft)" }}>You rated this order</span>
        </div>
        {order.feedback.comment && <p className="text-xs italic" style={{ color: "var(--ink-soft)" }}>"{order.feedback.comment}"</p>}
      </div>
    );
  }

  return (
    <div className="mt-4 pt-4 border-t" style={{ borderColor: "var(--line)" }}>
      <div className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--ink-soft)" }}>Rate this order</div>
      <StarPicker value={rating} onChange={setRating} />
      <textarea value={comment} onChange={e => setComment(e.target.value)} placeholder="Leave a comment (optional)"
        rows="2" className="w-full mt-2 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
      <button disabled={busy || rating === 0} onClick={() => onSubmit(order.id, rating, comment)}
        className="btn-primary mt-2 px-4 py-1.5 rounded-lg text-xs">
        {busy ? "Submitting…" : "Submit Feedback"}
      </button>
    </div>
  );
}

function TrackOrder({ orders, onSubmitFeedback, feedbackBusy }) {
  if (orders.length === 0) {
    return <div className="card p-10 text-center" style={{ color: "var(--ink-soft)" }}>No orders yet — place one from the Menu &amp; Order tab.</div>;
  }
  return (
    <div className="space-y-6 max-w-2xl">
      {orders.map(o => {
        const stepIndex = STATUSES.indexOf(o.status);
        return (
          <div key={o.token} className="card overflow-hidden">
            <div className="ticket p-5 flex items-center justify-between">
              <div className="perf pl-4">
                <div className="text-xs opacity-70">Pickup token</div>
                <div className="font-mono text-2xl font-700 tracking-wide">{o.token}</div>
              </div>
              <div className="text-right">
                <div className="text-xs opacity-70">Total</div>
                <div className="font-mono text-lg">{taka(o.total)}</div>
              </div>
            </div>
            <div className="p-5">
              <div className="flex items-center justify-between mb-2">
                {STATUSES.map((s, i) => (
                  <React.Fragment key={s}>
                    <div className="flex flex-col items-center gap-1.5 flex-1">
                      <div className={`stepper-dot ${i < stepIndex ? "done" : i === stepIndex ? "current" : ""}`}></div>
                      <span className="text-xs text-center" style={{ color: i <= stepIndex ? "var(--gold)" : "var(--ink-soft)", fontWeight: i === stepIndex ? 700 : 400 }}>{s}</span>
                    </div>
                    {i < STATUSES.length - 1 && <div className="h-0.5 flex-1 -mt-5" style={{ background: i < stepIndex ? "var(--gold)" : "var(--line)" }} />}
                  </React.Fragment>
                ))}
              </div>
              <div className="text-sm mt-4" style={{ color: "var(--ink-soft)" }}>
                {o.items.map(i => `${i.name} ×${i.qty}`).join(", ")}
              </div>
              {o.status === "Ready" && (
                <OrderFeedback order={o} onSubmit={onSubmitFeedback} busy={feedbackBusy} />
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------- Meal calendar tab ---------------- */
function MealCalendar({ role, year, month, calendar, bill, onToggle, onPrevMonth, onNextMonth, onJumpToday, isCurrentMonth }) {
  const total = daysInMonth(year, month);
  const monthName = new Date(year, month - 1).toLocaleString("default", { month: "long" });
  const firstWeekday = new Date(year, month - 1, 1).getDay();
  const now = new Date();
  const todayDay = now.getDate();
  const isThisMonthShown = now.getFullYear() === year && (now.getMonth() + 1) === month;

  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2 card p-5">
        <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
          <div className="flex items-center gap-2">
            <button onClick={onPrevMonth} aria-label="Previous month"
                    className="w-8 h-8 rounded-lg border flex items-center justify-center transition-colors"
                    style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
              <Icon path={I.chevronLeft} className="w-4 h-4" />
            </button>
            <div className="font-display font-700 text-lg min-w-[150px] text-center" style={{ color: "var(--gold)" }}>{monthName} {year}</div>
            <button onClick={onNextMonth} aria-label="Next month"
                    className="w-8 h-8 rounded-lg border flex items-center justify-center transition-colors"
                    style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
              <Icon path={I.chevronRight} className="w-4 h-4" />
            </button>
            {!isCurrentMonth && (
              <button onClick={onJumpToday} className="text-[11px] font-600 rounded-lg px-2 py-1 ml-1 border transition-colors"
                      style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
                Today
              </button>
            )}
          </div>
          <div className="text-xs" style={{ color: "var(--ink-soft)" }}>Tap a day to cycle: Off → Full → Half</div>
        </div>
        <div className="grid grid-cols-7 gap-2 mb-2 text-xs text-center font-600" style={{ color: "var(--ink-soft)" }}>
          {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => <div key={i}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-2">
          {Array.from({ length: firstWeekday }).map((_, i) => <div key={"e" + i}></div>)}
          {Array.from({ length: total }).map((_, i) => {
            const day = i + 1;
            const status = calendar[day] || "off";
            const isToday = isThisMonthShown && day === todayDay;
            return (
              <div key={day} onClick={() => onToggle(day, status)}
                className={`cal-cell text-sm font-600 ${status === "full" ? "cal-full" : status === "half" ? "cal-half" : ""} ${isToday ? "cal-today" : ""}`}>
                {day}
              </div>
            );
          })}
        </div>
        <div className="flex gap-4 mt-4 text-xs" style={{ color: "var(--ink-soft)" }}>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded" style={{ background: "var(--teal)" }}></span> Full meal</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded" style={{ background: "var(--gold)" }}></span> Half meal</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border" style={{ borderColor: "var(--line)" }}></span> Off</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border" style={{ borderColor: "var(--gold-bright)", boxShadow: "0 0 0 2px var(--gold-bright)" }}></span> Today</span>
        </div>
      </div>

      <div className="card p-5 h-fit">
        <div className="font-display font-700 mb-4" style={{ color: "var(--gold)" }}>Monthly bill</div>
        <div className="space-y-2 text-sm mb-4">
          <div className="flex justify-between"><span>Full meal days ({taka(bill.fullRate)} each)</span><span className="font-mono">{bill.fullDays}</span></div>
          <div className="flex justify-between"><span>Half meal days ({taka(bill.halfRate)} each)</span><span className="font-mono">{bill.halfDays}</span></div>
        </div>
        <div className="border-t pt-3" style={{ borderColor: "var(--line)" }}>
          <div className="flex justify-between font-700 text-lg">
            <span>Total</span><span className="font-mono">{taka(bill.total)}</span>
          </div>
        </div>

/* ---------------- Payment Gateway Modal (simulated, no real processor) ---------------- */
function PaymentGatewayModal({ amount, onClose, onConfirm }) {
  const [method, setMethod] = useState("card");
  const [stage, setStage] = useState("form"); // form | processing | success | error
  const [errors, setErrors] = useState({});
  const [card, setCard] = useState({ number: "", name: "", expiry: "", cvv: "" });
  const [mobile, setMobile] = useState({ number: "", pin: "" });

  const formatCardNumber = (v) => v.replace(/\D/g, "").slice(0, 16).replace(/(.{4})/g, "$1 ").trim();
  const formatExpiry = (v) => {
    const d = v.replace(/\D/g, "").slice(0, 4);
    return d.length > 2 ? `${d.slice(0, 2)}/${d.slice(2)}` : d;
  };
  const brand = card.number.startsWith("4") ? "VISA" : card.number.replace(/\s/g, "").match(/^5[1-5]/) ? "Mastercard" : null;

  const validate = () => {
    const e = {};
    if (method === "card") {
      if (card.number.replace(/\s/g, "").length !== 16) e.number = "Enter a 16-digit card number";
      if (!card.name.trim()) e.name = "Cardholder name is required";
      if (!/^\d{2}\/\d{2}$/.test(card.expiry)) e.expiry = "Use MM/YY format";
      if (card.cvv.length < 3) e.cvv = "3-digit CVV required";
    } else {
      if (!/^01\d{9}$/.test(mobile.number)) e.number = "Enter a valid number (01XXXXXXXXX)";
      if (mobile.pin.length < 4) e.pin = "Enter a valid PIN";
    }
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const handlePay = () => {
    if (!validate()) return;
    setStage("processing");
    setTimeout(async () => {
      try {
        await onConfirm();
        setStage("success");
        setTimeout(onClose, 1300);
      } catch (err) {
        setStage("error");
      }
    }, 1400);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(6,8,14,0.82)", backdropFilter: "blur(3px)" }}>
      <div className="w-full max-w-md rounded-2xl overflow-hidden fade-in" style={{ background: "var(--panel)", border: "1px solid var(--line)", boxShadow: "0 20px 60px rgba(0,0,0,0.5)" }}>
        <div className="flex items-center justify-between px-5 py-4 border-b" style={{ borderColor: "var(--line)" }}>
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-lg grid place-items-center shrink-0" style={{ background: "linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%)" }}>
              <Icon path={I.shield} className="w-4 h-4" style={{ color: "var(--gold)" }} />
            </div>
            <div>
              <div className="font-display font-700 text-sm leading-none" style={{ color: "var(--gold)" }}>CampusDine Pay</div>
              <div className="text-[10px] mt-1" style={{ color: "var(--ink-soft)" }}>Secure Payment Gateway</div>
            </div>
          </div>
          {stage === "form" && (
            <button onClick={onClose} aria-label="Close" style={{ color: "var(--ink-soft)" }}>
              <Icon path={I.x} className="w-5 h-5" />
            </button>
          )}
        </div>

        <div className="px-5 py-5">
          {stage === "processing" && (
            <div className="py-10 flex flex-col items-center gap-4">
              <div className="w-10 h-10 rounded-full border-2 animate-spin" style={{ borderColor: "var(--gold)", borderTopColor: "transparent" }}></div>
              <div className="text-sm" style={{ color: "var(--ink)" }}>Processing your payment…</div>
              <div className="text-[11px]" style={{ color: "var(--ink-soft)" }}>Please don't close this window</div>
            </div>
          )}

          {stage === "success" && (
            <div className="py-10 flex flex-col items-center gap-3">
              <div className="w-14 h-14 rounded-full flex items-center justify-center" style={{ background: "rgba(76,154,106,0.15)", border: "2px solid var(--leaf)" }}>
                <Icon path={I.check} className="w-7 h-7" style={{ color: "var(--leaf)" }} />
              </div>
              <div className="font-display font-700" style={{ color: "var(--gold)" }}>Payment Successful</div>
              <div className="text-xs font-mono" style={{ color: "var(--ink-soft)" }}>{taka(amount)} added to wallet</div>
            </div>
          )}

          {stage === "error" && (
            <div className="py-8 flex flex-col items-center gap-3 text-center">
              <div className="w-12 h-12 rounded-full flex items-center justify-center" style={{ background: "rgba(192,57,43,0.15)", border: "2px solid var(--brick)" }}>
                <Icon path={I.x} className="w-6 h-6" style={{ color: "var(--brick)" }} />
              </div>
              <div className="font-display font-700 text-sm" style={{ color: "var(--brick)" }}>Payment Failed</div>
              <div className="text-xs" style={{ color: "var(--ink-soft)" }}>Something went wrong, please try again.</div>
              <button onClick={() => setStage("form")} className="btn-gold px-4 py-2 rounded-lg text-xs mt-2">Try Again</button>
            </div>
          )}

          {stage === "form" && (
            <React.Fragment>
              <div className="flex justify-between items-center mb-4 px-0.5">
                <span className="text-xs" style={{ color: "var(--ink-soft)" }}>Amount Payable</span>
                <span className="font-mono text-lg font-700" style={{ color: "var(--gold)" }}>{taka(amount)}</span>
              </div>

              <div className="flex gap-2 mb-4">
                {[{ id: "card", label: "Card" }, { id: "bkash", label: "bKash" }, { id: "nagad", label: "Nagad" }].map(m => (
                  <button key={m.id} onClick={() => setMethod(m.id)}
                          className="flex-1 py-2 rounded-lg border text-xs font-600 transition-colors"
                          style={method === m.id ? { background: "var(--gold)", borderColor: "var(--gold)", color: "var(--teal-deep)" } : { borderColor: "var(--line)", color: "var(--ink-soft)" }}>
                    {m.label}
                  </button>
                ))}
              </div>

              {method === "card" && (
                <div className="space-y-3">
                  <div>
                    <label className="text-[11px] block mb-1" style={{ color: "var(--ink-soft)" }}>Card Number</label>
                    <div className="relative">
                      <input value={card.number} onChange={e => setCard({ ...card, number: formatCardNumber(e.target.value) })}
                             placeholder="1234 5678 9012 3456" inputMode="numeric"
                             className="w-full px-3 py-2 pr-16 rounded-lg border font-mono text-xs"
                             style={{ borderColor: errors.number ? "var(--brick)" : "var(--line)" }} />
                      {brand && <span className="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] font-700 rounded px-1.5 py-0.5 border" style={{ color: "var(--gold)", borderColor: "var(--line)" }}>{brand}</span>}
                    </div>
                    {errors.number && <p className="text-[10px] mt-1" style={{ color: "var(--brick)" }}>{errors.number}</p>}
                  </div>
                  <div>
                    <label className="text-[11px] block mb-1" style={{ color: "var(--ink-soft)" }}>Cardholder Name</label>
                    <input value={card.name} onChange={e => setCard({ ...card, name: e.target.value })} placeholder="MD RAHIM UDDIN"
                           className="w-full px-3 py-2 rounded-lg border font-mono text-xs uppercase"
                           style={{ borderColor: errors.name ? "var(--brick)" : "var(--line)" }} />
                    {errors.name && <p className="text-[10px] mt-1" style={{ color: "var(--brick)" }}>{errors.name}</p>}
                  </div>
                  <div className="flex gap-3">
                    <div className="flex-1">
                      <label className="text-[11px] block mb-1" style={{ color: "var(--ink-soft)" }}>Expiry</label>
                      <input value={card.expiry} onChange={e => setCard({ ...card, expiry: formatExpiry(e.target.value) })} placeholder="MM/YY" inputMode="numeric"
                             className="w-full px-3 py-2 rounded-lg border font-mono text-xs"
                             style={{ borderColor: errors.expiry ? "var(--brick)" : "var(--line)" }} />
                      {errors.expiry && <p className="text-[10px] mt-1" style={{ color: "var(--brick)" }}>{errors.expiry}</p>}
                    </div>
                    <div className="flex-1">
                      <label className="text-[11px] block mb-1" style={{ color: "var(--ink-soft)" }}>CVV</label>
                      <input value={card.cvv} onChange={e => setCard({ ...card, cvv: e.target.value.replace(/\D/g, "").slice(0, 3) })}
                             placeholder="•••" type="password" inputMode="numeric"
                             className="w-full px-3 py-2 rounded-lg border font-mono text-xs"
                             style={{ borderColor: errors.cvv ? "var(--brick)" : "var(--line)" }} />
                      {errors.cvv && <p className="text-[10px] mt-1" style={{ color: "var(--brick)" }}>{errors.cvv}</p>}
                    </div>
                  </div>
                </div>
              )}

              {(method === "bkash" || method === "nagad") && (
                <div className="space-y-3">
                  <div>
                    <label className="text-[11px] block mb-1" style={{ color: "var(--ink-soft)" }}>{method === "bkash" ? "bKash" : "Nagad"} Account Number</label>
                    <input value={mobile.number} onChange={e => setMobile({ ...mobile, number: e.target.value.replace(/\D/g, "").slice(0, 11) })}
                           placeholder="01XXXXXXXXX" inputMode="numeric"
                           className="w-full px-3 py-2 rounded-lg border font-mono text-xs"
                           style={{ borderColor: errors.number ? "var(--brick)" : "var(--line)" }} />
                    {errors.number && <p className="text-[10px] mt-1" style={{ color: "var(--brick)" }}>{errors.number}</p>}
                  </div>
                  <div>
                    <label className="text-[11px] block mb-1" style={{ color: "var(--ink-soft)" }}>PIN</label>
                    <input value={mobile.pin} onChange={e => setMobile({ ...mobile, pin: e.target.value.replace(/\D/g, "").slice(0, 5) })}
                           placeholder="••••" type="password" inputMode="numeric"
                           className="w-full px-3 py-2 rounded-lg border font-mono text-xs"
                           style={{ borderColor: errors.pin ? "var(--brick)" : "var(--line)" }} />
                    {errors.pin && <p className="text-[10px] mt-1" style={{ color: "var(--brick)" }}>{errors.pin}</p>}
                  </div>
                </div>
              )}

              <button onClick={handlePay} className="btn-gold w-full py-2.5 rounded-xl text-xs mt-5">
                Pay {taka(amount)}
              </button>
              <div className="flex items-center justify-center gap-1.5 mt-3 text-[10px]" style={{ color: "var(--ink-soft)" }}>
                <Icon path={I.lock} className="w-3 h-3" />
                <span>256-bit SSL Encrypted Transaction</span>
              </div>
            </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );
}

          </div>
        </div>
        <p className="text-xs mt-4" style={{ color: "var(--ink-soft)" }}>Use this to plan how much khichuri and tehari to prepare.</p>
      </div>
    </div>
  );
}

/* ---------------- Admin: Feedback ---------------- */
function AdminFeedback({ summary }) {
  const { average = 0, count = 0, entries = [] } = summary;
  return (
    <div>
      <div className="card p-6 mb-6 flex items-center gap-6 flex-wrap">
        <div>
          <div className="text-xs uppercase tracking-wide mb-1" style={{ color: "var(--ink-soft)" }}>Average Rating</div>
          <div className="flex items-center gap-2">
            <span className="font-mono text-3xl font-700" style={{ color: "var(--gold)" }}>{average.toFixed(1)}</span>
            <StarPicker value={Math.round(average)} onChange={() => {}} size="w-5 h-5" />
          </div>
        </div>
        <div className="border-l pl-6" style={{ borderColor: "var(--line)" }}>
          <div className="text-xs uppercase tracking-wide mb-1" style={{ color: "var(--ink-soft)" }}>Total Reviews</div>
          <div className="font-mono text-3xl font-700" style={{ color: "var(--ink)" }}>{count}</div>
        </div>
      </div>

      <div className="font-display font-700 mb-3" style={{ color: "var(--gold)" }}>Recent Feedback</div>
      {entries.length === 0 ? (
        <div className="card p-10 text-center" style={{ color: "var(--ink-soft)" }}>No feedback submitted yet.</div>
      ) : (
        <div className="space-y-3">
          {entries.map((e, i) => (
            <div key={i} className="card p-4">
              <div className="flex items-center justify-between mb-1.5 flex-wrap gap-2">
                <div className="flex items-center gap-3">
                  <StarPicker value={e.rating} onChange={() => {}} size="w-4 h-4" />
                  <span className="font-mono text-xs" style={{ color: "var(--ink-soft)" }}>{e.token}</span>
                </div>
                <span className="text-xs" style={{ color: "var(--ink-soft)" }}>{e.userName} · {e.userRole}</span>
              </div>
              {e.comment && <p className="text-sm mt-1" style={{ color: "var(--ink)" }}>"{e.comment}"</p>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- Profile tab (all roles) ---------------- */
function ProfileTab({ user, call, onUpdated }) {
  const [name, setName] = useState(user.name);
  const [walletBalance, setWalletBalance] = useState(user.walletBalance);
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [success, setSuccess] = useState(null);

  useEffect(() => {
    call("/api/auth/me").then(data => {
      setName(data.name);
      setWalletBalance(data.walletBalance);
    }).catch(() => {});
  }, []);

  const save = async () => {
    setError(null); setSuccess(null);
    if (!name.trim()) { setError("Name can't be empty."); return; }
    if (newPassword && newPassword.length < 6) { setError("New password must be at least 6 characters."); return; }
    if (newPassword && !currentPassword) { setError("Enter your current password to set a new one."); return; }
    setBusy(true);
    try {
      const body = { name };
      if (newPassword) { body.currentPassword = currentPassword; body.newPassword = newPassword; }
      const data = await call("/api/auth/me", { method: "PUT", body });
      onUpdated(data);
      setCurrentPassword(""); setNewPassword("");
      setSuccess("Profile updated.");
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="max-w-lg">
      <div className="card p-6">
        <div className="font-display font-700 text-lg mb-5" style={{ color: "var(--gold)" }}>My Profile</div>
        <div className="space-y-4">
          <div>
            <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>Full Name</label>
            <input value={name} onChange={e => setName(e.target.value)}
              className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <div>
              <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>ID Number</label>
              <input value={user.externalId} disabled
                className="w-full px-4 py-2.5 rounded-xl border opacity-60" style={{ borderColor: "var(--line)" }} />
            </div>
            <div>
              <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>Role</label>
              <input value={user.role} disabled
                className="w-full px-4 py-2.5 rounded-xl border opacity-60 capitalize" style={{ borderColor: "var(--line)" }} />
            </div>
          </div>
          {user.role !== "admin" && (
            <div className="ticket p-4">
              <div className="perf pl-4">
                <div className="text-xs opacity-70">Wallet Balance</div>
                <div className="font-mono text-xl font-700">{taka(walletBalance)}</div>
              </div>
            </div>
          )}

          <div className="border-t pt-4" style={{ borderColor: "var(--line)" }}>
            <div className="text-xs uppercase tracking-wide mb-3" style={{ color: "var(--ink-soft)" }}>Change Password (optional)</div>
            <div className="space-y-2">
              <input value={currentPassword} onChange={e => setCurrentPassword(e.target.value)} type="password" placeholder="Current password"
                className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
              <input value={newPassword} onChange={e => setNewPassword(e.target.value)} type="password" placeholder="New password"
                className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
            </div>
          </div>

          {error && <p className="text-sm" style={{ color: "#F0A99C" }}>{error}</p>}
          {success && <p className="text-sm" style={{ color: "var(--leaf)" }}>{success}</p>}
          <button disabled={busy} onClick={save} className="btn-primary w-full py-2.5 rounded-xl">
            {busy ? "Saving…" : "Save Changes"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- App root ---------------- */
function App() {
  const [apiBase, setApiBase] = useState(DEFAULT_API_BASE);
  const [session, setSession] = useState(null); // { token, user:{id,name,role,walletBalance} }
  const [tab, setTab] = useState("menu");
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [connected, setConnected] = useState(false);

  const [menu, setMenu] = useState([]);
  const [cart, setCart] = useState([]);
  const [orders, setOrders] = useState([]);
  const [wallet, setWallet] = useState({ balance: 0, transactions: [] });
  const [calendar, setCalendar] = useState({});
  const [bill, setBill] = useState({ fullDays: 0, halfDays: 0, fullRate: 0, halfRate: 0, total: 0 });
  const [overview, setOverview] = useState({});
  const [trend, setTrend] = useState([]);
  const [forecast, setForecast] = useState({});
  const [feedbackSummary, setFeedbackSummary] = useState({ average: 0, count: 0, entries: [] });
  const [feedbackBusy, setFeedbackBusy] = useState(false);

  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth() + 1);
  const isCurrentMonth = year === now.getFullYear() && month === now.getMonth() + 1;

  const goPrevMonth = () => {
    if (month === 1) { setYear(y => y - 1); setMonth(12); } else { setMonth(m => m - 1); }
  };
  const goNextMonth = () => {
    if (month === 12) { setYear(y => y + 1); setMonth(1); } else { setMonth(m => m + 1); }
  };
  const goToday = () => { setYear(now.getFullYear()); setMonth(now.getMonth() + 1); };

  const socketRef = useRef(null);
  const showError = (e) => setError(typeof e === "string" ? e : e.message);

  const call = (path, opts) => api(apiBase, path, { ...opts, token: session && session.token });

  const mapMenu = (rows) => rows.map(m => ({ ...m, bn: m.name_bn }));
  const mapWallet = (data) => ({
    balance: data.balance,
    transactions: data.transactions.map(t => ({ label: t.label, amount: t.amount, time: new Date(t.created_at).toLocaleString() })),
  });
  const mapCalendar = (rows) => {
    const map = {};
    rows.forEach(r => { map[new Date(r.the_date).getDate()] = r.status; });
    return map;
  };

  const refreshMenu = async () => setMenu(mapMenu(await call("/api/menu")));
  const refreshWallet = async () => setWallet(mapWallet(await call("/api/wallet")));
  const refreshCalendar = async () => {
    setCalendar(mapCalendar(await call(`/api/calendar?year=${year}&month=${month}`)));
    setBill(await call(`/api/calendar/bill?year=${year}&month=${month}`));
  };
  const refreshMyOrders = async () => setOrders(await call("/api/orders/mine"));
  const refreshAdminOrders = async () => setOrders(await call("/api/orders"));
  const refreshOverview = async () => setOverview(await call("/api/admin/overview"));
  const refreshReports = async () => {
    setTrend(await call("/api/admin/reports/revenue-trend"));
    setForecast(await call("/api/admin/reports/forecast"));
  };
  const refreshFeedback = async () => setFeedbackSummary(await call("/api/admin/feedback"));

  const onAuth = (token, user) => {
    setSession({ token, user });
    setTab(user.role === "admin" ? "overview" : "menu");
  };
  const logout = () => {
    if (socketRef.current) socketRef.current.disconnect();
    setSession(null); setCart([]); setError(null);
  };

  // Initial data load after login
  useEffect(() => {
    if (!session) return;
    (async () => {
      try {
        if (session.user.role === "admin") {
          await Promise.all([refreshMenu(), refreshAdminOrders(), refreshOverview(), refreshReports(), refreshFeedback()]);
        } else {
          await Promise.all([refreshMenu(), refreshMyOrders(), refreshWallet()]);
        }
      } catch (e) { showError(e); }
    })();
  }, [session]);

  // Refetch the meal calendar & bill whenever the visible month changes
  useEffect(() => {
    if (!session || session.user.role === "admin") return;
    refreshCalendar().catch(showError);
  }, [session, year, month]);

  // Live updates via Socket.io
  useEffect(() => {
    if (!session) return;
    const socket = io(apiBase, { auth: { token: session.token } });
    socketRef.current = socket;
    socket.on("connect", () => setConnected(true));
    socket.on("disconnect", () => setConnected(false));
    socket.on("order:new", (order) => {
      if (session.user.role === "admin") setOrders(prev => [order, ...prev]);
    });
    socket.on("order:update", (order) => {
      setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: order.status } : o));
    });
    return () => socket.disconnect();
  }, [session, apiBase]);

  const placeOrder = async (cartItems, paymentMethod) => {
    setBusy(true); setError(null);
    try {
      await call("/api/orders", { method: "POST", body: { items: cartItems.map(c => ({ id: c.id, qty: c.qty })), paymentMethod } });
      setCart([]);
      await Promise.all([refreshMyOrders(), refreshMenu(), paymentMethod === "wallet" ? refreshWallet() : Promise.resolve()]);
      setTab("track");
    } catch (e) { showError(e); } finally { setBusy(false); }
  };

  const advanceOrder = async (id) => {
    try {
      await call(`/api/orders/${id}/advance`, { method: "PATCH" });
      await refreshAdminOrders();
    } catch (e) { showError(e); }
  };

  const submitFeedback = async (orderId, rating, comment) => {
    setFeedbackBusy(true); setError(null);
    try {
      await call(`/api/orders/${orderId}/feedback`, { method: "POST", body: { rating, comment } });
      await refreshMyOrders();
    } catch (e) { showError(e); } finally { setFeedbackBusy(false); }
  };

  const topUp = async (amount) => {
    setBusy(true); setError(null);
    try {
      await call("/api/wallet/topup", { method: "POST", body: { amount } });
      await refreshWallet();
    } catch (e) { showError(e); } finally { setBusy(false); }
  };

  const toggleDay = async (day, currentStatus) => {
    const next = currentStatus === "off" ? "full" : currentStatus === "full" ? "half" : "off";
    try {
      await call(`/api/calendar/${day}`, { method: "PUT", body: { year, month, status: next } });
      await refreshCalendar();
    } catch (e) { showError(e); }
  };

  const updateMenuItem = async (id, patch) => {
    try {
      await call(`/api/menu/${id}`, { method: "PUT", body: patch });
      await refreshMenu();
    } catch (e) { showError(e); }
  };
  const addMenuItem = async (item) => {
    try {
      await call("/api/menu", { method: "POST", body: item });
      await refreshMenu();
    } catch (e) { showError(e); }
  };

  if (!session) return <Login apiBase={apiBase} setApiBase={setApiBase} onAuth={onAuth} />;

  const userTabs = [
    { key: "menu", label: "Menu & Order", icon: I.menu },
    { key: "track", label: "Track Order", icon: I.clock },
    { key: "calendar", label: "Meal Calendar", icon: I.calendar },
    { key: "wallet", label: "Wallet", icon: I.wallet },
    { key: "profile", label: "My Profile", icon: I.user },
  ];
  const adminTabs = [
    { key: "overview", label: "Overview", icon: I.dashboard },
    { key: "adminMenu", label: "Menu", icon: I.box },
    { key: "adminOrders", label: "Orders", icon: I.ticket },
    { key: "reports", label: "Reports", icon: I.chart },
    { key: "feedback", label: "Feedback", icon: I.star },
    { key: "profile", label: "My Profile", icon: I.user },
  ];

  return (
    <div className="min-h-screen">
      <TopBar role={session.user.role} name={session.user.name}
        tabs={session.user.role === "admin" ? adminTabs : userTabs}
        active={tab} setActive={setTab} onLogout={logout} connected={connected} />
      <div className="max-w-6xl mx-auto p-5 fade-in" key={tab}>
        {error && (
          <div className="error-banner rounded-xl px-4 py-3 mb-5 text-sm flex justify-between items-center">
            <span>{error}</span>
            <button onClick={() => setError(null)} className="font-700">✕</button>
          </div>
        )}

        {session.user.role !== "admin" && tab === "menu" && (
          <MenuOrder menu={menu} cart={cart} setCart={setCart} placeOrder={placeOrder} walletBalance={wallet.balance} busy={busy} />
        )}
        {session.user.role !== "admin" && tab === "track" && (
          <TrackOrder orders={orders} onSubmitFeedback={submitFeedback} feedbackBusy={feedbackBusy} />
        )}
        {session.user.role !== "admin" && tab === "calendar" && (
          <MealCalendar role={session.user.role} year={year} month={month} calendar={calendar} bill={bill} onToggle={toggleDay}
                        onPrevMonth={goPrevMonth} onNextMonth={goNextMonth} onJumpToday={goToday} isCurrentMonth={isCurrentMonth} />
        )}
        {session.user.role !== "admin" && tab === "wallet" && (
          <WalletTab balance={wallet.balance} topUp={topUp} transactions={wallet.transactions} busy={busy} />
        )}

        {session.user.role === "admin" && tab === "overview" && <AdminOverview overview={overview} orders={orders} />}
        {session.user.role === "admin" && tab === "adminMenu" && (
          <AdminMenu menu={menu} updateItem={updateMenuItem} addItem={addMenuItem} busy={busy} />
        )}
        {session.user.role === "admin" && tab === "adminOrders" && <AdminOrders orders={orders} advance={advanceOrder} />}
        {session.user.role === "admin" && tab === "reports" && <AdminReports trend={trend} forecast={forecast} />}
        {session.user.role === "admin" && tab === "feedback" && <AdminFeedback summary={feedbackSummary} />}

        {tab === "profile" && (
          <ProfileTab user={session.user} call={call}
            onUpdated={(u) => setSession(s => ({ ...s, user: { ...s.user, name: u.name, walletBalance: u.walletBalance } }))} />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
