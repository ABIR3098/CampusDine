  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; scroll-behavior: smooth; }

  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
    background-image:

  .gold-text {
    background: linear-gradient(135deg, #ca6c20 0%, #ef9b3f 50%, #9c4d16 100%);

    -webkit-text-fill-color: transparent;
    background-clip: text;

  ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.25); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }

  /* Classic Ticket Styling */
  .ticket {
    position: relative;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
    color: #ffffff;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    box-shadow: 0 8px 24px rgba(23, 53, 43, 0.14);
  }
  .ticket::before, .ticket::after {
    content: "";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 20px; height: 20px;
    background: var(--bg);
    border-radius: 50%;

  .ticket::before { left: -10px; border-right: 1px solid var(--panel-border); }
  .ticket::after { right: -10px; border-left: 1px solid var(--panel-border); }

  .card {

    border-radius: 12px;

    font-weight: 700;

    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);

    background: var(--gold);

    font-weight: 600;

    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
    color: var(--teal-deep);
    box-shadow: 0 2px 10px rgba(212, 175, 55, 0.25);

    border: 1px solid var(--panel-border);
    color: var(--ink-soft);

    border-color: var(--gold);
    color: var(--gold-bright);

async function api(apiBase, path, { method = "GET", body, token } = {}) {
  const res = await fetch(`${apiBase}${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

/* ---------------- Menu & Order Tab ---------------- */
function MenuOrder({ menu, cart, setCart, placeOrder, walletBalance, busy, favorites, toggleFavorite, call, receivingNumber, availableCoupons }) {
  const [cat, setCat] = useState("");
  const [search, setSearch] = useState("");
  const [minPrice, setMinPrice] = useState("");
  const [maxPrice, setMaxPrice] = useState("");
  const [availableOnly, setAvailableOnly] = useState(true);
  const [couponCode, setCouponCode] = useState("");
  const [coupon, setCoupon] = useState(null);
  const [couponMessage, setCouponMessage] = useState("");
  const filtered = menu.filter(i => (!cat || i.category === cat) && (!search || `${i.name} ${i.description || ""}`.toLowerCase().includes(search.toLowerCase())) && (!minPrice || Number(i.price) >= Number(minPrice)) && (!maxPrice || Number(i.price) <= Number(maxPrice)) && (!availableOnly || i.stock > 0));
  const [payMethod, setPayMethod] = useState("wallet");

  const add = (item) => setCart(prev => {
    const existing = prev.find(p => p.id === item.id);
    if (existing) return prev.map(p => p.id === item.id ? { ...p, qty: p.qty + 1 } : p);
    return [...prev, { ...item, qty: 1 }];
  });
  const dec = (item) => setCart(prev => prev.map(p => p.id === item.id ? { ...p, qty: p.qty - 1 } : p).filter(p => p.qty > 0));

  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const total = Math.max(0, subtotal - Number(coupon?.discountAmount || 0));
  const canPay = payMethod !== "wallet" || walletBalance >= total;
  const validateCoupon = async () => {
    if (!couponCode) return;
    try { const data = await call("/api/coupons/validate", { method: "POST", body: { couponCode, orderAmount: subtotal } }); setCoupon(data); setCouponMessage(`Discount applied: ${taka(data.discountAmount)}`); }
    catch (e) { setCoupon(null); setCouponMessage(e.message); }
  };

  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2">
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-2 mb-4">
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search meals" className="px-3 py-2 rounded-lg border text-xs" style={{ borderColor: "var(--panel-border)" }} />
          <input type="number" min="0" value={minPrice} onChange={e => setMinPrice(e.target.value)} placeholder="Min price" className="px-3 py-2 rounded-lg border text-xs" style={{ borderColor: "var(--panel-border)" }} />
          <input type="number" min="0" value={maxPrice} onChange={e => setMaxPrice(e.target.value)} placeholder="Max price" className="px-3 py-2 rounded-lg border text-xs" style={{ borderColor: "var(--panel-border)" }} />
          <label className="flex items-center gap-2 px-3 text-xs"><input type="checkbox" checked={availableOnly} onChange={e => setAvailableOnly(e.target.checked)} /> Available only</label>
        </div>
        <div className="flex gap-2 mb-5 flex-wrap">
          <button onClick={() => setCat("")} className={`tab-btn px-4 py-2 rounded-full text-xs ${!cat ? "active" : ""}`}>All</button>
          {CATEGORIES.map(c => (
            <button key={c.id} onClick={() => setCat(c.id)} className={`tab-btn px-4 py-2 rounded-full text-xs ${cat === c.id ? "active" : ""}`}>
              {c.label}
            </button>
          ))}
        </div>
        {favorites.length > 0 && <div className="card p-3 mb-5 text-xs"><span className="text-amber-300 font-700">Favorites:</span> {favorites.map(item => <button key={item.id} onClick={() => add(item)} className="ml-2 text-gray-300 hover:text-amber-300">{item.name}</button>)}</div>}
        <div className="grid sm:grid-cols-2 gap-4">
          {filtered.map(item => {
            const out = item.stock <= 0;
            const inCart = cart.find(c => c.id === item.id);
            const isFavorite = favorites.some(f => f.id === item.id);
            return (
              <div key={item.id} className={`card p-4 flex flex-col justify-between ${out ? "opacity-40" : ""}`}>
                <div>
                  <div className="flex items-start justify-between">
                    <div>
                      <div className="font-display font-700 text-amber-300">{item.name}</div>
                      <div className="text-xs text-gray-400 mt-0.5">{item.bn}</div>
                    </div>
                    <button onClick={() => toggleFavorite(item)} title={isFavorite ? "Remove favorite" : "Add favorite"} className={`text-lg ${isFavorite ? "text-amber-300" : "text-gray-500"}`}>★</button>
                    {item.tag && !out && (
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-amber-400 text-slate-950 font-700">{item.tag}</span>
                    )}
                  </div>
                </div>
                <div className="mt-4 flex items-center justify-between">
                  <span className="font-mono font-700 text-lg">{taka(item.price)}</span>
                  {out ? (
                    <span className="text-xs text-red-400 font-600">Stock Out</span>
                  ) : inCart ? (
                    <div className="flex items-center gap-2">
                      <button onClick={() => dec(item)} className="w-7 h-7 rounded-full grid place-items-center border border-amber-400/30"><Icon path={I.minus} className="w-3.5 h-3.5" /></button>
                      <span className="font-mono w-5 text-center text-sm">{inCart.qty}</span>
                      <button onClick={() => add(item)} className="w-7 h-7 rounded-full grid place-items-center bg-amber-400 text-slate-950"><Icon path={I.plus} className="w-3.5 h-3.5" /></button>
                    </div>
                  ) : (
                    <button onClick={() => add(item)} className="btn-primary px-4 py-1.5 rounded-md text-xs">Add</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div>
        <div className="card p-5 sticky top-20">
          <div className="font-display font-700 flex items-center gap-2 mb-4 text-amber-300">
            <Icon path={I.cart} className="w-5 h-5" /> Cart Summary
          </div>
          {cart.length === 0 ? (
            <p className="text-xs text-gray-400">কার্ট খালি — মেনু থেকে খাবার পছন্দ করুন।</p>
          ) : (
            <div className="space-y-2 mb-4">
              {cart.map(i => (
                <div key={i.id} className="flex justify-between text-xs">
                  <span>{i.name} × {i.qty}</span>
                  <span className="font-mono">{taka(i.price * i.qty)}</span>
                </div>
              ))}
            </div>
          )}
          <div className="border-t border-amber-400/20 pt-3 mb-4">
            <div className="flex justify-between font-700 text-sm">
              <span>Total Amount</span>
              <span className="font-mono text-amber-300">{taka(total)}</span>
            </div>
            {coupon && <div className="text-[11px] text-green-300 mt-1">Coupon discount: -{taka(coupon.discountAmount)}</div>}
          </div>
          {cart.length > 0 && (
            <>
              <div className="flex gap-2 mb-3">
                <input value={couponCode} onChange={e => setCouponCode(e.target.value.toUpperCase())} placeholder="Coupon code" className="flex-1 px-3 py-2 rounded-lg border text-xs" style={{ borderColor: "var(--panel-border)" }} />
                <button onClick={validateCoupon} className="px-3 rounded-lg border border-amber-400/30 text-xs">Apply</button>
              </div>
              {availableCoupons.length > 0 && <div className="mb-3 p-3 rounded-xl" style={{ background: "#fff8ed", border: "1px solid #f3d5ad" }}><div className="text-[10px] uppercase tracking-wider font-700 mb-2" style={{ color: "#a65417" }}>Available offers</div><div className="flex flex-wrap gap-2">{availableCoupons.map(offer => <button key={offer.id} onClick={() => setCouponCode(offer.code)} className="px-2.5 py-1.5 rounded-lg text-[11px] font-mono font-700" style={{ background: "#ffffff", color: "#a65417", border: "1px dashed #eab36f" }}>{offer.code} <span className="font-sans">{offer.discount_type === "PERCENTAGE" ? `${offer.discount_value}% off` : `${taka(offer.discount_value)} off`}</span></button>)}</div></div>}
              {couponMessage && <p className="text-[11px] text-gray-400 mb-3">{couponMessage}</p>}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4 text-xs">

                  Wallet
                </button>
                <button onClick={() => setPayMethod("cash")} className={`flex-1 py-2 rounded-lg border ${payMethod === "cash" ? "bg-amber-400 text-slate-950 font-700" : "border-amber-400/20"}`}>
                  Cash
                </button>
                {[['bkash', 'bKash'], ['nagad', 'Nagad']].map(([key, label]) => <button key={key} onClick={() => setPayMethod(key)} className={`py-2 rounded-lg border ${payMethod === key ? "bg-amber-400 text-slate-950 font-700" : "border-amber-400/20"}`}>{label}</button>)}
              </div>
              {payMethod !== "wallet" && payMethod !== "cash" && <p className="text-[11px] text-amber-300 mb-3">Send payment to {receivingNumber || "the configured receiving number"}. Payment initiation starts after order creation.</p>}
              {payMethod === "wallet" && !canPay && (
                <p className="text-[11px] text-red-400 mb-3">পর্যাপ্ত ব্যালেন্স নেই, ওয়ালেট রিচার্জ করুন।</p>
              )}
              <button disabled={!canPay || busy} onClick={() => placeOrder(cart, payMethod, coupon, total)} className="btn-primary w-full py-2.5 rounded-lg text-xs">
                {busy ? "Placing Order..." : "Confirm & Get Token"}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Track Order Tab ---------------- */
function TrackOrder({ orders, call, refreshOrders, refreshWallet }) {
  const cancelOrder = async (id) => { if (!window.confirm("Cancel this Received order? Refund: 100% if 8+ hours remain, 60% if 7-8 hours remain, 50% if 5-7 hours remain, otherwise 0%.")) return; try { const result = await call(`/api/orders/${id}/cancel`, { method: "PATCH" }); alert(result.refundAmount > 0 ? `৳${result.refundAmount} refunded (${Math.round(result.refundRate * 100)}%)` : "Order cancelled. No refund is available within 5 hours of meal time."); await refreshOrders(); await refreshWallet(); } catch (e) { alert(e.message); } };
  const exportCsv = async () => {
    try { const res = await fetch(`${window.__campusApiBase}/api/orders/export/csv`, { headers: { Authorization: `Bearer ${window.__campusToken}` } }); if (res.ok) { const blob = await res.blob(); const url = URL.createObjectURL(blob); const link = document.createElement("a"); link.href = url; link.download = "campusdine-orders.csv"; link.click(); URL.revokeObjectURL(url); return; } } catch (e) { /* use the loaded history below */ }
    const csv = ["Order ID,Order Token,Status,Total Amount,Items", ...orders.map(o => [o.id, o.token, o.status, o.total, (o.items || []).map(i => `${i.name}(${i.qty})`).join("; ")].map(value => `"${String(value ?? "").replace(/"/g, '""')}"`).join(","))].join("\n");
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); const link = document.createElement("a"); link.href = url; link.download = "campusdine-orders.csv"; link.click(); URL.revokeObjectURL(url);
  };
  if (orders.length === 0) {
    return <div><KitchenSimulation /><button onClick={exportCsv} className="mb-4 px-3 py-2 rounded-lg border border-amber-400/30 text-xs">Export CSV</button><div className="card p-12 text-center text-xs text-gray-400">কোনো অর্ডার পাওয়া যায়নি।</div></div>;
  }
  return (
    <div className="space-y-6 max-w-2xl mx-auto"><KitchenSimulation /><button onClick={exportCsv} className="px-3 py-2 rounded-lg border border-amber-400/30 text-xs">Export CSV</button>
      {orders.map(o => {
        const stepIndex = STATUSES.indexOf(o.status);
        return (
          <div key={o.token || o.id} className="card overflow-hidden">
            <div className="ticket p-5 flex items-center justify-between">
              <div className="perf pl-4">
                <div className="text-[10px] opacity-70 font-display uppercase tracking-widest">Token Number</div>
                <div className="font-mono text-2xl font-800 text-amber-300">{o.token}</div>
              </div>
              <div className="text-right">
                <div className="text-[10px] opacity-70 font-display uppercase tracking-widest">Total Bill</div>
                <div className="font-mono text-lg font-700">{taka(o.total)}</div>
              </div>
            </div>
            <div className="p-6">
              <div className="flex items-center justify-between mb-4">
                {STATUSES.map((s, i) => (
                  <React.Fragment key={s}>
                    <div className="flex flex-col items-center gap-1.5 flex-1">
                      <div className={`stepper-dot ${i < stepIndex ? "done" : i === stepIndex ? "current" : ""}`}></div>
                      <span className="text-[11px] text-center" style={{ color: i <= stepIndex ? "var(--gold)" : "var(--ink-soft)", fontWeight: i === stepIndex ? 700 : 400 }}>{s}</span>
                    </div>
                    {i < STATUSES.length - 1 && <div className="h-0.5 flex-1 -mt-4" style={{ background: i < stepIndex ? "var(--gold)" : "var(--panel-border)" }} />}
                  </React.Fragment>
                ))}
              </div>
              <div className="text-xs text-gray-400 border-t border-amber-400/10 pt-3 mt-4">
                Items: {o.items?.map(i => `${i.name} ×${i.qty}`).join(", ")}
              </div>
              {o.status === "Received" && <button onClick={() => cancelOrder(o.id)} className="mt-4 px-3 py-2 rounded-lg border border-red-500/40 text-red-300 text-xs">Cancel order</button>}
              {o.items?.map(i => <RatingForm key={i.menu_item_id || i.id} item={i} call={call} />)}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function KitchenSimulation() {
  const [stage, setStage] = useState(1);
  useEffect(() => { const timer = setInterval(() => setStage(current => (current + 1) % 3), 2600); return () => clearInterval(timer); }, []);
  const stages = ["Received", "Cooking", "Ready"];
  return <div className="simulation-card rounded-2xl p-5 mb-2"><div className="relative z-10 flex items-start justify-between gap-4"><div><div className="text-[10px] uppercase tracking-[.2em] opacity-70">Kitchen simulation</div><div className="font-display text-lg mt-1">Your meal is moving</div><div className="text-xs opacity-75 mt-1">A live preview of the campus pickup flow</div></div><div className="simulation-dot w-3 h-3 rounded-full bg-orange-300 mt-1"></div></div><div className="relative z-10 mt-5 simulation-line"></div><div className="relative z-10 grid grid-cols-3 mt-3 text-[10px] uppercase tracking-wider">{stages.map((name, index) => <div key={name} className={index <= stage ? "text-orange-200" : "opacity-50"}>{name}</div>)}</div></div>;
}

function RatingForm({ item, call }) {
  const [rating, setRating] = useState(0); const [review, setReview] = useState(""); const [message, setMessage] = useState("");
  const submit = async () => { try { await call(`/api/ratings/${item.menu_item_id || item.id}`, { method: "POST", body: { rating, review } }); setMessage("Review saved"); } catch (e) { setMessage(e.message); } };
  return <div className="mt-3 flex flex-wrap items-center gap-2 text-xs"><span className="text-gray-400">Rate {item.name}:</span>{[1, 2, 3, 4, 5].map(value => <button key={value} onClick={() => setRating(value)} className={value <= rating ? "text-amber-300 text-lg" : "text-gray-600 text-lg"}>★</button>)}<input value={review} onChange={e => setReview(e.target.value)} placeholder="Review (optional)" className="flex-1 min-w-32 px-2 py-1 rounded border text-xs" style={{ borderColor: "var(--panel-border)" }} /><button disabled={!rating} onClick={submit} className="px-2 py-1 rounded border border-amber-400/30">Save</button>{message && <span className="text-emerald-300">{message}</span>}</div>;
}

function ProfileTab({ call, user, onUserUpdate }) {
  const [profile, setProfile] = useState(user); const [passwords, setPasswords] = useState({ currentPassword: "", newPassword: "", confirmPassword: "" }); const [message, setMessage] = useState("");
  useEffect(() => { call("/api/profile").then(data => setProfile(data.user)).catch(e => setMessage(e.message)); }, []);
  const save = async () => { try { await call("/api/profile", { method: "PUT", body: { name: profile.name, email: profile.email, phone: profile.phone } }); onUserUpdate({ ...user, name: profile.name }); setMessage("Profile updated"); } catch (e) { setMessage(e.message); } };
  const changePassword = async () => { try { await call("/api/profile/change-password", { method: "POST", body: passwords }); setPasswords({ currentPassword: "", newPassword: "", confirmPassword: "" }); setMessage("Password changed"); } catch (e) { setMessage(e.message); } };
  const subscribe = async () => { try { await call("/api/profile", { method: "PUT", body: { phone: profile.phone } }); await call("/api/notifications/subscribe", { method: "POST", body: { phoneNumber: profile.phone } }); setMessage("SMS notifications enabled"); } catch (e) { setMessage(e.message.includes("404") ? "Phone saved; notification service is not enabled on this server" : e.message); } };
  const unsubscribe = async () => { try { await call("/api/notifications/unsubscribe", { method: "POST" }); setMessage("SMS notifications disabled"); } catch (e) { setMessage(e.message); } };
  return <div className="grid lg:grid-cols-2 gap-6 max-w-4xl mx-auto"><div className="card p-5 space-y-3"><div className="font-display font-700 text-amber-300">Profile</div><input value={profile.name || ""} onChange={e => setProfile({ ...profile, name: e.target.value })} placeholder="Name" className="w-full px-3 py-2 rounded border text-xs" style={{ borderColor: "var(--panel-border)" }} /><input value={profile.email || ""} onChange={e => setProfile({ ...profile, email: e.target.value })} placeholder="Email" className="w-full px-3 py-2 rounded border text-xs" style={{ borderColor: "var(--panel-border)" }} /><input value={profile.phone || ""} onChange={e => setProfile({ ...profile, phone: e.target.value })} placeholder="Notification phone" className="w-full px-3 py-2 rounded border text-xs" style={{ borderColor: "var(--panel-border)" }} /><button onClick={save} className="btn-primary px-4 py-2 rounded text-xs">Save profile</button><div className="flex gap-2"><button onClick={subscribe} className="px-3 py-2 rounded border border-amber-400/30 text-xs">Subscribe SMS</button><button onClick={unsubscribe} className="px-3 py-2 rounded border border-red-500/30 text-xs">Unsubscribe</button></div></div><div className="card p-5 space-y-3"><div className="font-display font-700 text-amber-300">Change password</div>{["currentPassword", "newPassword", "confirmPassword"].map(key => <input key={key} type="password" value={passwords[key]} onChange={e => setPasswords({ ...passwords, [key]: e.target.value })} placeholder={key.replace(/([A-Z])/g, " $1")} className="w-full px-3 py-2 rounded border text-xs" style={{ borderColor: "var(--panel-border)" }} />)}<button onClick={changePassword} className="btn-primary px-4 py-2 rounded text-xs">Change password</button>{message && <p className="text-xs text-emerald-300">{message}</p>}</div></div>;
}

/* ---------------- Meal Calendar Tab ---------------- */
function MealCalendar({ role, year, month, calendar, bill, onToggle }) {
  const total = daysInMonth(year, month);
  const monthName = new Date(year, month - 1).toLocaleString("default", { month: "long" });
  const firstWeekday = new Date(year, month - 1, 1).getDay();

  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2 card p-6">
        <div className="flex items-center justify-between mb-6">
          <div className="font-display font-700 text-lg text-amber-300">{monthName} {year}</div>
          <div className="text-xs text-gray-400">ট্যাপ করে মিল পর্যায় পরিবর্তন করুন: Off → Full → Half</div>
        </div>
        <div className="grid grid-cols-7 gap-2 mb-2 text-xs text-center font-600 text-gray-400">
          {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d, i) => <div key={i}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-2">
          {Array.from({ length: firstWeekday }).map((_, i) => <div key={"e" + i}></div>)}
          {Array.from({ length: total }).map((_, i) => {
            const day = i + 1;
            const status = calendar[day] || "off";
            return (
              <div key={day} onClick={() => onToggle(day, status)}
                   className={`cal-cell text-xs font-700 ${status === "full" ? "cal-full" : status === "half" ? "cal-half" : ""}`}>
                {day}
              </div>
            );
          })}
        </div>
        <div className="flex gap-4 mt-6 text-xs text-gray-400 justify-center">
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-amber-900 border border-amber-500"></span> Full Meal</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-amber-400/20 border border-amber-400"></span> Half Meal</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border border-gray-700"></span> Off</span>
        </div>
      </div>

      <div className="card p-6 h-fit">
        <div className="font-display font-700 mb-4 text-amber-300">Monthly Bill Summary</div>
        <div className="space-y-2 text-xs mb-4">
          <div className="flex justify-between"><span>Full Meal ({taka(bill.fullRate)})</span><span className="font-mono">{bill.fullDays} days</span></div>
          <div className="flex justify-between"><span>Half Meal ({taka(bill.halfRate)})</span><span className="font-mono">{bill.halfDays} days</span></div>
        </div>
        <div className="border-t border-amber-400/20 pt-3">
          <div className="flex justify-between font-700 text-sm">
            <span>Total Payable</span><span className="font-mono text-amber-300">{taka(bill.total)}</span>
          </div>
        </div>
        <p className="text-[11px] text-gray-400 mt-4 leading-relaxed">অটো-বিলিং হিসাব অনুযায়ী {role === "teacher" ? "Faculty" : "Student"} রেট প্রয়োগ করা হয়েছে।</p>
      </div>
    </div>
  );
}

/* ---------------- Wallet Tab ---------------- */
function WalletTab({ balance, topUp, gatewayTopUp, removeTransaction, transactions, busy, receivingNumber }) {
  const [amount, setAmount] = useState(100);
  const [method, setMethod] = useState("bkash");
  const [message, setMessage] = useState("");
  const startGatewayTopUp = async () => { setMessage(""); try { await gatewayTopUp(method, amount); setMessage(`${method} payment started`); } catch (e) { setMessage(e.message); } };
  const clearHistory = async () => { try { await removeTransaction("all"); } catch (e) { setMessage(e.message); } };
  return (
    <div className="grid lg:grid-cols-3 gap-6 max-w-4xl mx-auto">
      <div className="lg:col-span-1 space-y-4">
        <div className="ticket p-6">
          <div className="perf pl-4">
            <div className="text-[10px] uppercase font-display tracking-widest opacity-80">Available Balance</div>
            <div className="font-mono text-3xl font-800 text-amber-300 mt-1">{taka(balance)}</div>
          </div>
        </div>
        <div className="card p-5">
          <div className="font-display font-700 mb-3 text-xs text-amber-300">Quick Top Up</div>
          <div className="flex gap-2 mb-3">
            {[100, 300, 500].map(v => (
              <button key={v} onClick={() => setAmount(v)} className={`flex-1 py-1.5 rounded-md border text-xs font-mono ${amount === v ? "bg-amber-400 text-slate-950 font-700" : "border-amber-400/20"}`}>
                {taka(v)}
              </button>
            ))}
          </div>
          <input type="number" min="1" max="9999" value={amount} onChange={e => setAmount(Number(e.target.value))} className="w-full px-3 py-2 rounded-md border mb-3 font-mono text-xs" style={{ borderColor: "var(--panel-border)" }} />
          <button disabled={busy} onClick={() => amount > 0 && topUp(amount)} className="btn-gold w-full py-2.5 rounded-md text-xs">
            {busy ? "Processing..." : "Demo Wallet Top Up"}
          </button>
          <div className="mt-4 pt-4 border-t" style={{ borderColor: "var(--panel-border)" }}>
            <div className="text-[11px] mb-2" style={{ color: "var(--ink-soft)" }}>Gateway top-up to {receivingNumber}</div>
            <div className="grid grid-cols-2 gap-2 mb-2">
              {[['bkash', 'bKash'], ['nagad', 'Nagad']].map(([key, label]) => <button key={key} onClick={() => setMethod(key)} className={`py-2 rounded-md border text-xs ${method === key ? "bg-orange-500 text-white font-700" : "border-orange-200"}`}>{label}</button>)}
            </div>
            <button disabled={busy} onClick={startGatewayTopUp} className="w-full py-2 rounded-md border border-orange-300 text-orange-700 text-xs font-700">Pay via {method}</button>
            {message && <p className="text-[11px] mt-2 text-orange-700">{message}</p>}
          </div>
        </div>
      </div>

      <div className="lg:col-span-2 card p-6">
        <div className="flex items-center justify-between gap-3 mb-4"><div className="font-display font-700 text-amber-300">Transaction History</div>{transactions.length > 0 && <button onClick={clearHistory} className="text-[11px] text-red-500 hover:text-red-700">Remove all</button>}</div>
        {transactions.length === 0 ? (
          <p className="text-xs text-gray-400">কোনো লেনদেনের তথ্য পাওয়া যায়নি।</p>
        ) : (
          <div className="space-y-2">
            {transactions.map((t, i) => (
              <div key={t.id || i} className="flex justify-between items-center gap-3 py-2.5 text-xs border-b border-amber-400/10">
                <div>
                  <div className="font-600">{t.label}</div>
                  <div className="text-[10px] text-gray-400">{t.time}</div>
                </div>
                <div className="flex items-center gap-3"><span className={`font-mono font-700 ${t.amount > 0 ? "text-emerald-400" : "text-red-400"}`}>{t.amount > 0 ? "+" : ""}{taka(t.amount)}</span><button onClick={() => removeTransaction(t.id)} title="Remove from history" className="text-gray-400 hover:text-red-500">×</button></div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- App Core Entry ---------------- */
function App() {
  const [apiBase, setApiBase] = useState(DEFAULT_API_BASE);
  const [session, setSession] = useState(null);
  const [tab, setTab] = useState("menu");
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [connected, setConnected] = useState(false);

  const [menu, setMenu] = useState([]);
  const [cart, setCart] = useState([]);
  const [orders, setOrders] = useState([]);
  const [wallet, setWallet] = useState({ balance: 0, transactions: [] });
  const [calendar, setCalendar] = useState({});
  const [bill, setBill] = useState({ fullDays: 0, halfDays: 0, fullRate: 0, halfRate: 0, total: 0 });
  const [overview, setOverview] = useState({});
  const [trend, setTrend] = useState([]);
  const [forecast, setForecast] = useState({});
  const [favorites, setFavorites] = useState([]);
  const [availableCoupons, setAvailableCoupons] = useState([]);
  const [adminReviews, setAdminReviews] = useState([]);
  const [receivingNumber, setReceivingNumber] = useState("01318400442");

  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;

  const socketRef = useRef(null);
  const showError = (e) => setError(typeof e === "string" ? e : e.message);

  const call = (path, opts) => api(apiBase, path, { ...opts, token: session?.token });

  const mapMenu = (rows) => rows.map(m => ({ ...m, bn: m.name_bn }));
  const mapWallet = (data) => ({
    balance: data.balance,
    transactions: data.transactions.map(t => ({ id: t.id, label: t.label, amount: t.amount, time: new Date(t.created_at).toLocaleString() })),
  });
  const mapCalendar = (rows) => {
    const map = {};
    rows.forEach(r => { map[new Date(r.the_date).getDate()] = r.status; });
    return map;
  };

  const refreshMenu = async () => setMenu(mapMenu(await call("/api/menu")));
  const refreshWallet = async () => setWallet(mapWallet(await call("/api/wallet")));
  const removeTransaction = async (id) => { if (!id || !window.confirm(id === "all" ? "Remove all wallet entries from your history?" : "Remove this entry from your wallet history?")) return; try { await call(id === "all" ? "/api/wallet/transactions" : `/api/wallet/transactions/${id}`, { method: "DELETE" }); await refreshWallet(); } catch (e) { showError(e); } };
  const refreshCalendar = async () => {
    setCalendar(mapCalendar(await call(`/api/calendar?year=${year}&month=${month}`)));
    setBill(await call(`/api/calendar/bill?year=${year}&month=${month}`));
  };
  const refreshMyOrders = async () => setOrders(await call("/api/orders/mine"));
  const refreshFavorites = async () => { const data = await call("/api/favorites"); setFavorites(data.favorites || []); };
  const refreshCoupons = async () => { const data = await call("/api/coupons/available"); setAvailableCoupons(data.coupons || []); };
  const refreshAdminOrders = async () => setOrders(await call("/api/orders"));
  const refreshOverview = async () => setOverview(await call("/api/admin/overview"));
  const refreshReports = async () => {
    setTrend(await call("/api/admin/reports/revenue-trend"));
    setForecast(await call("/api/admin/reports/forecast"));
  };
  const refreshAdminReviews = async () => { const data = await call("/api/ratings/admin/reviews"); setAdminReviews(data.reviews || []); };

  const onAuth = (token, user) => {
    setSession({ token, user });
    setTab(user.role === "admin" ? "overview" : "menu");
  };

  const logout = () => {
    if (socketRef.current) socketRef.current.disconnect();
    setSession(null); setCart([]); setError(null);
  };

  useEffect(() => {
    if (!session) return;
    (async () => {
      try {
        if (session.user.role === "admin") {
          await Promise.all([refreshMenu(), refreshAdminOrders(), refreshOverview(), refreshReports(), refreshAdminReviews()]);
        } else {
          await Promise.all([refreshMenu(), refreshMyOrders(), refreshWallet(), refreshCalendar(), refreshFavorites(), refreshCoupons()]);
        }
      } catch (e) { showError(e); }
    })();
  }, [session]);

  useEffect(() => {
    if (!session) return;
    const socket = io(apiBase, { auth: { token: session.token } });
    socketRef.current = socket;
    socket.on("connect", () => setConnected(true));
    socket.on("disconnect", () => setConnected(false));
    socket.on("order:new", (order) => {
      if (session.user.role === "admin") setOrders(prev => [order, ...prev]);
    });
    socket.on("order:update", (order) => {
      setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: order.status } : o));
    });
    return () => socket.disconnect();
  }, [session, apiBase]);

  const toggleFavorite = async (item) => {
    try { const exists = favorites.some(f => f.id === item.id); await call(`/api/favorites/${item.id}`, { method: exists ? "DELETE" : "POST" }); await refreshFavorites(); } catch (e) { showError(e); }
  };

  const placeOrder = async (cartItems, paymentMethod, coupon, total) => {
    setBusy(true); setError(null);
    try {
      const order = await call("/api/orders", { method: "POST", body: { items: cartItems.map(c => ({ id: Number(c.id), qty: Number(c.qty) })), couponCode: coupon?.code, paymentMethod } });
      if (coupon?.couponId) await call("/api/coupons/apply", { method: "POST", body: { couponId: coupon.couponId, orderId: order.id } });
      if (paymentMethod === "bkash" || paymentMethod === "nagad") {
        const payment = await call(`/api/payment/${paymentMethod}/initiate`, { method: "POST", body: { amount: Number(total), orderId: order.id } });
        const paymentUrl = payment.paymentUrl || payment.redirectUrl;
        if (paymentUrl) window.open(paymentUrl, "_blank", "noopener");
      }
      setCart([]);
      await Promise.all([refreshMyOrders(), refreshMenu(), paymentMethod === "wallet" ? refreshWallet() : Promise.resolve()]);
      setTab("track");
    } catch (e) { showError(e); } finally { setBusy(false); }
  };

  const gatewayTopUp = async (method, amount) => {
    const data = await call(`/api/payment/${method}/wallet-topup`, { method: "POST", body: { amount: Number(amount) } });
    if (data.redirectUrl || data.paymentUrl) window.open(data.redirectUrl || data.paymentUrl, "_blank", "noopener");
    await refreshWallet();
    return data;
  };

  useEffect(() => { window.__campusApiBase = apiBase; window.__campusToken = session?.token || ""; }, [apiBase, session]);

  const advanceOrder = async (id) => {
    try {
      await call(`/api/orders/${id}/advance`, { method: "PATCH" });
      await refreshAdminOrders();
    } catch (e) { showError(e); }
  };

  const topUp = async (amount) => {
    setBusy(true); setError(null);
    try {
      await call("/api/wallet/topup", { method: "POST", body: { amount } });
      await refreshWallet();
    } catch (e) { showError(e); } finally { setBusy(false); }
  };

  const toggleDay = async (day, currentStatus) => {
    const next = currentStatus === "off" ? "full" : currentStatus === "full" ? "half" : "off";
    try {
      await call(`/api/calendar/${day}`, { method: "PUT", body: { year, month, status: next } });
      await refreshCalendar();
    } catch (e) { showError(e); }
  };

  const updateMenuItem = async (id, patch) => {
    try {
      await call(`/api/menu/${id}`, { method: "PUT", body: patch });
      await refreshMenu();
    } catch (e) { showError(e); }
  };
  const addMenuItem = async (item) => {
    try {
      await call("/api/menu", { method: "POST", body: item });
      await refreshMenu();
    } catch (e) { showError(e); }
  };

  if (!session) return <Login apiBase={apiBase} setApiBase={setApiBase} onAuth={onAuth} />;

  const userTabs = [
    { key: "menu", label: "Menu & Order", icon: I.menu },
    { key: "track", label: "Track Order", icon: I.clock },
    { key: "calendar", label: "Meal Calendar", icon: I.calendar },
    { key: "wallet", label: "Wallet", icon: I.wallet },
    { key: "profile", label: "Profile & Alerts", icon: I.user },
  ];
  const adminTabs = [
    { key: "overview", label: "Overview", icon: I.dashboard },
    { key: "adminMenu", label: "Menu", icon: I.box },
    { key: "adminOrders", label: "Orders Queue", icon: I.ticket },
    { key: "reports", label: "Reports", icon: I.chart },
    { key: "reviews", label: "Reviews", icon: I.ticket },
  ];

  return (
    <div className="min-h-screen">
      <TopBar role={session.user.role} name={session.user.name}
              tabs={session.user.role === "admin" ? adminTabs : userTabs}
              active={tab} setActive={setTab} onLogout={logout} connected={connected} />
      
      <main className="max-w-6xl mx-auto p-6 fade-in" key={tab}>
        {error && (
          <div className="p-4 rounded-lg mb-6 text-xs flex justify-between items-center border bg-red-950/40 border-red-500/40 text-red-300">
            <span>{error}</span>
            <button onClick={() => setError(null)} className="font-700 text-sm">✕</button>
          </div>
        )}

        {session.user.role !== "admin" && tab === "menu" && (
          <MenuOrder menu={menu} cart={cart} setCart={setCart} placeOrder={placeOrder} walletBalance={wallet.balance} busy={busy} favorites={favorites} toggleFavorite={toggleFavorite} call={call} receivingNumber={receivingNumber} availableCoupons={availableCoupons} />
        )}
        {session.user.role !== "admin" && tab === "track" && <TrackOrder orders={orders} call={call} refreshOrders={refreshMyOrders} refreshWallet={refreshWallet} />}
        {session.user.role !== "admin" && tab === "calendar" && (
          <MealCalendar role={session.user.role} year={year} month={month} calendar={calendar} bill={bill} onToggle={toggleDay} />
        )}
        {session.user.role !== "admin" && tab === "wallet" && (
          <WalletTab balance={wallet.balance} topUp={topUp} gatewayTopUp={gatewayTopUp} removeTransaction={removeTransaction} receivingNumber={receivingNumber} transactions={wallet.transactions} busy={busy} />
        )}
        {session.user.role !== "admin" && tab === "profile" && <ProfileTab call={call} user={session.user} onUserUpdate={user => setSession(prev => ({ ...prev, user }))} />}

        {session.user.role === "admin" && tab === "overview" && <AdminOverview overview={overview} orders={orders} />}
        {session.user.role === "admin" && tab === "adminMenu" && (
          <AdminMenu menu={menu} updateItem={updateMenuItem} addItem={addMenuItem} busy={busy} />
        )}
        {session.user.role === "admin" && tab === "adminOrders" && <AdminOrders orders={orders} advance={advanceOrder} />}
        {session.user.role === "admin" && tab === "reports" && <AdminReports trend={trend} forecast={forecast} />}
        {session.user.role === "admin" && tab === "reviews" && <AdminReviews reviews={adminReviews} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
