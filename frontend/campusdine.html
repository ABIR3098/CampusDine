<style>
  :root{
    --bg: #F5F7FA;
    --panel: #FFFFFF;
    --ink: #1F2937;
    --ink-soft: #6B7280;
    --teal: #16A34A;
    --teal-deep: #14532D;
    --gold: #16A34A;
    --gold-bright: #15803D;
    --gold-deep: #15803D;
    --gold-soft: #DCFCE7;
    --brick: #DC2626;
    --leaf: #16A34A;
    --line: #E5E7EB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', 'Hind Siliguri', ui-sans-serif, system-ui, sans-serif;
  }
  .font-display{font-family:'Plus Jakarta Sans', 'Hind Siliguri', ui-sans-serif, system-ui, sans-serif;}
  .font-mono{font-family:'JetBrains Mono', ui-monospace, monospace;}
  .gold-text{ color: var(--gold-deep); }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:8px;}

  .ticket{
    position:relative;
    background: linear-gradient(135deg, #16A34A 0%, #15803D 100%);
    color:#FFFFFF;
    border-radius: 12px;
    overflow:visible;
    box-shadow: 0 6px 16px -8px rgba(21,128,61,0.6);
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:18px; height:18px;
    background: var(--bg);
    border-radius:50%;
  }
  .ticket::before{ left:-9px; }
  .ticket::after{ right:-9px; }
  .ticket .perf{ border-left: 2px dashed rgba(255,255,255,0.45); }

  .tab-btn{
    font-weight:600;
    transition: all .15s ease;
  }
  .tab-btn.active{
    background: var(--gold);
    color: #FFFFFF;
  }
  .tab-btn:not(.active){
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .tab-btn:not(.active):hover{
    border-color: var(--gold);
    color: var(--gold-deep);
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.05);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .card:hover{
    border-color: #BBF7D0;
    box-shadow: 0 4px 12px rgba(16,24,40,0.06);
  }

  .btn-primary{
    background: var(--gold);
    color: #FFFFFF;
    font-weight:600;
    font-size:.9em;
    border-radius:8px;
    transition: background .15s ease, transform .1s ease;
  }
  .btn-primary:hover{ background: var(--gold-deep); }
  .btn-primary:active{ transform: scale(.98); }
  .btn-primary:disabled{ background:#D1D5DB; color:#9CA3AF; cursor:not-allowed; transform:none; }

  .btn-gold{
    background: #FFFFFF;
    border: 1px solid var(--gold);
    color: var(--gold-deep);
    font-weight:600;
    font-size:.9em;
  }
  .btn-gold:hover{ background: var(--gold); color: #FFFFFF; }
  .btn-gold:disabled{ border-color:#D1D5DB; color:#9CA3AF; background:#F3F4F6; cursor:not-allowed; }

  .stepper-dot{
    width:14px;height:14px;border-radius:50%;
    background:var(--line);
    border:2px solid var(--line);
  }
  .stepper-dot.done{ background:var(--gold); border-color:var(--gold); }
  .stepper-dot.current{ background:var(--gold); border-color:var(--gold); box-shadow:0 0 0 5px rgba(22,163,74,0.18); }

  .cal-cell{
    aspect-ratio:1/1;
    border-radius:8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer;
    user-select:none;
    border:1px solid var(--line);
    transition: transform .1s ease, border-color .15s ease;
    background:var(--panel);
    color: var(--ink);
  }
  .cal-cell:hover{ transform: translateY(-2px); border-color: var(--gold); }
  .cal-full{ background: var(--gold); color:#FFFFFF; border-color:var(--gold); }
  .cal-half{ background: var(--gold-soft); color:var(--teal-deep); border-color:var(--gold); }

  .fade-in{ animation: fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .low-stock-banner{
    background: #FEF2F2;
    border: 1px solid #FECACA;
  }

  .error-banner{ background:#FEF2F2; color:#B91C1C; border:1px solid #FECACA; }
  .success-banner{ background:#F0FDF4; color:#15803D; border:1px solid #BBF7D0; }

  #print-area{ display:none; }
  @media print{
    body *{ visibility:hidden; }
    #print-area, #print-area *{ visibility:visible; }
    #print-area{
      display:block; position:absolute; left:0; top:0; width:100%;
      display:flex; justify-content:center; padding:32px 16px;
    }
    .receipt{
      width:320px; border:1.5px dashed #9CA3AF; border-radius:14px;
      padding:22px 20px; font-family:'Plus Jakarta Sans', 'Hind Siliguri', ui-sans-serif, sans-serif;
      color:#111827;
    }
    .receipt-row{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; }
    .receipt-divider{ border-top:1px dashed #9CA3AF; margin:12px 0; }
  }

  .chip{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .chip:hover{ border-color: var(--gold); color: var(--gold-deep); }
  .chip.active-chip{
    background: var(--gold);
    color: #FFFFFF;
    border-color: var(--gold);
  }

  .logo-badge{
    background: var(--gold);
    border-radius: 10px;
  }

  .divider-flourish{ display:flex; align-items:center; justify-content:center; gap:14px; color: var(--gold); }
  .divider-flourish::before, .divider-flourish::after{
    content:""; flex:1; max-width:80px; border-bottom:1px solid var(--line);
  }

  input, select, textarea{ background: #FFFFFF; color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  button:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

</style>

/* ---------------- API helper ---------------- */
async function api(apiBase, path, { method = "GET", body, token } = {}) {
  const res = await fetch(`${apiBase}${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

const tx = (key, vars) => {
  let str = I18N[CURRENT_LANG] ? I18N[CURRENT_LANG][key] : undefined;
  if (str === undefined) str = I18N.en[key];
  if (str === undefined) str = key;
  if (vars) Object.keys(vars).forEach(k => { str = str.split("{" + k + "}").join(vars[k]); });
  return str;
};
// lookup("status", "Ready") -> translated label, or the raw value if there is no translation
const lookup = (prefix, val) => {
  const k = prefix + "." + val;
  const str = I18N[CURRENT_LANG] ? I18N[CURRENT_LANG][k] : undefined;
  if (str !== undefined) return str;
  return I18N.en[k] !== undefined ? I18N.en[k] : val;
};
const num = (n) => Number(n).toLocaleString(CURRENT_LANG === "bn" ? "bn-BD" : "en-US", { useGrouping: false });
const itemName = (item) => (CURRENT_LANG === "bn" && item.bn) ? item.bn : item.name;
const dispName = (name) => (CURRENT_LANG === "bn" && MENU_BN[name]) ? MENU_BN[name] : name;
// Wallet labels are stored in English by the server; map the known ones.
const txLabel = (label) => {
  if (CURRENT_LANG !== "bn") return label;
  if (label === "Welcome bonus") return tx("tx.welcome");
  if (label === "Order payment") return tx("tx.order");
  let m = /^Refund — Order (\S+) cancelled$/.exec(label);
  if (m) return tx("tx.refund", { t: m[1] });
  m = /^Wallet top-up via (.+)$/.exec(label);
  if (m) return tx("tx.topup", { m: m[1] });
  return label;
};
const taka = (n) => `৳${Number(n || 0).toLocaleString(CURRENT_LANG === "bn" ? "bn-BD" : "en-BD")}`;
function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); } // month is 1-12 here
function monthLabel(ym) {
  const [y, m] = ym.split("-");
  return new Date(Number(y), Number(m) - 1).toLocaleString("default", { month: "short" });
}

/* ---------------- Language toggle (EN | বাং) ---------------- */
function LangToggle({ onToggle }) {
  const seg = (active) => ({ background: active ? "var(--gold)" : "transparent", color: active ? "#fff" : "var(--ink-soft)" });
  return (
    <button onClick={onToggle} title={tx("lang.switch")}
      className="flex rounded-lg border overflow-hidden text-xs font-600" style={{ borderColor: "var(--line)" }}>
      <span className="px-2 py-1.5" style={seg(CURRENT_LANG === "en")}>EN</span>
      <span className="px-2 py-1.5" style={seg(CURRENT_LANG === "bn")}>বাং</span>
    </button>
  );
}

  const [password, setPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [resetMsg, setResetMsg] = useState(null);
  const [showAdvanced, setShowAdvanced] = useState(false);
  const authRef = useRef(null);

  const roleOptions = [
    { key: "student", label: tx("role.student.l"), desc: tx("role.student.d"), icon: I.user },
    { key: "teacher", label: tx("role.teacher.l"), desc: tx("role.teacher.d"), icon: I.user },
    { key: "admin", label: tx("role.admin.l"), desc: tx("role.admin.d"), icon: I.dashboard },
  ];

  const features = [
    { title: tx("f1.t"), desc: tx("f1.d") },
    { title: tx("f2.t"), desc: tx("f2.d") },
    { title: tx("f3.t"), desc: tx("f3.d") },
    { title: tx("f4.t"), desc: tx("f4.d") },
  ];

  const sampleMenu = [
    { name: tx("sm.tehari"), tag: tx("sm.tehari.t"), price: "৳ " + num(80), img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80" },
    { name: tx("sm.roll"), tag: tx("sm.roll.t"), price: "৳ " + num(50), img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80" },
    { name: tx("sm.brew"), tag: tx("sm.brew.t"), price: "৳ " + num(35), img: "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?auto=format&fit=crop&w=500&q=80" },
  ];

  const scrollToAuth = () => authRef.current && authRef.current.scrollIntoView({ behavior: "smooth", block: "start" });

  const submit = async () => {
    setError(null);
    if (!externalId || !password || (mode === "register" && !name)) {
      setError(tx("err.fill"));
      return;
    }
    setBusy(true);
    try {
      const data = mode === "login"
        ? await api(apiBase, "/api/auth/login", { method: "POST", body: { externalId, password } })
        : await api(apiBase, "/api/auth/register", { method: "POST", body: { name, externalId, role, password } });
      onAuth(data.token, data.user);
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const submitReset = async () => {
    setError(null); setResetMsg(null);
    if (!externalId || !newPassword) { setError(tx("err.fill")); return; }
    if (newPassword.length < 6) { setError(tx("err.pw6")); return; }
    setBusy(true);
    try {
      await api(apiBase, "/api/auth/reset-password", { method: "POST", body: { externalId, newPassword } });
      setMode("login");
      setPassword("");
      setNewPassword("");
      setResetMsg(tx("reset.ok"));
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const pillTab = (key, label) => (
    <button onClick={() => { setMode(key); setError(null); }}
      className="flex-1 py-2.5 rounded-full text-xs font-700 transition-all"
      style={mode === key
        ? { background: "var(--gold)", color: "#FFFFFF" }
        : { color: "var(--ink-soft)" }}>
      {label}
    </button>
  );

  return (
    <div className="min-h-screen">
      {/* Announcement bar */}
      <div className="text-center py-2 px-4 text-xs font-500"
        style={{ background: "var(--gold-soft)", color: "var(--teal-deep)", borderBottom: "1px solid var(--line)" }}>
        {tx("ann")}
      </div>

      {/* Sticky nav */}
      <header className="sticky top-0 z-30 backdrop-blur" style={{ background: "rgba(255,255,255,0.92)", borderBottom: "1px solid var(--line)" }}>
        <div className="max-w-6xl mx-auto px-6 py-3.5 flex items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className="logo-badge w-10 h-10 rounded-full grid place-items-center">
              <Icon path={I.ticket} className="w-5 h-5" style={{ color: "var(--gold)" }} />
            </div>
            <div>
              <span className="font-display gold-text text-lg font-800 block leading-none">CampusDine</span>
              <span className="text-[10px] block mt-0.5" style={{ color: "var(--ink-soft)" }}>{tx("canteen")}</span>
            </div>
          </div>
          <nav className="hidden md:flex items-center gap-8 text-sm font-500" style={{ color: "var(--ink-soft)" }}>
            <a href="#menu" style={{ color: "inherit" }} onMouseOver={e => e.currentTarget.style.color = "var(--gold)"} onMouseOut={e => e.currentTarget.style.color = "var(--ink-soft)"}>{tx("nav.menu")}</a>
            <a href="#about" style={{ color: "inherit" }} onMouseOver={e => e.currentTarget.style.color = "var(--gold)"} onMouseOut={e => e.currentTarget.style.color = "var(--ink-soft)"}>{tx("nav.about")}</a>
            <a href="#contact" style={{ color: "inherit" }} onMouseOver={e => e.currentTarget.style.color = "var(--gold)"} onMouseOut={e => e.currentTarget.style.color = "var(--ink-soft)"}>{tx("nav.contact")}</a>
          </nav>
          <div className="flex items-center gap-2">
            <LangToggle onToggle={onToggleLang} />
            <button onClick={scrollToAuth} className="btn-primary px-5 py-2 rounded-lg text-xs">{tx("signin")}</button>
          </div>
        </div>
      </header>

      {/* Hero */}
      <section className="relative py-24 px-6 text-center overflow-hidden">
        <div className="absolute inset-0 -z-10" style={{ background: "radial-gradient(ellipse 60% 50% at 50% 0%, rgba(22,163,74,0.10), transparent)" }}></div>
        <div className="max-w-3xl mx-auto space-y-6">
          <div className="inline-block px-4 py-1.5 rounded-full text-xs font-600" style={{ border: "1px solid var(--line)", color: "var(--gold)" }}>
            {tx("hero.badge")}
          </div>
          <h1 className="font-display text-4xl sm:text-5xl font-800 leading-tight" style={{ color: "var(--ink)" }}>
            {tx("hero.h1a")}<br /><span className="gold-text">{tx("hero.h1b")}</span>
          </h1>
          <p className="max-w-xl mx-auto text-[15px] leading-relaxed" style={{ color: "var(--ink-soft)" }}>
            {tx("hero.p")}
          </p>
          <div className="flex flex-wrap justify-center gap-4 pt-2">
            <button onClick={scrollToAuth} className="btn-primary px-8 py-3 rounded-lg">{tx("hero.start")}</button>
            <a href="#menu" className="btn-gold px-8 py-3 rounded-lg inline-block">{tx("hero.explore")}</a>
          </div>
        </div>
      </section>

      {/* Features banner */}
      <section className="border-y py-10" style={{ borderColor: "var(--line)", background: "#FFFFFF" }}>
        <div className="max-w-6xl mx-auto px-6 grid grid-cols-2 md:grid-cols-4 gap-8 text-center">
          {features.map(f => (
            <div key={f.title} className="space-y-1.5">
              <h4 className="font-display font-700 text-sm" style={{ color: "var(--gold)" }}>{f.title}</h4>
              <p className="text-xs leading-relaxed" style={{ color: "var(--ink-soft)" }}>{f.desc}</p>
            </div>
          ))}
        </div>
      </section>

      {/* Menu preview */}
      <section id="menu" className="max-w-6xl mx-auto px-6 py-20">
        <div className="text-center mb-12 space-y-3">
          <p className="font-display text-xs uppercase" style={{ color: "var(--gold)" }}>{tx("pop.k")}</p>
          <h2 className="font-display text-3xl font-800" style={{ color: "var(--ink)" }}>{tx("pop.h")}</h2>
          <div className="divider-flourish text-sm max-w-xs mx-auto">❖</div>
        </div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
          {sampleMenu.map(item => (
            <div key={item.name} className="card overflow-hidden">
              <div className="h-36 overflow-hidden" style={{ background: "var(--gold-soft)" }}>
                <img src={item.img} alt={item.name} className="w-full h-full object-cover" style={{ opacity: 1 }} />
              </div>
              <div className="p-4">
                <div className="font-display font-700 text-sm" style={{ color: "var(--ink)" }}>{item.name}</div>
                <div className="text-xs mb-2" style={{ color: "var(--ink-soft)" }}>{item.tag}</div>
                <div className="font-mono text-sm" style={{ color: "var(--gold)" }}>{item.price}</div>
              </div>
            </div>
          ))}
          <div className="card flex flex-col items-center justify-center text-center p-6 gap-3">
            <Icon path={I.menu} className="w-7 h-7" style={{ color: "var(--gold)" }} />
            <div className="font-display font-700 text-sm" style={{ color: "var(--ink)" }}>{tx("more")}</div>
            <p className="text-xs" style={{ color: "var(--ink-soft)" }}>{tx("more.d")}</p>
          </div>
        </div>
      </section>

      {/* About */}
      <section id="about" className="border-t py-20 px-6" style={{ borderColor: "var(--line)", background: "rgba(22,163,74,0.05)" }}>
        <div className="max-w-2xl mx-auto text-center space-y-5">
          <p className="font-display text-xs uppercase" style={{ color: "var(--gold)" }}>{tx("about.k")}</p>
          <h2 className="font-display text-3xl font-800" style={{ color: "var(--ink)" }}>{tx("about.h")}</h2>
          <div className="divider-flourish text-sm max-w-xs mx-auto">❖</div>
          <p className="leading-relaxed text-[15px]" style={{ color: "var(--ink-soft)" }}>
            {tx("about.p")}
          </p>
        </div>
      </section>

      {/* Auth */}
      <section ref={authRef} className="py-20 px-6">
        <div className="max-w-md mx-auto">
          <div className="text-center mb-8 space-y-2">
            <p className="font-display text-xs uppercase" style={{ color: "var(--gold)" }}>{tx("auth.k")}</p>
            <h2 className="font-display text-2xl font-800" style={{ color: "var(--ink)" }}>{tx("auth.h")}</h2>
          </div>

          <div className="card p-8 fade-in">
            {!role ? (
              <div className="space-y-3">
                {roleOptions.map((r) => (
                  <button key={r.key} onClick={() => setRole(r.key)}
                    className="w-full flex items-center gap-4 p-4 rounded-lg border text-left transition-all hover:-translate-y-0.5"
                    style={{ borderColor: "var(--line)" }}>
                    <div className="w-11 h-11 rounded-lg grid place-items-center shrink-0" style={{ background: "var(--gold-soft)" }}>
                      <Icon path={r.icon} className="w-5 h-5" style={{ color: "var(--teal-deep)" }} />
                    </div>
                    <div>
                      <div className="font-display font-700 text-sm" style={{ color: "var(--ink)" }}>{r.label}</div>
                      <div className="text-xs mt-0.5" style={{ color: "var(--ink-soft)" }}>{r.desc}</div>
                    </div>
                  </button>
                ))}
              </div>
            ) : mode === "forgot" ? (
              <>
                <button onClick={() => { setMode("login"); setError(null); }} className="text-sm mb-5 flex items-center gap-1" style={{ color: "var(--ink-soft)" }}>
                  <Icon path={I.arrow} className="w-4 h-4 rotate-180" /> {tx("back.login")}
                </button>
                <div className="font-display font-700 text-xl mb-1 text-center" style={{ color: "var(--gold)" }}>{tx("reset.h")}</div>
                <p className="text-xs mb-5 text-center" style={{ color: "var(--ink-soft)" }}>{tx("reset.p")}</p>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("id")}</label>
                    <input value={externalId} onChange={e => setExternalId(e.target.value)} placeholder="e.g. 24524203098"
                      className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                  </div>
                  <div>
                    <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("newpw")}</label>
                    <input value={newPassword} onChange={e => setNewPassword(e.target.value)} type="password" placeholder={tx("atleast6")}
                      className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                  </div>
                  {error && <p className="text-sm" style={{ color: "#DC2626" }}>{error}</p>}
                  <button disabled={busy} onClick={submitReset} className="btn-primary w-full py-2.5 rounded-xl">
                    {busy ? tx("wait") : tx("reset.h")}
                  </button>
                </div>
              </>
            ) : (
              <>
                <button onClick={() => { setRole(null); setError(null); }} className="text-sm mb-5 flex items-center gap-1" style={{ color: "var(--ink-soft)" }}>
                  <Icon path={I.arrow} className="w-4 h-4 rotate-180" /> {tx("back")}
                </button>
                <div className="font-display font-700 text-lg mb-5 text-center" style={{ color: "var(--gold)" }}>
                  {tx("access", { role: roleOptions.find(r => r.key === role).label })}
                </div>

                <div className="flex p-1 rounded-full mb-6" style={{ background: "var(--bg)", border: "1px solid var(--line)" }}>
                  {pillTab("login", tx("login"))}
                  {pillTab("register", tx("create"))}
                </div>

                <div className="space-y-3">
                  {mode === "register" && (
                    <div>
                      <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("fullname")}</label>
                      <input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Abir Hasan"
                        className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                    </div>
                  )}
                  <div>
                    <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("id")}</label>
                    <input value={externalId} onChange={e => setExternalId(e.target.value)} placeholder="e.g. 24524203098"
                      className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                  </div>
                  <div>
                    <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("pw")}</label>
                    <input value={password} onChange={e => setPassword(e.target.value)} type="password" placeholder={tx("yourpw")}
                      className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                    {mode === "login" && (
                      <button onClick={() => { setMode("forgot"); setError(null); setResetMsg(null); }}
                        className="text-xs mt-1.5" style={{ color: "var(--gold)" }}>
                        {tx("forgot")}
                      </button>
                    )}
                  </div>
                  {error && <p className="text-sm" style={{ color: "#DC2626" }}>{error}</p>}
                  {resetMsg && mode === "login" && <p className="text-sm" style={{ color: "var(--leaf)" }}>{resetMsg}</p>}
                  <button disabled={busy} onClick={submit} className="btn-primary w-full py-2.5 rounded-xl">
                    {busy ? tx("wait") : mode === "login" ? tx("login") : tx("createlogin")}
                  </button>
                </div>

                <button onClick={() => setShowAdvanced(s => !s)} className="text-xs mt-5 flex items-center gap-1 mx-auto" style={{ color: "var(--ink-soft)" }}>
                  <Icon path={I.plug} className="w-3.5 h-3.5" /> {tx("backend")} {apiBase}
                </button>
                {showAdvanced && (
                  <input value={apiBase} onChange={e => setApiBase(e.target.value)} placeholder="http://localhost:5000"
                    className="w-full mt-2 px-3 py-2 rounded-lg border text-sm font-mono" style={{ borderColor: "var(--line)" }} />
                )}
              </>
            )}
          </div>
        </div>
      </section>

      {/* Footer */}
      <footer id="contact" className="border-t pt-14 pb-8 px-6" style={{ borderColor: "var(--line)" }}>
        <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-10 pb-10 border-b" style={{ borderColor: "var(--line)" }}>
          <div>
            <h3 className="font-display gold-text text-xl font-800 mb-3">CampusDine</h3>
            <p className="text-xs leading-relaxed" style={{ color: "var(--ink-soft)" }}>
              {tx("foot.p")}
            </p>
          </div>
          <div>
            <h4 className="font-display text-sm uppercase mb-3" style={{ color: "var(--gold)" }}>{tx("foot.hours")}</h4>
            <p className="text-xs mb-1" style={{ color: "var(--ink-soft)" }}>{tx("foot.h1")}</p>
            <p className="text-xs" style={{ color: "var(--ink-soft)" }}>{tx("foot.h2")}</p>
          </div>
          <div>
            <h4 className="font-display text-sm uppercase mb-3" style={{ color: "var(--gold)" }}>{tx("foot.loc")}</h4>
            <p className="text-xs mb-1" style={{ color: "var(--ink-soft)" }}>{tx("foot.loc1")}</p>
            <p className="text-xs" style={{ color: "var(--ink-soft)" }}>{tx("foot.help")}</p>
          </div>
        </div>
        <p className="text-center text-[11px] uppercase pt-8" style={{ color: "var(--ink-soft)" }}>
          &copy; 2026 CampusDine — CSE 3208 Software Development Project I
        </p>
      </footer>
    </div>
  );
}

function TopBar({ role, name, tabs, active, setActive, onLogout, connected, onToggleLang }) {
  return (
    <div className="sticky top-0 z-20 backdrop-blur" style={{ background: "rgba(255,255,255,0.92)", borderBottom: "1px solid var(--line)" }}>
      <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4 flex-wrap">
        <div className="flex items-center gap-2">
          <div className="logo-badge w-8 h-8 rounded-full grid place-items-center">
            <Icon path={I.ticket} className="w-4 h-4" style={{ color: "var(--gold)" }} />
          </div>
          <span className="font-display gold-text font-700">CampusDine</span>
          <span className="w-2 h-2 rounded-full ml-1" title={connected ? tx("live.on") : tx("live.off")}
            style={{ background: connected ? "var(--leaf)" : "var(--line)" }}></span>
        </div>
        <div className="flex gap-1 flex-wrap">
          {tabs.map(t => (
            <button key={t.key} onClick={() => setActive(t.key)}

              <Icon path={t.icon} className="w-4 h-4" /> {t.label}

          ))}
        </div>
        <div className="flex items-center gap-3 relative">
          <div className="relative">
            <button onClick={onToggleNotifications} title="Notifications" className="relative w-10 h-10 rounded-lg grid place-items-center hover:bg-black/5 transition-colors">
              <Icon path={I.bell} className="w-5 h-5" style={{ color: "var(--gold)" }} />
              {notificationCount > 0 && (
                <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full text-[10px] font-700 grid place-items-center text-white" style={{ background: "var(--brick)" }}>
                  {notificationCount > 9 ? "9+" : notificationCount}
                </span>
              )}

            {notificationOpen && (
              <div className="absolute right-0 top-full mt-3 w-[min(92vw,360px)] rounded-2xl border shadow-2xl overflow-hidden" style={{ background: "#fff", borderColor: "var(--line)" }}>

                  <div className="flex items-center gap-2 text-[10px] uppercase tracking-wide">
                    {notificationCount > 0 && (
                      <button onClick={onMarkAllRead} className="px-2 py-1 rounded-full border" style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>
                        Mark all read
                      </button>

                    {notifications.length > 0 && (
                      <button onClick={onClearNotifications} className="px-2 py-1 rounded-full border" style={{ borderColor: "var(--line)", color: "var(--brick)" }}>
                        Clear
                      </button>
                    )}
                  </div>
                </div>
                {notifications.length === 0 ? (
                  <div className="p-4 text-sm" style={{ color: "var(--ink-soft)" }}>No notifications yet.</div>
                ) : (
                  <div className="max-h-80 overflow-y-auto">
                    {notifications.map(item => (
                      <div key={item.id} className="px-4 py-3 border-b last:border-b-0 transition-colors" style={{ borderColor: "var(--line)", background: item.read ? "transparent" : "rgba(245,179,0,0.05)" }}>
                        <div className="flex items-start gap-2">
                          <span className="mt-1.5 w-2 h-2 rounded-full shrink-0" style={{ background: item.kind === "announcement" ? "var(--leaf)" : "var(--gold)" }} />
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center justify-between gap-3">
                              <div className="text-[10px] uppercase tracking-wide font-700" style={{ color: item.kind === "announcement" ? "var(--teal-deep)" : "var(--gold)" }}>{item.title}</div>
                              {!item.read && <span className="w-2 h-2 rounded-full" style={{ background: "var(--brick)" }} />}
                            </div>
                            <div className="text-sm mt-1 leading-relaxed break-words" style={{ color: "var(--ink)" }}>{item.message}</div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
          <div className="text-right hidden sm:block">
            <div className="text-sm font-600 leading-tight">{name}</div>
            <div className="text-xs capitalize" style={{ color: "var(--ink-soft)" }}>{tx("r." + role)}</div>
          </div>
          {role !== "admin" && <LangToggle onToggle={onToggleLang} />}
          <button onClick={onLogout} title={tx("logout")} className="w-9 h-9 rounded-lg grid place-items-center hover:bg-white/5">
            <Icon path={I.logout} className="w-4.5 h-4.5" style={{ color: "var(--brick)" }} />
          </button>
        </div>
      </div>
    </div>
  );
}

function MenuOrder({ menu, cart, setCart, placeOrder, walletBalance, busy, onToggleFavorite, apiBase, sessionToken }) {
  const [cat, setCat] = useState("heavy");
  const [search, setSearch] = useState("");
  const [sortBy, setSortBy] = useState("default");
  const [favoritesOnly, setFavoritesOnly] = useState(false);
  const [diet, setDiet] = useState("all"); // "all" | "veg" | "nonveg"
  const filtered = menu
    .filter(i => i.category === cat)
    .filter(i => !favoritesOnly || i.is_favorite)
    .filter(i => diet === "all" || (diet === "veg" ? !!i.is_veg : !i.is_veg))
    .filter(i => {
      const q = search.trim().toLowerCase();
      if (!q) return true;
      return i.name.toLowerCase().includes(q) || (i.bn && i.bn.includes(search.trim()));
    })
    .sort((a, b) => {
      if (sortBy === "priceAsc") return a.price - b.price;
      if (sortBy === "priceDesc") return b.price - a.price;
      if (sortBy === "name") return a.name.localeCompare(b.name);
      return 0; // "default" — keep the server's category/name ordering
    });
  const starredItems = menu.filter(item => item.is_favorite);
  const [payMethod, setPayMethod] = useState("wallet");
  const [scheduleLater, setScheduleLater] = useState(false);
  const [pickupTime, setPickupTime] = useState("");
  const [couponCode, setCouponCode] = useState("");
  const [couponApplied, setCouponApplied] = useState(null);
  const [couponError, setCouponError] = useState("");
  const [couponBusy, setCouponBusy] = useState(false);
  useEffect(() => {
    setCouponApplied(null);
    setCouponError("");
  }, [cart]);

  // Feature: pre-order — a student can pick a slot up to 4h ahead (min 10min from now).
  // These bounds are hints for the native time input; the server enforces the real rule.
  const fmtHHMM = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const pickupNow = new Date();
  pickupNow.setSeconds(0, 0); // whole-minute precision — must match the server's rounding exactly
  const pickupMin = new Date(pickupNow.getTime() + 10 * 60000);
  const pickupMax = new Date(pickupNow.getTime() + 4 * 3600000);
  const pickupCrossesMidnight = pickupMin.getDate() !== pickupMax.getDate();

  const add = (item) => setCart(prev => {
    const existing = prev.find(p => p.id === item.id);
    if (existing) return prev.map(p => p.id === item.id ? { ...p, qty: p.qty + 1 } : p);
    return [...prev, { ...item, qty: 1 }];
  });
  const dec = (item) => setCart(prev => prev
    .map(p => p.id === item.id ? { ...p, qty: p.qty - 1 } : p)
    .filter(p => p.qty > 0));

  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const discountAmount = couponApplied ? Number(couponApplied.discountAmount || 0) : 0;
  const total = Math.max(0, subtotal - discountAmount);
  const canPay = payMethod === "cash" || walletBalance >= total;
  const canCheckout = canPay && (!scheduleLater || pickupTime);

  const applyCoupon = async () => {
    if (!couponCode.trim() || cart.length === 0) return;
    setCouponBusy(true);
    setCouponError("");
    try {
      const data = await api(apiBase, "/api/coupon/validate", {
        method: "POST",
        token: sessionToken,
        body: { couponCode: couponCode.trim(), orderAmount: subtotal, items: cart.map(i => ({ id: i.id, qty: i.qty })) }
      });
      setCouponApplied(data);
      setCouponCode(data.code || couponCode.trim().toUpperCase());
    } catch (e) {
      setCouponApplied(null);
      setCouponError(e.message || "Coupon is not valid");
    } finally {
      setCouponBusy(false);
    }
  };

  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2">
        <div className="flex gap-2 mb-5">
          {CATEGORIES.map(c => (
            <button key={c.id} onClick={() => setCat(c.id)}
              className={`tab-btn px-4 py-2 rounded-full text-sm ${cat === c.id ? "active" : ""}`}>
              {tx("cat." + c.id)}
            </button>
          ))}
        </div>
        <div className="flex flex-col sm:flex-row gap-2 mb-5">
          <input type="text" value={search} onChange={e => setSearch(e.target.value)}
            placeholder={tx("search.ph")}
            className="flex-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
          <select value={sortBy} onChange={e => setSortBy(e.target.value)}
            className="px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }}>
            <option value="default">{tx("sort.default")}</option>
            <option value="priceAsc">{tx("sort.priceAsc")}</option>
            <option value="priceDesc">{tx("sort.priceDesc")}</option>
            <option value="name">{tx("sort.name")}</option>
          </select>
          <label className="flex items-center gap-1.5 text-sm px-3 py-2 rounded-lg border cursor-pointer select-none whitespace-nowrap"
            style={{ borderColor: "var(--line)", color: favoritesOnly ? "var(--gold)" : "var(--ink-soft)" }}>
            <input type="checkbox" checked={favoritesOnly} onChange={e => setFavoritesOnly(e.target.checked)} />
            <Icon path={I.star} className="w-4 h-4" fill={favoritesOnly ? "currentColor" : "none"} />
            {tx("fav")}
          </label>
          <div className="flex rounded-lg border overflow-hidden text-sm" style={{ borderColor: "var(--line)" }}>
            {[["all", tx("diet.all")], ["veg", tx("diet.veg")], ["nonveg", tx("diet.nonveg")]].map(([key, label]) => (
              <button key={key} onClick={() => setDiet(key)} className="px-3 py-2 transition-colors whitespace-nowrap"
                style={{ background: diet === key ? "var(--gold)" : "transparent", color: diet === key ? "#fff" : "var(--ink-soft)" }}>
                {label}
              </button>
            ))}
          </div>
        </div>
        {filtered.length === 0 && (
          <p className="text-sm mb-4" style={{ color: "var(--ink-soft)" }}>{tx("empty")}</p>
        )}
        <div className="grid sm:grid-cols-2 gap-4">
          {filtered.map(item => {
            const out = item.stock <= 0;
            const inCart = cart.find(c => c.id === item.id);
            return (
              <div key={item.id} className={`card p-4 flex flex-col ${out ? "opacity-50" : ""}`}>
                <div className="flex items-start justify-between">
                  <div>
                    <div className="flex items-center gap-1.5">
                      <DietMark isVeg={!!item.is_veg} />
                      <span className="font-display font-700" style={{ color: "var(--gold)" }}>{itemName(item)}</span>
                    </div>
                    <div className="text-xs uppercase tracking-wide" style={{ color: "var(--ink-soft)" }}>{tx("cat." + item.category)}</div>
                  </div>
                  <div className="flex items-center gap-1.5">
                    {item.tag && !out && (
                      <span className="text-[10px] font-mono px-2 py-1 rounded-full" style={{ background: "var(--gold-soft)", color: "var(--teal-deep)" }}>
                        {lookup("tag", item.tag)}
                      </span>
                    )}
                    <button onClick={() => onToggleFavorite(item.id, item.is_favorite)}
                      title={item.is_favorite ? tx("fav.remove") : tx("fav.add")}
                      className="w-7 h-7 rounded-full grid place-items-center transition-colors hover:bg-black/5">
                      <Icon path={I.star} className="w-4 h-4" fill={item.is_favorite ? "currentColor" : "none"}
                        style={{ color: "var(--gold)" }} />
                    </button>
                  </div>
                </div>
                <div className="mt-3 flex items-center justify-between">
                  <span className="font-mono font-600 text-lg">{taka(item.price)}</span>
                  {out ? (
                    <span className="text-xs font-600" style={{ color: "var(--brick)" }}>{tx("outstock")}</span>
                  ) : inCart ? (
                    <div className="flex items-center gap-2">
                      <button onClick={() => dec(item)} className="w-7 h-7 rounded-full grid place-items-center border" style={{ borderColor: "var(--line)" }}><Icon path={I.minus} className="w-3.5 h-3.5" /></button>
                      <span className="font-mono w-5 text-center">{inCart.qty}</span>
                      <button onClick={() => add(item)} className="w-7 h-7 rounded-full grid place-items-center text-white" style={{ background: "var(--teal)" }}><Icon path={I.plus} className="w-3.5 h-3.5" /></button>
                    </div>
                  ) : (
                    <button onClick={() => add(item)} className="btn-primary px-3 py-1.5 rounded-lg text-sm">{tx("add")}</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div>
        <div className="card p-5 sticky top-20">
          <div className="font-display font-700 flex items-center gap-2 mb-4" style={{ color: "var(--gold)" }}>
            <Icon path={I.cart} className="w-5 h-5" /> {tx("cart.h")}
          </div>
          {cart.length === 0 ? (
            <p className="text-sm" style={{ color: "var(--ink-soft)" }}>{tx("cart.empty")}</p>
          ) : (
            <div className="space-y-2 mb-4">
              {cart.map(i => (
                <div key={i.id} className="flex justify-between text-sm">
                  <span>{itemName(i)} × {num(i.qty)}</span>
                  <span className="font-mono">{taka(i.price * i.qty)}</span>
                </div>
              ))}
            </div>
          )}
          <div className="border-t pt-3 mb-4" style={{ borderColor: "var(--line)" }}>
            <div className="flex justify-between font-700">
              <span>{tx("total")}</span>
              <span className="font-mono">{taka(total)}</span>
            </div>
          </div>
          {cart.length > 0 && (
            <>
              <div className="mb-4">
                <div className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--ink-soft)" }}>Coupon code</div>
                <div className="flex gap-2">
                  <input value={couponCode} onChange={e => { setCouponCode(e.target.value); setCouponApplied(null); if (couponError) setCouponError(""); }}
                    placeholder="e.g. CAMPUS10" className="flex-1 px-3 py-2 rounded-lg border text-sm uppercase" style={{ borderColor: "var(--line)" }} />
                  <button disabled={couponBusy || !couponCode.trim()} onClick={applyCoupon} className="btn-primary px-3 py-2 rounded-lg text-xs disabled:opacity-50">
                    {couponBusy ? "..." : "Apply"}
                  </button>
                </div>
                {couponError && <div className="text-xs mt-2" style={{ color: "var(--brick)" }}>{couponError}</div>}
                {couponApplied && <div className="text-xs mt-2" style={{ color: "var(--leaf)" }}>Discount applied: {couponApplied.discountType === "PERCENTAGE" ? `${couponApplied.discountValue}%` : `${taka(couponApplied.discountValue)}`} off</div>}
              </div>
              <div className="mb-4">
                <label className="flex items-center gap-2 text-sm mb-2">
                  <input type="checkbox" checked={scheduleLater} onChange={e => setScheduleLater(e.target.checked)} />
                  {tx("schedule")}
                </label>
                {scheduleLater && (
                  <>
                    <input type="time" value={pickupTime} onChange={e => setPickupTime(e.target.value)}
                      min={pickupCrossesMidnight ? undefined : fmtHHMM(pickupMin)}
                      max={pickupCrossesMidnight ? undefined : fmtHHMM(pickupMax)}
                      className="w-full px-3 py-2 rounded-lg border font-mono" style={{ borderColor: "var(--line)" }} />
                    <p className="text-xs mt-1" style={{ color: "var(--ink-soft)" }}>
                      {tx("pick.hint", { a: fmtHHMM(pickupMin), b: fmtHHMM(pickupMax) })}
                    </p>
                  </>
                )}
              </div>
              <div className="flex gap-2 mb-4 text-sm">
                <button onClick={() => setPayMethod("wallet")}
                  className={`flex-1 py-2 rounded-lg border ${payMethod === "wallet" ? "text-white" : ""}`}
                  style={payMethod === "wallet" ? { background: "var(--teal)", borderColor: "var(--teal)" } : { borderColor: "var(--line)" }}>
                  {tx("pay.wallet")}
                </button>
                <button onClick={() => setPayMethod("cash")}
                  className={`flex-1 py-2 rounded-lg border ${payMethod === "cash" ? "text-white" : ""}`}
                  style={payMethod === "cash" ? { background: "var(--teal)", borderColor: "var(--teal)" } : { borderColor: "var(--line)" }}>
                  {tx("pay.cash")}
                </button>
              </div>
              {payMethod === "wallet" && !canPay && (
                <p className="text-xs mb-3" style={{ color: "var(--brick)" }}>{tx("insufficient")}</p>
              )}
              <button disabled={!canCheckout || busy} onClick={() => placeOrder(cart, payMethod, scheduleLater ? pickupTime : null, couponApplied)}
                className="btn-primary w-full py-2.5 rounded-xl">
                {busy ? tx("placing") : tx("checkout")}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function TrackOrder({ orders, onSubmitFeedback, feedbackBusy, onCancel, cancelBusy }) {
  const [printOrder, setPrintOrder] = useState(null);

  // Feature: print receipt — render the chosen order into a hidden #print-area,
  // then trigger the browser print dialog; the CSS above hides everything else.
  useEffect(() => {
    if (!printOrder) return;
    const clear = () => setPrintOrder(null);
    window.addEventListener("afterprint", clear);
    const t = setTimeout(() => window.print(), 50);
    return () => { clearTimeout(t); window.removeEventListener("afterprint", clear); };
  }, [printOrder]);

  if (orders.length === 0) {
    return <div className="card p-10 text-center" style={{ color: "var(--ink-soft)" }}>{tx("noorders")}</div>;
  }
  return (
    <div className="space-y-6 max-w-2xl">
      {printOrder && (
        <div id="print-area">
          <div className="receipt">
            <div className="text-center mb-1">
              <div className="font-display font-800" style={{ fontSize: 18 }}>🍽 CampusDine</div>
              <div style={{ fontSize: 11, color: "#6B7280", letterSpacing: 1 }}>{tx("rc.title")}</div>
            </div>
            <div className="receipt-divider" />
            <div className="text-center" style={{ marginBottom: 10 }}>
              <div style={{ fontSize: 10, color: "#6B7280" }}>{tx("rc.token")}</div>
              <div className="font-mono font-800" style={{ fontSize: 30, letterSpacing: 2 }}>{printOrder.token}</div>
            </div>
            <div className="receipt-row"><span>{tx("rc.status")}</span><span style={{ fontWeight: 600 }}>{lookup("status", printOrder.status)}</span></div>
            <div className="receipt-row"><span>{tx("rc.payment")}</span><span>{printOrder.payment_method === "wallet" ? tx("pay.wallet") : tx("pay.cash")}</span></div>
            {printOrder.pickup_time && (
              <div className="receipt-row"><span>{tx("sched")}</span><span>{new Date(printOrder.pickup_time).toLocaleString()}</span></div>
            )}
            <div className="receipt-row"><span>{tx("rc.printed")}</span><span>{new Date().toLocaleString()}</span></div>
            <div className="receipt-divider" />
            {printOrder.items.map((i, idx) => (
              <div key={idx} className="receipt-row"><span>{dispName(i.name)} ×{num(i.qty)}</span><span>{taka(i.price * i.qty)}</span></div>
            ))}
            <div className="receipt-divider" />
            <div className="receipt-row" style={{ fontSize: 15, fontWeight: 800 }}><span>{tx("total")}</span><span>{taka(printOrder.total)}</span></div>
            <div className="text-center" style={{ marginTop: 16, fontSize: 11, color: "#6B7280" }}>
              {tx("rc.thanks")}
            </div>
          </div>
        </div>
      )}
      {orders.map(o => {
        const stepIndex = STATUSES.indexOf(o.status);
        const isCancelled = o.status === "Cancelled";
        return (
          <div key={o.token} className="card overflow-hidden">
            <div className="ticket p-5 flex items-center justify-between">
              <div className="perf pl-4">
                <div className="text-xs opacity-70">{tx("ticket.token")}</div>
                <div className="font-mono text-2xl font-700 tracking-wide">{o.token}</div>
              </div>
              <div className="text-right">
                <div className="text-xs opacity-70">{tx("total")}</div>
                <div className="font-mono text-lg">{taka(o.total)}</div>
              </div>
            </div>
            <div className="p-5">
              {o.pickup_time && (
                <div className="text-xs mb-3 font-600" style={{ color: "var(--teal)" }}>
                  {tx("sched")}: {new Date(o.pickup_time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
                </div>
              )}
              {o.queue && (
                <div className="flex items-center gap-3 mb-4 px-3 py-2.5 rounded-lg text-sm"
                  style={{ background: "var(--gold-soft)", color: "var(--teal-deep)" }}>
                  <Icon path={I.clock} className="w-4 h-4 shrink-0" />
                  <div className="flex flex-wrap items-baseline gap-x-2">
                    <span className="font-700">
                      {o.queue.ahead === 0
                        ? (o.status === "Cooking" ? tx("q.now") : tx("q.next"))
                        : tx(o.queue.ahead === 1 ? "q.ahead1" : "q.aheadN", { p: num(o.queue.position), a: num(o.queue.ahead) })}
                    </span>
                    <span style={{ color: "var(--ink-soft)" }}>{tx("q.est", { m: num(o.queue.est_minutes) })}</span>
                  </div>
                </div>
              )}
              {isCancelled ? (
                <div className="flex items-center gap-2 text-sm font-600" style={{ color: "var(--brick)" }}>
                  <Icon path={I.x} className="w-4 h-4" />
                  {lookup("status", "Cancelled")}
                  {o.payment_method === "wallet" && (
                    <span className="text-xs font-400" style={{ color: "var(--ink-soft)" }}>{tx("refunded")}</span>
                  )}
                </div>
              ) : (
                <div className="flex items-center justify-between mb-2">
                  {STATUSES.map((s, i) => (
                    <React.Fragment key={s}>
                      <div className="flex flex-col items-center gap-1.5 flex-1">
                        <div className={`stepper-dot ${i < stepIndex ? "done" : i === stepIndex ? "current" : ""}`}></div>
                        <span className="text-xs text-center" style={{ color: i <= stepIndex ? "var(--gold)" : "var(--ink-soft)", fontWeight: i === stepIndex ? 700 : 400 }}>{lookup("status", s)}</span>
                      </div>
                      {i < STATUSES.length - 1 && <div className="h-0.5 flex-1 -mt-5" style={{ background: i < stepIndex ? "var(--gold)" : "var(--line)" }} />}
                    </React.Fragment>
                  ))}
                </div>
              )}
              <div className="text-sm mt-4" style={{ color: "var(--ink-soft)" }}>
                {o.items.map(i => `${dispName(i.name)} ×${num(i.qty)}`).join(", ")}
              </div>
              <div className="flex items-center gap-2 mt-3">
                <button onClick={() => setPrintOrder(o)}
                  className="text-xs px-3 py-1.5 rounded-lg border font-600 flex items-center gap-1.5 transition-colors hover:bg-black/5"
                  style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>
                  <Icon path={I.printer} className="w-3.5 h-3.5" style={{ color: "var(--gold)" }} />
                  {tx("print")}
                </button>
                {o.status === "Received" && (
                  <button disabled={cancelBusy} onClick={() => onCancel(o.id)}
                    className="text-xs px-3 py-1.5 rounded-lg border font-600"
                    style={{ borderColor: "var(--brick)", color: "var(--brick)" }}>
                    {tx("cancelorder")}
                  </button>
                )}
              </div>
              {o.status === "Ready" && (
                <OrderFeedback order={o} onSubmit={onSubmitFeedback} busy={feedbackBusy} />
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------- Meal calendar tab ---------------- */
function MealCalendar({ role, year, month, calendar, bill, onToggle, onPrevMonth, onNextMonth, onJumpToday, isCurrentMonth }) {
  const total = daysInMonth(year, month);
  const monthName = new Date(year, month - 1).toLocaleString(CURRENT_LANG === "bn" ? "bn-BD" : "default", { month: "long" });
  const firstWeekday = new Date(year, month - 1, 1).getDay();
  const now = new Date();
  const todayDay = now.getDate();
  const isThisMonthShown = now.getFullYear() === year && (now.getMonth() + 1) === month;

  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2 card p-5">
        <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
          <div className="flex items-center gap-2">
            <button onClick={onPrevMonth} aria-label={tx("prevm")}
                    className="w-8 h-8 rounded-lg border flex items-center justify-center transition-colors"
                    style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
              <Icon path={I.chevronLeft} className="w-4 h-4" />
            </button>
            <div className="font-display font-700 text-lg min-w-[150px] text-center" style={{ color: "var(--gold)" }}>{monthName} {num(year)}</div>
            <button onClick={onNextMonth} aria-label={tx("nextm")}
                    className="w-8 h-8 rounded-lg border flex items-center justify-center transition-colors"
                    style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
              <Icon path={I.chevronRight} className="w-4 h-4" />
            </button>
            {!isCurrentMonth && (
              <button onClick={onJumpToday} className="text-[11px] font-600 rounded-lg px-2 py-1 ml-1 border transition-colors"
                      style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
                {tx("today")}
              </button>
            )}
          </div>
          <div className="text-xs" style={{ color: "var(--ink-soft)" }}>{tx("cal.hint")}</div>
        </div>
        <div className="grid grid-cols-7 gap-2 mb-2 text-xs text-center font-600" style={{ color: "var(--ink-soft)" }}>
          {tx("wd").split(",").map((d, i) => <div key={i}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-2">
          {Array.from({ length: firstWeekday }).map((_, i) => <div key={"e" + i}></div>)}
          {Array.from({ length: total }).map((_, i) => {
            const day = i + 1;
            const status = calendar[day] || "off";
            const isToday = isThisMonthShown && day === todayDay;
            return (
              <div key={day} onClick={() => onToggle(day, status)}
                className={`cal-cell text-sm font-600 ${status === "full" ? "cal-full" : status === "half" ? "cal-half" : ""} ${isToday ? "cal-today" : ""}`}>
                {num(day)}
              </div>
            );
          })}
        </div>
        <div className="flex gap-4 mt-4 text-xs" style={{ color: "var(--ink-soft)" }}>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded" style={{ background: "var(--teal)" }}></span> {tx("cal.full")}</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded" style={{ background: "var(--gold)" }}></span> {tx("cal.half")}</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border" style={{ borderColor: "var(--line)" }}></span> {tx("cal.off")}</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border" style={{ borderColor: "var(--gold-bright)", boxShadow: "0 0 0 2px var(--gold-bright)" }}></span> {tx("today")}</span>
        </div>
      </div>

      <div className="card p-5 h-fit">
        <div className="font-display font-700 mb-4" style={{ color: "var(--gold)" }}>{tx("cal.bill")}</div>
        <div className="space-y-2 text-sm mb-4">
          <div className="flex justify-between"><span>{tx("cal.fulldays", { r: taka(bill.fullRate) })}</span><span className="font-mono">{num(bill.fullDays)}</span></div>
          <div className="flex justify-between"><span>{tx("cal.halfdays", { r: taka(bill.halfRate) })}</span><span className="font-mono">{num(bill.halfDays)}</span></div>
        </div>
        <div className="border-t pt-3" style={{ borderColor: "var(--line)" }}>
          <div className="flex justify-between font-700 text-lg">
            <span>{tx("total")}</span><span className="font-mono">{taka(bill.total)}</span>
          </div>
        </div>
        <p className="text-xs mt-3" style={{ color: "var(--ink-soft)" }}>{tx("cal.note", { who: tx(role === "teacher" ? "who.teacher" : "who.student") })}</p>

const PAY_CATEGORIES = [
  {
    key: "mobile", label: "Mobile Banking", color: "#E2136E",
    options: [
      { key: "bkash", label: "bKash", color: "#E2136E" },
      { key: "nagad", label: "Nagad", color: "#F6921E" },
    ],
  },
  {
    key: "banking", label: "Banking", color: "#4C9A6A",
    options: [
      { key: "dbbl", label: "Dutch-Bangla Bank", color: "#0033A0" },
      { key: "brac", label: "BRAC Bank", color: "#4C9A6A" },
      { key: "city", label: "City Bank", color: "#9A6F0D" },
      { key: "islami", label: "Islami Bank Bangladesh", color: "#2E6FDB" },
      { key: "sonali", label: "Sonali Bank", color: "#C0392B" },
    ],
  },
  { key: "card", label: "Card", color: "#2E6FDB", options: null },
];

function PaymentModal({ amount, onClose, onConfirm, busy }) {
  const [step, setStep] = useState("category"); // category -> method -> confirm -> processing
  const [category, setCategory] = useState(null);
  const [choice, setChoice] = useState(null); // { key, label }
  const [err, setErr] = useState(null);

  const pickCategory = (cat) => {
    setCategory(cat);
    if (cat.options) {
      setStep("method");
    } else {
      setChoice({ key: cat.key, label: tx("pc." + cat.key) });
      setStep("confirm");
    }
  };

  const pickMethod = (opt) => {
    setChoice(opt);
    setStep("confirm");
  };

  const confirmPay = async () => {
    setErr(null);
    setStep("processing");
    try {
      await onConfirm(choice.key);
      setStep("success");
    } catch (e) {
      setErr(e.message || tx("pay.failed"));
      setStep("confirm");
    }
  };

  const goBack = () => {
    if (step === "method") { setStep("category"); setCategory(null); }
    else if (step === "confirm") { setStep(category?.options ? "method" : "category"); setChoice(null); }
  };

  const title = step === "category" ? tx("pay.t1")
    : step === "method" ? tx("pc." + category.key)
    : step === "confirm" ? tx("pay.t2")
    : step === "success" ? tx("pay.t3")
    : tx("pay.t4");

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(17,24,39,0.5)" }}>
      <div className="card w-full max-w-sm p-5 relative">
        {step !== "processing" && (
          <button onClick={onClose} className="absolute top-3 right-3 text-sm opacity-60 hover:opacity-100">✕</button>
        )}
        <div className="font-display font-700 mb-1" style={{ color: "var(--gold)" }}>{title}</div>
        <div className="text-xs mb-4" style={{ color: "var(--ink-soft)" }}>{tx("amount")} <span className="font-mono">{taka(amount)}</span></div>

        {step === "category" && (
          <div className="space-y-2">
            {PAY_CATEGORIES.map(c => (
              <button key={c.key} onClick={() => pickCategory(c)}
                className="w-full flex items-center justify-between px-4 py-3 rounded-lg border text-sm font-500"
                style={{ borderColor: "var(--line)" }}>
                <span className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full" style={{ background: c.color }} />
                  {tx("pc." + c.key)}
                </span>
                <span style={{ color: "var(--ink-soft)" }}>›</span>
              </button>
            ))}
          </div>
        )}

        {step === "method" && (
          <div className="space-y-2">
            {category.options.map(o => (
              <button key={o.key} onClick={() => pickMethod(o)}
                className="w-full flex items-center justify-between px-4 py-3 rounded-lg border text-sm font-500"
                style={{ borderColor: "var(--line)" }}>
                <span className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full" style={{ background: o.color }} />
                  {o.label}
                </span>
                <span style={{ color: "var(--ink-soft)" }}>›</span>
              </button>
            ))}
            <button onClick={goBack} className="w-full py-2 rounded-lg border text-sm mt-1" style={{ borderColor: "var(--line)" }}>{tx("back")}</button>
          </div>
        )}

        {step === "confirm" && (
          <div>
            <p className="text-sm mb-4">
              {CURRENT_LANG === "bn"
                ? <><span className="font-600">{choice.label}</span> দিয়ে <span className="font-mono font-600">{taka(amount)}</span> টপ-আপ করবেন?</>
                : <>Top up <span className="font-mono font-600">{taka(amount)}</span> via <span className="font-600">{choice.label}</span>?</>}
            </p>
            {err && <p className="text-xs mb-3" style={{ color: "var(--brick)" }}>{err}</p>}
            <div className="flex gap-2">
              <button onClick={goBack} className="flex-1 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }}>{tx("no")}</button>
              <button disabled={busy} onClick={confirmPay} className="flex-1 btn-primary py-2 rounded-lg text-sm">{tx("yes")}</button>
            </div>
          </div>
        )}

        {step === "processing" && (
          <div className="py-6 text-center text-sm" style={{ color: "var(--ink-soft)" }}>
            {tx("confirming", { m: choice?.label })}
          </div>
        )}

        {step === "success" && (
          <div className="py-4 text-center">
            <div className="mx-auto mb-3 w-12 h-12 rounded-full flex items-center justify-center text-2xl"
              style={{ background: "var(--leaf)", color: "#fff" }}>✓</div>
            <p className="text-sm mb-1">
              <span className="font-mono font-600">{taka(amount)}</span> {tx("pay.added")}
            </p>
            <p className="text-xs mb-4" style={{ color: "var(--ink-soft)" }}>{tx("paidvia", { m: choice?.label })}</p>
            <button onClick={onClose} className="btn-primary w-full py-2 rounded-lg text-sm">{tx("done")}</button>
          </div>
        )}
      </div>
    </div>
  );
}

                  {t.amount > 0 ? "+" : ""}{taka(t.amount)}

/* ---------------- Admin: Orders queue ---------------- */
function AdminOrders({ orders, advance }) {
  if (orders.length === 0) {
    return <div className="card p-10 text-center" style={{ color: "var(--ink-soft)" }}>Queue is empty.</div>;
  }
  // Feature: pre-order — ASAP orders (no pickup_time) need attention first,
  // then scheduled ones soonest-first, so the kitchen sees what's coming up next.
  const sorted = [...orders].sort((a, b) => {
    if (!a.pickup_time && !b.pickup_time) return b.id - a.id;
    if (!a.pickup_time) return -1;
    if (!b.pickup_time) return 1;
    return new Date(a.pickup_time) - new Date(b.pickup_time);
  });
  return (
    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
      {sorted.map(o => (
        <div key={o.token} className="card p-4">
          <div className="flex justify-between items-start mb-2">
            <span className="font-mono font-700 text-lg" style={{ color: "var(--gold)" }}>{o.token}</span>
            <span className="text-xs px-2 py-1 rounded-full font-600" style={{
              background: o.status === "Ready" ? "var(--leaf)" : o.status === "Cooking" ? "var(--gold)" : o.status === "Cancelled" ? "var(--brick)" : "var(--line)",
              color: o.status === "Received" ? "var(--ink)" : "#fff"
            }}>{o.status}</span>
          </div>
          {o.pickup_time && (
            <div className="text-xs mb-2 font-600" style={{ color: "var(--teal)" }}>
              Pickup: {new Date(o.pickup_time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
            </div>
          )}
          <div className="text-sm mb-3" style={{ color: "var(--ink-soft)" }}>
            {o.items.map(i => `${i.name} ×${i.qty}`).join(", ")}
          </div>
          <div className="flex justify-between items-center">
            <span className="font-mono text-sm">{taka(o.total)}</span>
            {o.status === "Cancelled" ? (
              <span className="text-xs flex items-center gap-1" style={{ color: "var(--brick)" }}><Icon path={I.x} className="w-4 h-4" /> Cancelled</span>
            ) : o.status !== "Ready" ? (
              <button onClick={() => advance(o.id)} className="btn-primary px-3 py-1.5 rounded-lg text-xs flex items-center gap-1">
                Advance <Icon path={I.arrow} className="w-3.5 h-3.5" />
              </button>
            ) : (
              <span className="text-xs flex items-center gap-1" style={{ color: "var(--leaf)" }}><Icon path={I.check} className="w-4 h-4" /> Done</span>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

function CouponEditor({ coupon, onSave }) {
  const toDateTimeInput = (value) => {
    if (!value) return "";
    const date = new Date(String(value).replace(" ", "T"));
    if (Number.isNaN(date.getTime())) return "";
    const pad = (number) => String(number).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  };
  const makeDraft = (item) => ({
    code: item.code || "",
    discountType: item.discount_type || "PERCENTAGE",
    discountValue: String(item.discount_value ?? ""),
    minOrderAmount: String(item.min_order_amount ?? 0),
    maxDiscount: item.max_discount == null ? "" : String(item.max_discount),
    usageLimit: item.usage_limit == null ? "" : String(item.usage_limit),
    expiryDate: toDateTimeInput(item.expiry_date),
    isActive: Boolean(Number(item.is_active)),
  });
  const [editing, setEditing] = useState(false);
  const [saving, setSaving] = useState(false);
  const [draft, setDraft] = useState(() => makeDraft(coupon));
  useEffect(() => setDraft(makeDraft(coupon)), [coupon]);

  const change = (field, value) => setDraft((current) => ({ ...current, [field]: value }));
  const save = async (event) => {
    event.preventDefault();
    setSaving(true);
    const saved = await onSave(coupon.id, {
      ...draft,
      discountValue: Number(draft.discountValue),
      minOrderAmount: Number(draft.minOrderAmount),
      maxDiscount: draft.maxDiscount === "" ? null : Number(draft.maxDiscount),
      usageLimit: draft.usageLimit === "" ? null : Number(draft.usageLimit),
      expiryDate: draft.expiryDate || null,
    });
    if (saved) setEditing(false);
    setSaving(false);
  };

  return (
    <div className="card p-4">
      <div className="flex items-start justify-between gap-3 flex-wrap">
        <div>
          <div className="font-display font-700 text-lg" style={{ color: "var(--gold)" }}>{coupon.code}</div>
          <div className="text-xs mt-1" style={{ color: "var(--ink-soft)" }}>
            {coupon.used_count || 0}{coupon.usage_limit ? ` / ${coupon.usage_limit}` : " used"} · {coupon.is_active ? "Active" : "Inactive"}
          </div>
        </div>
        {!editing && <button onClick={() => setEditing(true)} className="btn-primary px-3 py-2 rounded-lg text-sm">Edit coupon</button>}
      </div>
      {editing && (
        <form onSubmit={save} className="mt-4">
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>
              Coupon code
              <input required maxLength={50} value={draft.code} onChange={e => change("code", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-lg border text-sm uppercase" style={{ borderColor: "var(--line)" }} />
            </label>
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>
              Discount type
              <select value={draft.discountType} onChange={e => change("discountType", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }}>
                <option value="PERCENTAGE">Percentage</option>
                <option value="FIXED">Fixed amount</option>
              </select>
            </label>
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>
              Discount value {draft.discountType === "PERCENTAGE" ? "(%)" : "(৳)"}
              <input required type="number" min="0.01" max={draft.discountType === "PERCENTAGE" ? 100 : undefined} step="0.01"
                value={draft.discountValue} onChange={e => change("discountValue", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
            </label>
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>
              Minimum order (৳)
              <input type="number" min="0" step="0.01" value={draft.minOrderAmount}
                onChange={e => change("minOrderAmount", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
            </label>
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>
              Maximum discount (৳, optional)
              <input type="number" min="0.01" step="0.01" value={draft.maxDiscount}
                onChange={e => change("maxDiscount", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
            </label>
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>
              Usage limit (optional)
              <input type="number" min="1" step="1" value={draft.usageLimit}
                onChange={e => change("usageLimit", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
            </label>
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>
              Expires at (optional)
              <input type="datetime-local" value={draft.expiryDate} onChange={e => change("expiryDate", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
            </label>
            <label className="flex items-center gap-2 text-sm self-end pb-2">
              <input type="checkbox" checked={draft.isActive} onChange={e => change("isActive", e.target.checked)} />
              Coupon active
            </label>
          </div>
          <div className="flex justify-end gap-2 mt-4">
            <button type="button" onClick={() => { setDraft(makeDraft(coupon)); setEditing(false); }}
              className="px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }}>Cancel</button>
            <button type="submit" disabled={saving} className="btn-primary px-3 py-2 rounded-lg text-sm disabled:opacity-50">
              {saving ? "Saving…" : "Save changes"}
            </button>
          </div>
        </form>
      )}
    </div>
  );
}
