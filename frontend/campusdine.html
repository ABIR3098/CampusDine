  const shownHappy = offers.happyHours.filter(h => h.itemIds.length === 0 || h.itemIds.some(id => menuIdSet.has(id)));
  const bnOr = (o) => (CURRENT_LANG === "bn" && o.name_bn ? o.name_bn : o.name);
  const hhScope = (h) => h.itemIds.length ? "" : h.category ? tx("cat." + h.category) : "";
  const useCoupon = (c) => { setCouponCode(c.code); if (cart.length > 0) setCouponActive(c.code); };
  const slides = [];
  shownHappy.slice().sort((a, b) => Number(b.activeNow) - Number(a.activeNow)).forEach(h => slides.push({
    key: "h" + h.id, tone: "warm", tag: h.activeNow ? "● " + tx("offers.hh.now") : tx("offers.hh.at"),
    title: `${bnOr(h)} — ${h.discount_type === "PERCENTAGE" ? num(Number(h.discount_value)) + "% " : taka(h.discount_value) + " "}${tx("hero.off")}`,
    text: `${String(h.start_time).slice(0, 5)}–${String(h.end_time).slice(0, 5)} ${hhScope(h)}`.trim(),
  }));
  shownCombos.forEach(c => slides.push({
    key: "c" + c.id, tone: "rose", tag: tx("hero.combo"), title: `${bnOr(c)} — ${taka(c.price)}`,
    text: `${c.items.map(i => dispName(i.name) + (i.qty > 1 ? " ×" + num(i.qty) : "")).join(" + ")} · ${tx("offers.combo.save", { a: taka(c.saving) })}`,
    cta: comboAvailable(c) ? tx("offers.combo.add") : null, onCta: () => addCombo(c),
    img: (apiBase || "") + (c.items[0].image || "/images/food/default.svg"),
  }));
  availCoupons.slice(0, 4).forEach(c => slides.push({
    key: "k" + c.id, tone: "blue", tag: tx("hero.coupon"),
    title: `${c.code} — ${c.discount_type === "PERCENTAGE" ? num(Number(c.discount_value)) + "%" : taka(c.discount_value)} ${tx("hero.off")}`,
    text: [c.description, Number(c.min_order_amount) > 0 ? tx("hero.min", { a: taka(c.min_order_amount) }) : "", c.expiry_date ? tx("hero.till", { d: new Date(c.expiry_date).toLocaleDateString() }) : ""].filter(Boolean).join(" · "),
    cta: tx("hero.usecode"), onCta: () => useCoupon(c),
  }));
  const newItems = menu.filter(m => m.tag === "New" && m.stock > 0 && m.availability !== "sold_out" && m.availability !== "hidden");
  newItems.slice(0, 4).forEach(m => slides.push({
    key: "n" + m.id, tone: "green", tag: tx("hero.new"), title: `${itemName(m)} — ${taka(m.price)}`,
    text: tx("cat." + m.category), cta: tx("add"), onCta: () => add(m), img: (apiBase || "") + (m.image || "/images/food/default.svg"),
  }));
  if (loyalty) slides.push({
    key: "pts", tone: "violet", tag: tx("nav.rewards"),
    title: tx("q.balance", { p: num(loyalty.points) }),
    text: tx("rw.bonus", { n: num(loyalty.streak.daysToBonus), b: num(loyalty.streak.bonus) }),
  });
  useEffect(() => { if (payMethod !== "wallet" || cart.length === 0) setTip(0); }, [payMethod, cart.length]);
  const canPay = payMethod === "cash" || walletBalance >= total + tip;
  const canCheckout = canPay && (!scheduleLater || pickupTime);

  const applyCoupon = () => {
    if (!couponCode.trim() || cart.length === 0) return;
    setCouponBusy(true);
    setCouponActive(couponCode.trim().toUpperCase());
    setTimeout(() => setCouponBusy(false), 400);
  };

  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2">
        {userName && (() => {
          const h = new Date().getHours();
          const g = greetingFor(h);
          return (
            <div className="mb-4">
              <div className="font-display font-800 text-xl" style={{ color: "var(--ink)" }}>{g.icon} {tx("greet." + g.key)}, {String(userName).split(" ")[0]}!</div>
              <div className="text-sm" style={{ color: "var(--ink-soft)" }}>{tx("meal." + mealSlot(h).meal)}</div>
            </div>
          );
        })()}
        {recurringDue.map(p => (
          <div key={"due-" + p.id} className="mb-4 rounded-2xl border p-4 flex flex-wrap items-center gap-3" style={{ borderColor: "var(--gold)", background: "var(--panel-soft)" }}>
            <div className="flex-1 min-w-[200px]">
              <div className="font-display font-700" style={{ color: "var(--gold)" }}>⏰ {tx("rec.due")}</div>
              <div className="text-sm">{p.items.map(i => dispName(i.name) + (i.qty > 1 ? " ×" + num(i.qty) : "")).join(" + ")}</div>
            </div>
            <button type="button" onClick={() => onDueAdd(p)} className="btn-primary text-xs px-3 py-1.5 rounded-lg">{tx("rec.add")}</button>
            <button type="button" onClick={() => onDueSkip(p)} className="text-xs px-3 py-1.5 rounded-lg border" style={{ borderColor: "var(--line)" }}>{tx("rec.skip")}</button>
          </div>
        ))}
        <PromoSlider slides={slides} />
        <MenuCategoryTabs category={cat} setCategory={setCat} />
        <div className="flex flex-col sm:flex-row gap-2 mb-5">
          <MenuSearchSortControls search={search} setSearch={setSearch} sortBy={sortBy} setSortBy={setSortBy} />
          <FavoritesFilterToggle favoritesOnly={favoritesOnly} onChange={e => setFavoritesOnly(e.target.checked)} />
          <MenuDietFilter diet={diet} setDiet={setDiet} />
        </div>
        <UsualPanel pastOrders={pastOrders} menu={menu} cart={cart} add={add} />
        <FavoritesQuickOrderPanel items={starredItems} cart={cart} add={add}
          onToggleFavorite={onToggleFavorite} setFavoritesOnly={setFavoritesOnly} />
        {filtered.length === 0 && (
          <p className="text-sm mb-4" style={{ color: "var(--ink-soft)" }}>{tx("empty")}</p>
        )}
        <div className="grid sm:grid-cols-2 gap-4">
          {filtered.map(item => {
            const out = item.stock <= 0 || item.availability === "sold_out";
            const inCart = cart.find(c => c.id === item.id);
            return (
              <div key={item.id} className={`card p-4 flex flex-col ${out ? "opacity-50" : ""}`}>
                <div className="overflow-hidden mb-3" style={{ position: "relative", margin: "-1rem -1rem 0.75rem", height: 150, borderRadius: "inherit", borderBottomLeftRadius: 0, borderBottomRightRadius: 0, background: "var(--gold-soft)" }}>
                  {(out || (Number(item.stock) > 0 && Number(item.stock) <= STUDENT_LOW_STOCK)) && (
                    <span className="absolute top-2 left-2 text-[11px] font-700 px-2.5 py-1 rounded-full"
                      style={{ background: out ? "#B91C1C" : "#F59E0B", color: "#FFFFFF", zIndex: 1 }}>
                      {out ? tx("soldout") : tx("onlyleft", { n: num(item.stock) })}
                    </span>
                  )}
                  <img src={(apiBase || "") + (item.image || "/images/food/default.svg")} alt={item.name} loading="lazy"
                    onError={(e) => { if (!e.target.dataset.fb) { e.target.dataset.fb = "1"; e.target.src = (apiBase || "") + "/images/food/default.svg"; } }}
                    className="w-full h-full object-cover" />
                </div>
                <div className="flex items-start justify-between">
                  <div>
                    <div className="flex items-center gap-1.5">
                      <DietMark isVeg={!!item.is_veg} />
                      <span className="font-display font-700" style={{ color: "var(--ink)" }}>{itemName(item)}</span>
                    </div>
                    <div className="text-xs uppercase tracking-wide" style={{ color: "var(--ink-soft)" }}>{tx("cat." + item.category)}</div>
                  </div>
                  <div className="flex items-center gap-1.5">
                    {item.tag && !out && (
                      <span className="text-[10px] font-mono px-2 py-1 rounded-full" style={{ background: "var(--gold-soft)", color: "var(--teal-deep)" }}>
                        {lookup("tag", item.tag)}
                      </span>
                    )}
                    <FavoriteStarButton item={item} onToggleFavorite={onToggleFavorite} />
                  </div>
                </div>
                <NutritionInfo item={item} />
                <div className="mt-3 flex items-center justify-between">
                  <span className="font-mono font-600 text-lg">{taka(item.price)}</span>
                  {out ? (
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-600" style={{ color: "var(--brick)" }}>{item.availability === "sold_out" ? tx("soldout") : tx("outstock")}</span>
                      {onToggleNotify && (
                        <button type="button" onClick={() => onToggleNotify(item.id)}
                          className="text-xs px-2.5 py-1 rounded-lg border font-600"
                          style={{ borderColor: "var(--line)", color: watching.includes(item.id) ? "var(--leaf)" : "var(--gold)" }}>
                          🔔 {watching.includes(item.id) ? tx("notify.on") : tx("notify.me")}
                        </button>
                      )}
                    </div>
                  ) : inCart ? (
                    <div className="flex items-center gap-2">
                      <button onClick={() => dec(item)} className="w-7 h-7 rounded-full grid place-items-center border" style={{ borderColor: "var(--line)" }}><Icon path={I.minus} className="w-3.5 h-3.5" /></button>
                      <span className="font-mono w-5 text-center">{inCart.qty}</span>
                      <button onClick={() => add(item)} className="w-7 h-7 rounded-full grid place-items-center text-white" style={{ background: "var(--teal)" }}><Icon path={I.plus} className="w-3.5 h-3.5" /></button>
                    </div>
                  ) : (
                    <button onClick={() => add(item)} className="btn-primary px-3 py-1.5 rounded-lg text-sm">{tx("add")}</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div>
        <div className="card p-5 sticky top-20">
          <div className="font-display font-700 flex items-center gap-2 mb-4" style={{ color: "var(--gold)" }}>
            <Icon path={I.cart} className="w-5 h-5" /> {tx("cart.h")}
          </div>
          {cart.length === 0 ? (
            <p className="text-sm" style={{ color: "var(--ink-soft)" }}>{tx("cart.empty")}</p>
          ) : (
            <div className="space-y-2 mb-4">
              {cart.map(i => {
                const lq = lineQuote(i.id);
                const off = lq ? lq.comboDiscount + lq.hhDiscount : 0;
                return (
                  <div key={i.id} className="flex justify-between text-sm">
                    <span>{itemName(i)} × {num(i.qty)}</span>
                    <span className="font-mono">
                      {off > 0 && <s className="mr-1.5" style={{ color: "var(--ink-soft)" }}>{taka(i.price * i.qty)}</s>}
                      {taka(lq ? lq.net : i.price * i.qty)}
                    </span>
                  </div>
                );
              })}
            </div>
          )}
          <div className="border-t pt-3 mb-4" style={{ borderColor: "var(--line)" }}>
            <div className="flex justify-between text-sm">
              <span>{tx("subtotal")}</span>
              <span className="font-mono">{taka(subtotal)}</span>
            </div>
            {quote && quote.appliedCombos.map(c => (
              <div key={"qc" + c.id} className="flex justify-between text-sm mt-2" style={{ color: "var(--leaf)" }}>
                <span>{tx("q.combo", { n: (CURRENT_LANG === "bn" && c.name_bn ? c.name_bn : c.name) + (c.sets > 1 ? " ×" + num(c.sets) : "") })}</span>
                <span className="font-mono">−{taka(c.discount)}</span>
              </div>
            ))}
            {quote && quote.appliedHappyHours.map(h => (
              <div key={"qh" + h.id} className="flex justify-between text-sm mt-2" style={{ color: "var(--leaf)" }}>
                <span>{tx("q.hh", { n: CURRENT_LANG === "bn" && h.name_bn ? h.name_bn : h.name })}</span>
                <span className="font-mono">−{taka(h.discount)}</span>
              </div>
            ))}
            {couponApplied && (
              <div className="flex justify-between text-sm mt-2" style={{ color: "var(--leaf)" }}>
                <span>{tx("coupon.line", { c: couponApplied.code })}</span>
                <span className="font-mono">−{taka(couponApplied.discountAmount)}</span>
              </div>
            )}
            {quote && quote.reward && (
              <div className="flex justify-between text-sm mt-2" style={{ color: "var(--leaf)" }}>
                <span>{tx("q.reward", { n: CURRENT_LANG === "bn" && quote.reward.name_bn ? quote.reward.name_bn : quote.reward.name })}</span>
                <span className="font-mono">−{taka(quote.rewardDiscount)}</span>
              </div>
            )}
            <div className="flex justify-between font-700 mt-3">
              <span>{tx("total")}</span>
              <span className="font-mono">{taka(total)}</span>
            </div>
            {quote && quote.totalSavings > 0 && <div className="text-xs mt-1 text-right" style={{ color: "var(--leaf)" }}>{tx("q.save", { a: taka(quote.totalSavings) })}</div>}
            {quote && quote.pointsEarnable > 0 && <div className="text-xs mt-1 text-right" style={{ color: "var(--ink-soft)" }}>{tx("q.earn", { p: num(quote.pointsEarnable) })}</div>}
          </div>
          {cart.length > 0 && (
            <>
              <div className="mb-4">
                <div className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--ink-soft)" }}>{tx("coupon.label")}</div>
                <div className="flex gap-2">
                  <input value={couponCode} onChange={e => { setCouponCode(e.target.value); if (couponActive) setCouponActive(""); }}
                    placeholder={tx("coupon.ph")} className="flex-1 px-3 py-2 rounded-lg border text-sm uppercase" style={{ borderColor: "var(--line)" }} />
                  <button disabled={couponBusy || !couponCode.trim()} onClick={applyCoupon} className="btn-primary px-3 py-2 rounded-lg text-xs disabled:opacity-50">
                    {couponBusy ? "..." : tx("apply")}
                  </button>
                </div>
                {couponError && <div className="text-xs mt-2" style={{ color: "var(--brick)" }}>{couponError}</div>}
                {couponApplied && <div className="text-xs mt-2" style={{ color: "var(--leaf)" }}>{tx("coupon.applied", { d: couponApplied.discountType === "PERCENTAGE" ? `${num(couponApplied.discountValue)}%` : taka(couponApplied.discountValue) })}</div>}
              </div>
              {loyalty && loyalty.rewards.length > 0 && (
                <div className="mb-4">
                  <div className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--ink-soft)" }}>{tx("q.use")} · {tx("q.balance", { p: num(loyalty.points) })}</div>
                  <div className="space-y-1.5">
                    {loyalty.rewards.map(r => {
                      const needsItem = r.type === "FREE_ITEM" && !cart.some(c => c.id === r.item_id);
                      const cannot = loyalty.points < r.points_cost || needsItem;
                      const on = rewardId === r.id;
                      return (
                        <button key={r.id} disabled={cannot && !on} onClick={() => setRewardId(on ? null : r.id)}
                          className={`w-full text-left text-sm rounded-lg border px-3 py-2 flex justify-between items-center gap-2 disabled:opacity-50 ${on ? "text-white" : ""}`}
                          style={on ? { background: "var(--teal)", borderColor: "var(--teal)" } : { borderColor: "var(--line)" }}>
                          <span>
                            {CURRENT_LANG === "bn" && r.name_bn ? r.name_bn : r.name}
                            {cannot && !on && <span className="block text-[11px]" style={{ color: "var(--ink-soft)" }}>
                              {loyalty.points < r.points_cost ? tx("q.need", { n: num(r.points_cost - loyalty.points) }) : tx("q.needitem", { i: dispName(r.item_name || "") })}
                            </span>}
                          </span>
                          <span className="font-mono text-xs shrink-0">{num(r.points_cost)} {tx("q.points")}</span>
                        </button>
                      );
                    })}
                  </div>
                  {quote && quote.rewardError && <div className="text-xs mt-2" style={{ color: "var(--brick)" }}>{quote.rewardError}</div>}
                </div>
              )}
              <div className="mb-4">
                <label className="text-xs uppercase tracking-wide block mb-2" style={{ color: "var(--ink-soft)" }}>{tx("note.label")}</label>
                <div className="flex flex-wrap gap-1.5 mb-2">
                  {NOTE_CHIPS.map(k => {
                    const text = tx(k);
                    const on = noteHas(orderNote, text);
                    return (
                      <button key={k} type="button" onClick={() => setOrderNote(noteToggle(orderNote, text))}
                        className={"chip text-xs px-2.5 py-1 rounded-full" + (on ? " active-chip" : "")}>{text}</button>
                    );
                  })}
                </div>
                <textarea value={orderNote} onChange={e => setOrderNote(e.target.value.slice(0, 200))} rows={2} maxLength={200}
                  placeholder={tx("note.ph")} className="w-full px-3 py-2 rounded-lg border text-sm resize-none" style={{ borderColor: "var(--line)" }} />
                <div className="text-[10px] text-right mt-0.5" style={{ color: "var(--ink-soft)" }}>{num(orderNote.length)}/{num(200)}</div>
              </div>
              <div className="mb-4">
                <label className="text-xs uppercase tracking-wide block mb-2" style={{ color: "var(--ink-soft)" }}>{tx("dnote.label")}</label>
                <input type="text" value={deliveryNote} onChange={e => setDeliveryNote(e.target.value.slice(0, 200))} maxLength={200}
                  placeholder={tx("dnote.ph")} className="w-full px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
              </div>
              <div className="mb-4">
                <label className="flex items-center gap-2 text-sm mb-2">
                  <input type="checkbox" checked={scheduleLater} onChange={e => setScheduleLater(e.target.checked)} />
                  {tx("schedule")}
                </label>
                {scheduleLater && (
                  <>
                    <input type="time" value={pickupTime} onChange={e => setPickupTime(e.target.value)}
                      min={pickupCrossesMidnight ? undefined : fmtHHMM(pickupMin)}
                      max={pickupCrossesMidnight ? undefined : fmtHHMM(pickupMax)}
                      className="w-full px-3 py-2 rounded-lg border font-mono" style={{ borderColor: "var(--line)" }} />
                    <p className="text-xs mt-1" style={{ color: "var(--ink-soft)" }}>
                      {tx("pick.hint", { a: fmtHHMM(pickupMin), b: fmtHHMM(pickupMax) })}
                    </p>
                  </>
                )}
              </div>
              <div className="flex gap-2 mb-4 text-sm">
                <button onClick={() => setPayMethod("wallet")}
                  className={`flex-1 py-2 rounded-lg border ${payMethod === "wallet" ? "text-white" : ""}`}
                  style={payMethod === "wallet" ? { background: "var(--teal)", borderColor: "var(--teal)" } : { borderColor: "var(--line)" }}>
                  {tx("pay.wallet")}
                </button>
                <button onClick={() => setPayMethod("cash")}
                  className={`flex-1 py-2 rounded-lg border ${payMethod === "cash" ? "text-white" : ""}`}
                  style={payMethod === "cash" ? { background: "var(--teal)", borderColor: "var(--teal)" } : { borderColor: "var(--line)" }}>
                  {tx("pay.cash")}
                </button>
              </div>
              {payMethod === "wallet" && (
                <div className="mb-3">
                  <div className="text-xs mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("tip.label")}</div>
                  <div className="flex flex-wrap gap-2">
                    {[0, 5, 10, 20].map(v => (
                      <button key={v} type="button" onClick={() => setTip(v)}
                        className={"chip text-xs px-3 py-1.5 rounded-full" + (tip === v ? " active-chip" : "")}>{v === 0 ? tx("tip.none") : "৳" + v}</button>
                    ))}
                  </div>
                  {tip > 0 && <div className="text-xs mt-1.5 font-600">{tx("tip.total", { t: taka(total + tip) })}</div>}
                </div>
              )}
              {budget && budget.limit > 0 && (() => {
                const after = budget.spent + total;
                const pct = Math.round((after / budget.limit) * 100);
                if (pct < 80) return null;
                const over = after > budget.limit;
                return (
                  <div className="mb-3 text-xs rounded-lg px-3 py-2 font-600" style={{ background: over ? "#FEF2F2" : "#FFFBEB", color: over ? "#B91C1C" : "#92400E" }}>
                    ⚠️ {over ? tx("bud.cart.over", { o: taka(after - budget.limit), l: taka(budget.limit) }) : tx("bud.cart.near", { p: num(pct), l: taka(budget.limit) })}
                  </div>
                );
              })()}
              {payMethod === "wallet" && !canPay && (
                <div className="mb-3">
                  <p className="text-xs" style={{ color: "var(--brick)" }}>{tx("insufficient")}</p>
                  {onTopUp && (
                    <div className="flex items-center gap-2 mt-2">
                      <span className="text-xs font-600">{tx("topup.short", { a: taka(Math.max(0, total + tip - walletBalance)) })}</span>
                      <button type="button" onClick={() => onTopUp(Math.max(0, total + tip - walletBalance))} className="btn-primary text-xs px-3 py-1.5 rounded-lg">{tx("topup")}</button>
                    </div>
                  )}
                </div>
              )}
              {!quote && quoteError && (
                <p className="text-xs mb-3" style={{ color: "var(--brick)" }}>
                  Price preview unavailable ({quoteError}). The final price is calculated when you place the order.
                </p>
              )}
              <button disabled={!canCheckout || busy || (!quote && !quoteError)} onClick={() => placeOrder(cart, payMethod, scheduleLater ? pickupTime : null, couponApplied, orderNote, rewardId, deliveryNote, tip)}
                className="btn-primary w-full py-2.5 rounded-xl">
                {busy ? tx("placing") : tx("checkout")}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Track order tab ---------------- */
/* Feature: rate your rider */
function RiderRating({ order, apiBase, token }) {
  const [rating, setRating] = useState(0);
  const [comment, setComment] = useState("");
  const [saved, setSaved] = useState(order.rider_rating ? { rating: Number(order.rider_rating), comment: order.rider_comment } : null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const send = async () => {
    if (rating < 1) return;
    setBusy(true); setError("");
    try {
      await api(apiBase, "/api/orders/" + order.id + "/rate-rider", { method: "POST", token, body: { rating, comment } });
      setSaved({ rating, comment: comment.trim() });
    } catch (e) { setError(e.message || "Could not save your rating"); }
    finally { setBusy(false); }
  };
  if (saved) {
    return (
      <div className="mt-4 pt-4 border-t" style={{ borderColor: "var(--line)" }}>
        <div className="flex items-center gap-2">
          <StarPicker value={saved.rating} readOnly size="w-4 h-4" />
          <span className="text-xs" style={{ color: "var(--ink-soft)" }}>✓ {tx("rr.done")}{order.rider_name ? " (" + order.rider_name + ")" : ""}</span>
        </div>
        {saved.comment && <p className="text-xs italic mt-1.5" style={{ color: "var(--ink-soft)" }}>"{saved.comment}"</p>}
      </div>
    );
  }
  return (
    <div className="mt-4 pt-4 border-t" style={{ borderColor: "var(--line)" }}>
      <div className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--ink-soft)" }}>🛵 {tx("rr.title")}{order.rider_name ? " — " + order.rider_name : ""}</div>
      <StarPicker value={rating} onChange={setRating} />

/* ---------------- Print sheets (reports / feedback / bills) ----------------
   A print sheet is a plain black-on-white page rendered outside the app (a portal on <body>).
   While it prints, the whole app is hidden, so there are no blank pages, no dark-theme colours,
   no clipped charts. Tables repeat their header on every page. */
function PrintSheet({ title, meta, children }) {
  const host = useMemo(() => {
    let el = document.getElementById("print-sheet");
    if (!el) { el = document.createElement("div"); el.id = "print-sheet"; document.body.appendChild(el); }
    return el;
  }, []);
  useEffect(() => {
    document.body.classList.add("printing-sheet");
    const done = () => document.body.classList.remove("printing-sheet");
    window.addEventListener("afterprint", done);
    const t = setTimeout(() => window.print(), 120);
    return () => { clearTimeout(t); window.removeEventListener("afterprint", done); done(); };
  }, []);
  return ReactDOM.createPortal(
    <div>
      <h1>CampusDine — {title}</h1>
      <div className="ps-meta">{meta}</div>
      {children}
    </div>, host);
}
function PsTable({ head, rows, numCols = [], empty }) {
  if (!rows.length) return <p className="ps-empty">{empty || "—"}</p>;
  return (
    <table>
      <thead><tr>{head.map((h, i) => <th key={i} className={numCols.includes(i) ? "num" : ""} style={h === "" ? { width: "40%" } : undefined}>{h}</th>)}</tr></thead>
      <tbody>{rows.map((r, ri) => (
        <tr key={ri}>{r.map((c, i) => <td key={i} className={numCols.includes(i) ? "num" : ""}>{c}</td>)}</tr>
      ))}</tbody>
    </table>
  );
}

/* Feature: copy token */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (_) { /* fall through to the old way */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (_) { return false; }
}

            <div className="receipt-row"><span>{tx("rc.status")}</span><span style={{ fontWeight: 600 }}>{lookup("status", printOrder.status)}</span></div>
            <div className="receipt-row"><span>{tx("rc.payment")}</span><span>{printOrder.payment_method === "wallet" ? tx("pay.wallet") : tx("pay.cash")}</span></div>
            {printOrder.note && (
              <div className="receipt-row"><span>{tx("note.show")}</span><span>{printOrder.note}</span></div>
            )}
            {printOrder.delivery_note && (
              <div className="receipt-row"><span>{tx("dnote.show")}</span><span>{printOrder.delivery_note}</span></div>
            )}
            {printOrder.pickup_time && (
              <div className="receipt-row"><span>{tx("sched")}</span><span>{new Date(printOrder.pickup_time).toLocaleString()}</span></div>
            )}
            <div className="receipt-row"><span>{tx("rc.printed")}</span><span>{new Date().toLocaleString()}</span></div>
            <div className="receipt-divider" />
            {printOrder.items.map((i, idx) => (
              <div key={idx} className="receipt-row"><span>{dispName(i.name)} ×{num(i.qty)}</span><span>{taka(i.price * i.qty)}</span></div>
            ))}
            <div className="receipt-divider" />
            <div className="receipt-row" style={{ fontSize: 15, fontWeight: 800 }}><span>{tx("total")}</span><span>{taka(printOrder.total)}</span></div>
            <div className="text-center" style={{ marginTop: 16, fontSize: 11, color: "#6B7280" }}>
              {tx("rc.thanks")}
            </div>
          </div>
        </div>
      )}
      <div className="card p-4 space-y-3">
        <input type="text" value={hQuery} onChange={e => setHQuery(e.target.value)}
          placeholder="Search by token, item, note…"
          className="w-full px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
        <div className="flex flex-wrap gap-2">
          {[["all", "All"], ["Received", "Received"], ["Cooking", "Cooking"], ["Ready", "Ready"], ["Cancelled", "Cancelled"]].map(([v, label]) => (
            <button key={v} type="button" onClick={() => setHStatus(v)}
              className={"chip text-xs px-3 py-1.5 rounded-full" + (hStatus === v ? " active-chip" : "")}>{label}</button>
          ))}
        </div>
        <div className="flex flex-wrap items-center gap-2">
          {[["all", "Any time"], ["today", "Today"], ["week", "Last 7 days"], ["month", "Last 30 days"]].map(([v, label]) => (
            <button key={v} type="button" onClick={() => setHRange(v)}
              className={"chip text-xs px-3 py-1.5 rounded-full" + (hRange === v ? " active-chip" : "")}>{label}</button>
          ))}
          <span className="text-xs ml-auto" style={{ color: "var(--ink-soft)" }}>{filtered.length} / {orders.length}</span>
        </div>
      </div>
      {filtered.length === 0 && (
        <div className="card p-8 text-center text-sm" style={{ color: "var(--ink-soft)" }}>
          No orders match your filters.
          <div className="mt-3">
            <button type="button" className="chip text-xs px-3 py-1.5 rounded-full" onClick={() => { setHQuery(""); setHStatus("all"); setHRange("all"); }}>Clear filters</button>
          </div>
        </div>
      )}
      {filtered.map(o => {
        const stepIndex = STATUSES.indexOf(o.status);
        const isCancelled = o.status === "Cancelled";
        return (
          <div key={o.token} className="card overflow-hidden">
            <div className="ticket p-5 flex items-center justify-between">
              <div className="perf pl-4">
                <div className="text-xs opacity-70">{tx("ticket.token")}</div>
                <div className="font-mono text-2xl font-700 tracking-wide">{o.token}</div>
              </div>
              <div className="text-right">
                <div className="text-xs opacity-70">{tx("total")}</div>
                <div className="font-mono text-lg">{taka(o.total)}</div>
              </div>
            </div>
            <div className="p-5">
              {o.pickup_time && (
                <div className="text-xs mb-3 font-600" style={{ color: "var(--teal)" }}>
                  {tx("sched")}: {new Date(o.pickup_time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
                </div>
              )}
              {o.queue && (
                <div className="flex items-center gap-3 mb-4 px-3 py-2.5 rounded-lg text-sm"
                  style={{ background: "var(--gold-soft)", color: "var(--teal-deep)" }}>
                  <Icon path={I.clock} className="w-4 h-4 shrink-0" />
                  <div className="flex flex-wrap items-baseline gap-x-2">
                    <span className="font-700">
                      {o.queue.ahead === 0
                        ? (o.status === "Cooking" ? tx("q.now") : tx("q.next"))
                        : tx(o.queue.ahead === 1 ? "q.ahead1" : "q.aheadN", { p: num(o.queue.position), a: num(o.queue.ahead) })}
                    </span>
                    <span style={{ color: "var(--ink-soft)" }}>{tx("q.est", { m: num(o.queue.est_minutes) })}</span>
                  </div>
                </div>
              )}
              {isCancelled ? (
                <div className="flex items-center gap-2 text-sm font-600" style={{ color: "var(--brick)" }}>
                  <Icon path={I.x} className="w-4 h-4" />
                  {lookup("status", "Cancelled")}
                  {o.payment_method === "wallet" && (
                    <span className="text-xs font-400" style={{ color: "var(--ink-soft)" }}>{tx("refunded")}</span>
                  )}
                </div>
              ) : (
                <div className="flex items-center justify-between mb-2">
                  {STATUSES.map((s, i) => (
                    <React.Fragment key={s}>
                      <div className="flex flex-col items-center gap-1.5 flex-1">
                        <div className={`stepper-dot ${i < stepIndex ? "done" : i === stepIndex ? "current" : ""}`}></div>
                        <span className="text-xs text-center" style={{ color: i <= stepIndex ? "var(--gold)" : "var(--ink-soft)", fontWeight: i === stepIndex ? 700 : 400 }}>{lookup("status", s)}</span>
                      </div>
                      {i < STATUSES.length - 1 && <div className="h-0.5 flex-1 -mt-5" style={{ background: i < stepIndex ? "var(--gold)" : "var(--line)" }} />}
                    </React.Fragment>
                  ))}
                </div>
              )}
              {!isCancelled && o.qr && (
                <div className="flex items-center gap-4 mt-4 p-3 rounded-xl border" style={{ borderColor: "var(--line)" }}>
                  <QrCode value={o.qr} size={112} dim={!!o.picked_up_at} />
                  <div className="min-w-0">
                    <div className="text-sm font-700" style={{ color: o.picked_up_at ? "var(--leaf)" : "var(--ink)" }}>
                      {o.picked_up_at ? tx("qr.collected") : tx("qr.title")}
                    </div>
                    <p className="text-xs mt-1" style={{ color: "var(--ink-soft)" }}>
                      {o.picked_up_at ? new Date(o.picked_up_at).toLocaleString() : tx("qr.hint", { t: o.token })}
                    </p>
                  </div>
                </div>
              )}
              <div className="text-sm mt-4" style={{ color: "var(--ink-soft)" }}>
                {o.items.map(i => `${dispName(i.name)} ×${num(i.qty)}`).join(", ")}
              </div>
              {o.note && (
                <div className="text-xs mt-2 px-2.5 py-1.5 rounded-lg" style={{ background: "var(--gold-soft)", color: "var(--teal-deep)" }}>
                  {tx("note.show")}: {o.note}
                </div>
              )}
              {Number(o.tip_amount) > 0 && (
                <div className="text-xs mt-2 font-600" style={{ color: "var(--ink-soft)" }}>🪙 {tx("tip.show")}: ৳{o.tip_amount}{o.status === "Cancelled" && " " + tx("refunded")}</div>
              )}
              {(o.status === "Ready" || o.picked_up_at) && o.status !== "Cancelled" && (
                <div className="mt-3">
                  {issues[o.id] ? (
                    <div className="rounded-lg border p-3 text-xs" style={{ borderColor: "var(--line)", background: "var(--panel-soft)" }}>
                      <div className="font-700">{issues[o.id].status === "Resolved" ? "✅ " + tx("iss.resolved") : "⏳ " + tx("iss.open")} — {tx("iss.r." + issues[o.id].reason)}</div>
                      {issues[o.id].details && <div className="mt-1" style={{ color: "var(--ink-soft)" }}>“{issues[o.id].details}”</div>}
                      {issues[o.id].admin_reply && <div className="mt-1.5 font-600">💬 {tx("iss.reply")}: {issues[o.id].admin_reply}</div>}
                    </div>
                  ) : reporting === o.id ? (
                    <div className="rounded-lg border p-3" style={{ borderColor: "var(--line)" }}>
                      <div className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--ink-soft)" }}>⚠️ {tx("iss.title")}</div>
                      <div className="flex flex-wrap gap-1.5 mb-2">
                        {["cold", "wrong", "missing", "late", "quality", "other"].map(r => (
                          <button key={r} type="button" onClick={() => setRForm(f => ({ ...f, reason: r }))}
                            className={"chip text-xs px-2.5 py-1 rounded-full" + (rForm.reason === r ? " active-chip" : "")}>{tx("iss.r." + r)}</button>
                        ))}
                      </div>
                      <input type="text" value={rForm.details} onChange={e => setRForm(f => ({ ...f, details: e.target.value.slice(0, 300) }))}
                        placeholder={tx("iss.ph")} className="w-full px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
                      {rError && <p className="text-xs mt-1.5" style={{ color: "var(--brick)" }}>{rError}</p>}
                      <div className="flex gap-2 mt-2">
                        <button type="button" disabled={rBusy || !rForm.reason} onClick={() => submitIssue(o.id)} className="btn-primary text-xs px-3 py-1.5 rounded-lg">{tx("iss.send")}</button>
                        <button type="button" onClick={() => { setReporting(null); setRError(""); }} className="text-xs px-3 py-1.5 rounded-lg border" style={{ borderColor: "var(--line)" }}>{tx("iss.cancel")}</button>
                      </div>
                    </div>
                  ) : (
                    <button type="button" onClick={() => { setReporting(o.id); setRError(""); setRForm({ reason: "", details: "" }); }}
                      className="text-xs px-3 py-1.5 rounded-lg border font-600 transition-colors hover:bg-black/5" style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>
                      ⚠️ {tx("iss.report")}
                    </button>
                  )}
                </div>
              )}
              {o.delivery_note && (
                <div className="text-xs mt-2 px-2.5 py-1.5 rounded-lg" style={{ background: "var(--gold-soft)", color: "var(--teal-deep)" }}>
                  🚪 {tx("dnote.show")}: {o.delivery_note}
                </div>
              )}
              {o.rider_id && <RiderOrderChat apiBase={apiBase} token={token} orderId={o.id} />}
              <div className="flex items-center gap-2 mt-3">
                <button onClick={() => onReorder(o)}
                  className="text-xs px-3 py-1.5 rounded-lg font-600 btn-primary flex items-center gap-1.5">
                  {tx("reorder")}
                </button>
                <button onClick={() => setPrintOrder(o)}
                  className="text-xs px-3 py-1.5 rounded-lg border font-600 flex items-center gap-1.5 transition-colors hover:bg-black/5"
                  style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>
                  <Icon path={I.printer} className="w-3.5 h-3.5" style={{ color: "var(--gold)" }} />
                  {tx("print")}
                </button>
                <button type="button"
                  onClick={async () => {
                    const ok = await copyText(o.token);
                    if (ok) { setCopiedId(o.id); setTimeout(() => setCopiedId(null), 1500); }
                    else window.prompt(tx("copytoken") + ":", o.token);
                  }}
                  className="text-xs px-3 py-1.5 rounded-lg border font-600 flex items-center gap-1.5 transition-colors hover:bg-black/5"
                  style={{ borderColor: "var(--line)", color: copiedId === o.id ? "var(--leaf)" : "var(--ink-soft)" }}>
                  {copiedId === o.id ? "✓ " + tx("copied") : "📋 " + tx("copytoken")}
                </button>
                {o.status !== "Cancelled" && (
                  <button type="button" onClick={() => { setPlanDraft(o); window.scrollTo({ top: 0, behavior: "smooth" }); }}
                    className="text-xs px-3 py-1.5 rounded-lg border font-600 flex items-center gap-1.5 transition-colors hover:bg-black/5"
                    style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>🔁 {tx("rec.repeat")}</button>
                )}
                {o.status === "Received" && (
                  <button disabled={cancelBusy} onClick={() => onCancel(o.id)}
                    className="text-xs px-3 py-1.5 rounded-lg border font-600"
                    style={{ borderColor: "var(--brick)", color: "var(--brick)" }}>
                    {tx("cancelorder")}
                  </button>
                )}
              </div>
              {o.status === "Ready" && (
                <OrderFeedback order={o} onSubmit={onSubmitFeedback} busy={feedbackBusy} />
              )}
              {o.rider_id && o.picked_up_at && o.status !== "Cancelled" && (
                <RiderRating order={o} apiBase={apiBase} token={token} />
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------- Meal calendar tab ---------------- */
function MealCalendar({ user, role, year, month, calendar, paidDays, bill, onToggle, onPay, onRepeat, planBusy, onPrevMonth, onNextMonth, onJumpToday, isCurrentMonth }) {
  const [printKey, setPrintKey] = useState(0);
  const total = daysInMonth(year, month);
  const monthName = new Date(year, month - 1).toLocaleString(CURRENT_LANG === "bn" ? "bn-BD" : "default", { month: "long" });
  const firstWeekday = new Date(year, month - 1, 1).getDay();
  const now = new Date();
  const todayDay = now.getDate();
  const isThisMonthShown = now.getFullYear() === year && (now.getMonth() + 1) === month;

  const markedDays = Array.from({ length: total }, (_, i) => i + 1).filter(d => calendar[d] === "full" || calendar[d] === "half");
  return (
    <div className="grid lg:grid-cols-3 gap-6">
      {printKey > 0 && (
        <PrintSheet key={printKey} title={tx("pr.bill")}
          meta={`${user.name}${user.externalId ? " (" + user.externalId + ")" : ""} · ${monthName} ${num(year)} · ${tx("pr.generated", { t: new Date().toLocaleString() })}`}>
          <div className="ps-grid">
            {[[tx("pr.fullmeals"), num(bill.fullDays)], [tx("pr.halfmeals"), num(bill.halfDays)], [tx("total"), taka(bill.total)], [tx("mp.due"), taka(bill.dueAmount)]]
              .map(([k, v]) => <div key={k} className="ps-tile"><div className="ps-k">{k}</div><div className="ps-v">{v}</div></div>)}
          </div>
          <div className="ps-meta" style={{ marginTop: 6 }}>{tx("mp.paidamt")}: {taka(bill.paidAmount)} ({num(bill.paidDays)})</div>
          <h2>{monthName} {num(year)}</h2>
          <PsTable head={[tx("pr.date"), tx("pr.day"), tx("pr.meal"), tx("pr.rate"), tx("pr.status")]} numCols={[3]} empty={tx("pr.nodays")}
            rows={markedDays.map(d => [
              `${num(d)} ${monthName}`,
              new Date(year, month - 1, d).toLocaleDateString(CURRENT_LANG === "bn" ? "bn-BD" : "default", { weekday: "long" }),
              calendar[d] === "full" ? tx("cal.full") : tx("cal.half"),
              taka(calendar[d] === "full" ? bill.fullRate : bill.halfRate),
              paidDays && paidDays[d] ? tx("pr.paid") : tx("pr.unpaid"),
            ])} />
        </PrintSheet>
      )}
      <div className="lg:col-span-2 card p-5">
        <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
          <div className="flex items-center gap-2">
            <button onClick={onPrevMonth} aria-label={tx("prevm")}
                    className="w-8 h-8 rounded-lg border flex items-center justify-center transition-colors"
                    style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
              <Icon path={I.chevronLeft} className="w-4 h-4" />
            </button>
            <div className="font-display font-700 text-lg min-w-[150px] text-center" style={{ color: "var(--gold)" }}>{monthName} {num(year)}</div>
            <button onClick={onNextMonth} aria-label={tx("nextm")}
                    className="w-8 h-8 rounded-lg border flex items-center justify-center transition-colors"
                    style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
              <Icon path={I.chevronRight} className="w-4 h-4" />
            </button>
            {!isCurrentMonth && (
              <button onClick={onJumpToday} className="text-[11px] font-600 rounded-lg px-2 py-1 ml-1 border transition-colors"
                      style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
                {tx("today")}
              </button>
            )}
          </div>
          <div className="text-xs" style={{ color: "var(--ink-soft)" }}>{tx("cal.hint")}</div>
        </div>
        <div className="grid grid-cols-7 gap-2 mb-2 text-xs text-center font-600" style={{ color: "var(--ink-soft)" }}>
          {tx("wd").split(",").map((d, i) => <div key={i}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-2">
          {Array.from({ length: firstWeekday }).map((_, i) => <div key={"e" + i}></div>)}
          {Array.from({ length: total }).map((_, i) => {
            const day = i + 1;
            const status = calendar[day] || "off";
            const isToday = isThisMonthShown && day === todayDay;
            return (
              <div key={day} onClick={() => onToggle(day, status)}
                className={`cal-cell text-sm font-600 ${status === "full" ? "cal-full" : status === "half" ? "cal-half" : ""} ${isToday ? "cal-today" : ""}`}>
                {num(day)}{paidDays && paidDays[day] && <span className="text-[9px] ml-0.5">✓</span>}
              </div>
            );
          })}
        </div>
        <div className="flex gap-4 mt-4 text-xs" style={{ color: "var(--ink-soft)" }}>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded" style={{ background: "var(--teal)" }}></span> {tx("cal.full")}</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded" style={{ background: "var(--gold)" }}></span> {tx("cal.half")}</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border" style={{ borderColor: "var(--line)" }}></span> {tx("cal.off")}</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border" style={{ borderColor: "var(--gold-bright)", boxShadow: "0 0 0 2px var(--gold-bright)" }}></span> {tx("today")}</span>
          <span className="flex items-center gap-1.5">{tx("mp.legend")}</span>
        </div>
      </div>

      <div className="card p-5 h-fit">
        <div className="flex items-center justify-between gap-2 mb-4">
          <div className="font-display font-700" style={{ color: "var(--gold)" }}>{tx("cal.bill")}</div>
          <button onClick={() => setPrintKey(k => k + 1)} disabled={markedDays.length === 0} className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border font-600 disabled:opacity-40" style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
  <Icon path={I.printer} className="w-3.5 h-3.5" /> {tx("pr.print")}
</button>
        </div>
        <div className="space-y-2 text-sm mb-4">
          <div className="flex justify-between"><span>{tx("cal.fulldays", { r: taka(bill.fullRate) })}</span><span className="font-mono">{num(bill.fullDays)}</span></div>
          <div className="flex justify-between"><span>{tx("cal.halfdays", { r: taka(bill.halfRate) })}</span><span className="font-mono">{num(bill.halfDays)}</span></div>
        </div>
        <div className="border-t pt-3" style={{ borderColor: "var(--line)" }}>
          <div className="flex justify-between font-700 text-lg">
            <span>{tx("total")}</span><span className="font-mono">{taka(bill.total)}</span>
          </div>
        </div>
        <div className="border-t mt-3 pt-3 space-y-1.5 text-sm" style={{ borderColor: "var(--line)" }}>
          <div className="flex justify-between"><span>{tx("mp.paidamt")} ({num(bill.paidDays)})</span><span className="font-mono">{taka(bill.paidAmount)}</span></div>
          <div className="flex justify-between font-700"><span>{tx("mp.due")} ({num(bill.dueDays)})</span><span className="font-mono">{taka(bill.dueAmount)}</span></div>
          <div className="flex justify-between text-xs" style={{ color: "var(--ink-soft)" }}><span>{tx("mp.balance")}</span><span className="font-mono">{taka(bill.walletBalance)}</span></div>
        </div>
        {bill.dueAmount > bill.walletBalance && (
          <p className="text-xs mt-2" style={{ color: "#DC2626" }}>{tx("mp.short", { a: taka(bill.dueAmount - bill.walletBalance) })}</p>
        )}
        <button onClick={onPay} disabled={planBusy || bill.dueDays === 0 || bill.dueAmount > bill.walletBalance}
          className="btn-primary w-full py-2.5 rounded-xl mt-3 disabled:opacity-50">
          {planBusy ? tx("mp.paying") : bill.dueDays === 0 ? tx("mp.nothing") : `${tx("mp.pay")} · ${taka(bill.dueAmount)}`}
        </button>
        <button onClick={onRepeat} disabled={planBusy}
          className="w-full py-2 rounded-xl mt-2 text-sm border font-600 disabled:opacity-50" style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
          {tx("mp.repeat")}
        </button>
        <p className="text-[11px] mt-2" style={{ color: "var(--ink-soft)" }}>{tx("mp.repeat.d")}</p>
        <p className="text-xs mt-3" style={{ color: "var(--ink-soft)" }}>{tx("mp.note")}</p>
      </div>
    </div>
  );
}

/* ---------------- Spending summary (student / teacher) ---------------- */
/* Feature: monthly budget */
function BudgetCard({ budget, onSave }) {
  const [val, setVal] = useState("");
  const [editing, setEditing] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  if (!budget) return null;
  const limit = budget.limit;
  const raw = limit ? (budget.spent / limit) * 100 : 0;
  const color = raw >= 100 ? "#DC2626" : raw >= 80 ? "#F59E0B" : "var(--leaf)";
  const save = async (v) => {
    setBusy(true); setError("");
    try { await onSave(v); setEditing(false); setVal(""); }
    catch (e) { setError(e.message || "Could not save"); }
    finally { setBusy(false); }
  };
  const showForm = editing || !limit;
  return (
    <div className="card p-5">
      <div className="font-display font-700 mb-3" style={{ color: "var(--gold)" }}>🎯 {tx("bud.title")}</div>
      {limit ? (
        <>
          <div className="flex items-baseline justify-between mb-1.5">
            <span className="font-mono font-700 text-lg">{taka(budget.spent)} <span className="text-sm font-400" style={{ color: "var(--ink-soft)" }}>/ {taka(limit)}</span></span>
            <span className="text-sm font-700" style={{ color }}>{num(Math.round(raw))}%</span>
          </div>
          <div className="h-2.5 rounded-full overflow-hidden" style={{ background: "var(--line)" }}>
            <div className="h-full rounded-full" style={{ width: Math.min(100, Math.round(raw)) + "%", background: color }} />
          </div>
          <p className="text-xs mt-2 font-600" style={{ color: raw >= 100 ? "#B91C1C" : "var(--ink-soft)" }}>
            {raw >= 100 ? tx("bud.overmsg", { a: taka(budget.spent - limit) }) : tx("bud.left", { a: taka(limit - budget.spent) })}
          </p>
        </>
      ) : (
        <p className="text-sm" style={{ color: "var(--ink-soft)" }}>{tx("bud.none")}</p>
      )}
      {showForm ? (
        <div className="flex flex-wrap items-center gap-2 mt-3">
          <input type="number" min="50" max="100000" value={val} onChange={e => setVal(e.target.value)} placeholder={tx("bud.ph")}
            className="w-36 px-3 py-1.5 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
          <button type="button" disabled={busy || !val} onClick={() => save(Number(val))} className="btn-primary text-xs px-3 py-1.5 rounded-lg">{tx("bud.save")}</button>
          {limit && <button type="button" onClick={() => { setEditing(false); setError(""); }} className="text-xs px-3 py-1.5 rounded-lg border" style={{ borderColor: "var(--line)" }}>×</button>}
        </div>
      ) : (
        <div className="flex gap-2 mt-3">
          <button type="button" onClick={() => { setEditing(true); setVal(String(limit)); }} className="text-xs px-3 py-1.5 rounded-lg border" style={{ borderColor: "var(--line)" }}>{tx("bud.change")}</button>
          <button type="button" disabled={busy} onClick={() => save(null)} className="text-xs px-3 py-1.5 rounded-lg border" style={{ borderColor: "var(--line)", color: "var(--brick)" }}>{tx("bud.remove")}</button>
        </div>
      )}
      {error && <p className="text-xs mt-2" style={{ color: "var(--brick)" }}>{error}</p>}
    </div>
  );
}
function SpendingTab({ call, user, budget, onSaveBudget }) {
  const now = new Date();
  const [printKey, setPrintKey] = useState(0);
  const [ym, setYm] = useState({ year: now.getFullYear(), month: now.getMonth() + 1 });
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    let live = true;
    setData(null); setError(null);
    call(`/api/summary?year=${ym.year}&month=${ym.month}`)
      .then(d => { if (live) setData(d); })
      .catch(e => { if (live) setError(e.message); });
    return () => { live = false; };
  }, [ym.year, ym.month]);

  const shift = (d) => setYm(({ year, month }) => {
    const m = month - 1 + d;
    return { year: year + Math.floor(m / 12), month: ((m % 12) + 12) % 12 + 1 };
  });
  const isCurrent = ym.year === now.getFullYear() && ym.month === now.getMonth() + 1;
  const monthName = new Date(ym.year, ym.month - 1).toLocaleString(CURRENT_LANG === "bn" ? "bn-BD" : "default", { month: "long" });

  const Tile = ({ label, value, sub }) => (
    <div className="card p-4">
      <div className="text-xs uppercase tracking-wide" style={{ color: "var(--ink-soft)" }}>{label}</div>
      <div className="font-mono text-xl font-700 mt-1">{value}</div>
      {sub && <div className="text-xs mt-1" style={{ color: "var(--ink-soft)" }}>{sub}</div>}
    </div>
  );

  let body = null;
  if (error) {
    body = <div className="card p-6 text-sm" style={{ color: "#DC2626" }}>{error}</div>;
  } else if (!data) {
    body = <div className="card p-6 text-sm" style={{ color: "var(--ink-soft)" }}>{tx("sp.loading")}</div>;
  } else if (data.totals.orders === 0) {
    body = <div className="card p-10 text-center text-sm" style={{ color: "var(--ink-soft)" }}>{tx("sp.empty")}</div>;
  } else {
    const t = data.totals;
    const total = daysInMonth(ym.year, ym.month);
    const perDay = {};
    data.byDay.forEach(d => { perDay[d.day] = d.spent; });
    const dayMax = Math.max(1, ...data.byDay.map(d => d.spent));
    const catTotal = Math.max(1, data.byCategory.reduce((a, c) => a + c.spent, 0));
    let compare;
    if (data.prev.spent > 0) {
      const pct = Math.round(Math.abs(t.spent - data.prev.spent) / data.prev.spent * 100);
      compare = pct === 0 ? tx("sp.same") : tx(t.spent > data.prev.spent ? "sp.more" : "sp.less", { p: num(pct) });
    } else {
      compare = tx("sp.noprev");
    }
    body = (
      <>
        {printKey > 0 && (
          <PrintSheet key={printKey} title={tx("pr.spending")}
            meta={`${user.name}${user.externalId ? " (" + user.externalId + ")" : ""} · ${monthName} ${num(ym.year)} · ${tx("pr.generated", { t: new Date().toLocaleString() })}`}>
            <div className="ps-grid">
              {[[tx("sp.spent"), taka(t.spent)], [tx("sp.orders"), num(t.orders)], [tx("sp.avg"), taka(Math.round(t.avgOrder))], [tx("sp.saved"), taka(t.discounts)]]
                .map(([k, v]) => <div key={k} className="ps-tile"><div className="ps-k">{k}</div><div className="ps-v">{v}</div></div>)}
            </div>
            <div className="ps-meta" style={{ marginTop: 6 }}>{compare}</div>
            <h2>{tx("sp.daily")}</h2>
            <PsTable head={[tx("pr.date"), tx("pr.orders"), tx("pr.amount"), ""]} numCols={[1, 2]}
              rows={data.byDay.map(d => [`${num(d.day)} ${monthName}`, num(d.orders), taka(d.spent), <div className="ps-bar" style={{ width: `${(d.spent / dayMax) * 100}%` }}></div>])} />
            <h2>{tx("sp.top")}</h2>
            <PsTable head={[tx("pr.item"), tx("pr.qty"), tx("pr.amount")]} numCols={[1, 2]}
              rows={data.topItems.map(i => [dispName(i.name), num(i.qty), taka(i.spent)])} />
            <h2>{tx("sp.cat")}</h2>
            <PsTable head={[tx("pr.category"), tx("pr.amount"), "%"]} numCols={[1, 2]}
              rows={data.byCategory.map(c => [tx("sp.cat." + c.category), taka(c.spent), num(Math.round(c.spent / catTotal * 100)) + "%"])} />
            <h2>{tx("sp.pay")}</h2>
            <PsTable head={[tx("pr.method"), tx("pr.orders"), tx("pr.amount")]} numCols={[1, 2]}
              rows={data.byPayment.map(p => [p.method === "wallet" ? tx("pay.wallet") : tx("pay.cash"), num(p.orders), taka(p.spent)])} />
            <h2>{tx("sp.wallet")}</h2>
            <PsTable head={["", tx("pr.amount")]} numCols={[1]}
              rows={[[tx("sp.topups"), taka(data.wallet.topups)], [tx("wallet.bal"), taka(data.wallet.balance)]]} />
          </PrintSheet>
        )}
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          <Tile label={tx("sp.spent")} value={taka(t.spent)} sub={compare} />
          <Tile label={tx("sp.orders")} value={num(t.orders)} sub={tx("sp.activedays", { d: num(t.activeDays) })} />
          <Tile label={tx("sp.avg")} value={taka(Math.round(t.avgOrder))} sub={tx("sp.biggest", { a: taka(t.biggest) })} />
          <Tile label={tx("sp.saved")} value={taka(t.discounts)} sub={tx("sp.saved.d")} />
        </div>

        <div className="card p-5">
          <div className="font-display font-700 mb-4" style={{ color: "var(--gold)" }}>{tx("sp.daily")}</div>
          <div className="overflow-x-auto">
            <div className="flex items-end gap-1 h-40" style={{ minWidth: total * 14 }}>
              {Array.from({ length: total }).map((_, i) => {
                const day = i + 1, v = perDay[day] || 0;
                return (
                  <div key={day} className="flex-1 flex flex-col items-center justify-end" title={`${day}: ${taka(v)}`}>
                    <div className="w-full rounded-t" style={{ height: v ? `${Math.max(3, (v / dayMax) * 130)}px` : "2px", background: v ? "var(--gold)" : "var(--line)" }}></div>
                    <div className="text-[9px] mt-1 font-mono" style={{ color: "var(--ink-soft)" }}>{num(day)}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        {/* Feature: spending last 6 months */}
        {data.months && (
          <div className="card p-5">
            <div className="font-display font-700 mb-4" style={{ color: "var(--gold)" }}>{tx("sp.months")}</div>
            {(() => {
              const mMax = Math.max(1, ...data.months.map(m => m.spent));
              return (
                <div className="flex items-end gap-2 h-40">
                  {data.months.map(m => {
                    const sel = m.year === ym.year && m.month === ym.month;
                    const label = new Date(m.year, m.month - 1).toLocaleString(CURRENT_LANG === "bn" ? "bn-BD" : "default", { month: "short" });
                    return (
                      <button key={m.year + "-" + m.month} type="button" onClick={() => setYm({ year: m.year, month: m.month })}
                        className="flex-1 flex flex-col items-center justify-end" title={label + " " + m.year + ": " + taka(m.spent) + " · " + m.orders}>
                        <div className="text-[10px] font-mono mb-1" style={{ color: "var(--ink-soft)" }}>{m.spent ? taka(Math.round(m.spent)) : ""}</div>
                        <div className="w-full rounded-t" style={{ height: m.spent ? Math.max(4, (m.spent / mMax) * 110) + "px" : "2px", background: m.spent ? "var(--gold)" : "var(--line)", opacity: sel || !m.spent ? 1 : 0.5 }}></div>
                        <div className="text-[11px] mt-1" style={{ color: sel ? "var(--gold)" : "var(--ink-soft)", fontWeight: sel ? 700 : 400 }}>{label}</div>
                      </button>
                    );
                  })}
                </div>
              );
            })()}
          </div>
        )}

        <div className="grid md:grid-cols-2 gap-5">
          <div className="card p-5">
            <div className="font-display font-700 mb-3" style={{ color: "var(--gold)" }}>{tx("sp.top")}</div>
            <div className="space-y-2 text-sm">
              {data.topItems.map((it, i) => (
                <div key={it.name} className="flex justify-between gap-3">
                  <span>{num(i + 1)}. {dispName(it.name)} <span style={{ color: "var(--ink-soft)" }}>×{num(it.qty)}</span></span>
                  <span className="font-mono">{taka(it.spent)}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="card p-5">
            <div className="font-display font-700 mb-3" style={{ color: "var(--gold)" }}>{tx("sp.cat")}</div>
            <div className="space-y-3">
              {data.byCategory.map(c => (
                <div key={c.category}>
                  <div className="flex justify-between text-sm mb-1">
                    <span>{tx("sp.cat." + c.category)}</span>
                    <span className="font-mono">{taka(c.spent)} · {num(Math.round(c.spent / catTotal * 100))}%</span>
                  </div>
                  <div className="h-2 rounded-full" style={{ background: "var(--line)" }}>
                    <div className="h-2 rounded-full" style={{ width: `${(c.spent / catTotal) * 100}%`, background: "var(--gold)" }}></div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="card p-5">
            <div className="font-display font-700 mb-3" style={{ color: "var(--gold)" }}>{tx("sp.pay")}</div>
            <div className="space-y-2 text-sm">
              {data.byPayment.map(p => (
                <div key={p.method} className="flex justify-between">
                  <span>{p.method === "wallet" ? tx("pay.wallet") : tx("pay.cash")} <span style={{ color: "var(--ink-soft)" }}>· {tx("sp.norders", { n: num(p.orders) })}</span></span>
                  <span className="font-mono">{taka(p.spent)}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="card p-5">
            <div className="font-display font-700 mb-3" style={{ color: "var(--gold)" }}>{tx("sp.wallet")}</div>
            <div className="space-y-2 text-sm">
              <div className="flex justify-between"><span>{tx("sp.topups")}</span><span className="font-mono">{taka(data.wallet.topups)}</span></div>
              <div className="flex justify-between"><span>{tx("wallet.bal")}</span><span className="font-mono">{taka(data.wallet.balance)}</span></div>
            </div>
          </div>
        </div>
      </>
    );
  }

  return (
    <div className="space-y-5">
      <BudgetCard budget={budget} onSave={onSaveBudget} />
      <div className="flex items-center gap-2">
        <button onClick={() => shift(-1)} aria-label={tx("prevm")} className="w-8 h-8 rounded-lg border flex items-center justify-center" style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
          <Icon path={I.chevronLeft} className="w-4 h-4" />
        </button>
        <div className="font-display font-700 text-lg min-w-[150px] text-center" style={{ color: "var(--gold)" }}>{monthName} {num(ym.year)}</div>
        <button onClick={() => shift(1)} disabled={isCurrent} aria-label={tx("nextm")} className="w-8 h-8 rounded-lg border flex items-center justify-center disabled:opacity-40" style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
          <Icon path={I.chevronRight} className="w-4 h-4" />
        </button>
        {!isCurrent && (
          <button onClick={() => setYm({ year: now.getFullYear(), month: now.getMonth() + 1 })} className="text-[11px] font-600 rounded-lg px-2 py-1 ml-1 border" style={{ borderColor: "var(--line)", color: "var(--gold)" }}>{tx("today")}</button>
        )}
        {data && data.totals.orders > 0 && (
          <div className="ml-auto"><button onClick={() => setPrintKey(k => k + 1)}  className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border font-600 disabled:opacity-40" style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
  <Icon path={I.printer} className="w-3.5 h-3.5" /> {tx("pr.print")}
</button></div>
        )}
      </div>
      {body}
    </div>
  );
}

const PAY_CATEGORIES = [
  {
    key: "mobile", label: "Mobile Banking", color: "#E2136E",
    options: [
      { key: "bkash", label: "bKash", color: "#E2136E" },

    options: [

      { key: "city", label: "City Bank", color: "#9A6F0D" },
      { key: "islami", label: "Islami Bank Bangladesh", color: "#2E6FDB" },

    ],

  { key: "card", label: "Card", color: "#2E6FDB", options: null },

function PaymentModal({ amount, onClose, onConfirm, busy }) {
  const [step, setStep] = useState("category"); // category -> method -> confirm -> processing
  const [category, setCategory] = useState(null);
  const [choice, setChoice] = useState(null); // { key, label }
  const [err, setErr] = useState(null);

  const pickCategory = (cat) => {
    setCategory(cat);
    if (cat.options) {
      setStep("method");
    } else {
      setChoice({ key: cat.key, label: tx("pc." + cat.key) });
      setStep("confirm");
    }
  };

  const pickMethod = (opt) => {
    setChoice(opt);
    setStep("confirm");
  };

  const confirmPay = async () => {
    setErr(null);
    setStep("processing");
    try {
      await onConfirm(choice.key);
      setStep("success");
    } catch (e) {
      setErr(e.message || tx("pay.failed"));
      setStep("confirm");
    }
  };

  const goBack = () => {
    if (step === "method") { setStep("category"); setCategory(null); }
    else if (step === "confirm") { setStep(category?.options ? "method" : "category"); setChoice(null); }
  };

  const title = step === "category" ? tx("pay.t1")
    : step === "method" ? tx("pc." + category.key)
    : step === "confirm" ? tx("pay.t2")
    : step === "success" ? tx("pay.t3")
    : tx("pay.t4");

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(17,24,39,0.5)" }}>
      <div className="card w-full max-w-sm p-5 relative">
        {step !== "processing" && (
          <button onClick={onClose} className="absolute top-3 right-3 text-sm opacity-60 hover:opacity-100">✕</button>
        )}
        <div className="font-display font-700 mb-1" style={{ color: "var(--gold)" }}>{title}</div>
        <div className="text-xs mb-4" style={{ color: "var(--ink-soft)" }}>{tx("amount")} <span className="font-mono">{taka(amount)}</span></div>

        {step === "category" && (
          <div className="space-y-2">
            {PAY_CATEGORIES.map(c => (
              <button key={c.key} onClick={() => pickCategory(c)}
                className="w-full flex items-center justify-between px-4 py-3 rounded-lg border text-sm font-500"
                style={{ borderColor: "var(--line)" }}>
                <span className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full" style={{ background: c.color }} />
                  {tx("pc." + c.key)}
                </span>
                <span style={{ color: "var(--ink-soft)" }}>›</span>
              </button>
            ))}
          </div>
        )}

        {step === "method" && (
          <div className="space-y-2">
            {category.options.map(o => (
              <button key={o.key} onClick={() => pickMethod(o)}
                className="w-full flex items-center justify-between px-4 py-3 rounded-lg border text-sm font-500"
                style={{ borderColor: "var(--line)" }}>
                <span className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full" style={{ background: o.color }} />
                  {o.label}
                </span>
                <span style={{ color: "var(--ink-soft)" }}>›</span>
              </button>
            ))}
            <button onClick={goBack} className="w-full py-2 rounded-lg border text-sm mt-1" style={{ borderColor: "var(--line)" }}>{tx("back")}</button>
          </div>
        )}

        {step === "confirm" && (
          <div>
            <p className="text-sm mb-4">
              {CURRENT_LANG === "bn"
                ? <><span className="font-600">{choice.label}</span> দিয়ে <span className="font-mono font-600">{taka(amount)}</span> টপ-আপ করবেন?</>
                : <>Top up <span className="font-mono font-600">{taka(amount)}</span> via <span className="font-600">{choice.label}</span>?</>}
            </p>
            {err && <p className="text-xs mb-3" style={{ color: "var(--brick)" }}>{err}</p>}
            <div className="flex gap-2">
              <button onClick={goBack} className="flex-1 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }}>{tx("no")}</button>
              <button disabled={busy} onClick={confirmPay} className="flex-1 btn-primary py-2 rounded-lg text-sm">{tx("yes")}</button>
            </div>
          </div>
        )}

        {step === "processing" && (
          <div className="py-6 text-center text-sm" style={{ color: "var(--ink-soft)" }}>
            {tx("confirming", { m: choice?.label })}
          </div>
        )}

        {step === "success" && (
          <div className="py-4 text-center">
            <div className="mx-auto mb-3 w-12 h-12 rounded-full flex items-center justify-center text-2xl"
              style={{ background: "var(--leaf)", color: "#fff" }}>✓</div>
            <p className="text-sm mb-1">
              <span className="font-mono font-600">{taka(amount)}</span> {tx("pay.added")}
            </p>
            <p className="text-xs mb-4" style={{ color: "var(--ink-soft)" }}>{tx("paidvia", { m: choice?.label })}</p>
            <button onClick={onClose} className="btn-primary w-full py-2 rounded-lg text-sm">{tx("done")}</button>
          </div>
        )}
      </div>
    </div>
  );
}

function ReferralCard({ apiBase, token }) {
  const [info, setInfo] = useState(null);
  const [copied, setCopied] = useState(false);
  useEffect(() => {
    let dead = false;
    api(apiBase, "/api/wallet/referral", { token }).then(d => { if (!dead) setInfo(d); }).catch(() => {});
    return () => { dead = true; };
  }, []);
  if (!info) return null;
  const copy = async () => {
    try { await navigator.clipboard.writeText(info.code); setCopied(true); setTimeout(() => setCopied(false), 1500); }
    catch (_) { window.prompt(tx("ref.copy") + ":", info.code); }
  };
  return (
    <div className="card p-5 mb-5">
      <div className="font-display font-700 mb-2" style={{ color: "var(--gold)" }}>🎁 {tx("ref.title")}</div>
      <div className="text-xs mb-1" style={{ color: "var(--ink-soft)" }}>{tx("ref.yours")}</div>
      <div className="flex items-center gap-2 mb-3">
        <span className="font-mono text-xl font-700 tracking-widest px-3 py-1.5 rounded-lg border" style={{ borderColor: "var(--line)", background: "var(--panel-soft)" }}>{info.code}</span>
        <button type="button" onClick={copy} className="text-xs px-3 py-1.5 rounded-lg border font-600" style={{ borderColor: "var(--line)", color: copied ? "var(--leaf)" : "var(--ink-soft)" }}>
          {copied ? "✓ " + tx("ref.copied") : "📋 " + tx("ref.copy")}
        </button>
      </div>
      <p className="text-xs mb-2" style={{ color: "var(--ink-soft)" }}>{tx("ref.how", { b: taka(info.bonus) })}</p>
      <p className="text-xs font-600">{tx("ref.stats", { i: num(info.invited), r: num(info.rewarded), e: taka(info.earned) })}</p>
    </div>
  );
}

            {busy ? tx("adding") : tx("addmoney")}
          </button>
        </div>
        <SendMoneyCard balance={balance} onLookup={onLookup} onSend={onSend} />
      </div>
      <div className="lg:col-span-2 card p-5">
        <div className="font-display font-700 mb-4" style={{ color: "var(--gold)" }}>{tx("txhist")}</div>
        {transactions.length === 0 ? (
          <p className="text-sm" style={{ color: "var(--ink-soft)" }}>{tx("notx")}</p>
        ) : (
          <div className="space-y-1">
            {transactions.map((t, i) => (
              <div key={i} className="flex justify-between items-center py-2.5 text-sm" style={{ borderBottom: "1px solid var(--line)" }}>
                <div>
                  <div className="font-500">{txLabel(t.label)}</div>
                  <div className="text-xs" style={{ color: "var(--ink-soft)" }}>{t.time}</div>
                </div>
                <span className="font-mono font-600" style={{ color: t.amount > 0 ? "var(--leaf)" : "var(--brick)" }}>
                  {t.amount > 0 ? "+" : ""}{taka(t.amount)}
                </span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- Wallet: send money to another student / teacher ---------------- */
function SendMoneyCard({ balance, onLookup, onSend }) {
  const [toId, setToId] = useState("");
  const [recipient, setRecipient] = useState(null); // { name, externalId } once the ID is confirmed
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null); // { ok, text }

  const find = async () => {
    setMsg(null); setRecipient(null);
    if (!toId.trim()) return;
    setBusy(true);
    try { setRecipient(await onLookup(toId.trim())); }
    catch (e) { setMsg({ ok: false, text: e.message }); }
    finally { setBusy(false); }
  };

  const send = async () => {
    const n = Number(amount);
    if (!recipient || !(n > 0)) return;
    if (n > balance) { setMsg({ ok: false, text: tx("xfer.short") }); return; }
    if (!window.confirm(tx("xfer.confirm", { a: taka(n), n: recipient.name }))) return;
    setBusy(true); setMsg(null);
    try {
      await onSend(recipient.externalId, n, note.trim());
      setMsg({ ok: true, text: tx("xfer.ok", { a: taka(n), n: recipient.name }) });
      setToId(""); setRecipient(null); setAmount(""); setNote("");
    } catch (e) {
      setMsg({ ok: false, text: e.message });
    } finally { setBusy(false); }
  };

  return (
    <div className="card p-5 mt-5">
      <div className="font-display font-700 mb-1" style={{ color: "var(--gold)" }}>{tx("xfer.title")}</div>
      <p className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>{tx("xfer.sub")}</p>

      {!recipient ? (
        <form className="flex gap-2" onSubmit={e => { e.preventDefault(); find(); }}>
          <input value={toId} onChange={e => setToId(e.target.value)} placeholder={tx("xfer.id")}
            className="flex-1 min-w-0 px-3 py-2 rounded-lg border" style={{ borderColor: "var(--line)" }} />
          <button type="submit" disabled={busy || !toId.trim()} className="btn-primary px-4 rounded-lg text-sm disabled:opacity-50">{tx("xfer.find")}</button>
        </form>
      ) : (
        <div className="space-y-3">
          <div className="flex items-center justify-between gap-2 rounded-lg px-3 py-2" style={{ background: "var(--gold-soft)", color: "var(--teal-deep)" }}>
            <div className="text-sm font-700 truncate">{recipient.name} <span className="font-mono font-400 text-xs">({recipient.externalId})</span></div>
            <button type="button" onClick={() => { setRecipient(null); setMsg(null); }} className="text-xs font-600 underline">{tx("xfer.change")}</button>
          </div>
          <div className="flex gap-2">
            {[50, 100, 200].map(v => (
              <button key={v} type="button" onClick={() => setAmount(String(v))}
                className="flex-1 py-1.5 rounded-lg border text-sm font-mono" style={{ borderColor: "var(--line)" }}>{taka(v)}</button>
            ))}
          </div>
          <input type="number" min="1" value={amount} onChange={e => setAmount(e.target.value)} placeholder={tx("xfer.amount")}
            className="w-full px-3 py-2 rounded-lg border font-mono" style={{ borderColor: "var(--line)" }} />
          <input value={note} maxLength={40} onChange={e => setNote(e.target.value)} placeholder={`${tx("xfer.note")} — ${tx("xfer.note.ph")}`}
            className="w-full px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
          <button type="button" onClick={send} disabled={busy || !(Number(amount) > 0)} className="btn-primary w-full py-2.5 rounded-xl disabled:opacity-50">
            {busy ? tx("xfer.sending") : tx("xfer.send")}
          </button>
        </div>
      )}
      {msg && (
        <div className={`${msg.ok ? "success-banner" : "error-banner"} rounded-lg px-3 py-2 mt-3 text-sm`}>{msg.text}</div>
      )}
      <p className="text-[11px] mt-3" style={{ color: "var(--ink-soft)" }}>{tx("xfer.limit")}</p>
    </div>
  );
}

                          : { background: "var(--danger-bg, #FEF2F2)", color: "var(--danger-fg, #B91C1C)" };

                      <div className="flex items-center gap-2 flex-wrap">

    </div>
  );
