  .fade-in { animation: pageLift .3s ease-out both; }
  @keyframes pageLift { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

// Pickup-slot grid with the live rush meter (green = quiet … red = full).
function SlotPicker({ data, value, onChange }) {
  if (!data) return <p className="text-[11px] text-gray-400">…</p>;
  const slots = data.slots.filter(s => !s.past);
  if (slots.length === 0) return <p className="text-[11px] text-gray-400">{tr("No pickup slots on this date.")}</p>;
  const renderGroup = (kind) => {
    const list = slots.filter(s => s.kind === kind);
    if (!list.length) return null;
    return (
      <div key={kind} className="mb-2">
        {kind === "iftar" && <div className="text-[10px] font-700 mb-1" style={{ color: "#3F2E8C" }}>🌙 {tr("Iftar")}</div>}
        <div className="flex flex-wrap gap-1.5 overflow-y-auto pr-1" style={{ maxHeight: 176 }}>
          {list.map(s => (
            <button key={s.time} disabled={!s.available} onClick={() => onChange(value === s.time ? "" : s.time)} title={`${s.booked}/${s.capacity}${s.clash ? " · " + s.clash : ""}`}
                    className={`px-2 py-1 rounded-md border text-[11px] flex items-center gap-1 ${value === s.time ? "bg-amber-400 text-slate-950 font-700" : "border-amber-400/30"} ${!s.available ? "opacity-40 cursor-not-allowed line-through" : ""}`}>
              <span className="w-2 h-2 rounded-full inline-block" style={{ background: STATUS_DOT[s.status] }}></span>{s.time}{s.clash ? <span title={s.clash}>📚</span> : null}
            </button>
          ))}
        </div>
      </div>
    );
  };
  return (
    <div>
      {data.jummah && <div className="text-[10px] mb-1" style={{ color: "#8A5B00" }}>🕌 {tr("Jummah")}: slots pause 12:30–14:00 · extra capacity before/after</div>}
      {renderGroup("lunch")}{renderGroup("iftar")}
      <div className="flex gap-3 text-[10px] text-gray-400 mt-1 flex-wrap">
        {["quiet", "moderate", "busy", "full"].map(k => <span key={k} className="flex items-center gap-1"><span className="w-2 h-2 rounded-full inline-block" style={{ background: STATUS_DOT[k] }}></span>{tr(k[0].toUpperCase() + k.slice(1))}</span>)}
        <span>📚 {tr("class")}</span>
      </div>
    </div>
  );
}

function DietTags({ item }) {
  const bits = [];
  bits.push(<span key="v" className="text-[10px]" title={item.is_veg ? "Vegetarian" : "Contains meat/fish/egg"}>{item.is_veg ? "🟢" : "🔴"}</span>);
  if (item.spice_level > 0) bits.push(<span key="s" className="text-[10px]" title={`Spice ${item.spice_level}/3`}>{SPICE[item.spice_level]}</span>);
  if (item.has_nuts) bits.push(<span key="n" className="text-[10px]" title="Contains nuts">🥜</span>);
  if (item.is_halal === 0 || item.is_halal === false) bits.push(<span key="h" className="text-[10px] text-red-400">non-halal</span>);
  if (item.iftar_only) bits.push(<span key="i" className="text-[10px]" style={{ color: "#3F2E8C" }}>🌙 {tr("Iftar")}</span>);
  return <div className="flex items-center gap-1.5 mt-1">{bits}</div>;
}

// Order QR (SVG from the server, fetched with the login token).
function QRBox({ orderId }) {
  const [svg, setSvg] = useState("");
  useEffect(() => {
    let live = true;
    fetch(`${window.__campusApiBase}/api/orders/${orderId}/qr`, { headers: { Authorization: `Bearer ${window.__campusToken}` } })
      .then(r => (r.ok ? r.text() : "")).then(t => { if (live) setSvg(t); }).catch(() => {});
    return () => { live = false; };
  }, [orderId]);
  if (!svg) return <div className="text-[11px] text-gray-400 mt-3">…</div>;
  return <div className="mt-3 inline-block p-2 rounded-xl bg-white border" style={{ borderColor: "var(--panel-border)" }} dangerouslySetInnerHTML={{ __html: svg }} />;
}


/* ---------------- API helper ---------------- */
async function api(apiBase, path, { method = "GET", body, token } = {}) {
  const res = await fetch(`${apiBase}${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) { const err = new Error(data.error || `Request failed (${res.status})`); err.status = res.status; throw err; }
  return data;
}

                {roles.map((r) => (

                    style={{ borderColor: "var(--panel-border)", background: "rgba(255, 255, 255, 0.72)" }}>
                    <div className="w-11 h-11 rounded-lg grid place-items-center shrink-0 logo-badge">
                      <Icon path={r.icon} className="w-5 h-5" style={{ color: "var(--gold)" }} />

                    <div>
                      <div className="font-display font-700 text-sm group-hover:text-amber-300">{r.label}</div>
                      <div className="text-xs mt-0.5" style={{ color: "var(--ink-soft)" }}>{r.desc}</div>

            ) : mode === "forgot" ? (
              <div className="space-y-4">
                <button onClick={() => { setMode("login"); setError(null); }} className="text-xs mb-2 flex items-center gap-1.5" style={{ color: "var(--ink-soft)" }}>
                  <Icon path={I.arrow} className="w-3.5 h-3.5 rotate-180" /> Back to login
                </button>
                <div className="font-display font-700 text-lg text-center" style={{ color: "var(--gold-bright)" }}>Reset Password</div>
                <input value={externalId} onChange={e => setExternalId(e.target.value)} placeholder="User ID"
                       className="w-full px-4 py-3 rounded-lg border text-sm" style={{ borderColor: "var(--panel-border)" }} />
                  <input value={otp} onChange={e => setOtp(e.target.value)} placeholder="OTP"
                    className="w-full px-4 py-3 rounded-lg border text-sm" style={{ borderColor: "var(--panel-border)" }} />
                <input value={newPassword} onChange={e => setNewPassword(e.target.value)} type="password" placeholder="New Password"
                       className="w-full px-4 py-3 rounded-lg border text-sm" style={{ borderColor: "var(--panel-border)" }} />
                {error && <p className="text-xs text-red-400">{error}</p>}
                  <div className="flex gap-2">
                    <button disabled={busy} onClick={requestReset} className="flex-1 py-3 rounded-lg border border-amber-400/30 text-xs">Request OTP</button>
                    <button disabled={busy} onClick={submitReset} className="btn-primary flex-1 py-3 rounded-lg text-xs">Verify & Reset</button>
                  </div>
              </div>
            ) : (
              <div className="space-y-4">
                <button onClick={() => { setRole(null); setError(null); }} className="text-xs flex items-center gap-1.5" style={{ color: "var(--ink-soft)" }}>
                  <Icon path={I.arrow} className="w-3.5 h-3.5 rotate-180" /> Change Role
                </button>
                <div className="font-display font-700 text-lg text-center" style={{ color: "var(--gold-bright)" }}>
                  {roles.find(r => r.key === role)?.label} Access
                </div>

                <div className="flex p-1 rounded-full border mb-4" style={{ background: "var(--bg)", borderColor: "var(--panel-border)" }}>
                  <button onClick={() => setMode("login")} className={`flex-1 py-2 rounded-full text-xs font-display font-700 ${mode === "login" ? "bg-amber-400 text-slate-950" : "text-gray-400"}`}>Log In</button>
                  <button onClick={() => setMode("register")} className={`flex-1 py-2 rounded-full text-xs font-display font-700 ${mode === "register" ? "bg-amber-400 text-slate-950" : "text-gray-400"}`}>Register</button>
                </div>

                {mode === "register" && (
                  <input value={name} onChange={e => setName(e.target.value)} placeholder="Full Name"
                         className="w-full px-4 py-3 rounded-lg border text-sm" style={{ borderColor: "var(--panel-border)" }} />
                )}
                <input value={externalId} onChange={e => setExternalId(e.target.value)} placeholder="ID Number"
                       className="w-full px-4 py-3 rounded-lg border text-sm" style={{ borderColor: "var(--panel-border)" }} />
                <div>
                  <input value={password} onChange={e => setPassword(e.target.value)} type="password" placeholder="Password"
                         className="w-full px-4 py-3 rounded-lg border text-sm" style={{ borderColor: "var(--panel-border)" }} />
                  {mode === "login" && (
                    <button onClick={() => { setMode("forgot"); setError(null); }} className="text-xs mt-2 text-amber-400">
                      Forgot Password?
                    </button>
                  )}
                </div>

                {error && <p className="text-xs text-red-400">{error}</p>}
                {resetMsg && <p className="text-xs text-emerald-400">{resetMsg}</p>}

                <button disabled={busy} onClick={submit} className="btn-primary w-full py-3 rounded-lg text-xs">
                  {busy ? "Authenticating..." : mode === "login" ? "Enter Portal" : "Create Account & Enter"}
                </button>

                <div className="pt-2 text-center">
                  <button onClick={() => setShowAdvanced(!showAdvanced)} className="text-[11px] flex items-center justify-center gap-1 mx-auto text-gray-400">
                    <Icon path={I.plug} className="w-3.5 h-3.5" /> Backend Server Host
                  </button>
                  {showAdvanced && (
                    <input value={apiBase} onChange={e => setApiBase(e.target.value)}
                           className="w-full mt-2 px-3 py-2 rounded-md border text-xs font-mono" style={{ borderColor: "var(--panel-border)" }} />
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      </section>

      <footer className="border-t py-10 px-6 bg-white" style={{ borderColor: "var(--line)" }}>
        <p className="text-center text-sm text-gray-400">
          &copy; 2026 CampusDine — CSE Software Project
        </p>
      </footer>
    </div>
  );
}

/* ---------------- Top Navbar ---------------- */
function TopBar({ role, name, tabs, active, setActive, onLogout, connected, notifs, onReadNotifs, lang, toggleLang, darkMode, setDarkMode }) {
  const [open, setOpen] = useState(false);
  useEffect(() => {
    if (!open) return;
    const handle = (e) => {
      // Close if click is outside the notification container
      setOpen(false);
    };
    // Small timeout so the current click that opened it doesn't immediately close it
    const timer = setTimeout(() => document.addEventListener('click', handle), 0);
    return () => { clearTimeout(timer); document.removeEventListener('click', handle); };
  }, [open]);
  return (
    <div className="topbar sticky top-0 z-20">
      <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-4 flex-wrap">
        <div className="flex items-center gap-3">
          <div className="logo-badge w-9 h-9 grid place-items-center">
            <Icon path={I.ticket} className="w-4 h-4" />
          </div>
          <div>
            <span className="font-display font-800 text-lg leading-none block text-white">CampusDine</span>
            <div className="flex items-center gap-1.5 mt-0.5">
              <span className="w-1.5 h-1.5 rounded-full" style={{ background: connected ? "var(--leaf)" : "var(--brick)" }}></span>
              <span className="text-[10px]" style={{ color: "var(--ink-soft)" }}>{connected ? "Live System" : "Offline"}</span>
            </div>
          </div>
        </div>

        <div className="flex gap-1.5 flex-wrap">
          {tabs.map(t => (
            <button key={t.key} onClick={() => setActive(t.key)}
                    className={`tab-btn px-4 py-2 rounded-lg text-xs flex items-center gap-2 ${active === t.key ? "active" : ""}`}>
              <Icon path={t.icon} className="w-3.5 h-3.5" /> {tr(t.label)}
            </button>
          ))}
        </div>

        <div className="flex items-center gap-4">
          <button onClick={() => setDarkMode && setDarkMode(!darkMode)} title={darkMode ? "Light mode" : "Dark mode"} className="px-2.5 py-1.5 rounded-lg border text-[11px] font-700" style={{ borderColor: "var(--panel-border)" }}>{darkMode ? "☀️" : "🌙"}</button>
          <button onClick={toggleLang} title="English / বাংলা" className="px-2.5 py-1.5 rounded-lg border text-[11px] font-700" style={{ borderColor: "var(--panel-border)" }}>{lang === "bn" ? "EN" : "বাং"}</button>
          {notifs && (
            <div className="relative">
              <button onClick={() => { const next = !open; setOpen(next); if (next && notifs.unread > 0) onReadNotifs(); }} title="Notifications" className="p-2 rounded-lg border relative" style={{ borderColor: "var(--panel-border)" }}>
                <Icon path={I.bell} className="w-4 h-4" />
                {notifs.unread > 0 && <span className="absolute -top-1.5 -right-1.5 min-w-4 h-4 px-1 rounded-full bg-red-500 text-white text-[10px] grid place-items-center">{notifs.unread}</span>}
              </button>
              {open && (
                <div className="absolute right-0 mt-2 w-72 max-h-80 overflow-auto rounded-xl border shadow-lg z-40" style={{ background: "#fff", borderColor: "var(--panel-border)" }}>
                  {notifs.list.length === 0 ? <p className="text-xs p-4" style={{ color: "var(--ink-soft)" }}>No notifications yet.</p> : notifs.list.map(n => (
                    <div key={n.id} className="p-3 text-xs border-b" style={{ borderColor: "var(--panel-border)" }}>
                      <div>{n.message}</div>
                      <div className="text-[10px] mt-1" style={{ color: "var(--ink-soft)" }}>{new Date(n.sent_at).toLocaleString()}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
          <div className="text-right hidden sm:block">
            <div className="text-xs font-700 leading-tight">{name}</div>
            <div className="text-[10px] capitalize font-mono mt-0.5 text-amber-400">{role}</div>
          </div>
          <button onClick={onLogout} title="Log Out" className="p-2 rounded-lg border border-red-900/40 hover:border-red-500 transition-colors">
            <Icon path={I.logout} className="w-4 h-4 text-red-400" />
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------------- Menu & Order Tab ---------------- */
function MenuOrder({ menu, cart, setCart, placeOrder, walletBalance, busy, favorites, toggleFavorite, call, receivingNumber, availableCoupons, refreshMenu }) {
  const [cat, setCat] = useState("");
  const [search, setSearch] = useState("");
  const [debouncedSearch, setDebouncedSearch] = useState("");
  useEffect(() => {
    const t = setTimeout(() => setDebouncedSearch(search), 250);
    return () => clearTimeout(t);
  }, [search]);
  const [minPrice, setMinPrice] = useState("");
  const [maxPrice, setMaxPrice] = useState("");
  const [availableOnly, setAvailableOnly] = useState(true);
  const [couponCode, setCouponCode] = useState("");
  const [coupon, setCoupon] = useState(null);
  const [couponMessage, setCouponMessage] = useState("");
  const [dayOffset, setDayOffset] = useState(0);
  const mealDate = isoDay(dayOffset);
  const [slotData, setSlotData] = useState(null);
  const [slot, setSlot] = useState("");
  const [suggest, setSuggest] = useState(null);
  const [veg, setVeg] = useState(false);
  const [noNuts, setNoNuts] = useState(false);
  const [mild, setMild] = useState(false);
  const [listening, setListening] = useState(false);
  const [impact, setImpact] = useState(null);
  const [budget, setBudget] = useState(null);
  const didRefresh = useRef(false);
  useEffect(() => {
    if (!didRefresh.current) {
      didRefresh.current = true;
      if (refreshMenu) refreshMenu();
    }
    call("/api/rewards/impact").then(setImpact).catch(() => {});
    call("/api/budget").then(setBudget).catch(() => {});
  }, []);
  useEffect(() => {
    setSlot("");
    call(`/api/slots?date=${mealDate}`).then(setSlotData).catch(() => setSlotData(null));
    call(`/api/schedule/suggest?date=${mealDate}`).then(setSuggest).catch(() => setSuggest(null));
  }, [mealDate]);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const listen = () => {
    if (!SR) return;
    const r = new SR(); r.lang = LANG === "bn" ? "bn-BD" : "en-US"; r.interimResults = false;
    r.onstart = () => setListening(true); r.onend = () => setListening(false); r.onerror = () => setListening(false);
    r.onresult = (e) => setSearch(String(e.results[0][0].transcript || "").replace(/[.।]$/, ""));
    r.start();
  };
  // Last-hour deals only apply to today's meals; the server re-checks the price when the order is placed.
  const priceOf = (i) => { const m = menu.find(x => x.id === i.id) || i; return mealDate === isoDay(0) && m.surplus_price != null ? m.surplus_price : m.price; };
  const dealItems = mealDate === isoDay(0) ? menu.filter(m => m.surplus_active) : [];
  const filtered = menu.filter(i => (!veg || i.is_veg) && (!noNuts || !i.has_nuts) && (!mild || i.spice_level <= 1) && (!cat || i.category === cat) && (!debouncedSearch || `${i.name} ${i.bn || ""} ${i.description || ""}`.toLowerCase().includes(debouncedSearch.toLowerCase())) && (!minPrice || Number(i.price) >= Number(minPrice)) && (!maxPrice || Number(i.price) <= Number(maxPrice)) && (!availableOnly || i.stock > 0));
  const [payMethod, setPayMethod] = useState("wallet");

  const add = (item) => setCart(prev => {
    const existing = prev.find(p => p.id === item.id);
    if (existing) return prev.map(p => p.id === item.id ? { ...p, qty: Math.min(p.qty + 1, item.stock ?? 20, 20) } : p);
    return [...prev, { ...item, qty: 1 }];
  });
  const dec = (item) => setCart(prev => prev.map(p => p.id === item.id ? { ...p, qty: p.qty - 1 } : p).filter(p => p.qty > 0));

  const subtotal = cart.reduce((s, i) => s + priceOf(i) * i.qty, 0);
  const total = Math.max(0, subtotal - Number(coupon?.discountAmount || 0));
  const canPay = payMethod !== "wallet" || walletBalance >= total;
  const hasIftar = cart.some(c => (menu.find(m => m.id === c.id) || c).iftar_only);
  const slotKind = slotData && slotData.slots.find(s => s.time === slot)?.kind;
  const iftarBlock = hasIftar && slotKind !== "iftar";
  const projected = budget && budget.limit ? budget.spent + total : null;
  // A validated coupon is only valid for the cart it was checked against.
  useEffect(() => { setCoupon(null); setCouponMessage(""); }, [subtotal]);
  const validateCoupon = async () => {
    if (!couponCode) return;
    try { const data = await call("/api/coupons/validate", { method: "POST", body: { couponCode, orderAmount: subtotal } }); setCoupon(data); setCouponMessage(`Discount applied: ${taka(data.discountAmount)}`); }
    catch (e) { setCoupon(null); setCouponMessage(e.message); }
  };

  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2">
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-2 mb-4">
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder={tr("Search meals")} className="px-3 py-2 rounded-lg border text-xs" style={{ borderColor: "var(--panel-border)" }} />
          <input type="number" min="0" value={minPrice} onChange={e => setMinPrice(e.target.value)} placeholder="Min price" className="px-3 py-2 rounded-lg border text-xs" style={{ borderColor: "var(--panel-border)" }} />
          <input type="number" min="0" value={maxPrice} onChange={e => setMaxPrice(e.target.value)} placeholder="Max price" className="px-3 py-2 rounded-lg border text-xs" style={{ borderColor: "var(--panel-border)" }} />
          <label className="flex items-center gap-2 px-3 text-xs"><input type="checkbox" checked={availableOnly} onChange={e => setAvailableOnly(e.target.checked)} /> {tr("Available only")}</label>
        </div>
        <div className="card p-4 mb-4">
          <div className="flex items-center gap-2 flex-wrap mb-2">
            <span className="text-xs font-700">📅 {tr("When do you want to eat?")}</span>
            <DayPicker value={dayOffset} onChange={setDayOffset} />
            <span className="text-[11px] text-gray-400">{slot ? `${tr("Pickup")} ${slot}` : tr("No pickup time chosen")}</span>
          </div>
          {suggest && suggest.suggestedSlot && slot !== suggest.suggestedSlot && <div className="note note-ok flex items-center gap-2 text-[11px] mb-2 p-2">📚 {suggest.message} <button onClick={() => setSlot(suggest.suggestedSlot)} className="px-2 py-0.5 rounded border border-emerald-600 font-700">Use {suggest.suggestedSlot}</button></div>}
          <SlotPicker data={slotData} value={slot} onChange={setSlot} />
        </div>
        <div className="flex gap-2 mb-4 flex-wrap text-[11px]">
          {[[veg, setVeg, "🟢 " + tr("Vegetarian")], [noNuts, setNoNuts, "🥜 " + tr("No nuts")], [mild, setMild, "🌶 " + tr("Mild (not spicy)")]].map(([on, set, label]) => <button key={label} onClick={() => set(!on)} className={`px-3 py-1.5 rounded-full border ${on ? "bg-amber-400 text-slate-950 font-700" : "border-amber-400/30"}`}>{label}</button>)}
          {SR && <button onClick={listen} className={`px-3 py-1.5 rounded-full border ${listening ? "bg-red-500 text-white" : "border-amber-400/30"}`}>🎤 {listening ? tr("Listening…") : tr("Voice search")}</button>}
        </div>
        {dealItems.length > 0 && <div className="note note-warn p-3 mb-4 text-xs">⏰ <b>{tr("Last-hour deal")}!</b> {dealItems.length} item{dealItems.length > 1 ? "s" : ""} discounted until closing — prices below already include it.</div>}
        {impact && impact.mealsSaved > 0 && <div className="text-[11px] text-gray-400 mb-3">🌱 {impact.mealsSaved} {tr("meals saved from waste")}</div>}
        <div className="flex gap-2 mb-5 flex-wrap">
          <button onClick={() => setCat("")} className={`tab-btn px-4 py-2 rounded-full text-xs ${!cat ? "active" : ""}`}>{tr("All")}</button>
          {CATEGORIES.map(c => (
            <button key={c.id} onClick={() => setCat(c.id)} className={`tab-btn px-4 py-2 rounded-full text-xs ${cat === c.id ? "active" : ""}`}>
              {tr(c.label)}
            </button>
          ))}
        </div>
        {favorites.length > 0 && <div className="card p-3 mb-5 text-xs"><span className="text-amber-300 font-700">Favorites:</span> {favorites.map(item => <button key={item.id} disabled={item.stock <= 0} onClick={() => add(item)} className="ml-2 text-gray-300 hover:text-amber-300 disabled:opacity-40 disabled:line-through">{item.name}</button>)}</div>}
        <div className="grid sm:grid-cols-2 gap-4">
          {filtered.map(item => {
            const out = item.stock <= 0;
            const inCart = cart.find(c => c.id === item.id);
            const isFavorite = favorites.some(f => f.id === item.id);
            return (
              <div key={item.id} className={`card p-4 flex flex-col justify-between ${out ? "opacity-40" : ""}`}>
                <div>
                  <div className="flex items-start justify-between gap-2">
                    <div className="flex-1 min-w-0">
                      <div className="font-display font-700 text-amber-300">{item.name}</div>
                      <div className="text-xs text-gray-400 mt-0.5">{item.bn}</div>
                      <DietTags item={item} />
                      {item.rating_count > 0 && <div className="text-[11px] text-amber-500 mt-0.5">★ {item.avg_rating} <span className="text-gray-400">({item.rating_count})</span></div>}
                      {!out && item.stock <= LOW_STOCK_THRESHOLD && <div className="text-[10px] text-red-400 mt-0.5">Only {item.stock} left</div>}
                    </div>
                    <div className="flex flex-col items-end gap-1 shrink-0">
                      <button onClick={() => toggleFavorite(item)} title={isFavorite ? "Remove favorite" : "Add favorite"} className={`text-lg leading-none ${isFavorite ? "text-amber-300" : "text-gray-400 hover:text-amber-300"}`}>★</button>
                      {item.tag && !out && (
                        <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-amber-400 text-slate-950 font-700">{item.tag}</span>
                      )}
                    </div>
                  </div>
                </div>
                <div className="mt-4 flex items-center justify-between">
                  <span className="font-mono font-700 text-lg">{mealDate === isoDay(0) && item.surplus_price != null ? <><span className="text-xs line-through text-gray-400 mr-1">{taka(item.price)}</span><span style={{ color: "#D92D20" }}>{taka(item.surplus_price)}</span></> : taka(item.price)}</span>
                  {out ? (
                    <span className="text-xs text-red-400 font-600">{tr("Stock Out")}</span>
                  ) : inCart ? (
                    <div className="flex items-center gap-2">
                      <button onClick={() => dec(item)} className="w-7 h-7 rounded-full grid place-items-center border border-amber-400/30"><Icon path={I.minus} className="w-3.5 h-3.5" /></button>
                      <span className="font-mono w-5 text-center text-sm">{inCart.qty}</span>
                      <button onClick={() => add(item)} className="w-7 h-7 rounded-full grid place-items-center bg-amber-400 text-slate-950"><Icon path={I.plus} className="w-3.5 h-3.5" /></button>
                    </div>
                  ) : (
                    <button onClick={() => add(item)} className="btn-primary px-4 py-1.5 rounded-md text-xs">{tr("Add")}</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div>
        <div className="card p-5 sticky top-20">
          <div className="font-display font-700 flex items-center gap-2 mb-4 text-amber-300">
            <Icon path={I.cart} className="w-5 h-5" /> {tr("Cart Summary")}
          </div>
          {cart.length === 0 ? (
            <div className="text-center py-6">
              <div className="text-3xl mb-2">🍽️</div>
              <p className="text-xs font-600 text-gray-500">কার্ট খালি</p>
              <p className="text-[11px] text-gray-400 mt-0.5">মেনু থেকে খাবার পছন্দ করে কার্টে যোগ করুন।</p>
            </div>
          ) : (
            <div className="space-y-2 mb-4">
              {cart.map(i => (
                <div key={i.id} className="flex justify-between text-xs">
                  <span>{i.name} × {i.qty}</span>
                  <span className="font-mono">{taka(priceOf(i) * i.qty)}</span>
                </div>
              ))}
            </div>
          )}
          {cart.length > 0 && <div className="text-[11px] text-gray-400 mb-2">📅 {dayText(dayOffset)} · {slot ? `${tr("Pickup")} ${slot}` : tr("No pickup time chosen")}</div>}
          <div className="border-t border-amber-400/20 pt-3 mb-4">
            <div className="flex justify-between font-700 text-sm">
              <span>{tr("Total Amount")}</span>
              <span className="font-mono text-amber-300">{taka(total)}</span>
            </div>
            {coupon && <div className="text-[11px] text-green-300 mt-1">Coupon discount: -{taka(coupon.discountAmount)}</div>}
            {projected != null && cart.length > 0 && <div className={`text-[11px] mt-1 ${projected > budget.limit ? "text-red-400" : "text-gray-400"}`}>{projected > budget.limit ? `⚠ Over your weekly budget by ${taka(projected - budget.limit)}` : `💰 ${taka(budget.limit - projected)} left in your weekly budget`}</div>}
          </div>
          {cart.length > 0 && (
            <>
              <div className="flex gap-2 mb-3">
                <input value={couponCode} onChange={e => setCouponCode(e.target.value.toUpperCase())} placeholder="Coupon code" className="flex-1 px-3 py-2 rounded-lg border text-xs" style={{ borderColor: "var(--panel-border)" }} />
                <button onClick={validateCoupon} className="px-3 rounded-lg border border-amber-400/30 text-xs">Apply</button>
              </div>
              {availableCoupons.length > 0 && <div className="note note-warn mb-3 p-3"><div className="text-[10px] uppercase tracking-wider font-700 mb-2" style={{ color: "#8A5B00" }}>Available offers</div><div className="flex flex-wrap gap-2">{availableCoupons.map(offer => <button key={offer.id} onClick={() => setCouponCode(offer.code)} className="px-2.5 py-1.5 rounded-lg text-[11px] font-mono font-700" style={{ background: "#fff", color: "#101B2D", border: "1.5px dashed #101B2D" }}>{offer.code} <span className="font-sans">{offer.discount_type === "PERCENTAGE" ? `${offer.discount_value}% off` : `${taka(offer.discount_value)} off`}</span></button>)}</div></div>}
              {couponMessage && <p className="text-[11px] text-gray-400 mb-3">{couponMessage}</p>}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4 text-xs">
                <button onClick={() => setPayMethod("wallet")} className={`flex-1 py-2 rounded-lg border ${payMethod === "wallet" ? "bg-amber-400 text-slate-950 font-700" : "border-amber-400/20"}`}>
                  Wallet
                </button>
                <button onClick={() => setPayMethod("cash")} className={`flex-1 py-2 rounded-lg border ${payMethod === "cash" ? "bg-amber-400 text-slate-950 font-700" : "border-amber-400/20"}`}>
                  Cash
                </button>
                {[['bkash', 'bKash'], ['nagad', 'Nagad']].map(([key, label]) => <button key={key} onClick={() => setPayMethod(key)} className={`py-2 rounded-lg border ${payMethod === key ? "bg-amber-400 text-slate-950 font-700" : "border-amber-400/20"}`}>{label}</button>)}
              </div>
              {payMethod !== "wallet" && payMethod !== "cash" && <p className="text-[11px] text-amber-300 mb-3">Send payment to {receivingNumber || "the configured receiving number"}. Payment initiation starts after order creation.</p>}
              {payMethod === "wallet" && !canPay && (
                <p className="text-[11px] text-red-400 mb-3">পর্যাপ্ত ব্যালেন্স নেই, ওয়ালেট রিচার্জ করুন।</p>
              )}
              {iftarBlock && <p className="text-[11px] mb-3" style={{ color: "#3F2E8C" }}>🌙 Iftar items need an iftar pickup slot — choose one above.</p>}
              <button disabled={!canPay || busy || iftarBlock} onClick={() => placeOrder(cart, payMethod, coupon, total, { pickupSlot: slot || null, mealDate })} className="btn-primary w-full py-2.5 rounded-lg text-xs">
                {busy ? "Placing Order..." : tr("Confirm & Get Token")}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Friends: group orders + treats ---------------- */
function TreatSection({ call, menu, showError, refreshWallet }) {
  const [toId, setToId] = useState("");
  const [friend, setFriend] = useState("");
  const [kind, setKind] = useState("credit");
  const [amount, setAmount] = useState("");
  const [itemId, setItemId] = useState("");
  const [qty, setQty] = useState(1);
  const [dayOffset, setDayOffset] = useState(0);
  const [slot, setSlot] = useState("");
  const [slotData, setSlotData] = useState(null);
  const [message, setMessage] = useState("");
  const [info, setInfo] = useState("");
  const [history, setHistory] = useState({ sent: [], received: [] });
  const loadHistory = () => call("/api/treats").then(setHistory).catch(() => {});
  useEffect(() => { loadHistory(); }, []);
  useEffect(() => { if (kind === "meal") call(`/api/slots?date=${isoDay(dayOffset)}`).then(setSlotData).catch(() => setSlotData(null)); setSlot(""); }, [kind, dayOffset]);
  const lookup = async () => { setFriend(""); if (!toId.trim()) return; try { const d = await call(`/api/treats/lookup?externalId=${encodeURIComponent(toId.trim())}`); setFriend(d.name); } catch (e) { setFriend(""); setInfo(e.message); } };
  const send = async () => {
    setInfo("");
    try {
      const body = { toExternalId: toId.trim(), kind, message };
      if (kind === "credit") body.amount = Number(amount); else { body.menuItemId = Number(itemId); body.qty = Number(qty); body.mealDate = isoDay(dayOffset); if (slot) body.pickupSlot = slot; }
      const r = await call("/api/treats", { method: "POST", body });
      setInfo(`✅ ${r.message}`); setAmount(""); setMessage(""); await Promise.all([refreshWallet(), loadHistory()]);
    } catch (e) { showError(e); }
  };
  return (
    <div className="card p-5">
      <div className="font-display font-700 text-amber-300 mb-3">🎁 {tr("Treat a friend")}</div>
      <div className="grid sm:grid-cols-2 gap-2 mb-3">
        <div className="flex gap-2"><input value={toId} onChange={e => { setToId(e.target.value); setFriend(""); }} onBlur={lookup} placeholder={tr("Friend's ID")} className={`${inputCls} flex-1`} style={inputStyle} /><button onClick={lookup} className="px-3 rounded-lg border border-amber-400/30 text-xs">Check</button></div>
        <div className="text-xs self-center">{friend ? <span className="text-emerald-600">✓ {friend}</span> : <span className="text-gray-400">{info}</span>}</div>
      </div>
      <div className="flex gap-2 mb-3 text-xs">
        {[["credit", tr("Send credit")], ["meal", tr("Buy a meal")]].map(([k, label]) => <button key={k} onClick={() => setKind(k)} className={`tab-btn px-4 py-2 rounded-full ${kind === k ? "active" : ""}`}>{label}</button>)}
      </div>
      {kind === "credit" ? (
        <input type="number" min="1" max="1000" value={amount} onChange={e => setAmount(e.target.value)} placeholder="৳ Amount" className={`${inputCls} w-40 mb-3`} style={inputStyle} />
      ) : (
        <div className="space-y-2 mb-3">
          <div className="flex gap-2 flex-wrap">
            <select value={itemId} onChange={e => setItemId(e.target.value)} className={inputCls} style={inputStyle}><option value="">Choose item…</option>{menu.filter(m => m.stock > 0).map(m => <option key={m.id} value={m.id}>{m.name} · {taka(m.price)}</option>)}</select>
            <input type="number" min="1" max="5" value={qty} onChange={e => setQty(e.target.value)} className={`${inputCls} w-20`} style={inputStyle} />
            <DayPicker value={dayOffset} onChange={setDayOffset} />
          </div>
          <SlotPicker data={slotData} value={slot} onChange={setSlot} />
        </div>
      )}
      <div className="flex gap-2 flex-wrap">
        <input value={message} maxLength={140} onChange={e => setMessage(e.target.value)} placeholder={tr("Message")} className={`${inputCls} flex-1 min-w-[10rem]`} style={inputStyle} />
        <button onClick={send} disabled={!toId || (kind === "credit" ? !amount : !itemId)} className="btn-primary px-5 py-2 rounded-lg text-xs">{tr("Send")}</button>
      </div>
      {info && friend && <p className="text-[11px] mt-2 text-emerald-600">{info}</p>}
      {(history.sent.length > 0 || history.received.length > 0) && (
        <div className="grid sm:grid-cols-2 gap-4 mt-4 text-[11px]">
          <div><div className="font-700 mb-1">Sent</div>{history.sent.slice(0, 5).map(t => <div key={t.id} className="text-gray-400">{t.kind === "credit" ? `৳${t.amount}` : "🍽 meal"} → {t.other}</div>)}</div>
          <div><div className="font-700 mb-1">Received</div>{history.received.slice(0, 5).map(t => <div key={t.id} className="text-gray-400">{t.kind === "credit" ? `৳${t.amount}` : "🍽 meal"} ← {t.other}{t.message ? ` “${t.message}”` : ""}</div>)}</div>
        </div>
      )}
    </div>
  );
}

function GroupSection({ call, menu, me, showError, refreshWallet, refreshOrders }) {
  const [groups, setGroups] = useState([]);
  const [group, setGroup] = useState(null);
  const [joinCode, setJoinCode] = useState("");
  const [form, setForm] = useState({ name: "", splitMode: "equal", dayOffset: 0, slot: "" });
  const [slotData, setSlotData] = useState(null);
  const [pick, setPick] = useState({ id: "", qty: 1 });
  const loadList = () => call("/api/groups/mine").then(d => setGroups(d.groups)).catch(() => {});
  useEffect(() => { loadList(); }, []);
  useEffect(() => { setForm(f => ({ ...f, slot: "" })); call(`/api/slots?date=${isoDay(form.dayOffset)}`).then(setSlotData).catch(() => setSlotData(null)); }, [form.dayOffset]);
  useEffect(() => {
    if (!group || group.status !== "open") return undefined;
    const t = setInterval(() => call(`/api/groups/${group.code}`).then(setGroup).catch(() => {}), 4000);
    return () => clearInterval(t);
  }, [group && group.code, group && group.status]);
  const act = async (fn) => { try { await fn(); } catch (e) { showError(e); } };
  const open = (code) => act(async () => setGroup(await call(`/api/groups/${code}`)));
  const create = () => act(async () => { setGroup(await call("/api/groups", { method: "POST", body: { name: form.name, splitMode: form.splitMode, mealDate: isoDay(form.dayOffset), pickupSlot: form.slot || undefined } })); setForm(f => ({ ...f, name: "" })); loadList(); });
  const join = () => act(async () => { setGroup(await call("/api/groups/join", { method: "POST", body: { code: joinCode } })); setJoinCode(""); loadList(); });
  const setQty = (itemId, qty) => act(async () => setGroup(await call(`/api/groups/${group.code}/items`, { method: "PUT", body: { itemId, qty } })));
  const confirm = (v) => act(async () => setGroup(await call(`/api/groups/${group.code}/confirm`, { method: "POST", body: { confirmed: v } })));
  const checkout = () => act(async () => { await call(`/api/groups/${group.code}/checkout`, { method: "POST" }); await Promise.all([refreshWallet(), refreshOrders()]); setGroup(await call(`/api/groups/${group.code}`)); loadList(); });
  const cancelGroup = () => act(async () => { await call(`/api/groups/${group.code}`, { method: "DELETE" }); setGroup(null); loadList(); });
  const leave = () => act(async () => { await call(`/api/groups/${group.code}/leave`, { method: "POST" }); setGroup(null); loadList(); });
  const myQty = (id) => (group ? (group.items.find(i => i.userId === me && i.itemId === id) || {}).qty || 0 : 0);

  return (
    <div className="card p-5">
      <div className="font-display font-700 text-amber-300 mb-3">👥 {tr("Group orders")}</div>
      {!group && (
        <div className="space-y-4">
          <div className="grid sm:grid-cols-2 gap-4">
            <div className="space-y-2">
              <input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder={tr("Group name")} className={`${inputCls} w-full`} style={inputStyle} />
              <div className="flex gap-2 flex-wrap">
                <DayPicker value={form.dayOffset} onChange={o => setForm({ ...form, dayOffset: o })} />
                <select value={form.splitMode} onChange={e => setForm({ ...form, splitMode: e.target.value })} className={inputCls} style={inputStyle}><option value="equal">{tr("Equal split")}</option><option value="own">{tr("Everyone pays own items")}</option></select>
              </div>
              <SlotPicker data={slotData} value={form.slot} onChange={s => setForm({ ...form, slot: s })} />
              <button onClick={create} disabled={!form.name.trim()} className="btn-primary px-4 py-2 rounded-lg text-xs">{tr("Create group")}</button>
            </div>
            <div className="space-y-2">
              <div className="flex gap-2"><input value={joinCode} onChange={e => setJoinCode(e.target.value.toUpperCase())} maxLength={8} placeholder={tr("Group code")} className={`${inputCls} flex-1 font-mono`} style={inputStyle} /><button onClick={join} disabled={joinCode.length < 4} className="px-4 rounded-lg border border-amber-400/40 text-xs">{tr("Join")}</button></div>
              {groups.length > 0 && <div className="text-[11px] space-y-1 pt-2">{groups.map(g => <button key={g.code} onClick={() => open(g.code)} className="block w-full text-left p-2 rounded-lg border border-amber-400/20 hover:border-amber-400"><b>{g.name}</b> · <span className="font-mono">{g.code}</span> · {g.members} 👤 · {String(g.meal_date).slice(0, 10)}{g.pickup_slot ? ` ${g.pickup_slot}` : ""} · <span className={g.status === "open" ? "text-emerald-600" : "text-gray-400"}>{g.status}</span></button>)}</div>}
            </div>
          </div>
        </div>
      )}
      {group && (
        <div className="space-y-4">
          <div className="flex items-start justify-between gap-3 flex-wrap">
            <div><div className="font-700">{group.name} <span className={`text-[10px] px-2 py-0.5 rounded-full ${group.status === "open" ? "bg-emerald-100 text-emerald-700" : "bg-gray-200 text-gray-600"}`}>{group.status}</span></div>
              <div className="text-[11px] text-gray-400">{group.mealDate}{group.pickupSlot ? ` · ${tr("Pickup")} ${group.pickupSlot}` : ""} · {group.splitMode === "equal" ? tr("Equal split") : tr("Everyone pays own items")} · host {group.host.name}</div></div>
            <div className="text-right"><div className="text-[10px] text-gray-400">{tr("Group code")}</div><div className="font-mono text-xl font-800 tracking-widest text-amber-300">{group.code}</div></div>
          </div>
          <div className="grid sm:grid-cols-2 gap-4">
            <div>
              <div className="text-[11px] font-700 mb-1">Members</div>
              {group.members.map(m => <div key={m.userId} className="flex justify-between text-xs py-1 border-b border-amber-400/10"><span>{m.confirmed ? "✅" : "⏳"} {m.name}{m.isHost ? " 👑" : ""}</span><span className="font-mono">{taka(m.share)}</span></div>)}
              <div className="flex justify-between text-sm font-700 pt-2"><span>Total</span><span className="font-mono text-amber-300">{taka(group.total)}</span></div>
            </div>
            <div>
              <div className="text-[11px] font-700 mb-1">Cart</div>
              {group.items.length === 0 && <p className="text-xs text-gray-400">Nobody has added food yet.</p>}
              {group.items.map(i => <div key={`${i.userId}-${i.itemId}`} className="flex justify-between items-center text-xs py-1 border-b border-amber-400/10"><span>{i.name} × {i.qty} <span className="text-gray-400">({i.userName})</span></span>
                <span className="flex items-center gap-1">{group.status === "open" && i.userId === me && <><button onClick={() => setQty(i.itemId, i.qty - 1)} className="w-5 h-5 rounded-full border border-amber-400/30">−</button><button onClick={() => setQty(i.itemId, i.qty + 1)} className="w-5 h-5 rounded-full border border-amber-400/30">+</button></>}<span className="font-mono w-12 text-right">{taka(i.line)}</span></span></div>)}
              {group.status === "open" && (
                <div className="flex gap-2 mt-2">
                  <select value={pick.id} onChange={e => setPick({ ...pick, id: e.target.value })} className={`${inputCls} flex-1`} style={inputStyle}><option value="">Add my item…</option>{menu.filter(m => m.stock > 0).map(m => <option key={m.id} value={m.id}>{m.name} · {taka(m.price)}</option>)}</select>
                  <input type="number" min="1" max="20" value={pick.qty} onChange={e => setPick({ ...pick, qty: e.target.value })} className={`${inputCls} w-16`} style={inputStyle} />
                  <button disabled={!pick.id} onClick={() => setQty(Number(pick.id), myQty(Number(pick.id)) + Number(pick.qty))} className="px-3 rounded-lg border border-amber-400/40 text-xs">{tr("Add")}</button>
                </div>
              )}
            </div>
          </div>
          {group.status === "open" ? (
            <div className="flex gap-2 flex-wrap items-center">
              <button onClick={() => confirm(!group.myConfirmed)} disabled={group.items.length === 0} className={`px-4 py-2 rounded-lg text-xs ${group.myConfirmed ? "border border-emerald-500 text-emerald-700" : "btn-primary"}`}>{group.myConfirmed ? "✅ Confirmed (tap to undo)" : tr("Confirm")}</button>
              {group.isHost ? <><button onClick={checkout} disabled={!group.allConfirmed || group.items.length === 0} className="btn-primary px-4 py-2 rounded-lg text-xs">{tr("Place group order")}</button><button onClick={cancelGroup} className="px-3 py-2 rounded-lg border border-red-500/40 text-red-400 text-xs">Cancel group</button></> : <button onClick={leave} className="px-3 py-2 rounded-lg border border-red-500/40 text-red-400 text-xs">Leave</button>}
              <span className="text-[11px] text-gray-400">{group.isHost ? (group.allConfirmed ? "Everyone confirmed — you can place the order." : "Waiting for everyone to confirm. Any cart change resets confirmations.") : "Payment happens when the host places the order."}</span>
            </div>
          ) : <p className="text-xs text-emerald-600">{group.status === "placed" ? "✅ Order placed — follow it in Track Order." : "This group was cancelled."}</p>}
          <button onClick={() => { setGroup(null); loadList(); }} className="text-[11px] text-gray-400 underline">← Back to groups</button>
        </div>
      )}
    </div>
  );
}

/* ---------------- Class routine ---------------- */
function ClassRoutine({ call, showError }) {
  const [classes, setClasses] = useState([]);
  const [form, setForm] = useState({ weekday: 0, start: "09:00", end: "10:30", title: "" });
  const load = () => call("/api/schedule").then(d => setClasses(d.classes)).catch(() => {});
  useEffect(() => { load(); }, []);
  const add = async () => { try { await call("/api/schedule", { method: "POST", body: form }); setForm({ ...form, title: "" }); load(); } catch (e) { showError(e); } };
  const del = async (id) => { try { await call(`/api/schedule/${id}`, { method: "DELETE" }); load(); } catch (e) { showError(e); } };
  return (
    <div className="card p-5 mt-6">
      <div className="font-display font-700 text-amber-300 mb-1">📚 {tr("Class routine")}</div>
      <p className="text-[11px] text-gray-400 mb-3">Save your lectures once — the menu will suggest a pickup time when you're free and warn you about clashes.</p>
      <div className="flex gap-2 flex-wrap mb-4">
        <select value={form.weekday} onChange={e => setForm({ ...form, weekday: Number(e.target.value) })} className={inputCls} style={inputStyle}>{WEEKDAYS.map((d, i) => <option key={d} value={i}>{d}</option>)}</select>
        <input type="time" value={form.start} onChange={e => setForm({ ...form, start: e.target.value })} className={inputCls} style={inputStyle} />
        <input type="time" value={form.end} onChange={e => setForm({ ...form, end: e.target.value })} className={inputCls} style={inputStyle} />
        <input value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} placeholder="Course (e.g. CSE 305)" className={`${inputCls} flex-1 min-w-[8rem]`} style={inputStyle} />
        <button onClick={add} disabled={!form.title.trim()} className="btn-primary px-4 py-2 rounded-lg text-xs">{tr("Add class")}</button>
      </div>
      {classes.length === 0 ? <p className="text-xs text-gray-400">No classes saved yet.</p> : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-2">
          {WEEKDAYS.map((d, i) => { const list = classes.filter(c => c.weekday === i); if (!list.length) return null; return (
            <div key={d} className="p-3 rounded-xl border" style={inputStyle}><div className="text-[11px] font-700 mb-1">{d}</div>{list.map(c => <div key={c.id} className="flex justify-between text-[11px] py-0.5"><span>{c.start_time}–{c.end_time} {c.title}</span><button onClick={() => del(c.id)} className="text-red-400">✕</button></div>)}</div>
          ); })}
        </div>
      )}
    </div>
  );
}

        {rw.log.length > 0 && <div className="mt-3 text-[11px] text-gray-400 space-y-0.5">{rw.log.slice(0, 5).map((l, i) => <div key={i} className="flex justify-between"><span>{l.reason}</span><span className={l.points > 0 ? "text-emerald-600" : "text-red-400"}>{l.points > 0 ? "+" : ""}{l.points}</span></div>)}</div>}

        <div className="h-3 rounded-full bg-gray-200 mb-1"><div className="h-3 rounded-full" style={{ width: `${bd.limit ? pct : 0}%`, background: barColor }}></div></div>
        <div className="text-[11px] text-gray-400 mb-4">Last week: {taka(bd.prevWeekSpent)}{bd.limit ? ` · ${pct}% of budget used` : ""}</div>
        <div className="flex items-end gap-2 h-24 mb-1">{bd.daily.map(d => <div key={d.day} className="flex-1 flex flex-col items-center justify-end" title={taka(d.spent)}><div className="w-full rounded-t bg-emerald-500" style={{ height: `${Math.max(2, (d.spent / dmax) * 70)}px` }}></div></div>)}</div>
        <div className="flex gap-2 text-[10px] text-gray-400 mb-4">{bd.daily.map(d => <div key={d.day} className="flex-1 text-center">{d.day.slice(8)}</div>)}</div>

    </div>
  );

function TrackOrder({ orders, call, refreshOrders, refreshWallet, reorder, meId }) {
  const [queue, setQueue] = useState({});
  const [showQr, setShowQr] = useState({});
  useEffect(() => { call("/api/orders/queue/mine").then(d => setQueue(d.queue || {})).catch(() => {}); }, [orders]);
  const cancelOrder = async (id) => { if (!window.confirm("Cancel this Received order? Refund: 100% if 8+ hours remain, 60% if 7-8 hours remain, 50% if 5-7 hours remain, otherwise 0%.")) return; try { const result = await call(`/api/orders/${id}/cancel`, { method: "PATCH" }); alert(result.refundAmount > 0 ? `৳${result.refundAmount} refunded (${Math.round(result.refundRate * 100)}%)` : "Order cancelled. No refund is available within 5 hours of meal time."); await refreshOrders(); await refreshWallet(); } catch (e) { alert(e.message); } };
  const exportCsv = async () => {
    try { const res = await fetch(`${window.__campusApiBase}/api/orders/export/csv`, { headers: { Authorization: `Bearer ${window.__campusToken}` } }); if (res.ok) { const blob = await res.blob(); const url = URL.createObjectURL(blob); const link = document.createElement("a"); link.href = url; link.download = "campusdine-orders.csv"; link.click(); URL.revokeObjectURL(url); return; } } catch (e) { /* use the loaded history below */ }
    const csv = ["Order ID,Order Token,Status,Total Amount,Items", ...orders.map(o => [o.id, o.token, o.status, o.total, (o.items || []).map(i => `${i.name}(${i.qty})`).join("; ")].map(value => `"${String(value ?? "").replace(/"/g, '""')}"`).join(","))].join("\n");
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); const link = document.createElement("a"); link.href = url; link.download = "campusdine-orders.csv"; link.click(); URL.revokeObjectURL(url);
  };
  if (orders.length === 0) {
    return <div><KitchenSimulation /><button onClick={exportCsv} className="mb-4 px-3 py-2 rounded-lg border border-amber-400/30 text-xs">Export CSV</button><div className="card p-12 text-center text-xs text-gray-400">কোনো অর্ডার পাওয়া যায়নি।</div></div>;
  }
  return (
    <div className="space-y-6 max-w-2xl mx-auto"><KitchenSimulation /><button onClick={exportCsv} className="px-3 py-2 rounded-lg border border-amber-400/30 text-xs">Export CSV</button>
      {orders.map(o => {
        const stepIndex = stepIndexOf(o.status);
        const closed = o.status === "Cancelled" || o.status === "Refunded";
        const isOwner = o.user_id === meId;
        const q = queue[o.id];
        const showCode = !closed && !o.picked_up_at && (isOwner || o.kind === "group");
        return (
          <div key={o.token || o.id} className="card overflow-hidden">
            <div className="ticket p-5 flex items-center justify-between">
              <div className="perf pl-4">
                <div className="text-[10px] opacity-70 font-display uppercase tracking-widest">Token Number</div>
                <div className="font-mono text-2xl font-800 text-amber-300" title={o.token}>{shortToken(o.token)}</div>
              </div>
              <div className="text-right">
                <div className="text-[10px] opacity-70 font-display uppercase tracking-widest">Total Bill</div>
                <div className="font-mono text-lg font-700">{taka(o.total)}</div>
              </div>
            </div>
            <div className="p-6">
              {o.label && <div className="note note-info text-xs mb-3 px-3 py-2">{o.kind === "treat" && !isOwner ? `🎁 You treated ${o.owner_name}` : o.label}{o.shares && o.shares.length > 1 ? ` · paid by ${o.shares.map(s => `${s.name} ${taka(s.amount)}`).join(", ")}` : ""}</div>}
              {o.pickup_slot && <div className="text-xs font-700 mb-3" style={{ color: "#8A5B00" }}>⏰ {tr("Pickup")} {o.pickup_slot}</div>}
              {q && !closed && <div className="note note-info text-xs mb-3 px-3 py-2">👥 {q.ahead} {tr("orders ahead of you")} · ~{q.etaMinutes} min{q.typicalMinutes ? ` (usually ~${q.typicalMinutes} min)` : ""}</div>}
              {o.picked_up_at && <div className="note note-ok text-xs mb-3 px-3 py-2">✅ {tr("Collected")}</div>}
              <div className="flex items-center justify-between mb-4">
                {!closed && STATUSES.map((s, i) => (
                  <React.Fragment key={s}>
                    <div className="flex flex-col items-center gap-1.5 flex-1">
                      <div className={`stepper-dot ${i < stepIndex ? "done" : i === stepIndex ? "current" : ""}`}></div>
                      <span className="text-[11px] text-center" style={{ color: i <= stepIndex ? "var(--ink)" : "var(--ink-soft)", fontWeight: i === stepIndex ? 700 : 400 }}>{s}</span>
                    </div>
                    {i < STATUSES.length - 1 && <div className="h-0.5 flex-1 -mt-4" style={{ background: i < stepIndex ? "var(--leaf)" : "var(--panel-border)" }} />}
                  </React.Fragment>
                ))}
              </div>
              {closed && <div className="note note-danger text-xs mb-3 px-3 py-2">{o.status === "Refunded" ? `Cancelled — ${taka(o.refund_amount)} refunded to your wallet` : "Cancelled"}</div>}
              <div className="text-xs text-gray-400 border-t border-amber-400/10 pt-3 mt-4">
                {o.meal_date && <div className="mb-1">{tr("Meal date")}: {String(o.meal_date).slice(0, 10)}</div>}
                Items: {o.items?.map(i => `${i.name} ×${i.qty}`).join(", ")}
              </div>
              <div className="flex gap-2 flex-wrap items-center">
                {isOwner && (o.status === "Received" || o.status === "Confirmed") && <button onClick={() => cancelOrder(o.id)} className="mt-4 px-3 py-2 rounded-lg border border-red-500/40 text-red-400 text-xs">{tr("Cancel order")}</button>}
                {isOwner && <button onClick={() => reorder(o)} className="mt-4 px-3 py-2 rounded-lg border border-amber-400/40 text-xs">{tr("Order again")}</button>}
                {showCode && <button onClick={() => setShowQr({ ...showQr, [o.id]: !showQr[o.id] })} className="mt-4 px-3 py-2 rounded-lg border border-amber-400/40 text-xs">{showQr[o.id] ? tr("Hide QR") : "📱 " + tr("Show pickup QR")}</button>}
                {!closed && (
                  <button
                    onClick={() => {
                      const win = window.open('', '_blank');
                      if (win) {
                        win.document.write(`<!DOCTYPE html><html><head><title>Token ${shortToken(o.token)}</title></head><body style="font-family:system-ui,sans-serif;text-align:center;padding:2rem">
                          <div style="border:2px solid #000;border-radius:12px;padding:2rem;max-width:340px;margin:0 auto">
                            <h2 style="margin:0;font-size:14px;text-transform:uppercase;letter-spacing:1px">CampusDine Token</h2>
                            <h1 style="font-size:2.8rem;letter-spacing:2px;margin:0.8rem 0;font-family:monospace">${shortToken(o.token)}</h1>
                            <p style="margin:4px 0;font-size:14px"><b>Pickup:</b> ${o.pickup_slot || 'Regular'} | <b>Date:</b> ${String(o.meal_date || '').slice(0, 10)}</p>
                            <p style="margin:4px 0;font-size:16px"><b>Total:</b> ৳${o.total}</p>
                            <hr style="margin:1rem 0;border-top:1px dashed #000"/>
                            <p style="font-size:13px;color:#333">${(o.items || []).map(i => i.name + ' ×' + i.qty).join(', ')}</p>
                          </div>
                          <script>window.print();<\/script></body></html>`);
                        win.document.close();
                      }
                    }}
                    className="mt-4 px-3 py-2 rounded-lg border border-amber-400/40 text-xs"
                  >🖨️ Print Token</button>
                )}
              </div>
              {showCode && showQr[o.id] && <div><QRBox orderId={o.id} /><div className="text-[11px] text-gray-400 mt-1">Show this at the counter — or give the code <b className="font-mono">{shortToken(o.token)}</b>.</div></div>}
              {o.status === "Ready" && isOwner && o.items?.map(i => <RatingForm key={i.menu_item_id || i.id} item={i} call={call} />)}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function KitchenSimulation() {
  const [stage, setStage] = useState(1);
  useEffect(() => { const timer = setInterval(() => setStage(current => (current + 1) % 3), 2600); return () => clearInterval(timer); }, []);
  const stages = ["Received", "Cooking", "Ready"];
  return <div className="simulation-card rounded-2xl p-5 mb-2"><div className="relative z-10 flex items-start justify-between gap-4"><div><div className="text-[10px] uppercase tracking-[.2em] opacity-70">Kitchen simulation</div><div className="font-display text-lg mt-1">Your meal is moving</div><div className="text-xs opacity-75 mt-1">A live preview of the campus pickup flow</div></div><div className="simulation-dot w-3 h-3 rounded-full bg-orange-300 mt-1"></div></div><div className="relative z-10 mt-5 simulation-line"></div><div className="relative z-10 grid grid-cols-3 mt-3 text-[10px] uppercase tracking-wider">{stages.map((name, index) => <div key={name} className={index <= stage ? "text-orange-200" : "opacity-50"}>{name}</div>)}</div></div>;
}

function RatingForm({ item, call }) {
  const [rating, setRating] = useState(0); const [review, setReview] = useState(""); const [message, setMessage] = useState("");
  const submit = async () => { try { await call(`/api/ratings/${item.menu_item_id || item.id}`, { method: "POST", body: { rating, review } }); setMessage("Review saved"); } catch (e) { setMessage(e.message); } };
  return <div className="mt-3 flex flex-wrap items-center gap-2 text-xs"><span className="text-gray-400">Rate {item.name}:</span>{[1, 2, 3, 4, 5].map(value => <button key={value} onClick={() => setRating(value)} className={value <= rating ? "text-amber-300 text-lg" : "text-gray-600 text-lg"}>★</button>)}<input value={review} onChange={e => setReview(e.target.value)} placeholder="Review (optional)" className="flex-1 min-w-32 px-2 py-1 rounded border text-xs" style={{ borderColor: "var(--panel-border)" }} /><button disabled={!rating} onClick={submit} className="px-2 py-1 rounded border border-amber-400/30">Save</button>{message && <span className="text-emerald-300">{message}</span>}</div>;
}

function ProfileTab({ call, user, onUserUpdate }) {
  const [profile, setProfile] = useState(user); const [passwords, setPasswords] = useState({ currentPassword: "", newPassword: "", confirmPassword: "" }); const [message, setMessage] = useState("");
  useEffect(() => { call("/api/profile").then(data => setProfile(data.user)).catch(e => setMessage(e.message)); }, []);
  const save = async () => { try { await call("/api/profile", { method: "PUT", body: { name: profile.name, email: profile.email, phone: profile.phone } }); onUserUpdate({ ...user, name: profile.name }); setMessage("Profile updated"); } catch (e) { setMessage(e.message); } };
  const changePassword = async () => { try { await call("/api/profile/change-password", { method: "POST", body: passwords }); setPasswords({ currentPassword: "", newPassword: "", confirmPassword: "" }); setMessage("Password changed"); } catch (e) { setMessage(e.message); } };
  const subscribe = async () => { try { await call("/api/profile", { method: "PUT", body: { phone: profile.phone } }); await call("/api/notifications/subscribe", { method: "POST", body: { phoneNumber: profile.phone } }); setMessage("SMS notifications enabled"); } catch (e) { setMessage(e.message.includes("404") ? "Phone saved; notification service is not enabled on this server" : e.message); } };
  const unsubscribe = async () => { try { await call("/api/notifications/unsubscribe", { method: "POST" }); setMessage("SMS notifications disabled"); } catch (e) { setMessage(e.message); } };
  return <div className="grid lg:grid-cols-2 gap-6 max-w-4xl mx-auto"><div className="card p-5 space-y-3"><div className="font-display font-700 text-amber-300">Profile</div><input value={profile.name || ""} onChange={e => setProfile({ ...profile, name: e.target.value })} placeholder="Name" className="w-full px-3 py-2 rounded border text-xs" style={{ borderColor: "var(--panel-border)" }} /><input value={profile.email || ""} onChange={e => setProfile({ ...profile, email: e.target.value })} placeholder="Email" className="w-full px-3 py-2 rounded border text-xs" style={{ borderColor: "var(--panel-border)" }} /><input value={profile.phone || ""} onChange={e => setProfile({ ...profile, phone: e.target.value })} placeholder="Notification phone" className="w-full px-3 py-2 rounded border text-xs" style={{ borderColor: "var(--panel-border)" }} /><button onClick={save} className="btn-primary px-4 py-2 rounded text-xs">Save profile</button><div className="flex gap-2"><button onClick={subscribe} className="px-3 py-2 rounded border border-amber-400/30 text-xs">Subscribe SMS</button><button onClick={unsubscribe} className="px-3 py-2 rounded border border-red-500/30 text-xs">Unsubscribe</button></div></div><div className="card p-5 space-y-3"><div className="font-display font-700 text-amber-300">Change password</div>{["currentPassword", "newPassword", "confirmPassword"].map(key => <input key={key} type="password" value={passwords[key]} onChange={e => setPasswords({ ...passwords, [key]: e.target.value })} placeholder={key.replace(/([A-Z])/g, " $1")} className="w-full px-3 py-2 rounded border text-xs" style={{ borderColor: "var(--panel-border)" }} />)}<button onClick={changePassword} className="btn-primary px-4 py-2 rounded text-xs">Change password</button>{message && <p className="text-xs text-emerald-300">{message}</p>}</div></div>;
}

/* ---------------- Meal Calendar Tab ---------------- */
function MealCalendar({ role, year, month, calendar, bill, onToggle }) {
  const total = daysInMonth(year, month);
  const monthName = new Date(year, month - 1).toLocaleString("default", { month: "long" });
  const firstWeekday = new Date(year, month - 1, 1).getDay();
  const todayDay = new Date().getDate();

  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2 card p-6">
        <div className="flex items-center justify-between mb-6">
          <div className="font-display font-700 text-lg text-amber-300">{monthName} {year}</div>
          <div className="text-xs text-gray-400">ট্যাপ করে মিল পর্যায় পরিবর্তন করুন: Off → Full → Half</div>
        </div>
        <div className="grid grid-cols-7 gap-2 mb-2 text-xs text-center font-600 text-gray-400">
          {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d, i) => <div key={i}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-2">
          {Array.from({ length: firstWeekday }).map((_, i) => <div key={"e" + i}></div>)}
          {Array.from({ length: total }).map((_, i) => {
            const day = i + 1;
            const status = calendar[day] || "off";
            return (
              <div key={day} onClick={() => day >= todayDay && onToggle(day, status)} title={day < todayDay ? "Past days can't be changed" : ""}
                   className={`cal-cell text-xs font-700 ${status === "full" ? "cal-full" : status === "half" ? "cal-half" : ""} ${day < todayDay ? "opacity-40 cursor-not-allowed" : ""}`}>
                {day}
              </div>
            );
          })}
        </div>
        <div className="flex gap-4 mt-6 text-xs text-gray-400 justify-center">
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-amber-900 border border-amber-500"></span> Full Meal</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-amber-400/20 border border-amber-400"></span> Half Meal</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border border-gray-700"></span> Off</span>
        </div>
      </div>

      <div className="card p-6 h-fit">
        <div className="font-display font-700 mb-4 text-amber-300">Monthly Bill Summary</div>
        <div className="space-y-2 text-xs mb-4">
          <div className="flex justify-between"><span>Full Meal ({taka(bill.fullRate)})</span><span className="font-mono">{bill.fullDays} days</span></div>
          <div className="flex justify-between"><span>Half Meal ({taka(bill.halfRate)})</span><span className="font-mono">{bill.halfDays} days</span></div>
        </div>
        <div className="border-t border-amber-400/20 pt-3">
          <div className="flex justify-between font-700 text-sm">
            <span>Total Payable</span><span className="font-mono text-amber-300">{taka(bill.total)}</span>
          </div>
        </div>
        <p className="text-[11px] text-gray-400 mt-4 leading-relaxed">অটো-বিলিং হিসাব অনুযায়ী {role === "teacher" ? "Faculty" : "Student"} রেট প্রয়োগ করা হয়েছে।</p>
      </div>
    </div>
  );
}

/* ---------------- Wallet Tab ---------------- */
function WalletTab({ balance, topUp, gatewayTopUp, removeTransaction, transactions, busy, receivingNumber, demoTopup }) {
  const [amount, setAmount] = useState(100);
  const [method, setMethod] = useState("bkash");
  const [message, setMessage] = useState("");
  const startGatewayTopUp = async () => { setMessage(""); try { await gatewayTopUp(method, amount); setMessage(`${method} payment started`); } catch (e) { setMessage(e.message); } };
  const clearHistory = async () => { try { await removeTransaction("all"); } catch (e) { setMessage(e.message); } };
  return (
    <div className="grid lg:grid-cols-3 gap-6 max-w-4xl mx-auto">
      <div className="lg:col-span-1 space-y-4">
        <div className="ticket p-6">
          <div className="perf pl-4">
            <div className="text-[10px] uppercase font-display tracking-widest opacity-80">Available Balance</div>
            <div className="font-mono text-3xl font-800 text-amber-300 mt-1">{taka(balance)}</div>
          </div>
        </div>
        <div className="card p-5">
          <div className="font-display font-700 mb-3 text-xs text-amber-300">Quick Top Up</div>
          <div className="flex gap-2 mb-3">
            {[100, 300, 500].map(v => (
              <button key={v} onClick={() => setAmount(v)} className={`flex-1 py-1.5 rounded-md border text-xs font-mono ${amount === v ? "bg-amber-400 text-slate-950 font-700" : "border-amber-400/20"}`}>
                {taka(v)}
              </button>
            ))}
          </div>
          <input type="number" min="1" max="9999" value={amount} onChange={e => setAmount(Number(e.target.value))} className="w-full px-3 py-2 rounded-md border mb-3 font-mono text-xs" style={{ borderColor: "var(--panel-border)" }} />
          {demoTopup && <button disabled={busy} onClick={() => amount > 0 && topUp(amount)} className="btn-gold w-full py-2.5 rounded-md text-xs">
            {busy ? "Processing..." : "Demo Wallet Top Up"}
          </button>}
          <div className="mt-4 pt-4 border-t" style={{ borderColor: "var(--panel-border)" }}>
            <div className="text-[11px] mb-2" style={{ color: "var(--ink-soft)" }}>Gateway top-up to {receivingNumber}</div>
            <div className="grid grid-cols-2 gap-2 mb-2">
              {[['bkash', 'bKash'], ['nagad', 'Nagad']].map(([key, label]) => <button key={key} onClick={() => setMethod(key)} className={`py-2 rounded-md border text-xs ${method === key ? "bg-orange-500 text-white font-700" : "border-orange-200"}`}>{label}</button>)}
            </div>
            <button disabled={busy} onClick={startGatewayTopUp} className="w-full py-2 rounded-md border border-orange-300 text-orange-700 text-xs font-700">Pay via {method}</button>
            {message && <p className="text-[11px] mt-2 text-orange-700">{message}</p>}
          </div>
        </div>
      </div>

      <div className="lg:col-span-2 card p-6">
        <div className="flex items-center justify-between gap-3 mb-4"><div className="font-display font-700 text-amber-300">Transaction History</div>{transactions.length > 0 && <button onClick={clearHistory} className="text-[11px] text-red-500 hover:text-red-700">Remove all</button>}</div>
        {transactions.length === 0 ? (
          <p className="text-xs text-gray-400">কোনো লেনদেনের তথ্য পাওয়া যায়নি।</p>
        ) : (
          <div className="space-y-2">
            {transactions.map((t, i) => (
              <div key={t.id || i} className="flex justify-between items-center gap-3 py-2.5 text-xs border-b border-amber-400/10">
                <div>
                  <div className="font-600">{t.label}</div>
                  <div className="text-[10px] text-gray-400">{t.time}</div>
                </div>
                <div className="flex items-center gap-3"><span className={`font-mono font-700 ${t.amount > 0 ? "text-emerald-400" : "text-red-400"}`}>{t.amount > 0 ? "+" : ""}{taka(t.amount)}</span><button onClick={() => removeTransaction(t.id)} title="Remove from history" className="text-gray-400 hover:text-red-500">×</button></div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- Admin: Overview ---------------- */
function AdminOverview({ overview, orders, call }) {

// Counter screen: scan the student's QR (camera or USB scanner) or type the 8-character code.
function AdminPickup({ orders, call, showError, collect }) {
  const [code, setCode] = useState("");
  const [last, setLast] = useState(null);
  const [recent, setRecent] = useState([]);
  const [scanning, setScanning] = useState(false);
  const [msg, setMsg] = useState("");
  const videoRef = useRef(null);
  const BD = window.BarcodeDetector;
  const submit = async (value) => {
    const c = (value ?? code).trim();
    if (!c) return;
    try {
      const o = await call("/api/orders/pickup", { method: "POST", body: { code: c } });
      setLast(o); setMsg(""); setCode(""); setRecent(r => [o, ...r].slice(0, 8));
    } catch (e) { setLast(null); setMsg(e.message); }
  };
  useEffect(() => {
    if (!scanning) return undefined;
    let stream, timer, stopped = false;
    (async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play(); }
        const det = new BD({ formats: ["qr_code"] });
        timer = setInterval(async () => {
          if (stopped || !videoRef.current) return;
          try { const found = await det.detect(videoRef.current); if (found.length) { stopped = true; setScanning(false); submit(found[0].rawValue); } } catch (e) { /* frame not ready */ }
        }, 400);
      } catch (e) { setMsg("Camera unavailable: " + e.message); setScanning(false); }
    })();
    return () => { stopped = true; clearInterval(timer); if (stream) stream.getTracks().forEach(t => t.stop()); };
  }, [scanning]);
  const waiting = orders.filter(o => o.status === "Ready" && !o.picked_up_at);
  return (
    <div className="grid lg:grid-cols-2 gap-6">
      <div className="card p-5">
        <div className="font-display font-700 text-amber-300 mb-3">📷 {tr("Scan or type the order code")}</div>
        <div className="flex gap-2 mb-3">
          <input autoFocus value={code} onChange={e => setCode(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()} placeholder="e.g. 9F3A12BC  or  CD:…" className={`${inputCls} flex-1 font-mono`} style={inputStyle} />
          <button onClick={() => submit()} className="btn-primary px-5 rounded-lg text-xs">{tr("Collect")}</button>
        </div>
        {BD && <button onClick={() => setScanning(s => !s)} className="px-3 py-2 rounded-lg border border-amber-400/40 text-xs mb-3">{scanning ? "Stop camera" : "Scan with camera"}</button>}
        {scanning && <video ref={videoRef} muted playsInline className="w-full rounded-xl bg-black mb-3" style={{ maxHeight: 260 }} />}
        {msg && <div className="p-3 rounded-lg text-xs border border-red-400/50 text-red-500 bg-red-50">{msg}</div>}
        {last && <div className="p-4 rounded-xl text-xs border border-emerald-400/60 bg-emerald-50 text-emerald-800"><div className="font-700 text-sm mb-1">✅ Hand over to {last.customer}</div><div>{last.items?.map(i => `${i.name} ×${i.qty}`).join(", ")}</div>{last.label && <div className="mt-1">{last.label}</div>}</div>}
        {recent.length > 1 && <div className="mt-3 text-[11px] text-gray-400">Recently collected: {recent.slice(1).map(o => shortToken(o.token)).join(", ")}</div>}
      </div>
      <div className="card p-5">
        <div className="font-display font-700 text-amber-300 mb-3">Ready — waiting for pickup ({waiting.length})</div>
        {waiting.length === 0 ? <p className="text-xs text-gray-400">Nothing is waiting at the counter.</p> : waiting.map(o => (
          <div key={o.id} className="flex items-center justify-between text-xs py-2 border-b border-amber-400/10 gap-2">
            <span><b className="font-mono">{shortToken(o.token)}</b> · {o.customer}{o.pickup_slot ? ` · ${o.pickup_slot}` : ""}<div className="text-gray-400">{o.items?.map(i => `${i.name} ×${i.qty}`).join(", ")}</div></span>
            <button onClick={() => collect(o)} className="px-3 py-1.5 rounded-md border border-amber-400/40">{tr("Mark collected")}</button>
          </div>
        ))}
      </div>
    </div>
  );
}
