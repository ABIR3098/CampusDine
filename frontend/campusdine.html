function fitChatInput(el) {
  if (!el) return;
  el.style.height = "auto";
  const border = el.offsetHeight - el.clientHeight;
  const full = el.scrollHeight + border;
  el.style.height = Math.min(full, 120) + "px";
  el.style.overflowY = full > 120 ? "auto" : "hidden";
}

function ChatWorkspace({ role, userId, apiBase, sessionToken, refreshKey }) {
  const [conversations, setConversations] = useState([]);
  const [selectedUserId, setSelectedUserId] = useState(null);
  const [messages, setMessages] = useState([]);
  const [draft, setDraft] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [search, setSearch] = useState("");
  const [mobileChat, setMobileChat] = useState(false);
  const [emojiOpen, setEmojiOpen] = useState(false);
  const [orderOpen, setOrderOpen] = useState(false);
  const [myOrders, setMyOrders] = useState(null);
  const [typing, setTyping] = useState(false);
  const [menuFor, setMenuFor] = useState(null);
  const [replyTo, setReplyTo] = useState(null);
  const [pendingPhoto, setPendingPhoto] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [searchOpen, setSearchOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [matchPos, setMatchPos] = useState(0);
  const searchRef = useRef(null);
  const [reactFor, setReactFor] = useState(null);
  const fileRef = useRef(null);
  const [onlineIds, setOnlineIds] = useState([]);
  const [adminOnline, setAdminOnline] = useState(null);
  const [lastSeen, setLastSeen] = useState({});
  const [adminAgo, setAdminAgo] = useState(null);
  const [flashId, setFlashId] = useState(null);
  const [dividerId, setDividerId] = useState(null);
  const [atBottom, setAtBottom] = useState(true);
  const [newBelow, setNewBelow] = useState(0);
  const scrollRef = useRef(null);
  const dividerRef = useRef(null);
  const initRef = useRef(null);
  const pendingInit = useRef(null);
  const unreadFromRef = useRef(null);
  const stickRef = useRef(true);
  const prevLen = useRef(0);
  const typingTimer = useRef(null);
  const lastTypingSent = useRef(0);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);
  const isAdmin = role === "admin";
  const selected = conversations.find(c => Number(c.user_id) === Number(selectedUserId));
  const chatCall = (path, options = {}) => api(apiBase, path, { ...options, token: sessionToken });

  const refreshConversations = async () => {
    const data = await chatCall("/api/chat/conversations");
    setConversations(data.conversations || []);
  };
  const refreshMessages = async (target = selectedUserId) => {
    if (isAdmin && !target) { setMessages([]); return; }
    const data = await chatCall(isAdmin ? `/api/chat/${target}/messages` : "/api/chat/messages");
    if (data.firstUnreadId && initRef.current === null) unreadFromRef.current = data.firstUnreadId;
    setMessages(data.messages || []);
  };

  const refreshPresence = async () => {
    const d = await chatCall("/api/chat/presence");
    if (isAdmin) { setOnlineIds((d.online || []).map(Number)); setLastSeen(d.lastSeen || {}); }
    else { setAdminOnline(!!d.adminOnline); setAdminAgo(d.adminAgoSeconds ?? null); }
  };
  useEffect(() => {
    (isAdmin ? refreshConversations() : refreshMessages()).catch(e => setError(e.message));
    refreshPresence().catch(() => {});
  }, [isAdmin, apiBase, sessionToken, refreshKey]);
  useEffect(() => {
    if (!isAdmin || selectedUserId || conversations.length === 0) return;
    setSelectedUserId(conversations[0].user_id);
  }, [isAdmin, selectedUserId, conversations]);
  useEffect(() => {
    if (!isAdmin || !selectedUserId) return;
    refreshMessages(selectedUserId).catch(e => setError(e.message));
  }, [isAdmin, apiBase, sessionToken, selectedUserId, refreshKey]);
  // Fallback auto-refresh every 10s (live socket updates still work instantly)
  useEffect(() => {
    const t = setInterval(() => {
      if (document.hidden) return;
      refreshPresence().catch(() => {});
      (isAdmin ? Promise.all([refreshConversations(), refreshMessages()]) : refreshMessages()).catch(() => {});
    }, 10000);
    return () => clearInterval(t);
  }, [isAdmin, apiBase, sessionToken, selectedUserId]);
  // Reset scroll state whenever another conversation is opened
  useEffect(() => {
    initRef.current = null; pendingInit.current = null; unreadFromRef.current = null;
    stickRef.current = true; prevLen.current = 0;
    setDividerId(null); setNewBelow(0); setAtBottom(true); setReplyTo(null); setPendingPhoto(null); setSearchOpen(false); setQuery(""); setReactFor(null);
    if (isAdmin) setMessages([]);
  }, [selectedUserId]);
  // First load of a conversation: remember where the unread messages start
  useEffect(() => {
    if (messages.length === 0 || initRef.current !== null) return;
    initRef.current = String(selectedUserId || "me");
    const fu = unreadFromRef.current ? messages.find(m => m.id === unreadFromRef.current && Number(m.sender_id) !== Number(userId)) : null;
    pendingInit.current = { id: fu ? fu.id : null };
    prevLen.current = messages.length;
    setDividerId(fu ? fu.id : null);
  }, [messages]);
  // Smart scrolling: jump to first unread on open; afterwards only follow new messages if the reader is at the bottom
  useEffect(() => {
    const el = scrollRef.current;
    if (!el || messages.length === 0) return;
    const toBottom = (smooth) => { if (el.scrollTo) el.scrollTo({ top: el.scrollHeight, behavior: smooth ? "smooth" : "auto" }); else el.scrollTop = el.scrollHeight; };
    if (pendingInit.current) {
      const want = pendingInit.current.id;
      if (want && !dividerRef.current) return;
      pendingInit.current = null;
      if (want) {
        const top = dividerRef.current.getBoundingClientRect().top - el.getBoundingClientRect().top + el.scrollTop;
        el.scrollTop = Math.max(0, top - 40);
      } else toBottom(false);
      return;
    }
    const grew = messages.length - prevLen.current;
    prevLen.current = messages.length;
    const last = messages[messages.length - 1];
    if (stickRef.current || Number(last.sender_id) === Number(userId)) { toBottom(true); setNewBelow(0); }
    else if (grew > 0) setNewBelow(n => n + grew);
  }, [messages.length, typing, dividerId]);
  const onScroll = (e) => {
    const el = e.currentTarget;
    const near = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
    stickRef.current = near; setAtBottom(near);
    if (near) setNewBelow(0);
  };
  const jumpToBottom = () => {
    const el = scrollRef.current; if (!el) return;
    if (el.scrollTo) el.scrollTo({ top: el.scrollHeight, behavior: "smooth" }); else el.scrollTop = el.scrollHeight;
    stickRef.current = true; setNewBelow(0);
  };

  const send = async (text) => {
    const photo = text === undefined ? pendingPhoto : null;
    const message = (text ?? draft).trim();
    if ((!message && !photo) || busy || (isAdmin && !selectedUserId)) return;
    setBusy(true); setError("");
    const reply = replyTo;
    const temp = { id: `tmp-${Date.now()}`, sender_id: userId, message: message || "📷 Photo", created_at: new Date().toISOString(), pending: true,
      ...(photo ? { image_local: photo.url } : {}),
      ...(reply ? { reply_to_id: reply.id, reply_sender_id: reply.sender_id, reply_sender_name: reply.sender_name, reply_text: shortText(reply.message) } : {}) };
    setMessages(m => [...m, temp]);
    setDraft(""); setEmojiOpen(false); setOrderOpen(false); setReplyTo(null);
    if (photo) setPendingPhoto(null);
    lastTypingSent.current = 0; emitTyping(false);
    if (inputRef.current) inputRef.current.style.height = "auto";
    try {
      const imageId = photo ? await uploadImage(photo.blob) : null;
      await chatCall("/api/chat/messages", { method: "POST", body: { message: message || "📷 Photo", ...(isAdmin ? { userId: selectedUserId } : {}), ...(reply ? { replyTo: reply.id } : {}), ...(imageId ? { imageId } : {}) } });
      await Promise.all([refreshMessages(selectedUserId), isAdmin ? refreshConversations() : Promise.resolve()]);
    } catch (e) {
      setMessages(m => m.filter(x => x.id !== temp.id));
      setDraft(message); setReplyTo(reply); if (photo) setPendingPhoto(photo);
      setError(e.message || tx("chat.sendfail"));
    } finally { setBusy(false); }
  };
  const onKey = (e) => {
    if (e.key === "Escape" && replyTo) { setReplyTo(null); return; }
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  };
  const onInput = (e) => {
    setDraft(e.target.value);
    const nowTs = Date.now();
    if (e.target.value && nowTs - lastTypingSent.current > 2000) { lastTypingSent.current = nowTs; emitTyping(true); }
    if (!e.target.value) { lastTypingSent.current = 0; emitTyping(false); }
    fitChatInput(e.target);
  };

  const fmtTime = (d) => new Date(d).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const dayLabel = (d) => {
    const x = new Date(d), now = new Date(), y = new Date(); y.setDate(now.getDate() - 1);
    if (x.toDateString() === now.toDateString()) return "Today";
    if (x.toDateString() === y.toDateString()) return "Yesterday";
    return x.toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" });
  };
  const listTime = (d) => {
    if (!d) return "";
    const x = new Date(d);
    return x.toDateString() === new Date().toDateString() ? fmtTime(d) : x.toLocaleDateString([], { day: "numeric", month: "short" });
  };

  const filtered = conversations.filter(c => { const t = search.trim().toLowerCase(); return !t || (c.name || "").toLowerCase().includes(t) || (c.last_message || "").toLowerCase().includes(t); });
  const heading = isAdmin ? selected?.name || "Choose a conversation" : tx("chat.admin");
  const isOnline = (id) => onlineIds.includes(Number(id));
  const headOnline = isAdmin ? (selectedUserId ? isOnline(selectedUserId) : undefined) : (adminOnline === null ? undefined : adminOnline);
  const agoText = (sec) => {
    if (sec === null || sec === undefined) return "";
    if (sec < 60) return "just now";
    const mins = Math.floor(sec / 60);
    if (mins < 60) return `${mins} min ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs} hour${hrs === 1 ? "" : "s"} ago`;
    const days = Math.floor(hrs / 24);
    return `${days} day${days === 1 ? "" : "s"} ago`;
  };
  const headAgo = isAdmin ? (selectedUserId ? lastSeen[String(selectedUserId)] : undefined) : adminAgo;
  const withDot = (name, size, online) => (
    <span className="chat-avatar"><Avatar name={name} size={size} />{online !== undefined && <i className={`chat-dot ${online ? "on" : ""}`} />}</span>
  );
  const quick = ["Where is my order?", "Wallet / payment issue", "Menu question", "Thank you!"];
  const emojis = ["😊", "😂", "👍", "🙏", "❤️", "🎉", "✅", "😋", "🍛", "☕", "😢", "🔥"];
  const templates = ["Your order is ready for pickup.", "Please check your wallet balance and try again.", "Thanks for reaching out, we are looking into it.", "This item is currently unavailable."];
  const addEmoji = (em) => { setDraft(d => d + em); inputRef.current?.focus(); };
  const uploadImage = async (blob) => {
    const res = await fetch(`${apiBase}/api/chat/images${isAdmin ? `?userId=${selectedUserId}` : ""}`, {
      method: "POST", headers: { Authorization: `Bearer ${sessionToken}`, "Content-Type": blob.type || "image/jpeg" }, body: blob,
    });
    let data = {};
    try { data = await res.json(); } catch (e) { /* empty body */ }
    if (!res.ok) {
      if (data.error) throw new Error(data.error);
      if (res.status === 404 || res.status === 405) throw new Error("Photo upload is not available yet. Restart the server, then refresh the page (Ctrl + Shift + R).");
      if (res.status === 401 || res.status === 403) throw new Error("Please log in again to send photos.");
      throw new Error("Photo upload failed (error " + res.status + ").");
    }
    return data.id;
  };
  const pickPhoto = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (!/^image\//.test(file.type)) { setError("Please choose an image file"); return; }
    try {
      setError("");
      const blob = await compressChatPhoto(file);
      setPendingPhoto({ blob, url: URL.createObjectURL(blob) });
      inputRef.current?.focus();
    } catch (err) { setError(err.message); }
  };
  const shortText = (t) => { const mt = /^🧾 Order (\S+)/.exec(t || ""); return mt ? `🧾 Order ${mt[1]}` : (t || ""); };
  const startReply = (m) => { setReplyTo(m); setMenuFor(null); inputRef.current?.focus(); };
  const jumpToMessage = (id) => {
    const box = scrollRef.current, el = box && box.querySelector(`[data-mid="${id}"]`);
    if (!el) return;
    const top = box.scrollTop + el.getBoundingClientRect().top - box.getBoundingClientRect().top - 80;
    if (box.scrollTo) box.scrollTo({ top: Math.max(0, top), behavior: "smooth" }); else box.scrollTop = Math.max(0, top);
    setFlashId(id); setTimeout(() => setFlashId(null), 1400);
  };
  const deleteMsg = async (m) => {
    setMenuFor(null);
    if (!window.confirm("Delete this message for everyone?")) return;
    try {
      await chatCall(`/api/chat/messages/${m.id}`, { method: "DELETE" });
      setMessages(list => list.map(x => x.id === m.id ? { ...x, message: "", deleted_at: new Date().toISOString() } : x));
      if (isAdmin) refreshConversations().catch(() => {});
    } catch (e) { setError(e.message); }
  };
  const copyMsg = (m) => { setMenuFor(null); try { navigator.clipboard.writeText(m.message); } catch (e) {} };
  useEffect(() => {
    if (menuFor === null) return;
    const close = () => setMenuFor(null);
    document.addEventListener("click", close);
    return () => document.removeEventListener("click", close);
  }, [menuFor]);
  useEffect(() => {
    if (!lightbox) return;
    const onEsc = (e) => { if (e.key === "Escape") setLightbox(null); };
    document.addEventListener("keydown", onEsc);
    return () => document.removeEventListener("keydown", onEsc);
  }, [lightbox]);
  // ---- search inside this chat ----
  const q = query.trim().toLowerCase();
  const matchIds = q ? messages.filter(m => !m.deleted_at && !(m.image_id && m.message === "📷 Photo") && (m.message || "").toLowerCase().includes(q)).map(m => m.id) : [];
  const curPos = matchIds.length ? Math.min(matchPos, matchIds.length - 1) : -1;
  const curId = curPos >= 0 ? matchIds[curPos] : null;
  useEffect(() => { setMatchPos(Math.max(0, matchIds.length - 1)); }, [q]);
  useEffect(() => {
    if (curId === null) return;
    const box = scrollRef.current, el = box && box.querySelector(`[data-mid="${curId}"]`);
    if (!el) return;
    const top = box.scrollTop + el.getBoundingClientRect().top - box.getBoundingClientRect().top - 80;
    if (box.scrollTo) box.scrollTo({ top: Math.max(0, top), behavior: "smooth" }); else box.scrollTop = Math.max(0, top);
  }, [curId, q]);
  const stepMatch = (dir) => { if (matchIds.length) setMatchPos(p => (Math.min(p, matchIds.length - 1) + dir + matchIds.length) % matchIds.length); };
  const closeSearch = () => { setSearchOpen(false); setQuery(""); };
  const toggleSearch = () => { if (searchOpen) closeSearch(); else { setSearchOpen(true); setTimeout(() => searchRef.current?.focus(), 30); } };
  // ---- reactions (one per person per message; tap the same emoji again to remove it) ----
  const REACTION_SET = ["👍", "❤️", "😂", "😮", "😢", "🙏"];
  useEffect(() => {
    if (!reactFor) return;
    const close = () => setReactFor(null);
    document.addEventListener("click", close);
    return () => document.removeEventListener("click", close);
  }, [reactFor]);
  const withReaction = (list, next) => {
    let out = (list || []).map(r => r.mine ? { ...r, count: r.count - 1, mine: false } : r).filter(r => r.count > 0);
    if (next) {
      const hit = out.find(r => r.emoji === next);
      if (hit) out = out.map(r => r === hit ? { ...r, count: r.count + 1, mine: true } : r);
      else out = [...out, { emoji: next, count: 1, mine: true, names: [] }];
    }
    return out;
  };
  const reactTo = async (m, emoji) => {
    setReactFor(null);
    const mineNow = (m.reactions || []).find(r => r.mine);
    const next = mineNow && mineNow.emoji === emoji ? null : emoji;
    setMessages(list => list.map(x => x.id === m.id ? { ...x, reactions: withReaction(x.reactions, next) } : x));
    try {
      await chatCall(`/api/chat/messages/${m.id}/reaction`, { method: "POST", body: { emoji: next } });
      await refreshMessages(selectedUserId);
    } catch (e) { setError(e.message); refreshMessages(selectedUserId).catch(() => {}); }
  };
  const reactControl = (m, side, boxEl) => (
    <div className={`chat-react-wrap ${reactFor && reactFor.id === m.id ? "open" : ""}`}>
      <button type="button" className="chat-react-btn" aria-label="React to message" title="React"
        onClick={e => {
          e.stopPropagation();
          if (reactFor && reactFor.id === m.id) { setReactFor(null); return; }
          const box = scrollRef.current;
          const place = box && e.currentTarget.getBoundingClientRect().top - box.getBoundingClientRect().top < 70 ? "down" : "up";
          setReactFor({ id: m.id, place });
        }}>☺</button>
      {reactFor && reactFor.id === m.id && (
        <div className={`chat-reactbar ${reactFor.place} ${side}`} onClick={e => e.stopPropagation()}>
          {REACTION_SET.map(em => {
            const on = (m.reactions || []).some(r => r.mine && r.emoji === em);
            return <button key={em} type="button" className={on ? "on" : ""} aria-label={`React ${em}`} onClick={() => reactTo(m, em)}>{em}</button>;
          })}
        </div>
      )}
    </div>
  );
  const highlight = (text) => {
    if (!q) return text;
    const out = [], low = text.toLowerCase();
    let i = 0, k = 0;
    for (;;) {
      const j = low.indexOf(q, i);
      if (j < 0) break;
      if (j > i) out.push(text.slice(i, j));
      out.push(<mark key={k++} className="chat-hit">{text.slice(j, j + q.length)}</mark>);
      i = j + q.length;
    }
    out.push(text.slice(i));
    return out;
  };
  const emitTyping = (on) => {
    const sock = window.__campusSocket;
    if (!sock || (isAdmin && !selectedUserId)) return;
    sock.emit("chat:typing", { to: isAdmin ? selectedUserId : 0, typing: on });
  };
  useEffect(() => {
    const onTyping = (e) => {
      const d = e.detail || {};
      if (isAdmin && Number(d.from) !== Number(selectedUserId)) return;
      clearTimeout(typingTimer.current);
      setTyping(!!d.typing);
      if (d.typing) typingTimer.current = setTimeout(() => setTyping(false), 4000);
    };
    window.addEventListener("chat-typing", onTyping);
    return () => { window.removeEventListener("chat-typing", onTyping); clearTimeout(typingTimer.current); };
  }, [isAdmin, selectedUserId]);
  useEffect(() => { setTyping(false); }, [selectedUserId, messages.length]);
  const parseOrder = (text) => {
    const mt = /^🧾 Order (\S+) \| ([^|]+) \| ([^|]+) \| ([\s\S]*)$/.exec(text || "");
    return mt ? { token: mt[1], status: mt[2].trim(), total: mt[3].trim(), items: mt[4].trim() } : null;
  };
  const openOrders = async () => {
    setEmojiOpen(false);
    const next = !orderOpen;
    setOrderOpen(next);
    if (next && myOrders === null) {
      try {
        const list = await chatCall("/api/orders/mine");
        setMyOrders(Array.isArray(list) ? list.slice(0, 6) : []);
      } catch (e) { setMyOrders([]); setError(e.message); }
    }
  };
  const shareOrder = (o) => {
    const items = (o.items || []).map(i => `${i.qty}× ${i.name}`).join(", ").slice(0, 200) || "-";
    send(`🧾 Order ${o.token} | ${o.status} | ${taka(o.total)} | ${items}`);
  };
  useEffect(() => {
    const el = inputRef.current;
    fitChatInput(el);
  }, [draft]);

  const di = dividerId ? messages.findIndex(m => m.id === dividerId) : -1;
  const unreadN = di < 0 ? 0 : messages.slice(di).filter(m => Number(m.sender_id) !== Number(userId) && !m.deleted_at).length;
  const rows = [];
  messages.forEach((m, i) => {
    const prev = messages[i - 1], next = messages[i + 1];
    const mine = Number(m.sender_id) === Number(userId);
    if (!prev || new Date(prev.created_at).toDateString() !== new Date(m.created_at).toDateString())
      rows.push(<div key={`d${m.id}`} className="chat-day"><span>{dayLabel(m.created_at)}</span></div>);
    if (m.id === dividerId && unreadN > 0)
      rows.push(<div key={`u${m.id}`} ref={dividerRef} className="chat-unread"><span>{unreadN} new message{unreadN === 1 ? "" : "s"}</span></div>);
    const first = !prev || Number(prev.sender_id) !== Number(m.sender_id) || new Date(prev.created_at).toDateString() !== new Date(m.created_at).toDateString();
    const last = !next || Number(next.sender_id) !== Number(m.sender_id);
    rows.push(
      <div key={m.id} data-mid={m.id} className={`chat-row ${mine ? "mine" : ""} ${flashId === m.id ? "flash" : ""} ${curId === m.id ? "search-current" : ""}`}>
        {!mine && <div style={{ width: 30 }}>{last && <Avatar name={m.sender_name || heading} size={30} />}</div>}
        {mine && !m.pending && !m.deleted_at && (
          <div className="chat-more-wrap">
            <button type="button" className="chat-more" aria-label="Message options"
              onClick={e => { e.stopPropagation(); setMenuFor(menuFor === m.id ? null : m.id); }}>⋯</button>
            {menuFor === m.id && (
              <div className="chat-menu" onClick={e => e.stopPropagation()}>
                <button type="button" onClick={() => copyMsg(m)}>Copy</button>
                <button type="button" className="danger" onClick={() => deleteMsg(m)}>Delete</button>
              </div>
            )}
          </div>
        )}
        {mine && !m.pending && !m.deleted_at && (
          <button type="button" className="chat-reply-btn" aria-label="Reply" title="Reply" onClick={() => startReply(m)}>↩</button>
        )}
        {mine && !m.pending && !m.deleted_at && reactControl(m, "mine")}
        <div className={`chat-bubble ${mine ? "mine" : "theirs"} ${first ? "first" : ""} ${last ? "last" : ""} ${m.pending ? "pending" : ""} ${!m.deleted_at && m.reactions && m.reactions.length ? "has-react" : ""}`}>
          {!mine && first && isAdmin === false && <div className="chat-name">{m.sender_name}</div>}
          {m.reply_to_id && !m.deleted_at && (
            <button type="button" className="chat-quote" onClick={() => jumpToMessage(m.reply_to_id)}>
              <b>{Number(m.reply_sender_id) === Number(userId) ? "You" : (m.reply_sender_name || "Message")}</b>
              <span>{m.reply_deleted ? "🚫 Message deleted" : shortText(m.reply_text)}</span>
            </button>
          )}
          {!m.deleted_at && (m.image_id || m.image_local) && (
            m.image_local
              ? <img className="chat-img" src={m.image_local} alt="Sending photo" />
              : <ChatImage id={m.image_id} apiBase={apiBase} token={sessionToken} onOpen={setLightbox} />
          )}
          {m.deleted_at ? <p className="chat-deleted">🚫 This message was deleted</p> : (() => {
            const oc = parseOrder(m.message);
            return oc ? (
              <div className="chat-order">
                <div className="chat-order-top"><span className="chat-order-token">🧾 {oc.token}</span><span className="chat-order-status">{oc.status}</span></div>
                <div className="chat-order-items">{oc.items}</div>
                <div className="chat-order-total">{oc.total}</div>
              </div>
            ) : ((m.image_id || m.image_local) && m.message === "📷 Photo") ? null : <p>{highlight(m.message)}</p>;
          })()}
          <span className="chat-meta">{fmtTime(m.created_at)}{mine && <b>{m.pending ? " ·" : m.read_at ? " ✓✓" : " ✓"}</b>}</span>
          {!m.deleted_at && m.reactions && m.reactions.length > 0 && (
            <div className="chat-reactions">
              {m.reactions.map(r => (
                <button key={r.emoji} type="button" className={`chat-pill-react ${r.mine ? "mine" : ""}`}
                  title={(r.names || []).join(", ")} onClick={() => reactTo(m, r.emoji)}>
                  <span>{r.emoji}</span>{r.count > 1 && <b>{r.count}</b>}
                </button>
              ))}
            </div>
          )}
        </div>
        {!mine && !m.pending && !m.deleted_at && (
          <button type="button" className="chat-reply-btn" aria-label="Reply" title="Reply" onClick={() => startReply(m)}>↩</button>
        )}
        {!mine && !m.pending && !m.deleted_at && reactControl(m, "theirs")}
      </div>
    );
  });

  return (
    <section className="chat-shell" data-admin={isAdmin ? "1" : "0"} data-mobile-chat={mobileChat ? "1" : "0"}>
      {isAdmin && (
        <aside className="card chat-inbox">
          <div className="chat-inbox-head">
            <div className="chat-inbox-title">
              <h2 className="font-display font-700" style={{ color: "var(--gold)" }}>Inbox</h2>
              <span className="chat-online-count"><i className="chat-dot on" />{onlineIds.length} online</span>
            </div>
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search name or message…" className="chat-search" />
          </div>
          <div className="chat-inbox-list">
            {filtered.length === 0 ? (
              <p className="p-4 text-sm text-center" style={{ color: "var(--ink-soft)" }}>{conversations.length ? "No match found." : "No messages yet."}</p>
            ) : filtered.map(c => {
              const active = Number(selectedUserId) === Number(c.user_id), unread = Number(c.unread_count) > 0;
              return (
                <button key={c.user_id} className={`chat-item ${active ? "active" : ""}`}
                  onClick={() => { setSelectedUserId(c.user_id); setMobileChat(true); }}>
                  {withDot(c.name, 42, isOnline(c.user_id))}
                  <span className="chat-item-body">
                    <span className="chat-item-top">
                      <span className="chat-item-name" style={{ fontWeight: unread ? 700 : 600 }}>{c.name}</span>
                      <span className="chat-item-time">{listTime(c.updated_at || c.last_at)}</span>
                    </span>
                    <span className="chat-item-bottom">
                      <span className="chat-item-last" style={{ fontWeight: unread ? 600 : 400 }}>{c.last_message || "No messages"}</span>
                      {unread && <span className="chat-badge">{c.unread_count}</span>}
                    </span>
                    <span className="chat-item-role">{c.role}{" · "}{isOnline(c.user_id) ? <b className="chat-online-text">Online</b> : (lastSeen[String(c.user_id)] != null ? `Offline · ${agoText(lastSeen[String(c.user_id)])}` : "Offline")}</span>
                  </span>
                </button>
              );
            })}
          </div>
        </aside>
      )}
      <div className="card chat-panel">
        <header className="chat-head">
          {isAdmin && <button className="chat-back" onClick={() => setMobileChat(false)} aria-label="Back"><Icon path="M15 18l-6-6 6-6" /></button>}
          {withDot(heading, 40, headOnline)}
          <div style={{ minWidth: 0, flex: 1 }}>
            <h2 className="font-display font-700 truncate" style={{ color: "var(--ink)" }}>{heading}</h2>
            <p className="text-xs capitalize" style={{ color: "var(--ink-soft)" }}>
              {typing ? <span className="chat-typing-text">typing…</span> : (
              <>
                {headOnline !== undefined && <span className={headOnline ? "chat-online-text" : ""}>{headOnline ? "Online" : "Offline"}{!headOnline && headAgo != null ? ` · last seen ${agoText(headAgo)}` : ""}</span>}
                {headOnline !== undefined && " · "}
                {isAdmin ? selected?.role || "Admin inbox" : tx("chat.private")}
              </>
            )}
            </p>
          </div>
          <button type="button" className={`chat-search-btn ${searchOpen ? "on" : ""}`} aria-label="Search in chat" title="Search in chat" onClick={toggleSearch}>
            <Icon path="M21 21l-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z" className="w-5 h-5" />
          </button>
          <span className="chat-pill">{tx("chat.support")}</span>
        </header>
        {searchOpen && (
          <div className="chat-searchbar">
            <input ref={searchRef} value={query} onChange={e => setQuery(e.target.value)} placeholder="Search in this chat…"
              onKeyDown={e => { if (e.key === "Escape") closeSearch(); else if (e.key === "Enter") { e.preventDefault(); stepMatch(e.shiftKey ? 1 : -1); } }} />
            <span className="chat-search-count">{q ? (matchIds.length ? `${curPos + 1} of ${matchIds.length}` : "No results") : ""}</span>
            <button type="button" aria-label="Older match" title="Older match (Enter)" disabled={matchIds.length < 2} onClick={() => stepMatch(-1)}>▲</button>
            <button type="button" aria-label="Newer match" title="Newer match (Shift+Enter)" disabled={matchIds.length < 2} onClick={() => stepMatch(1)}>▼</button>
            <button type="button" aria-label="Close search" onClick={closeSearch}>✕</button>
          </div>
        )}
        {error && <p className="chat-error">{error}</p>}
        <div className="chat-scroll-wrap">
        <div className="chat-scroll" ref={scrollRef} onScroll={onScroll} aria-live="polite">
          {messages.length === 0 ? (
            <div className="chat-empty">
              <div className="chat-empty-icon"><Icon path={I.chat} className="w-8 h-8" /></div>
              <p>{isAdmin && !selectedUserId ? "Select a student or teacher to open their conversation." : tx("chat.empty")}</p>
              {!isAdmin && (
                <div className="chat-quick">
                  {quick.map(q => <button key={q} type="button" onClick={() => send(q)}>{q}</button>)}
                </div>
              )}
            </div>
          ) : rows}
          {typing && (
            <div className="chat-row">
              <div style={{ width: 30 }}><Avatar name={heading} size={30} /></div>
              <div className="chat-bubble theirs first last chat-typing"><i /><i /><i /></div>
            </div>
          )}
          <div ref={bottomRef} />
        </div>
        {!atBottom && messages.length > 0 && (
          <button type="button" className="chat-jump" onClick={jumpToBottom} aria-label="Jump to latest message">
            <Icon path="M12 5v14M19 12l-7 7-7-7" className="w-5 h-5" />
            {newBelow > 0 && <span className="chat-jump-badge">{newBelow}</span>}
          </button>
        )}
        </div>
        {isAdmin && selectedUserId && (
          <div className="chat-templates">
            {templates.map(t => <button key={t} type="button" onClick={() => { setDraft(t); inputRef.current?.focus(); }}>{t}</button>)}
          </div>
        )}
        {pendingPhoto && (
          <div className="chat-photobar">
            <img src={pendingPhoto.url} alt="Selected photo" />
            <span>Photo ready. Add a caption (optional) and press send.</span>
            <button type="button" aria-label="Remove photo" onClick={() => setPendingPhoto(null)}>✕</button>
          </div>
        )}
        {replyTo && (
          <div className="chat-replybar">
            <div>
              <b>Replying to {Number(replyTo.sender_id) === Number(userId) ? "yourself" : (replyTo.sender_name || heading)}</b>
              <span>{shortText(replyTo.message)}</span>
            </div>
            <button type="button" aria-label="Cancel reply" onClick={() => setReplyTo(null)}>✕</button>
          </div>
        )}
        <form className="chat-composer" onSubmit={e => { e.preventDefault(); send(); }}>
          <button type="button" className="chat-emoji-btn" aria-label="Send a photo" title="Send a photo"
            onClick={() => fileRef.current?.click()} disabled={isAdmin && !selectedUserId}>📷</button>
          <input ref={fileRef} type="file" accept="image/*" hidden onChange={pickPhoto} />
          {!isAdmin && (
            <button type="button" className="chat-emoji-btn" aria-label="Share an order" title="Share an order" onClick={openOrders}>🧾</button>
          )}
          {orderOpen && !isAdmin && (
            <div className="chat-order-panel">
              {myOrders === null ? <p className="chat-order-note">Loading…</p>
                : myOrders.length === 0 ? <p className="chat-order-note">You have no orders yet.</p>
                : myOrders.map(o => (
                  <button key={o.token} type="button" className="chat-order-pick" onClick={() => shareOrder(o)}>
                    <b>{o.token} · {o.status} · {taka(o.total)}</b>
                    <small>{(o.items || []).map(i => `${i.qty}× ${i.name}`).join(", ").slice(0, 70)}</small>
                  </button>
                ))}
            </div>
          )}
          <button type="button" className="chat-emoji-btn" aria-label="Emoji" onClick={() => { setOrderOpen(false); setEmojiOpen(o => !o); }}
            disabled={isAdmin && !selectedUserId}>😊</button>
          {emojiOpen && (
            <div className="chat-emoji-panel">
              {emojis.map(em => <button key={em} type="button" onClick={() => addEmoji(em)}>{em}</button>)}
            </div>
          )}
          <div className="chat-input-wrap">
            <textarea ref={inputRef} value={draft} onChange={onInput} onKeyDown={onKey} maxLength={4000} rows={1}
              disabled={isAdmin && !selectedUserId} placeholder={tx("chat.ph")} />
            {draft.length > 3500 && <span className="chat-count">{draft.length}/4000</span>}
          </div>
          <button type="submit" className="chat-send" aria-label={tx("chat.send")}
            disabled={busy || (!draft.trim() && !pendingPhoto) || (isAdmin && !selectedUserId)}>
            <Icon path="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" className="w-5 h-5" />
          </button>
        </form>
      </div>
      {lightbox && (
        <div className="chat-lightbox" onClick={() => setLightbox(null)}>
          <img src={lightbox} alt="Photo" />
        </div>
      )}
    </section>
  );
}

// Shrinks a chosen photo (max 1280px, JPEG) so it stays small enough to upload quickly.
function compressChatPhoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = async () => {
      try {
        let scale = Math.min(1, 1280 / Math.max(img.width, img.height)), quality = 0.82, blob = null;
        for (let i = 0; i < 6; i++) {
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", quality));
          if (blob && blob.size <= 700 * 1024) break;
          quality = Math.max(0.5, quality - 0.1); scale *= 0.85;
        }
        URL.revokeObjectURL(url);
        if (!blob || blob.size > 900 * 1024) return reject(new Error("This photo is too large. Please choose a smaller one."));
        resolve(blob);
      } catch (e) { reject(new Error("Could not process this photo")); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("This file is not a supported photo")); };
    img.src = url;
  });
}

// A photo inside a chat bubble. Loaded with the login token, so only the two people in the chat can see it.
function ChatImage({ id, apiBase, token, onOpen }) {
  const [src, setSrc] = useState(() => (window.__chatImgCache && window.__chatImgCache[id]) || null);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    if (src) return;
    let alive = true;
    fetch(`${apiBase}/api/chat/images/${id}`, { headers: { Authorization: `Bearer ${token}` } })
      .then(r => { if (!r.ok) throw new Error("missing"); return r.blob(); })
      .then(b => {
        const url = URL.createObjectURL(b);
        (window.__chatImgCache = window.__chatImgCache || {})[id] = url;
        if (alive) setSrc(url);
      })
      .catch(() => { if (alive) setFailed(true); });
    return () => { alive = false; };
  }, [id]);
  if (failed) return <div className="chat-img-missing">📷 Photo unavailable</div>;
  if (!src) return <div className="chat-img-skel" />;
  return <img className="chat-img" src={src} alt="Chat photo" onClick={() => onOpen(src)} />;
}

function Avatar({ src, name, size = 34, className = "" }) {
  const letter = (name || "?").trim().charAt(0).toUpperCase();
  const base = { width: size, height: size, borderRadius: 999, flexShrink: 0 };
  if (src) return <img src={src} alt={name || ""} className={className} style={{ ...base, objectFit: "cover" }} />;
  return (
    <div className={`grid place-items-center text-white font-700 ${className}`}
      style={{ ...base, fontSize: size * 0.4, background: "linear-gradient(135deg, var(--gold) 0%, var(--gold-hover) 100%)" }}>{letter}</div>
  );
}
// Reads an image file, crops it to a centred square and shrinks it to 256px (keeps the upload tiny).
function fileToAvatar(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("img"));
      img.onload = () => {
        const size = 256, side = Math.min(img.width, img.height);
        const c = document.createElement("canvas"); c.width = size; c.height = size;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function ProfileTab({ user, call, onUpdated, liveBalance }) {
  const [editing, setEditing] = useState(false);
  const [profile, setProfile] = useState({
    name: user.name, email: "", accountType: "regular", phone: "", address: "", department: "", fatherPhone: "", hallName: "", roomNumber: "", hallId: null,
  });
  const [walletBalance, setWalletBalance] = useState(user.walletBalance);
  /* Fix: profile balance = live wallet balance */
  const shownBalance = liveBalance != null ? liveBalance : walletBalance;
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [avatar, setAvatar] = useState(user.avatar || null);
  const [avatarChanged, setAvatarChanged] = useState(false);
  const fileRef = useRef(null);
  const [announcementText, setAnnouncementText] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [success, setSuccess] = useState(null);

  const loadProfile = () => call("/api/auth/me").then(data => {
    setProfile({
      name: data.name, email: data.email || "", accountType: data.accountType || "regular",
      phone: data.phone || "", address: data.address || "",
      department: data.department || "", fatherPhone: data.fatherPhone || "",
      hallName: data.hallName || "", roomNumber: data.roomNumber || "", hallId: data.hallId || null,
    });
    setWalletBalance(data.walletBalance);
    setAvatar(data.avatar || null); setAvatarChanged(false);
  }).catch(() => {});

  const pickPhoto = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setError(null);
    if (!/^image\/(png|jpe?g|webp|gif|bmp)$/i.test(file.type)) { setError(tx("pic.bad")); return; }
    try { setAvatar(await fileToAvatar(file)); setAvatarChanged(true); }
    catch (_) { setError(tx("pic.bad")); }
  };

  useEffect(() => { loadProfile(); }, []);

  const save = async () => {
    setError(null); setSuccess(null);
    if (!profile.name.trim()) { setError(tx("pe.name")); return; }
    if (newPassword && newPassword.length < 6) { setError(tx("pe.pw6")); return; }
    if (newPassword && !currentPassword) { setError(tx("pe.cur")); return; }
    if (newPassword && newPassword !== confirmPassword) { setError(tx("pe.match")); return; }
    setBusy(true);
    try {
      const body = {
        name: profile.name, phone: profile.phone, address: profile.address,
        department: profile.department, fatherPhone: profile.fatherPhone,
      };
      if (profile.email.trim()) body.email = profile.email.trim();
      if (user.role !== "admin") { body.roomNumber = profile.roomNumber; body.hallName = profile.hallName; }
      if (newPassword) { body.currentPassword = currentPassword; body.newPassword = newPassword; }
      if (avatarChanged) body.avatar = avatar;
      const data = await call("/api/auth/me", { method: "PUT", body });
      onUpdated(data);
      setProfile(p => ({ ...p, hallId: data.hallId || p.hallId }));
      setCurrentPassword(""); setNewPassword(""); setConfirmPassword("");
      setAvatarChanged(false);
      setSuccess(tx("pe.ok"));
      setEditing(false);
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const cancelEdit = () => {
    setError(null); setCurrentPassword(""); setNewPassword(""); setConfirmPassword("");
    setEditing(false);
    loadProfile();
  };

  const sendAnnouncement = async () => {
    if (!announcementText.trim()) return;
    setBusy(true);
    try {
      await call("/api/admin/announcement", { method: "POST", body: { message: announcementText.trim() } });
      setAnnouncementText("");

          <div className="grid grid-cols-2 gap-4">

              <div className="grid grid-cols-2 gap-4">

              <div className="space-y-2">

                  className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                <input value={newPassword} onChange={e => setNewPassword(e.target.value)} type={showPw ? "text" : "password"} placeholder={tx("newpw2")} autoComplete="new-password"

                <input value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} type={showPw ? "text" : "password"} placeholder={tx("cfpw")} autoComplete="new-password"

                <label className="flex items-center gap-2 text-xs cursor-pointer select-none" style={{ color: "var(--ink-soft)" }}>
                  <input type="checkbox" checked={showPw} onChange={e => setShowPw(e.target.checked)} /> {tx("showpw")}

          {editing && (

              </button>

        </div>
      </div>
    </div>
  );

// Waits for hall/loader.js to finish compiling the Hall files, then shows the Hall.
function HallGate(props) {
  const [ready, setReady] = useState(!!window.HallApp);
  useEffect(() => {
    if (ready) return;
    const t = setInterval(() => { if (window.HallApp || window.HallLoadError) { setReady(true); clearInterval(t); } }, 150);
    return () => clearInterval(t);
  }, [ready]);
  if (window.HallLoadError) return <div className="p-6 text-sm">Could not load the Hall: {window.HallLoadError} <button className="btn-gold px-3 py-1.5 rounded-lg text-xs ml-2" onClick={props.onBack}>← Back</button></div>;
  if (!ready || !window.HallApp) return <div className="p-6 text-sm opacity-70">Loading Hall…</div>;
  const Hall = window.HallApp;
  return <Hall {...props} ui={{ ThemeMenu, Avatar, WalletTab, ProfileTab }} />;
}

// Fix 12: one broken screen must not blank the whole app. Shows a friendly card instead.
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { failed: false, error: null, stack: "", tries: 0 };
    this.retry = this.retry.bind(this);
  }
  static getDerivedStateFromError(error) {
    return { failed: true, error };
  }
  componentDidCatch(error, info) {
    this.setState({ stack: (info && info.componentStack) || "" });
    console.error("CampusDine: a screen crashed while drawing:", error, info && info.componentStack);
  }
  retry() {
    this.setState((s) => ({ failed: false, error: null, stack: "", tries: s.tries + 1 }));
  }
  render() {
    if (!this.state.failed) return <React.Fragment key={this.state.tries}>{this.props.children}</React.Fragment>;
    const whole = this.props.scope === "app";
    const bn = typeof CURRENT_LANG !== "undefined" && CURRENT_LANG === "bn";
    const text = whole
      ? (bn
        ? { title: "কিছু একটা ভুল হয়েছে", body: "অ্যাপে একটা অপ্রত্যাশিত সমস্যা হয়েছে। পেজটি রিলোড করুন, আবার লগইন করতে হতে পারে।" }
        : { title: "Something went wrong", body: "The app hit an unexpected error. Reload the page — you may need to log in again." })
      : (bn
        ? { title: "এই স্ক্রিনে একটা সমস্যা হয়েছে", body: "বাকি অ্যাপ ঠিকঠাক চলছে। আবার চেষ্টা করুন, অথবা অন্য ট্যাব খুলুন।" }
        : { title: "This screen ran into a problem", body: "The rest of the app still works — try again, or open another tab." });
    const labels = bn
      ? { again: "আবার চেষ্টা করুন", reload: "রিলোড করুন", details: "টেকনিক্যাল তথ্য" }
      : { again: "Try again", reload: "Reload", details: "Technical details" };
    const err = this.state.error;
    const detail = [
      err && err.name ? err.name + ": " + (err.message || "") : String(err),
      ...String(this.state.stack || "").split("\n").filter(Boolean).slice(0, 6),
    ].join("\n");
    const card = (
      <div role="alert" style={{ maxWidth: 520, margin: whole ? "0 auto" : "24px auto", padding: "22px 22px 18px", borderRadius: 16, border: "1px solid rgba(220,38,38,0.35)", background: "rgba(220,38,38,0.07)", color: "var(--ink, #1f2937)", textAlign: "center" }}>
        <div style={{ fontSize: 34, lineHeight: 1 }}>⚠️</div>
        <h2 style={{ fontWeight: 700, fontSize: 18, margin: "10px 0 6px" }}>{text.title}</h2>
        <p style={{ fontSize: 14, opacity: 0.8, margin: "0 0 14px" }}>{text.body}</p>
        <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
          <button type="button" className="btn-primary" style={{ padding: "8px 16px", borderRadius: 10, fontSize: 14 }} onClick={this.retry}>{labels.again}</button>
          <button type="button" className="btn-gold" style={{ padding: "8px 16px", borderRadius: 10, fontSize: 14 }} onClick={() => window.location.reload()}>{labels.reload}</button>
        </div>
        <details style={{ marginTop: 14, textAlign: "left", fontSize: 12 }}>
          <summary style={{ cursor: "pointer", opacity: 0.7 }}>{labels.details}</summary>
          <pre style={{ whiteSpace: "pre-wrap", wordBreak: "break-word", marginTop: 8, fontSize: 11, userSelect: "text" }}>{detail}</pre>
        </details>
      </div>
    );
    return whole
      ? <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>{card}</div>
      : card;
  }
}

function App() {

  const [coupons, setCoupons] = useState([]);

  const [myGeneralFeedback, setMyGeneralFeedback] = useState([]);
  const [generalBusy, setGeneralBusy] = useState(false);
  const [newFeedbackCount, setNewFeedbackCount] = useState(0);
  const [notifications, setNotifications] = useState([]);
  const [toastNotifications, setToastNotifications] = useState([]);
  const [notificationCenterOpen, setNotificationCenterOpen] = useState(false);
  const [chatRefreshKey, setChatRefreshKey] = useState(0);
  const [loyaltyKey, setLoyaltyKey] = useState(0); // bumped whenever points / offers may have changed

  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth() + 1);
  const isCurrentMonth = year === now.getFullYear() && month === now.getMonth() + 1;

  const goPrevMonth = () => {
    if (month === 1) { setYear(y => y - 1); setMonth(12); } else { setMonth(m => m - 1); }
  };
  const goNextMonth = () => {
    if (month === 12) { setYear(y => y + 1); setMonth(1); } else { setMonth(m => m + 1); }
  };
  const goToday = () => { setYear(now.getFullYear()); setMonth(now.getMonth() + 1); };

  const socketRef = useRef(null);
  const showError = (e) => { setSuccess(null); setError(typeof e === "string" ? e : e.message); };
  const showSuccess = (msg) => { setError(null); setSuccess(msg); };
  const markAllNotificationsRead = () => setNotifications(prev => prev.map(item => ({ ...item, read: true })));
  const clearNotifications = () => setNotifications([]);
  const pushNotification = (kind, title, message) => {
    const id = Date.now() + Math.random();
    const item = { id, kind, title, message, read: false, createdAt: new Date().toISOString() };
    setNotifications(prev => [item, ...prev]);
    setToastNotifications(prev => [item, ...prev].slice(0, 3));
    setTimeout(() => {
      setToastNotifications(prev => prev.filter(entry => entry.id !== id));
    }, 5000);
  };

  const call = (path, opts) => api(apiBase, path, { ...opts, token: session && session.token });

  const mapMenu = (rows) => rows.map(m => ({ ...m, bn: m.name_bn }));

  };
  const mapPaid = (rows) => {

      const who = payload.userName || "A user";
      const what = payload.kind === "order" ? `order ${payload.token}` : `the canteen (${payload.category})`;
      pushNotification("feedback", payload.updated ? "Feedback updated" : "New feedback", `${who} rated ${what} ${payload.rating}★`);
    });
    // Someone sent this user money: update the balance live
    socket.on("wallet:received", (payload) => {
      refreshWallet().catch(() => {});
      pushNotification("wallet", tx("n.received.t"), tx("n.received", { n: payload.from, a: taka(payload.amount) }));
    });
    // Order became Ready: points (and maybe a streak bonus) landed
    socket.on("loyalty:update", (p) => {
      setLoyaltyKey(k => k + 1);
      if (p.points > 0) pushNotification("loyalty", tx("n.points.t"), tx("n.points", { p: num(p.points + (p.bonus || 0)), o: p.token, b: num(p.balance) }));
      if (p.bonus > 0) pushNotification("loyalty", tx("n.points.t"), tx("n.bonus", { s: num(p.streak), b: num(p.bonus) }));
    });
    socket.on("announcement", (payload) => {
      pushNotification("announcement", tx("n.announce"), payload.message || tx("n.announce.def"));
    });
    socket.on("chat:message", (payload) => {
      setChatRefreshKey(value => value + 1);
      if (Number(payload.senderId) !== Number(session.user.id)) {
        pushNotification("chat", tx("n.chat"), `${payload.senderName}: ${payload.message}`);
      }
    });
    // Queue positions of everyone's orders shift whenever any order is placed, cancelled or advanced
    // Admin changed an item (sold out / hidden / price): refresh the menu live
    socket.on("menu:changed", () => { refreshMenu().catch(() => {}); });
    socket.on("menu:restocked", () => { refreshAlerts().catch(() => {}); });
    socket.on("queue:changed", () => {
      if (session.user.role !== "admin" && session.user.role !== "rider") refreshMyOrders().catch(() => {});
    });

    return () => socket.disconnect();
  }, [session, apiBase]);

  /* Feature: cart top-up shortcut */
  const [topupSuggest, setTopupSuggest] = useState(null);
  useEffect(() => { if (tab !== "wallet") setTopupSuggest(null); }, [tab]);
  const goTopUp = (shortage) => {
    setTopupSuggest(Math.min(10000, Math.max(10, Math.ceil(shortage / 10) * 10))); // rounded up to ৳10, within the ৳10,000 limit
    setTab("wallet");
  };

  const [issueTick, setIssueTick] = useState(0); // bumps when a new problem report arrives (admin list reloads)

  useEffect(() => {
    if (session && session.user.role !== "admin" && (tab === "wallet" || tab === "profile")) refreshWallet().catch(() => {});
  }, [tab]);

  /* Feature: recurring order */
  const [recurringDue, setRecurringDue] = useState([]);
  const notifiedDueRef = useRef(new Set());
  const refreshDue = async () => {
    const list = await call("/api/recurring/due");
    setRecurringDue(list);
    for (const p of list) {
      const key = p.id + ":" + p.today;
      if (!notifiedDueRef.current.has(key)) { notifiedDueRef.current.add(key); pushNotification("order", tx("rec.nt"), tx("rec.nm")); }
    }
  };
  useEffect(() => {
    if (!session || (session.user.role !== "student" && session.user.role !== "teacher")) return;
    refreshDue().catch(() => {});
    const timer = setInterval(() => refreshDue().catch(() => {}), 60000);
    return () => clearInterval(timer);
  }, [session && session.token]);
  const markDueDone = async (plan) => {
    await call("/api/recurring/" + plan.id + "/done", { method: "POST" });
    await refreshDue();
  };
  const addDue = async (plan) => {
    const anyAvailable = plan.items.some(i => { const m = menu.find(x => x.id === i.id); return m && m.stock > 0 && m.availability === "available"; });
    reorder({ items: plan.items.map(i => ({ menuItemId: i.id, name: i.name, qty: i.qty })) });
    if (anyAvailable) { try { await markDueDone(plan); } catch (e) { /* the cart is already filled */ } }
  };
  const skipDue = async (plan) => { try { await markDueDone(plan); } catch (e) { showError(e); } };

  /* Feature: monthly budget */
  const [budget, setBudget] = useState(null);
  const budgetNotifiedRef = useRef({});
  const refreshBudget = async () => {
    const b = await call("/api/summary/budget");
    setBudget(b);
    if (b.limit) {
      const pct = (b.spent / b.limit) * 100;
      const level = pct >= 100 ? 100 : pct >= 80 ? 80 : 0;
      if (level > (budgetNotifiedRef.current[b.month] || 0)) {
        budgetNotifiedRef.current[b.month] = level;
        pushNotification("wallet", tx(level === 100 ? "bud.over.t" : "bud.near.t"),
          tx(level === 100 ? "bud.over" : "bud.near", { s: taka(b.spent), l: taka(b.limit) }));
      }
    }
  };
  useEffect(() => {
    if (!session || (session.user.role !== "student" && session.user.role !== "teacher")) return;
    refreshBudget().catch(() => {});
  }, [orders, session && session.token]);
  const saveBudget = async (limit) => {
    const b = await call("/api/summary/budget", { method: "PUT", body: { limit } });
    setBudget(b);
  };

  const placeOrder = async (cartItems, paymentMethod, pickupTime, coupon, note, rewardId, deliveryNote, tip) => {
    setBusy(true); setError(null);
    try {
      const deliveryLocation = await new Promise(resolve => {
        /* Fix: order feedback */
        setTimeout(() => resolve(undefined), 2500); // give up on the location after 2.5s
        if (!navigator.geolocation) return resolve(undefined);
        navigator.geolocation.getCurrentPosition(
          position => resolve({ latitude: position.coords.latitude, longitude: position.coords.longitude }),
          () => resolve(undefined),
          { enableHighAccuracy: false, maximumAge: 60000, timeout: 1800 }
        );
      });
      const placed = await call("/api/orders", {
        method: "POST",
        body: {
          items: cartItems.map(c => ({ id: c.id, qty: c.qty })),
          paymentMethod,
          pickupTime: pickupTime || undefined,
          couponId: coupon ? coupon.couponId : undefined,
          couponCode: coupon ? coupon.code : undefined,
          note: note && note.trim() ? note.trim() : undefined,
          rewardId: rewardId || undefined,
          deliveryNote: deliveryNote && deliveryNote.trim() ? deliveryNote.trim() : undefined,
          tip: tip > 0 ? tip : undefined,
          deliveryLocation,
        },
      });
      setCart([]);
      setLoyaltyKey(k => k + 1);
      await Promise.all([refreshMyOrders(), refreshMenu(), paymentMethod === "wallet" ? refreshWallet() : Promise.resolve()]);
      setTab("track");
      showSuccess("✅ Order placed! Your token is " + placed.token + " — you can see it here in the Orders tab.");
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) { showError(e); window.scrollTo({ top: 0, behavior: "smooth" }); } finally { setBusy(false); }
  }; 
    // Order again: put the items of a past order back into the cart (current prices, capped by stock).
  const reorder = (order) => {
    // Fix 13: match items by id (name only as a fallback, and only inside the order's own restaurant);
    // an order from another restaurant opens that restaurant, because one order = one restaurant.
    const target = RESTAURANTS.find(r => r.id === order.restaurant) || restaurant;
    const switching = !!(target && restaurant && target.id !== restaurant.id);
    const next = switching ? [] : [...cart];
    const added = [];
    const skipped = [];
    for (const it of order.items) {
      const m = menu.find(x => (it.menuItemId != null
        ? x.id === it.menuItemId
        : x.name === it.name && (!target || x.restaurant === target.id)));
      if (!m || m.stock <= 0 || m.availability === "sold_out") { skipped.push(dispName(it.name)); continue; }
      const idx = next.findIndex(c => c.id === m.id);
      const have = idx >= 0 ? next[idx].qty : 0;
      const qty = Math.min(have + it.qty, m.stock);
      if (qty <= have) { skipped.push(dispName(it.name)); continue; }
      if (idx >= 0) next[idx] = { ...next[idx], qty }; else next.push({ ...m, qty });
      added.push(qty < have + it.qty ? `${dispName(m.name)} (${num(m.stock)}${tx("reorder.left")})` : dispName(m.name));
    }
    if (added.length === 0) { showError(tx("reorder.none")); return; }
    if (switching && cart.length > 0 && !window.confirm(lang === "bn"
      ? `এই অর্ডারটি ${target.name}-এর। সেখানে গেলে আপনার বর্তমান কার্ট খালি হয়ে যাবে। চালিয়ে যাবেন?`
      : `This order is from ${target.name}. Switching will empty your current cart. Continue?`)) return;
    if (switching) setRestaurant(target);
    setCart(next);
    showSuccess(tx("reorder.added") + added.join(", ") + "." + (skipped.length ? tx("reorder.skipped") + skipped.join(", ") + "." : ""));
    setTab("menu");
  };

  const advanceOrder = async (id) => {
    try {
      await call(`/api/orders/${id}/advance`, { method: "PATCH" });
      await refreshAdminOrders();
    } catch (e) { showError(e); }
  };

  const cancelOrder = async (id) => {
    setBusy(true); setError(null); setSuccess(null);
    try {
      const cancelled = await call(`/api/orders/${id}/cancel`, { method: "PATCH" });
      await Promise.all([refreshMyOrders(), refreshMenu(), refreshWallet()]);
      setLoyaltyKey(k => k + 1); // spent points come back on cancel
      showSuccess(
        cancelled.payment_method === "wallet"
          ? tx("msg.cancel.w", { t: cancelled.token, a: taka(Number(cancelled.total) + Number(cancelled.tip_amount || 0)) /* Fix: cancel refund shows tip */ })
          : tx("msg.cancel", { t: cancelled.token })
      );
    } catch (e) { showError(e); } finally { setBusy(false); }
  };

  const submitFeedback = async (orderId, rating, comment) => {
    setFeedbackBusy(true); setError(null);
    try {
      await call(`/api/orders/${orderId}/feedback`, { method: "POST", body: { rating, comment } });
      await refreshMyOrders();
      return true;
    } catch (e) { showError(e); return false; } finally { setFeedbackBusy(false); }
  };

  const submitGeneralFeedback = async (category, rating, comment) => {
    setGeneralBusy(true); setError(null);
    try {
      await call("/api/feedback", { method: "POST", body: { category, rating, comment } });
      await refreshMyGeneralFeedback();
      return true;
    } catch (e) { showError(e); return false; } finally { setGeneralBusy(false); }
  };

  // Admin: opening the Feedback tab always pulls the latest and clears the unread badge
  useEffect(() => {
    if (!session || session.user.role !== "admin" || tab !== "feedback") return;
    refreshFeedback().catch(() => {});
    setNewFeedbackCount(0);
  }, [tab, session, newFeedbackCount]);

  const topUp = async (amount, method) => {
    setBusy(true); setError(null);
    try {
      await call("/api/wallet/topup", { method: "POST", body: { amount, method } });
    } catch (e) { showError(e); throw e; } finally { setBusy(false); }
    // The top-up already succeeded on the server; a refresh hiccup shouldn't look like a failed payment.
    try { await refreshWallet(); } catch (e) { showError(e); }
  };

  // Wallet transfer: look the person up first, then send. Errors bubble up so the card can show them.
  const lookupRecipient = (id) => call(`/api/wallet/recipient?id=${encodeURIComponent(id)}`);
  const sendMoney = async (toId, amount, note) => {
    await call("/api/wallet/transfer", { method: "POST", body: { toId, amount, note } });
    try { await refreshWallet(); } catch (e) { showError(e); }
  };

  const toggleDay = async (day, currentStatus) => {
    const next = currentStatus === "off" ? "full" : currentStatus === "full" ? "half" : "off";
    if (calendarPaid[day] && !window.confirm(tx("mp.confirm"))) return;
    try {
      const r = await call(`/api/calendar/${day}`, { method: "PUT", body: { year, month, status: next } });
      await refreshCalendar();
      if (r.refunded) await refreshWallet();
    } catch (e) { showError(e); }
  };
  const payMealPlan = async () => {
    setPlanBusy(true);
    try {
      const r = await call("/api/calendar/pay", { method: "POST", body: { year, month } });
      setSuccess(tx("mp.paid.ok", { a: taka(r.paid), d: num(r.days) }));
      await refreshCalendar(); await refreshWallet();
    } catch (e) { showError(e); } finally { setPlanBusy(false); }
  };
  const repeatLastMonth = async () => {
    setPlanBusy(true);
    try {
      const r = await call("/api/calendar/repeat", { method: "POST", body: { year, month } });
      setSuccess(tx("mp.repeat.ok", { n: num(r.added) }));
      await refreshCalendar();
    } catch (e) { showError(e); } finally { setPlanBusy(false); }
  };

  const updateMenuItem = async (id, patch) => {
    try {
      await call(`/api/menu/${id}`, { method: "PUT", body: patch });
      await refreshMenu();
    } catch (e) { showError(e); }
  };
  const updateCoupon = async (id, patch) => {
    try {
      await call(`/api/coupon/${id}`, { method: "PUT", body: patch });
      await refreshCoupons();
      showSuccess("Coupon updated successfully.");
      return true;
    } catch (e) {
      showError(e);
      return false;
    }
  };
  const addMenuItem = async (item) => {
    try {
      await call("/api/menu", { method: "POST", body: { ...item, restaurant: restaurant && restaurant.id } });
      await refreshMenu();
    } catch (e) { showError(e); }
  };

  // Language: admin pages are English-only for now; student/teacher pages follow the toggle.
  CURRENT_LANG = (session && session.user.role === "admin") ? "en" : lang;
  MENU_BN = {};
  menu.forEach(m => { if (m.bn) MENU_BN[m.name] = m.bn; });
  const toggleLang = () => {
    const next = lang === "bn" ? "en" : "bn";
    setLang(next);
    try { localStorage.setItem("cd_lang", next); } catch (e) {}
  };

  if (!session) return <><RiderGpsBackground /><Login apiBase={apiBase} setApiBase={setApiBase} onAuth={onAuth} onToggleLang={toggleLang} /></>;

  if (session.user.role === "rider") return <><RiderGpsBackground /><RiderDashboard apiBase={apiBase} token={session.token} user={session.user} onLogout={logout} /></>;

  if (!restaurant) {
    return <><RiderGpsBackground /><RestaurantPicker role={session.user.role} userName={session.user.name} lang={lang}
      onPick={(r) => { setRestaurant(r); setTab(session.user.role === "admin" ? "overview" : "menu"); }} onLogout={logout} /></>;
  }

  // The Hall is its own section (no cart / riders / offers) — it replaces the whole restaurant screen
  if (restaurant.isHall) {
    return <HallGate call={call} user={session.user} token={session.token} lang={lang} onBack={() => setRestaurant(null)} onLogout={logout} refreshWallet={refreshWallet}
      ext={{ apiBase, wallet, busy, topUp, onLookup: lookupRecipient, onSend: sendMoney,
        onProfileUpdated: (u) => setSession(s => ({ ...s, user: { ...s.user, name: u.name, walletBalance: u.walletBalance, avatar: u.avatar || null, email: u.email || null, accountType: u.accountType, hallName: u.hallName || null, roomNumber: u.roomNumber || null, hallId: u.hallId || null } })) }} />;
  }

  // Each restaurant sells its own items; admin orders are also limited to the chosen restaurant
  const restaurantMenu = menu.filter(m => m.restaurant === restaurant.id);
  const restaurantOrders = session.user.role === "admin" ? orders.filter(o => o.restaurant === restaurant.id) : orders;
  const switchRestaurant = () => {
    if (cart.length > 0 && !window.confirm(session.user.role !== "admin" && lang === "bn"
      ? "রেস্টুরেন্ট বদলালে আপনার কার্ট খালি হয়ে যাবে। চালিয়ে যাবেন?"
      : "Switching restaurant will empty your cart. Continue?")) return;
    setCart([]);
    setRestaurant(null);
  };

  const toRate = orders.filter(o => o.status === "Ready" && !o.feedback).length;
  const userTabs = [
    { key: "menu", label: tx("nav.menu"), icon: I.menu },
    { key: "groupOrders", label: "Group orders", icon: I.ticket },
    { key: "track", label: tx("nav.track"), icon: I.clock },
    { key: "campusHub", label: "Campus Hub", icon: I.dashboard },
    { key: "calendar", label: tx("nav.calendar"), icon: I.calendar },
    { key: "wallet", label: tx("nav.wallet"), icon: I.wallet },
    { key: "rewards", label: tx("nav.rewards"), icon: I.gift },
    { key: "spending", label: tx("nav.spending"), icon: I.chart },
    { key: "chat", label: tx("nav.chat"), icon: I.chat },
    { key: "feedback", label: tx("nav.feedback"), icon: I.star, badge: toRate },
    { key: "profile", label: tx("nav.profile"), icon: I.user },
  ];
  const teacherTabs = [...userTabs, { key: "riderTracking", label: "Rider Tracking", icon: I.ticket }];
  const adminTabs = [
    { key: "overview", label: "Overview", icon: I.dashboard },
    { key: "commandCenter", label: "Command Center", icon: I.chart },
    { key: "adminMenu", label: "Menu", icon: I.box },
    { key: "hallFood", label: "Hall Food", icon: I.calendar },
    { key: "adminOrders", label: "Orders", icon: I.ticket },
    { key: "verify", label: "Scan token", icon: I.ticket },
    { key: "coupons", label: "Coupons", icon: I.ticket },
    { key: "offers", label: "Offers", icon: I.gift },
    { key: "chat", label: "Messages", icon: I.chat },
    { key: "reports", label: "Reports", icon: I.chart },
    { key: "feedback", label: "Feedback", icon: I.star, badge: newFeedbackCount },
    { key: "profile", label: "Profile", icon: I.user },
  ];

  const unreadNotifications = notifications.filter(item => !item.read).length;

  return (
    <div className="min-h-screen">
      <TopBar role={session.user.role} name={session.user.name} avatar={session.user.avatar}
        tabs={session.user.role === "admin" ? adminTabs : session.user.role === "teacher" ? teacherTabs : userTabs}
        active={tab} setActive={setTab} onLogout={logout} connected={connected} onToggleLang={toggleLang}
        notifications={notifications} notificationCount={unreadNotifications}
        notificationOpen={notificationCenterOpen}
        onToggleNotifications={() => setNotificationCenterOpen(v => !v)}
        onMarkAllRead={markAllNotificationsRead}
        onClearNotifications={clearNotifications}
      />
      <div className="fixed top-[76px] right-4 z-50 flex flex-col gap-2 w-[min(90vw,320px)] pointer-events-none">
        {toastNotifications.map(item => (
          <div key={item.id} className="pointer-events-auto rounded-xl border p-3 shadow-lg" style={{
            background: item.kind === "announcement" ? "rgba(22,163,74,0.10)" : "rgba(245,179,0,0.12)",
            borderColor: item.kind === "announcement" ? "rgba(22,163,74,0.35)" : "rgba(245,179,0,0.35)",
            color: "var(--ink)"
          }}>
            <div className="text-[10px] uppercase tracking-wide font-700" style={{ color: item.kind === "announcement" ? "var(--teal-deep)" : "var(--gold)" }}>{item.title}</div>
            <div className="text-sm mt-1 leading-relaxed">{item.message}</div>
          </div>
        ))}
      </div>
      <div className="max-w-6xl mx-auto px-5 pt-4 flex items-center justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-2.5">
          <img src={restaurant.logo} alt="" style={{ width: 36, height: 36 }} />
          <div className="leading-tight">
            <div className="text-sm font-700">{restaurant.name}</div>
            {restaurant.subtitle && <div className="text-[11px] opacity-60">({restaurant.subtitle})</div>}
          </div>
        </div>
        <button className="btn-gold px-3 py-1.5 rounded-lg text-xs" onClick={switchRestaurant}>
          {session.user.role !== "admin" && lang === "bn" ? "রেস্টুরেন্ট বদলান" : "Switch restaurant"}
        </button>
      </div>
      <div className="max-w-6xl mx-auto p-5 pb-24 sm:pb-5 fade-in" key={tab}>
        <ErrorBoundary scope="tab">
        {error && (
          <div className="error-banner rounded-xl px-4 py-3 mb-5 text-sm flex justify-between items-center">
            <span>{error}</span>
            <button onClick={() => setError(null)} className="font-700">✕</button>
          </div>
        )}
        {success && (
          <div className="success-banner rounded-xl px-4 py-3 mb-5 text-sm flex justify-between items-center">
            <span>{success}</span>
            <button onClick={() => setSuccess(null)} className="font-700">✕</button>
          </div>
        )}
        {session.user.role !== "admin" && wallet.loaded && wallet.balance < LOW_BALANCE_THRESHOLD && !lowBalanceDismissed && tab !== "wallet" && (
          <div className="warn-banner rounded-xl px-4 py-3 mb-5 text-sm flex justify-between items-center gap-3">
            <span>{tx("lowbal", { b: taka(wallet.balance) })}</span>
            <span className="flex items-center gap-3 shrink-0">
              <button onClick={() => setTab("wallet")} className="btn-primary px-3 py-1.5 rounded-lg text-xs">{tx("topup")}</button>
              <button onClick={() => setLowBalanceDismissed(true)} className="font-700">✕</button>
            </span>
          </div>
        )}

        {session.user.role === "teacher" && tab === "riderTracking" && <TeacherRiderTracking apiBase={apiBase} token={session.token} />}
        {session.user.role !== "admin" && tab === "menu" && (
          <MenuOrder menu={restaurantMenu} cart={cart} setCart={setCart} placeOrder={placeOrder} walletBalance={wallet.balance} busy={busy}
            onToggleFavorite={toggleFavorite} apiBase={apiBase} sessionToken={session.token} loyaltyKey={loyaltyKey} budget={budget} recurringDue={recurringDue} onDueAdd={addDue} onDueSkip={skipDue} onTopUp={goTopUp} userName={session.user.name} pastOrders={orders} watching={watching} onToggleNotify={toggleNotify} />
        )}
        {session.user.role !== "admin" && tab === "campusHub" && <CampusHub apiBase={apiBase} token={session.token} orders={orders} role={session.user.role} />}
        {session.user.role !== "admin" && tab === "groupOrders" && <GroupOrderPanel menu={restaurantMenu} cart={cart} setCart={setCart} apiBase={apiBase} token={session.token} userId={session.user.id} />}
        {session.user.role !== "admin" && tab === "rewards" && <RewardsTab call={call} refreshKey={loyaltyKey} onGoMenu={() => setTab("menu")} />}
        {session.user.role !== "admin" && tab === "track" && (
          <TrackOrder orders={orders} onSubmitFeedback={submitFeedback} feedbackBusy={feedbackBusy} onCancel={cancelOrder} cancelBusy={busy} onReorder={reorder} onRefresh={refreshMyOrders} apiBase={apiBase} token={session.token} />
        )}
        {session.user.role !== "admin" && tab === "feedback" && (
          <FeedbackTab user={session.user} orders={orders} onSubmitOrder={submitFeedback} orderBusy={feedbackBusy}
            general={myGeneralFeedback} onSubmitGeneral={submitGeneralFeedback} generalBusy={generalBusy} />
        )}
        {session.user.role !== "admin" && tab === "calendar" && (
          <MealCalendar user={session.user} role={session.user.role} year={year} month={month} calendar={calendar} paidDays={calendarPaid} bill={bill} onToggle={toggleDay}
                        onPay={payMealPlan} onRepeat={repeatLastMonth} planBusy={planBusy}
                        onPrevMonth={goPrevMonth} onNextMonth={goNextMonth} onJumpToday={goToday} isCurrentMonth={isCurrentMonth} />
        )}
        {session.user.role !== "admin" && tab === "spending" && <SpendingTab call={call} user={session.user} budget={budget} onSaveBudget={saveBudget} />}
        {session.user.role !== "admin" && tab === "wallet" && (
          <WalletTab apiBase={apiBase} token={session.token} balance={wallet.balance} topUp={topUp} transactions={wallet.transactions} busy={busy} suggestedAmount={topupSuggest}
            onLookup={lookupRecipient} onSend={sendMoney} />
        )}
        {tab === "chat" && (
          <ChatWorkspace role={session.user.role} userId={session.user.id} apiBase={apiBase}
            sessionToken={session.token} refreshKey={chatRefreshKey} />
        )}

        {session.user.role === "admin" && tab === "commandCenter" && <CanteenCommandCenter apiBase={apiBase} token={session.token} orders={restaurantOrders} restaurantId={restaurant?.id} />}
        {session.user.role === "admin" && tab === "overview" && <AdminOverview overview={overview} orders={restaurantOrders} />}
        {session.user.role === "admin" && tab === "adminMenu" && (
          <AdminMenu menu={restaurantMenu} updateItem={updateMenuItem} addItem={addMenuItem} busy={busy} />
        )}
        {session.user.role === "admin" && tab === "hallFood" && <AdminHallFood call={call} />}
        {session.user.role === "admin" && tab === "adminOrders" && <AdminOrders orders={restaurantOrders} advance={advanceOrder} call={call} />}
        {session.user.role === "admin" && tab === "coupons" && <AdminCoupons coupons={coupons} onSave={updateCoupon} />}
        {session.user.role === "admin" && tab === "offers" && (
          <AdminOffers call={call} menu={restaurantMenu} notify={(m, isErr) => { if (isErr) showError(m); else showSuccess(m); setLoyaltyKey(k => k + 1); }} />
        )}
        {session.user.role === "admin" && tab === "verify" && (
          <AdminVerify call={call} onCollected={(o) => setOrders(prev => prev.map(x => x.id === o.id ? { ...x, picked_up_at: o.picked_up_at } : x))} />
        )}
        {session.user.role === "admin" && tab === "reports" && <AdminReports trend={trend} forecast={forecast} call={call} apiBase={apiBase} token={session.token} />}
        {session.user.role === "admin" && tab === "feedback" && (
          <>
            <ProblemReports apiBase={apiBase} token={session.token} refreshKey={issueTick} />
            <AdminFeedback summary={feedbackSummary} />
          </>
        )}

        {tab === "profile" && (
          <ProfileTab user={session.user} call={call} liveBalance={session.user.role !== "admin" && wallet.loaded ? wallet.balance : null}
            onUpdated={(u) => setSession(s => ({ ...s, user: { ...s.user, name: u.name, walletBalance: u.walletBalance, avatar: u.avatar || null, email: u.email || null, accountType: u.accountType, hallName: u.hallName || null, roomNumber: u.roomNumber || null, hallId: u.hallId || null } }))} />
        )}
        </ErrorBoundary>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary scope="app">
    <App />
  </ErrorBoundary>
);
</script>
</body>
</html>
