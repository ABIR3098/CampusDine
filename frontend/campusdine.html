<script>
  // Saved theme (light / dark / auto + accent colour) is applied before the page paints, so there is no flash.
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem("cd_theme") || "{}");
      var dark = t.mode === "dark" || (t.mode === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      document.documentElement.setAttribute("data-accent", t.accent || "orange");
    } catch (e) {}
  })();

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    transition: background-color .25s ease, color .25s ease;
    background:var(--bg);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', 'Hind Siliguri', ui-sans-serif, system-ui, sans-serif;
  }
  .font-display{font-family:'Plus Jakarta Sans', 'Hind Siliguri', ui-sans-serif, system-ui, sans-serif;}
  .font-mono{font-family:'JetBrains Mono', ui-monospace, monospace;}
  .gold-text{ color: var(--gold-deep); }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px;}

  .ticket{
    position:relative;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-hover) 100%);
    color:#FFFFFF;
    border-radius: 12px;
    overflow:visible;
    box-shadow: 0 6px 16px -8px var(--accent-shadow);
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:18px; height:18px;
    background: var(--bg);
    border-radius:50%;

  .ticket::before{ left:-9px; }
  .ticket::after{ right:-9px; }

    .receipt-divider{ border-top:1px dashed #9CA3AF; margin:12px 0; }
    .no-print{ display:none !important; }
    body.printing-sheet > #root{ display:none !important; }
    body.printing-sheet #print-sheet, body.printing-sheet #print-sheet *{ visibility:visible; }
    body.printing-sheet #print-sheet{ display:block !important; }
    #print-sheet{ font-family:'Plus Jakarta Sans','Hind Siliguri',ui-sans-serif,sans-serif; color:#111827; background:#FFFFFF; font-size:12px; line-height:1.45; }
    #print-sheet *{ color:#111827; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #print-sheet h1{ font-size:20px; margin:0 0 2px; }
    #print-sheet h2{ font-size:13px; margin:16px 0 6px; padding-bottom:3px; border-bottom:1px solid #9CA3AF; break-after:avoid; }
    #print-sheet .ps-meta{ color:#4B5563; font-size:11px; margin-bottom:14px; }
    #print-sheet .ps-empty{ color:#6B7280; font-size:11.5px; margin:4px 0; }
    #print-sheet .ps-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
    #print-sheet .ps-tile{ border:1px solid #D1D5DB; border-radius:6px; padding:6px 9px; break-inside:avoid; }
    #print-sheet .ps-k{ font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:#6B7280; }
    #print-sheet .ps-v{ font-size:15px; font-weight:700; font-family:ui-monospace,Menlo,Consolas,monospace; }
    #print-sheet table{ width:100%; border-collapse:collapse; font-size:11.5px; }
    #print-sheet th, #print-sheet td{ padding:4px 6px; border-bottom:1px solid #E5E7EB; text-align:left; vertical-align:top; }
    #print-sheet th{ background:#F3F4F6; font-weight:700; }
    #print-sheet .num{ text-align:right; white-space:nowrap; font-family:ui-monospace,Menlo,Consolas,monospace; }
    #print-sheet thead{ display:table-header-group; }
    #print-sheet tr{ break-inside:avoid; page-break-inside:avoid; }
    #print-sheet .ps-bar{ height:8px; min-width:2px; background:#374151; border-radius:2px; }
  }

  .chip{
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .chip:hover{ border-color: var(--gold); color: var(--gold-deep); }
  .chip.active-chip{
    background: var(--gold);
    color: #FFFFFF;
    border-color: var(--gold);
  }

  .logo-badge{
    background: var(--gold);
    border-radius: 10px;
  }

  .role-option{ background:var(--panel); transition:border-color .15s ease, background-color .15s ease; }
  .role-option:hover{ border-color:var(--gold) !important; background:var(--panel-soft); }

  .divider-flourish{ display:flex; align-items:center; justify-content:center; gap:14px; color: var(--gold); }
  .divider-flourish::before, .divider-flourish::after{
    content:""; flex:1; max-width:80px; border-bottom:1px solid var(--line);
  }

  input, select, textarea{ background: var(--input-bg); color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  button:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

async function api(apiBase, path, { method = "GET", body, token } = {}) {
  const res = await fetch(`${apiBase}${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

/* ---------------- Theme (light / dark / auto + accent colour) ---------------- */
const THEME_ACCENTS = [
  { key: "green", color: "#16A34A" }, { key: "blue", color: "#2563EB" }, { key: "orange", color: "#EA580C" },
  { key: "purple", color: "#7C3AED" }, { key: "rose", color: "#E11D48" },
];
function readTheme() {
  try {
    const t = JSON.parse(localStorage.getItem("cd_theme") || "{}");
    return {
      mode: ["light", "dark", "auto"].includes(t.mode) ? t.mode : "light",
      accent: THEME_ACCENTS.some(a => a.key === t.accent) ? t.accent : "orange",
    };
  } catch (e) { return { mode: "light", accent: "orange" }; }
}
function applyTheme(t) {
  const dark = t.mode === "dark" || (t.mode === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  document.documentElement.setAttribute("data-accent", t.accent);
}
function ThemeMenu() {
  const [theme, setTheme] = useState(readTheme);
  const [open, setOpen] = useState(false);
  const boxRef = useRef(null);

  // apply + remember the choice; in "auto" mode also follow the device when it switches light/dark
  useEffect(() => {
    applyTheme(theme);
    try { localStorage.setItem("cd_theme", JSON.stringify(theme)); } catch (e) {}
    if (theme.mode !== "auto" || !window.matchMedia) return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = () => applyTheme(theme);
    mq.addEventListener("change", onChange);
    return () => mq.removeEventListener("change", onChange);
  }, [theme]);

  // close the panel when clicking elsewhere
  useEffect(() => {
    if (!open) return;
    const close = (e) => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", close);
    return () => document.removeEventListener("mousedown", close);
  }, [open]);

  const modes = [["light", "theme.light"], ["dark", "theme.dark"], ["auto", "theme.auto"]];
  return (
    <div className="relative" ref={boxRef}>
      <button onClick={() => setOpen(o => !o)} title={tx("theme.title")} aria-expanded={open}
        className="w-9 h-9 rounded-lg grid place-items-center transition-colors hover:bg-black/5">
        <Icon path={I.droplet} className="w-5 h-5" style={{ color: "var(--gold)" }} />
      </button>
      {open && (
        <div className="absolute right-0 top-full mt-2 w-60 rounded-2xl border shadow-2xl p-3 z-50 fade-in"
          style={{ background: "var(--panel)", borderColor: "var(--line)" }}>
          <div className="text-[11px] uppercase tracking-wide mb-2" style={{ color: "var(--ink-soft)" }}>{tx("theme.mode")}</div>
          <div className="flex rounded-lg border overflow-hidden text-xs mb-3" style={{ borderColor: "var(--line)" }}>
            {modes.map(([key, label]) => (
              <button key={key} onClick={() => setTheme(t => ({ ...t, mode: key }))} className="flex-1 px-2 py-2 transition-colors"
                style={{ background: theme.mode === key ? "var(--gold)" : "transparent", color: theme.mode === key ? "#fff" : "var(--ink-soft)" }}>
                {tx(label)}
              </button>
            ))}
          </div>
          <div className="text-[11px] uppercase tracking-wide mb-2" style={{ color: "var(--ink-soft)" }}>{tx("theme.accent")}</div>
          <div className="flex items-center gap-2">
            {THEME_ACCENTS.map(a => (
              <button key={a.key} onClick={() => setTheme(t => ({ ...t, accent: a.key }))}
                title={tx("theme." + a.key)} aria-label={tx("theme." + a.key)}
                className="w-8 h-8 rounded-full grid place-items-center border-2 transition-transform hover:scale-110"
                style={{ background: a.color, borderColor: theme.accent === a.key ? "var(--ink)" : "transparent" }}>
                {theme.accent === a.key && <Icon path={I.check} className="w-4 h-4" style={{ color: "#fff" }} />}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- Added: validation helpers + QR code ---------------- */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const ID_RE = /^[A-Za-z0-9._-]{3,50}$/;

// Draws a QR code as inline SVG (black on white, so scanners work in dark theme too).
// Uses the small "qrcode-generator" library loaded in <head>; if it failed to load we show the plain token instead.
function QrCode({ value, size = 120, dim = false }) {
  const qr = useMemo(() => {
    try {
      if (typeof window.qrcode !== "function" || !value) return null;
      const q = window.qrcode(0, "M");
      q.addData(String(value));
      q.make();
      const n = q.getModuleCount();
      let d = "";
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c},${r}h1v1h-1z`;
      return { n, d };
    } catch (e) { return null; }
  }, [value]);
  if (!qr) return null;
  const pad = 4;
  return (
    <svg role="img" aria-label="QR code" width={size} height={size} viewBox={`${-pad} ${-pad} ${qr.n + pad * 2} ${qr.n + pad * 2}`}
      shapeRendering="crispEdges" style={{ background: "#fff", borderRadius: 8, flexShrink: 0, opacity: dim ? 0.3 : 1 }}>
      <rect x={-pad} y={-pad} width={qr.n + pad * 2} height={qr.n + pad * 2} fill="#fff" />
      <path d={qr.d} fill="#000" />
    </svg>
  );
}

  }, [cooldown]);

  // Changing the email (or switching tab / role) throws away a half-finished OTP step
  useEffect(() => { setOtpSent(false); setResetSent(false); setOtp(""); setOtpDev(false); }, [email, mode, role]);

    setBusy(true);
    try {
      await api(apiBase, "/api/auth/reset-password", { method: "POST", body: { externalId: externalId.trim(), email: email.trim(), newPassword, otp: otpRequired ? otp.trim() : undefined } });
      setOtp(""); setResetSent(false);
      setMode("login");
      setPassword("");
      setNewPassword("");
      setResetMsg(tx("reset.ok"));
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const otpBox = (onResend, shownEmail, hintText) => (
    <div className="rounded-xl border p-3 space-y-2" style={{ borderColor: "var(--line)", background: "var(--bg)" }}>
      <p className="text-xs" style={{ color: "var(--ink-soft)" }}>{tx("otp.sent", { e: shownEmail || email.trim() })}</p>
      <label className="text-xs uppercase tracking-wide block" style={{ color: "var(--ink-soft)" }}>{tx("otp.label")}</label>
      <input value={otp} inputMode="numeric" autoComplete="one-time-code" maxLength={6} placeholder={tx("otp.ph")}
        onChange={e => setOtp(e.target.value.replace(/\D/g, "").slice(0, 6))}
        className="w-full px-4 py-2.5 rounded-xl border text-center text-xl font-700" style={{ borderColor: "var(--line)", letterSpacing: "0.5em" }} />
      <div className="flex items-center justify-between gap-2 text-xs">
        <span style={{ color: "var(--ink-soft)" }}>{hintText || tx("otp.change")}</span>
        <button type="button" disabled={busy || cooldown > 0} onClick={onResend}
          className="font-600 shrink-0" style={{ color: cooldown > 0 ? "var(--ink-soft)" : "var(--gold)" }}>
          {cooldown > 0 ? tx("otp.resendin", { s: cooldown }) : tx("otp.resend")}
        </button>
      </div>
      {otpDev && <p className="text-[11px]" style={{ color: "var(--ink-soft)" }}>{tx("otp.devhint")}</p>}
    </div>
  );

  const pillTab = (key, label) => (
    <button onClick={() => { setMode(key); setError(null); }}
      className="flex-1 py-2.5 rounded-full text-xs font-700 transition-all"
      style={mode === key
        ? { background: "var(--gold)", color: "#FFFFFF" }
        : { color: "var(--ink-soft)" }}>
      {label}
    </button>
  );

  return (
    <div className="min-h-screen">
      {/* New CampusDine front: announcement bar, header and hero (styles live in landing.css, all scoped under .cdl) */}
      <div className="cdl" data-lang={CURRENT_LANG}>
        <svg width="0" height="0" style={{ position: "absolute" }} aria-hidden="true">
          <defs>
          <symbol id="cdl-i-mega" viewBox="0 0 24 24"><path d="M3 10v4a1 1 0 0 0 1 1h2l5 4V5L6 9H4a1 1 0 0 0-1 1Zm13-2.5a5 5 0 0 1 0 9M19 4a9 9 0 0 1 0 16" fill="currentColor" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></symbol>
          <symbol id="cdl-i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 1.500-2.100-.5-1.200.2-2.400 1.600-2.400H17a4 4 0 0 0 4-4c0-5-4-9.500-9-9.500Z" fill="none" stroke="currentColor" strokeWidth="1.800" strokeLinejoin="round"/><circle cx="7.500" cy="11" r="1.300" fill="currentColor"/><circle cx="10.500" cy="7" r="1.300" fill="currentColor"/><circle cx="15" cy="7.500" r="1.300" fill="currentColor"/></symbol>
          <symbol id="cdl-i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"/></symbol>
          <symbol id="cdl-i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></symbol>
          <symbol id="cdl-i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></g></symbol>
          <symbol id="cdl-i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></symbol>
          <symbol id="cdl-i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2" fill="currentColor"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7Z" fill="currentColor"/></symbol>
          <symbol id="cdl-i-fork" viewBox="0 0 24 24"><path d="M7 3v7a2 2 0 0 0 2 2v9M5 3v5M9 3v5M5 8a2 2 0 0 0 2 2M9 8a2 2 0 0 1-2 2M16 21V3c-2.2 1.2-3.5 4-3.5 7.5 0 2 1 3.2 3.5 3.5" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></symbol>
          <symbol id="cdl-i-list" viewBox="0 0 24 24"><path d="M3 6h2.5M3 12h2.5M3 18h2.5M9 6h12M9 12h12M9 18h12" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round"/></symbol>
          <symbol id="cdl-i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></symbol>
          <symbol id="cdl-i-bolt" viewBox="0 0 24 24"><path d="M13.5 2 5 13.5h6L10 22l9-12h-6.2Z" fill="currentColor"/></symbol>
          <symbol id="cdl-i-shield" viewBox="0 0 24 24"><path d="M12 2.5 4.5 5.5v5.5c0 5 3.2 8.7 7.5 10 4.3-1.3 7.5-5 7.5-10V5.5Z" fill="currentColor"/><path d="M12 8v6M9 11h6" stroke="var(--cdl-icon-bg)" strokeWidth="2.2" strokeLinecap="round"/></symbol>
          <symbol id="cdl-i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" strokeWidth="2.2"/><circle cx="12" cy="12" r="5" fill="currentColor"/><path d="M12 9.5V12l2 1.5" stroke="var(--cdl-icon-bg)" strokeWidth="1.6" strokeLinecap="round" fill="none"/></symbol>
          <symbol id="cdl-i-bank" viewBox="0 0 24 24"><path d="M12 2 3 7v2h18V7Zm-7 9v7H3v2h18v-2h-2v-7h-2v7h-3v-7h-2v7h-2v-7H9v7H7v-7Z" fill="currentColor"/></symbol>
          </defs>
        </svg>

        <div className="cdl-announce">
          <svg className="cdl-ic"><use href="#cdl-i-mega" /></svg>
          <span>{tx("ann")}</span>
          <svg className="cdl-ic cdl-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11Z" fill="currentColor" /></svg>
        </div>

        <header className="cdl-nav">
          <a href="#" className="cdl-brand" onClick={e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" }); }}>
            <img src="images/landing/logo.png" alt={tx("land.logoAlt")} className="cdl-brand-logo" />
            <span className="cdl-brand-text">
              <span className="cdl-brand-name">Campus<b>Dine</b></span>
              <span className="cdl-brand-tag"><i></i><span>{tx("land.tag")}</span><i></i></span>
            </span>
          </a>

          <nav className={"cdl-links" + (navOpen ? " cdl-open" : "")} onClick={() => setNavOpen(false)}>
            <a href="#" className="cdl-active" onClick={e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" }); }}>{tx("nav.home")}</a>
            <a href="#menu">{tx("nav.menu")}</a>
            <a href="#about">{tx("nav.about")}</a>
            <a href="#contact">{tx("nav.contact")}</a>
          </nav>

          <div className="cdl-actions">
            <div className="cdl-theme-slot"><ThemeMenu key={themeKey} /></div>
            <button type="button" className="cdl-icon-btn" onClick={toggleDark} aria-label={tx("land.dark")} title={tx("land.dark")}>
              <svg className="cdl-ic"><use href={isDark ? "#cdl-i-sun" : "#cdl-i-moon"} /></svg>
            </button>
            <div className="cdl-lang">
              <button type="button" className="cdl-lang-btn" aria-haspopup="true" aria-expanded={langOpen} aria-label={tx("land.langBtn")}
                onClick={e => { e.stopPropagation(); setLangOpen(o => !o); }}>
                <svg className="cdl-ic"><use href="#cdl-i-globe" /></svg><span>{CURRENT_LANG.toUpperCase()}</span><svg className="cdl-ic cdl-sm"><use href="#cdl-i-chev" /></svg>
              </button>
              <ul className={"cdl-lang-menu" + (langOpen ? " cdl-open" : "")}>
                <li><button type="button" onClick={() => { setLangOpen(false); if (CURRENT_LANG !== "en") onToggleLang(); }}>English</button></li>
                <li><button type="button" onClick={() => { setLangOpen(false); if (CURRENT_LANG !== "bn") onToggleLang(); }}>বাংলা</button></li>
              </ul>
            </div>
            <button type="button" onClick={scrollToAuth} className="cdl-btn cdl-signin"><svg className="cdl-ic"><use href="#cdl-i-user" /></svg><span>{tx("signin")}</span></button>
            <button type="button" className="cdl-burger" aria-label={tx("land.menuBtn")} aria-expanded={navOpen} onClick={() => setNavOpen(o => !o)}><span></span><span></span><span></span></button>
          </div>
        </header>

        <main className="cdl-hero">
          <div className="cdl-hero-copy">
            <div className="cdl-pill">
              <span className="cdl-pill-ic"><svg className="cdl-ic"><use href="#cdl-i-fork" /></svg></span>
              <span>{tx("land.pill")}</span>
            </div>
            <h1>
              <span>{tx("hero.h1a")}</span>
              <span className="cdl-accent">{tx("hero.h1b")}</span>
            </h1>
            <p className="cdl-lead">{tx("land.lead")}</p>
            <div className="cdl-cta">
              <button type="button" onClick={scrollToAuth} className="cdl-btn cdl-primary"><svg className="cdl-ic"><use href="#cdl-i-fork" /></svg><span>{tx("hero.start")}</span><svg className="cdl-ic"><use href="#cdl-i-arrow" /></svg></button>
              <a href="#menu" className="cdl-btn cdl-outline"><svg className="cdl-ic"><use href="#cdl-i-list" /></svg><span>{tx("hero.explore")}</span></a>
            </div>
            <ul className="cdl-features">
              <li><span className="cdl-f-ic"><svg className="cdl-ic"><use href="#cdl-i-bolt" /></svg></span><div><strong>{tx("land.f1t")}</strong><small>{tx("land.f1s")}</small></div></li>
              <li><span className="cdl-f-ic"><svg className="cdl-ic"><use href="#cdl-i-shield" /></svg></span><div><strong>{tx("land.f2t")}</strong><small>{tx("land.f2s")}</small></div></li>
              <li><span className="cdl-f-ic"><svg className="cdl-ic"><use href="#cdl-i-clock" /></svg></span><div><strong>{tx("land.f3t")}</strong><small>{tx("land.f3s")}</small></div></li>
              <li><span className="cdl-f-ic"><svg className="cdl-ic"><use href="#cdl-i-bank" /></svg></span><div><strong>{tx("land.f4t")}</strong><small>{tx("land.f4s")}</small></div></li>
            </ul>
          </div>

          <div className="cdl-hero-art">
            <div className="cdl-art-wrap">
              <img className="cdl-light-img" src="images/landing/hero-food.jpg" alt={tx("land.alt")} />
              <img className="cdl-dark-img" src="images/landing/hero-food-dark.jpg" alt="" aria-hidden="true" />
              <div className="cdl-tint" aria-hidden="true"></div>
            </div>
            <svg className="cdl-wave" viewBox="0 0 600 160" preserveAspectRatio="none" aria-hidden="true">
              <path d="M0 160C110 60 250 40 380 52c90 8 150-6 220-40V160Z" fill="var(--cdl-bg)" />
              <path d="M0 160C110 60 250 40 380 52c90 8 150-6 220-40" fill="none" stroke="var(--cdl-accent)" strokeWidth="3" />
            </svg>
          </div>
        </main>
      </div>

      {/* Menu preview */}
      <section id="menu" className="max-w-6xl mx-auto px-6 py-20">
        <div className="text-center mb-12 space-y-3">
          <p className="font-display text-xs uppercase" style={{ color: "var(--gold)" }}>{tx("pop.k")}</p>
          <h2 className="font-display text-3xl font-800" style={{ color: "var(--ink)" }}>{tx("pop.h")}</h2>
          <div className="divider-flourish text-sm max-w-xs mx-auto">❖</div>
        </div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
          {sampleMenu.map(item => (
            <div key={item.name} className="card overflow-hidden">
              <div className="h-36 overflow-hidden" style={{ background: "var(--gold-soft)" }}>
                <img src={item.img} alt={item.name} className="w-full h-full object-cover" style={{ opacity: 1 }} />
              </div>
              <div className="p-4">
                <div className="font-display font-700 text-sm" style={{ color: "var(--ink)" }}>{item.name}</div>
                <div className="text-xs mb-2" style={{ color: "var(--ink-soft)" }}>{item.tag}</div>
                <div className="font-mono text-sm" style={{ color: "var(--gold)" }}>{item.price}</div>
              </div>
            </div>
          ))}
          <div className="card flex flex-col items-center justify-center text-center p-6 gap-3">
            <Icon path={I.menu} className="w-7 h-7" style={{ color: "var(--gold)" }} />
            <div className="font-display font-700 text-sm" style={{ color: "var(--ink)" }}>{tx("more")}</div>
            <p className="text-xs" style={{ color: "var(--ink-soft)" }}>{tx("more.d")}</p>
          </div>
        </div>
      </section>

      {/* About */}
      <section id="about" className="border-t py-20 px-6" style={{ borderColor: "var(--line)", background: "rgba(22,163,74,0.05)" }}>
        <div className="max-w-2xl mx-auto text-center space-y-5">
          <p className="font-display text-xs uppercase" style={{ color: "var(--gold)" }}>{tx("about.k")}</p>
          <h2 className="font-display text-3xl font-800" style={{ color: "var(--ink)" }}>{tx("about.h")}</h2>
          <div className="divider-flourish text-sm max-w-xs mx-auto">❖</div>
          <p className="leading-relaxed text-[15px]" style={{ color: "var(--ink-soft)" }}>
            {tx("about.p")}
          </p>
        </div>
      </section>

      {/* Auth */}
      <section ref={authRef} className="py-20 px-6">
        <div className="max-w-md mx-auto">
          <div className="text-center mb-8 space-y-2">
            <p className="font-display text-xs uppercase" style={{ color: "var(--gold)" }}>{tx("auth.k")}</p>
            <h2 className="font-display text-2xl font-800" style={{ color: "var(--ink)" }}>{tx("auth.h")}</h2>
          </div>

          <div className="card p-8 fade-in">
            {!role ? (
              <div className="space-y-3">
                {roleOptions.map((r) => (
                  <button key={r.key} onClick={() => { setRole(r.key); if (r.key === "admin") setMode("login"); }}
                    className="role-option w-full flex items-center gap-4 p-4 rounded-lg border text-left"
                    style={{ borderColor: "var(--line)" }}>
                    <div className="w-11 h-11 rounded-lg grid place-items-center shrink-0" style={{ background: "var(--gold-soft)" }}>
                      <Icon path={r.icon} className="w-5 h-5" style={{ color: "var(--teal-deep)" }} />
                    </div>
                    <div>
                      <div className="font-display font-700 text-sm" style={{ color: "var(--ink)" }}>{r.label}</div>
                      <div className="text-xs mt-0.5" style={{ color: "var(--ink-soft)" }}>{r.desc}</div>
                    </div>
                  </button>
                ))}
              </div>
            ) : mode === "forgot" ? (
              <>
                <button onClick={() => { setMode("login"); setError(null); }} className="text-sm mb-5 flex items-center gap-1" style={{ color: "var(--ink-soft)" }}>
                  <Icon path={I.arrow} className="w-4 h-4 rotate-180" /> {tx("back.login")}
                </button>
                <div className="font-display font-700 text-xl mb-1 text-center" style={{ color: "var(--gold)" }}>{tx("reset.h")}</div>
                <p className="text-xs mb-5 text-center" style={{ color: "var(--ink-soft)" }}>{tx("reset.p")}</p>
                <div className="space-y-3">
                  <div>
                    <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("id")}</label>
                    <input value={externalId} onChange={e => setExternalId(e.target.value)} placeholder="e.g. 24524203098"
                      className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                  </div>
                  <div>
                    <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("email")}</label>
                    <input value={email} onChange={e => setEmail(e.target.value)} type="email" placeholder={tx("email.ph")}
                      className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                  </div>
                  {otpRequired && resetSent && otpBox(sendResetCode)}
                  {(!otpRequired || resetSent) && (
                    <div>
                      <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("newpw")}</label>
                      <input value={newPassword} onChange={e => setNewPassword(e.target.value)} type="password" placeholder={tx("atleast6")}
                        className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                    </div>
                  )}
                  <p className="text-[11px]" style={{ color: "var(--ink-soft)" }}>{tx("reset.noemail")}</p>
                  {otpRequired && resetSent && <p className="text-[11px]" style={{ color: "var(--ink-soft)" }}>{tx("otp.devhint")}</p>}
                  {error && <p className="text-sm" style={{ color: "#DC2626" }}>{error}</p>}
                  {resetMsg && <p className="text-sm" style={{ color: "var(--leaf)" }}>{resetMsg}</p>}
                  <button disabled={busy} onClick={otpRequired && !resetSent ? sendResetCode : submitReset} className="btn-primary w-full py-2.5 rounded-xl">
                    {busy ? tx("wait") : (otpRequired && !resetSent ? tx("reset.send") : tx("reset.h"))}
                  </button>
                </div>
              </>
            ) : (
              <>
                <button onClick={() => { setRole(null); setError(null); }} className="text-sm mb-5 flex items-center gap-1" style={{ color: "var(--ink-soft)" }}>
                  <Icon path={I.arrow} className="w-4 h-4 rotate-180" /> {tx("back")}
                </button>
                <div className="font-display font-700 text-lg mb-5 text-center" style={{ color: "var(--gold)" }}>
                  {tx("access", { role: roleOptions.find(r => r.key === role).label })}
                </div>

                <div className="flex p-1 rounded-full mb-6" style={{ background: "var(--bg)", border: "1px solid var(--line)" }}>
                  {pillTab("login", tx("login"))}
                  {role !== "admin" && pillTab("register", tx("create"))}
                </div>

                <form className="space-y-3" noValidate onSubmit={e => { e.preventDefault(); submit(); }}>
                  {mode === "register" && (
                    <>
                      <div>
                        <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("fullname")}</label>
                        <input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Abir Hasan" autoComplete="name"
                          className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                      </div>
                      <div>
                        <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("email")}</label>
                        <input value={email} type="email" autoComplete="email" placeholder={tx("email.ph")}
                          onChange={e => { setEmail(e.target.value); setTaken(t => ({ ...t, email: false })); }}
                          onBlur={() => checkTaken("email")}
                          className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: taken.email ? "#DC2626" : "var(--line)" }} />
                        {taken.email && <p className="text-xs mt-1" style={{ color: "#DC2626" }}>{tx("taken.email")}</p>}
                      </div>
                    </>
                  )}
                  <div>
                    <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{mode === "login" ? tx("idoremail") : tx("id")}</label>
                    <input value={externalId} autoComplete="username" placeholder={mode === "login" ? "ID / email" : "e.g. 24524203098"}
                      onChange={e => { setExternalId(e.target.value); setTaken(t => ({ ...t, externalId: false })); }}
                      onBlur={() => mode === "register" && checkTaken("externalId")}
                      className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: taken.externalId ? "#DC2626" : "var(--line)" }} />
                    {mode === "register" && taken.externalId && <p className="text-xs mt-1" style={{ color: "#DC2626" }}>{tx("taken.id")}</p>}
                  </div>

                  {mode === "register" && (
                    <div>
                      <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("acct.type")}</label>
                      <div className="grid grid-cols-2 gap-2">
                        {[["regular", tx("acct.regular"), tx("acct.regular.d")], ["hall", tx("acct.hall"), tx("acct.hall.d")]].map(([key, label, desc]) => (
                          <button type="button" key={key} onClick={() => setAccountType(key)}
                            className="text-left px-3 py-2.5 rounded-xl border transition-all"
                            style={accountType === key
                              ? { borderColor: "var(--gold)", background: "var(--gold-soft)", color: "var(--teal-deep)" }
                              : { borderColor: "var(--line)", color: "var(--ink-soft)" }}>
                            <div className="text-sm font-700">{label}</div>
                            <div className="text-[11px] mt-0.5 opacity-80">{desc}</div>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {mode === "register" && accountType === "hall" && (
                    <div className="rounded-xl border p-3 space-y-3" style={{ borderColor: "var(--line)", background: "var(--bg)" }}>
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("hallname")}</label>
                          <input value={hallName} onChange={e => setHallName(e.target.value)} placeholder={tx("hallname.ph")}
                            className="w-full px-3 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                        </div>
                        <div>
                          <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("room")}</label>
                          <input value={roomNumber} onChange={e => setRoomNumber(e.target.value)} placeholder={tx("room.signup.ph")}
                            className="w-full px-3 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                        </div>
                      </div>
                      <p className="text-[11px]" style={{ color: "var(--ink-soft)" }}>{tx("hall.signup.note")}</p>
                    </div>

function MenuOrder({ menu, cart, setCart, placeOrder, walletBalance, busy, onToggleFavorite, apiBase, sessionToken }) {
  const [cat, setCat] = useState("heavy");
  const [search, setSearch] = useState("");
  const [sortBy, setSortBy] = useState("default");
  const [favoritesOnly, setFavoritesOnly] = useState(false);
  const [diet, setDiet] = useState("all"); // "all" | "veg" | "nonveg"
  // A restaurant may have no items in the selected category (e.g. no "heavy" meals):
  // jump to the first category that does have items so the menu never opens empty.
  useEffect(() => {
    if (menu.length > 0 && !menu.some(i => i.category === cat)) {
      const first = ["heavy", "snacks", "drinks"].find(c => menu.some(i => i.category === c));
      if (first) setCat(first);
    }
  }, [menu]);
  const filtered = menu
    .filter(i => i.category === cat)
    .filter(i => !favoritesOnly || i.is_favorite)
    .filter(i => diet === "all" || (diet === "veg" ? !!i.is_veg : !i.is_veg))
    .filter(i => {
      const q = search.trim().toLowerCase();
      if (!q) return true;
      return i.name.toLowerCase().includes(q) || (i.bn && i.bn.includes(search.trim()));
    })
    .sort((a, b) => {
      if (sortBy === "priceAsc") return a.price - b.price;
      if (sortBy === "priceDesc") return b.price - a.price;
      if (sortBy === "name") return a.name.localeCompare(b.name);
      return 0; // "default" — keep the server's category/name ordering
    });
  const starredItems = menu.filter(item => item.is_favorite);
  const [payMethod, setPayMethod] = useState("wallet");
  const [scheduleLater, setScheduleLater] = useState(false);
  const [pickupTime, setPickupTime] = useState("");
  const [couponCode, setCouponCode] = useState("");
  const [couponApplied, setCouponApplied] = useState(null);
  const [couponError, setCouponError] = useState("");
  const [couponBusy, setCouponBusy] = useState(false);
  const [orderNote, setOrderNote] = useState("");
  useEffect(() => {
    setCouponApplied(null);
    setCouponError("");
    if (cart.length === 0) { setCouponCode(""); setOrderNote(""); }
  }, [cart]);

  // Feature: pre-order — a student can pick a slot up to 4h ahead (min 10min from now).
  // These bounds are hints for the native time input; the server enforces the real rule.
  const fmtHHMM = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const pickupNow = new Date();
  pickupNow.setSeconds(0, 0); // whole-minute precision — must match the server's rounding exactly
  const pickupMin = new Date(pickupNow.getTime() + 10 * 60000);
  const pickupMax = new Date(pickupNow.getTime() + 4 * 3600000);
  const pickupCrossesMidnight = pickupMin.getDate() !== pickupMax.getDate();

  const add = (item) => setCart(prev => {
    const existing = prev.find(p => p.id === item.id);
    if (existing) return prev.map(p => p.id === item.id ? { ...p, qty: p.qty + 1 } : p);
    return [...prev, { ...item, qty: 1 }];
  });
  const dec = (item) => setCart(prev => prev
    .map(p => p.id === item.id ? { ...p, qty: p.qty - 1 } : p)
    .filter(p => p.qty > 0));

  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const discountAmount = couponApplied ? Number(couponApplied.discountAmount || 0) : 0;
  const total = Math.max(0, subtotal - discountAmount);
  const canPay = payMethod === "cash" || walletBalance >= total;
  const canCheckout = canPay && (!scheduleLater || pickupTime);

  const applyCoupon = async () => {
    if (!couponCode.trim() || cart.length === 0) return;
    setCouponBusy(true);
    setCouponError("");
    try {
      const data = await api(apiBase, "/api/coupon/validate", {
        method: "POST",
        token: sessionToken,
        body: { couponCode: couponCode.trim(), orderAmount: subtotal, items: cart.map(i => ({ id: i.id, qty: i.qty })) }
      });
      setCouponApplied(data);
      setCouponCode(data.code || couponCode.trim().toUpperCase());
    } catch (e) {
      setCouponApplied(null);
      setCouponError(e.message || tx("coupon.invalid"));
    } finally {
      setCouponBusy(false);
    }
  };

  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2">
        <MenuCategoryTabs category={cat} setCategory={setCat} />
        <div className="flex flex-col sm:flex-row gap-2 mb-5">
          <MenuSearchSortControls search={search} setSearch={setSearch} sortBy={sortBy} setSortBy={setSortBy} />

/* ---------------- Print sheets (reports / feedback / bills) ----------------
   A print sheet is a plain black-on-white page rendered outside the app (a portal on <body>).
   While it prints, the whole app is hidden, so there are no blank pages, no dark-theme colours,
   no clipped charts. Tables repeat their header on every page. */
function PrintSheet({ title, meta, children }) {
  const host = useMemo(() => {
    let el = document.getElementById("print-sheet");
    if (!el) { el = document.createElement("div"); el.id = "print-sheet"; document.body.appendChild(el); }
    return el;
  }, []);
  useEffect(() => {
    document.body.classList.add("printing-sheet");
    const done = () => document.body.classList.remove("printing-sheet");
    window.addEventListener("afterprint", done);
    const t = setTimeout(() => window.print(), 120);
    return () => { clearTimeout(t); window.removeEventListener("afterprint", done); done(); };
  }, []);
  return ReactDOM.createPortal(
    <div>
      <h1>CampusDine — {title}</h1>
      <div className="ps-meta">{meta}</div>
      {children}
    </div>, host);
}
function PsTable({ head, rows, numCols = [], empty }) {
  if (!rows.length) return <p className="ps-empty">{empty || "—"}</p>;
  return (
    <table>
      <thead><tr>{head.map((h, i) => <th key={i} className={numCols.includes(i) ? "num" : ""} style={h === "" ? { width: "40%" } : undefined}>{h}</th>)}</tr></thead>
      <tbody>{rows.map((r, ri) => (
        <tr key={ri}>{r.map((c, i) => <td key={i} className={numCols.includes(i) ? "num" : ""}>{c}</td>)}</tr>
      ))}</tbody>
    </table>
  );
}
const psStars = (n) => "★".repeat(Math.max(0, Math.min(5, n))) + "☆".repeat(5 - Math.max(0, Math.min(5, n)));

function OrderFeedback({ order, onSubmit, busy }) {
  const fb = order.feedback;
  const [editing, setEditing] = useState(false);
  const [rating, setRating] = useState(fb ? fb.rating : 0);
  const [comment, setComment] = useState(fb && fb.comment ? fb.comment : "");

  // keep the form in sync when the server copy changes (e.g. after saving)
  useEffect(() => {
    if (fb) { setRating(fb.rating); setComment(fb.comment || ""); }
  }, [fb && fb.rating, fb && fb.comment]);

  const send = async () => {
    const ok = await onSubmit(order.id, rating, comment);
    if (ok !== false) setEditing(false);
  };

  if (fb && !editing) {
    return (
      <div className="mt-4 pt-4 border-t" style={{ borderColor: "var(--line)" }}>
        <div className="flex items-center justify-between gap-2">
          <div className="flex items-center gap-2">
            <StarPicker value={fb.rating} readOnly size="w-4 h-4" />
            <span className="text-xs" style={{ color: "var(--ink-soft)" }}>✓ {tx("rated")}</span>
          </div>
          <button onClick={() => setEditing(true)} className="text-xs font-600" style={{ color: "var(--gold-deep)" }}>{tx("fb.edit")}</button>
        </div>
        {fb.comment && <p className="text-xs italic mt-1.5" style={{ color: "var(--ink-soft)" }}>"{fb.comment}"</p>}
      </div>
    );
  }

  return (
    <div className="mt-4 pt-4 border-t" style={{ borderColor: "var(--line)" }}>
      <div className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--ink-soft)" }}>{tx("rate")}</div>
      <div className="flex items-center gap-3">
        <StarPicker value={rating} onChange={setRating} />
        {rating > 0 && <span className="text-sm font-600" style={{ color: "var(--gold-deep)" }}>{tx(RATING_KEYS[rating])}</span>}
      </div>
      <textarea value={comment} onChange={e => setComment(e.target.value)} placeholder={tx("comment.ph")} maxLength={500}
        rows="2" className="w-full mt-2 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
      <div className="flex items-center gap-2 mt-2">
        <button disabled={busy || rating === 0} onClick={send} className="btn-primary px-4 py-1.5 rounded-lg text-xs">
          {busy ? tx("submitting") : (fb ? tx("fb.update") : tx("submit"))}
        </button>
        {fb && (
          <button onClick={() => { setEditing(false); setRating(fb.rating); setComment(fb.comment || ""); }}
            className="px-3 py-1.5 rounded-lg text-xs border font-600" style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>
            {tx("fb.cancel")}
          </button>
        )}
        {rating === 0 && !fb && <span className="text-xs" style={{ color: "var(--ink-soft)" }}>{tx("fb.pickrating")}</span>}
      </div>
    </div>
  );
}

  if (orders.length === 0) {
    return <div className="card p-10 text-center" style={{ color: "var(--ink-soft)" }}>{tx("noorders")}</div>;

            <div className="receipt-row"><span>{tx("rc.status")}</span><span style={{ fontWeight: 600 }}>{lookup("status", printOrder.status)}</span></div>
            <div className="receipt-row"><span>{tx("rc.payment")}</span><span>{printOrder.payment_method === "wallet" ? tx("pay.wallet") : tx("pay.cash")}</span></div>
            {printOrder.note && (
              <div className="receipt-row"><span>{tx("note.show")}</span><span>{printOrder.note}</span></div>
            )}
            {printOrder.pickup_time && (
              <div className="receipt-row"><span>{tx("sched")}</span><span>{new Date(printOrder.pickup_time).toLocaleString()}</span></div>
            )}
            <div className="receipt-row"><span>{tx("rc.printed")}</span><span>{new Date().toLocaleString()}</span></div>
            <div className="receipt-divider" />
            {printOrder.items.map((i, idx) => (
              <div key={idx} className="receipt-row"><span>{dispName(i.name)} ×{num(i.qty)}</span><span>{taka(i.price * i.qty)}</span></div>
            ))}
            <div className="receipt-divider" />
            <div className="receipt-row" style={{ fontSize: 15, fontWeight: 800 }}><span>{tx("total")}</span><span>{taka(printOrder.total)}</span></div>
            <div className="text-center" style={{ marginTop: 16, fontSize: 11, color: "#6B7280" }}>
              {tx("rc.thanks")}
            </div>
          </div>
        </div>
      )}
      {orders.map(o => {
        const stepIndex = STATUSES.indexOf(o.status);
        const isCancelled = o.status === "Cancelled";
        return (
          <div key={o.token} className="card overflow-hidden">
            <div className="ticket p-5 flex items-center justify-between">
              <div className="perf pl-4">
                <div className="text-xs opacity-70">{tx("ticket.token")}</div>
                <div className="font-mono text-2xl font-700 tracking-wide">{o.token}</div>
              </div>
              <div className="text-right">
                <div className="text-xs opacity-70">{tx("total")}</div>
                <div className="font-mono text-lg">{taka(o.total)}</div>
              </div>
            </div>
            <div className="p-5">
              {o.pickup_time && (
                <div className="text-xs mb-3 font-600" style={{ color: "var(--teal)" }}>
                  {tx("sched")}: {new Date(o.pickup_time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
                </div>
              )}
              {o.queue && (
                <div className="flex items-center gap-3 mb-4 px-3 py-2.5 rounded-lg text-sm"
                  style={{ background: "var(--gold-soft)", color: "var(--teal-deep)" }}>
                  <Icon path={I.clock} className="w-4 h-4 shrink-0" />
                  <div className="flex flex-wrap items-baseline gap-x-2">
                    <span className="font-700">
                      {o.queue.ahead === 0
                        ? (o.status === "Cooking" ? tx("q.now") : tx("q.next"))
                        : tx(o.queue.ahead === 1 ? "q.ahead1" : "q.aheadN", { p: num(o.queue.position), a: num(o.queue.ahead) })}
                    </span>
                    <span style={{ color: "var(--ink-soft)" }}>{tx("q.est", { m: num(o.queue.est_minutes) })}</span>
                  </div>
                </div>
              )}
              {isCancelled ? (
                <div className="flex items-center gap-2 text-sm font-600" style={{ color: "var(--brick)" }}>
                  <Icon path={I.x} className="w-4 h-4" />
                  {lookup("status", "Cancelled")}
                  {o.payment_method === "wallet" && (
                    <span className="text-xs font-400" style={{ color: "var(--ink-soft)" }}>{tx("refunded")}</span>
                  )}
                </div>
              ) : (
                <div className="flex items-center justify-between mb-2">
                  {STATUSES.map((s, i) => (
                    <React.Fragment key={s}>
                      <div className="flex flex-col items-center gap-1.5 flex-1">
                        <div className={`stepper-dot ${i < stepIndex ? "done" : i === stepIndex ? "current" : ""}`}></div>
                        <span className="text-xs text-center" style={{ color: i <= stepIndex ? "var(--gold)" : "var(--ink-soft)", fontWeight: i === stepIndex ? 700 : 400 }}>{lookup("status", s)}</span>
                      </div>
                      {i < STATUSES.length - 1 && <div className="h-0.5 flex-1 -mt-5" style={{ background: i < stepIndex ? "var(--gold)" : "var(--line)" }} />}
                    </React.Fragment>
                  ))}
                </div>
              )}
              {!isCancelled && o.qr && (
                <div className="flex items-center gap-4 mt-4 p-3 rounded-xl border" style={{ borderColor: "var(--line)" }}>
                  <QrCode value={o.qr} size={112} dim={!!o.picked_up_at} />
                  <div className="min-w-0">
                    <div className="text-sm font-700" style={{ color: o.picked_up_at ? "var(--leaf)" : "var(--ink)" }}>
                      {o.picked_up_at ? tx("qr.collected") : tx("qr.title")}
                    </div>
                    <p className="text-xs mt-1" style={{ color: "var(--ink-soft)" }}>
                      {o.picked_up_at ? new Date(o.picked_up_at).toLocaleString() : tx("qr.hint", { t: o.token })}
                    </p>
                  </div>
                </div>
              )}
              <div className="text-sm mt-4" style={{ color: "var(--ink-soft)" }}>
                {o.items.map(i => `${dispName(i.name)} ×${num(i.qty)}`).join(", ")}
              </div>
              {o.note && (
                <div className="text-xs mt-2 px-2.5 py-1.5 rounded-lg" style={{ background: "var(--gold-soft)", color: "var(--teal-deep)" }}>
                  {tx("note.show")}: {o.note}
                </div>
              )}
              <div className="flex items-center gap-2 mt-3">
                <button onClick={() => onReorder(o)}
                  className="text-xs px-3 py-1.5 rounded-lg font-600 btn-primary flex items-center gap-1.5">
                  {tx("reorder")}
                </button>
                <button onClick={() => setPrintOrder(o)}
                  className="text-xs px-3 py-1.5 rounded-lg border font-600 flex items-center gap-1.5 transition-colors hover:bg-black/5"
                  style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>
                  <Icon path={I.printer} className="w-3.5 h-3.5" style={{ color: "var(--gold)" }} />
                  {tx("print")}
                </button>
                {o.status === "Received" && (
                  <button disabled={cancelBusy} onClick={() => onCancel(o.id)}
                    className="text-xs px-3 py-1.5 rounded-lg border font-600"
                    style={{ borderColor: "var(--brick)", color: "var(--brick)" }}>
                    {tx("cancelorder")}
                  </button>
                )}
              </div>
              {o.status === "Ready" && (
                <OrderFeedback order={o} onSubmit={onSubmitFeedback} busy={feedbackBusy} />
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------- Meal calendar tab ---------------- */
function MealCalendar({ user, role, year, month, calendar, paidDays, bill, onToggle, onPay, onRepeat, planBusy, onPrevMonth, onNextMonth, onJumpToday, isCurrentMonth }) {
  const [printKey, setPrintKey] = useState(0);
  const total = daysInMonth(year, month);
  const monthName = new Date(year, month - 1).toLocaleString(CURRENT_LANG === "bn" ? "bn-BD" : "default", { month: "long" });
  const firstWeekday = new Date(year, month - 1, 1).getDay();
  const now = new Date();
  const todayDay = now.getDate();
  const isThisMonthShown = now.getFullYear() === year && (now.getMonth() + 1) === month;

  const markedDays = Array.from({ length: total }, (_, i) => i + 1).filter(d => calendar[d] === "full" || calendar[d] === "half");
  return (
    <div className="grid lg:grid-cols-3 gap-6">
      {printKey > 0 && (
        <PrintSheet key={printKey} title={tx("pr.bill")}
          meta={`${user.name}${user.externalId ? " (" + user.externalId + ")" : ""} · ${monthName} ${num(year)} · ${tx("pr.generated", { t: new Date().toLocaleString() })}`}>
          <div className="ps-grid">
            {[[tx("pr.fullmeals"), num(bill.fullDays)], [tx("pr.halfmeals"), num(bill.halfDays)], [tx("total"), taka(bill.total)], [tx("mp.due"), taka(bill.dueAmount)]]
              .map(([k, v]) => <div key={k} className="ps-tile"><div className="ps-k">{k}</div><div className="ps-v">{v}</div></div>)}
          </div>
          <div className="ps-meta" style={{ marginTop: 6 }}>{tx("mp.paidamt")}: {taka(bill.paidAmount)} ({num(bill.paidDays)})</div>
          <h2>{monthName} {num(year)}</h2>
          <PsTable head={[tx("pr.date"), tx("pr.day"), tx("pr.meal"), tx("pr.rate"), tx("pr.status")]} numCols={[3]} empty={tx("pr.nodays")}
            rows={markedDays.map(d => [
              `${num(d)} ${monthName}`,
              new Date(year, month - 1, d).toLocaleDateString(CURRENT_LANG === "bn" ? "bn-BD" : "default", { weekday: "long" }),
              calendar[d] === "full" ? tx("cal.full") : tx("cal.half"),
              taka(calendar[d] === "full" ? bill.fullRate : bill.halfRate),
              paidDays && paidDays[d] ? tx("pr.paid") : tx("pr.unpaid"),
            ])} />
        </PrintSheet>
      )}
      <div className="lg:col-span-2 card p-5">
        <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
          <div className="flex items-center gap-2">
            <button onClick={onPrevMonth} aria-label={tx("prevm")}
                    className="w-8 h-8 rounded-lg border flex items-center justify-center transition-colors"
                    style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
              <Icon path={I.chevronLeft} className="w-4 h-4" />
            </button>
            <div className="font-display font-700 text-lg min-w-[150px] text-center" style={{ color: "var(--gold)" }}>{monthName} {num(year)}</div>
            <button onClick={onNextMonth} aria-label={tx("nextm")}
                    className="w-8 h-8 rounded-lg border flex items-center justify-center transition-colors"
                    style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
              <Icon path={I.chevronRight} className="w-4 h-4" />
            </button>
            {!isCurrentMonth && (
              <button onClick={onJumpToday} className="text-[11px] font-600 rounded-lg px-2 py-1 ml-1 border transition-colors"
                      style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
                {tx("today")}
              </button>
            )}
          </div>
          <div className="text-xs" style={{ color: "var(--ink-soft)" }}>{tx("cal.hint")}</div>
        </div>
        <div className="grid grid-cols-7 gap-2 mb-2 text-xs text-center font-600" style={{ color: "var(--ink-soft)" }}>
          {tx("wd").split(",").map((d, i) => <div key={i}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-2">
          {Array.from({ length: firstWeekday }).map((_, i) => <div key={"e" + i}></div>)}
          {Array.from({ length: total }).map((_, i) => {
            const day = i + 1;
            const status = calendar[day] || "off";
            const isToday = isThisMonthShown && day === todayDay;
            return (
              <div key={day} onClick={() => onToggle(day, status)}
                className={`cal-cell text-sm font-600 ${status === "full" ? "cal-full" : status === "half" ? "cal-half" : ""} ${isToday ? "cal-today" : ""}`}>
                {num(day)}{paidDays && paidDays[day] && <span className="text-[9px] ml-0.5">✓</span>}
              </div>
            );
          })}
        </div>
        <div className="flex gap-4 mt-4 text-xs" style={{ color: "var(--ink-soft)" }}>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded" style={{ background: "var(--teal)" }}></span> {tx("cal.full")}</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded" style={{ background: "var(--gold)" }}></span> {tx("cal.half")}</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border" style={{ borderColor: "var(--line)" }}></span> {tx("cal.off")}</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border" style={{ borderColor: "var(--gold-bright)", boxShadow: "0 0 0 2px var(--gold-bright)" }}></span> {tx("today")}</span>
          <span className="flex items-center gap-1.5">{tx("mp.legend")}</span>
        </div>
      </div>

      <div className="card p-5 h-fit">
        <div className="flex items-center justify-between gap-2 mb-4">
          <div className="font-display font-700" style={{ color: "var(--gold)" }}>{tx("cal.bill")}</div>
          <button onClick={() => setPrintKey(k => k + 1)} disabled={markedDays.length === 0} className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border font-600 disabled:opacity-40" style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
  <Icon path={I.printer} className="w-3.5 h-3.5" /> {tx("pr.print")}
</button>
        </div>
        <div className="space-y-2 text-sm mb-4">
          <div className="flex justify-between"><span>{tx("cal.fulldays", { r: taka(bill.fullRate) })}</span><span className="font-mono">{num(bill.fullDays)}</span></div>
          <div className="flex justify-between"><span>{tx("cal.halfdays", { r: taka(bill.halfRate) })}</span><span className="font-mono">{num(bill.halfDays)}</span></div>
        </div>
        <div className="border-t pt-3" style={{ borderColor: "var(--line)" }}>
          <div className="flex justify-between font-700 text-lg">
            <span>{tx("total")}</span><span className="font-mono">{taka(bill.total)}</span>
          </div>
        </div>
        <div className="border-t mt-3 pt-3 space-y-1.5 text-sm" style={{ borderColor: "var(--line)" }}>
          <div className="flex justify-between"><span>{tx("mp.paidamt")} ({num(bill.paidDays)})</span><span className="font-mono">{taka(bill.paidAmount)}</span></div>
          <div className="flex justify-between font-700"><span>{tx("mp.due")} ({num(bill.dueDays)})</span><span className="font-mono">{taka(bill.dueAmount)}</span></div>
          <div className="flex justify-between text-xs" style={{ color: "var(--ink-soft)" }}><span>{tx("mp.balance")}</span><span className="font-mono">{taka(bill.walletBalance)}</span></div>
        </div>
        {bill.dueAmount > bill.walletBalance && (
          <p className="text-xs mt-2" style={{ color: "#DC2626" }}>{tx("mp.short", { a: taka(bill.dueAmount - bill.walletBalance) })}</p>
        )}
        <button onClick={onPay} disabled={planBusy || bill.dueDays === 0 || bill.dueAmount > bill.walletBalance}
          className="btn-primary w-full py-2.5 rounded-xl mt-3 disabled:opacity-50">
          {planBusy ? tx("mp.paying") : bill.dueDays === 0 ? tx("mp.nothing") : `${tx("mp.pay")} · ${taka(bill.dueAmount)}`}
        </button>
        <button onClick={onRepeat} disabled={planBusy}
          className="w-full py-2 rounded-xl mt-2 text-sm border font-600 disabled:opacity-50" style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
          {tx("mp.repeat")}
        </button>
        <p className="text-[11px] mt-2" style={{ color: "var(--ink-soft)" }}>{tx("mp.repeat.d")}</p>
        <p className="text-xs mt-3" style={{ color: "var(--ink-soft)" }}>{tx("mp.note")}</p>
      </div>
    </div>
  );
}

/* ---------------- Spending summary (student / teacher) ---------------- */
function SpendingTab({ call, user }) {
  const now = new Date();
  const [printKey, setPrintKey] = useState(0);
  const [ym, setYm] = useState({ year: now.getFullYear(), month: now.getMonth() + 1 });
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    let live = true;
    setData(null); setError(null);
    call(`/api/summary?year=${ym.year}&month=${ym.month}`)
      .then(d => { if (live) setData(d); })
      .catch(e => { if (live) setError(e.message); });
    return () => { live = false; };
  }, [ym.year, ym.month]);

  const shift = (d) => setYm(({ year, month }) => {
    const m = month - 1 + d;
    return { year: year + Math.floor(m / 12), month: ((m % 12) + 12) % 12 + 1 };
  });
  const isCurrent = ym.year === now.getFullYear() && ym.month === now.getMonth() + 1;
  const monthName = new Date(ym.year, ym.month - 1).toLocaleString(CURRENT_LANG === "bn" ? "bn-BD" : "default", { month: "long" });

  const Tile = ({ label, value, sub }) => (
    <div className="card p-4">
      <div className="text-xs uppercase tracking-wide" style={{ color: "var(--ink-soft)" }}>{label}</div>
      <div className="font-mono text-xl font-700 mt-1">{value}</div>
      {sub && <div className="text-xs mt-1" style={{ color: "var(--ink-soft)" }}>{sub}</div>}
    </div>
  );

  let body = null;
  if (error) {
    body = <div className="card p-6 text-sm" style={{ color: "#DC2626" }}>{error}</div>;
  } else if (!data) {
    body = <div className="card p-6 text-sm" style={{ color: "var(--ink-soft)" }}>{tx("sp.loading")}</div>;
  } else if (data.totals.orders === 0) {
    body = <div className="card p-10 text-center text-sm" style={{ color: "var(--ink-soft)" }}>{tx("sp.empty")}</div>;
  } else {
    const t = data.totals;
    const total = daysInMonth(ym.year, ym.month);
    const perDay = {};
    data.byDay.forEach(d => { perDay[d.day] = d.spent; });
    const dayMax = Math.max(1, ...data.byDay.map(d => d.spent));
    const catTotal = Math.max(1, data.byCategory.reduce((a, c) => a + c.spent, 0));
    let compare;
    if (data.prev.spent > 0) {
      const pct = Math.round(Math.abs(t.spent - data.prev.spent) / data.prev.spent * 100);
      compare = pct === 0 ? tx("sp.same") : tx(t.spent > data.prev.spent ? "sp.more" : "sp.less", { p: num(pct) });
    } else {
      compare = tx("sp.noprev");
    }
    body = (
      <>
        {printKey > 0 && (
          <PrintSheet key={printKey} title={tx("pr.spending")}
            meta={`${user.name}${user.externalId ? " (" + user.externalId + ")" : ""} · ${monthName} ${num(ym.year)} · ${tx("pr.generated", { t: new Date().toLocaleString() })}`}>
            <div className="ps-grid">
              {[[tx("sp.spent"), taka(t.spent)], [tx("sp.orders"), num(t.orders)], [tx("sp.avg"), taka(Math.round(t.avgOrder))], [tx("sp.saved"), taka(t.discounts)]]
                .map(([k, v]) => <div key={k} className="ps-tile"><div className="ps-k">{k}</div><div className="ps-v">{v}</div></div>)}
            </div>
            <div className="ps-meta" style={{ marginTop: 6 }}>{compare}</div>
            <h2>{tx("sp.daily")}</h2>
            <PsTable head={[tx("pr.date"), tx("pr.orders"), tx("pr.amount"), ""]} numCols={[1, 2]}
              rows={data.byDay.map(d => [`${num(d.day)} ${monthName}`, num(d.orders), taka(d.spent), <div className="ps-bar" style={{ width: `${(d.spent / dayMax) * 100}%` }}></div>])} />
            <h2>{tx("sp.top")}</h2>
            <PsTable head={[tx("pr.item"), tx("pr.qty"), tx("pr.amount")]} numCols={[1, 2]}
              rows={data.topItems.map(i => [dispName(i.name), num(i.qty), taka(i.spent)])} />
            <h2>{tx("sp.cat")}</h2>
            <PsTable head={[tx("pr.category"), tx("pr.amount"), "%"]} numCols={[1, 2]}
              rows={data.byCategory.map(c => [tx("sp.cat." + c.category), taka(c.spent), num(Math.round(c.spent / catTotal * 100)) + "%"])} />
            <h2>{tx("sp.pay")}</h2>
            <PsTable head={[tx("pr.method"), tx("pr.orders"), tx("pr.amount")]} numCols={[1, 2]}
              rows={data.byPayment.map(p => [p.method === "wallet" ? tx("pay.wallet") : tx("pay.cash"), num(p.orders), taka(p.spent)])} />
            <h2>{tx("sp.wallet")}</h2>
            <PsTable head={["", tx("pr.amount")]} numCols={[1]}
              rows={[[tx("sp.topups"), taka(data.wallet.topups)], [tx("wallet.bal"), taka(data.wallet.balance)]]} />
          </PrintSheet>
        )}
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          <Tile label={tx("sp.spent")} value={taka(t.spent)} sub={compare} />
          <Tile label={tx("sp.orders")} value={num(t.orders)} sub={tx("sp.activedays", { d: num(t.activeDays) })} />
          <Tile label={tx("sp.avg")} value={taka(Math.round(t.avgOrder))} sub={tx("sp.biggest", { a: taka(t.biggest) })} />
          <Tile label={tx("sp.saved")} value={taka(t.discounts)} sub={tx("sp.saved.d")} />
        </div>

        <div className="card p-5">
          <div className="font-display font-700 mb-4" style={{ color: "var(--gold)" }}>{tx("sp.daily")}</div>
          <div className="overflow-x-auto">
            <div className="flex items-end gap-1 h-40" style={{ minWidth: total * 14 }}>
              {Array.from({ length: total }).map((_, i) => {
                const day = i + 1, v = perDay[day] || 0;
                return (
                  <div key={day} className="flex-1 flex flex-col items-center justify-end" title={`${day}: ${taka(v)}`}>
                    <div className="w-full rounded-t" style={{ height: v ? `${Math.max(3, (v / dayMax) * 130)}px` : "2px", background: v ? "var(--gold)" : "var(--line)" }}></div>
                    <div className="text-[9px] mt-1 font-mono" style={{ color: "var(--ink-soft)" }}>{num(day)}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        <div className="grid md:grid-cols-2 gap-5">
          <div className="card p-5">
            <div className="font-display font-700 mb-3" style={{ color: "var(--gold)" }}>{tx("sp.top")}</div>
            <div className="space-y-2 text-sm">
              {data.topItems.map((it, i) => (
                <div key={it.name} className="flex justify-between gap-3">
                  <span>{num(i + 1)}. {dispName(it.name)} <span style={{ color: "var(--ink-soft)" }}>×{num(it.qty)}</span></span>
                  <span className="font-mono">{taka(it.spent)}</span>
                </div>
              ))}
            </div>
          </div>
          <div className="card p-5">
            <div className="font-display font-700 mb-3" style={{ color: "var(--gold)" }}>{tx("sp.cat")}</div>
            <div className="space-y-3">
              {data.byCategory.map(c => (
                <div key={c.category}>
                  <div className="flex justify-between text-sm mb-1">
                    <span>{tx("sp.cat." + c.category)}</span>
                    <span className="font-mono">{taka(c.spent)} · {num(Math.round(c.spent / catTotal * 100))}%</span>
                  </div>
                  <div className="h-2 rounded-full" style={{ background: "var(--line)" }}>
                    <div className="h-2 rounded-full" style={{ width: `${(c.spent / catTotal) * 100}%`, background: "var(--gold)" }}></div>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="card p-5">
            <div className="font-display font-700 mb-3" style={{ color: "var(--gold)" }}>{tx("sp.pay")}</div>
            <div className="space-y-2 text-sm">
              {data.byPayment.map(p => (
                <div key={p.method} className="flex justify-between">

function PaymentModal({ amount, onClose, onConfirm, busy }) {
  const [step, setStep] = useState("category"); // category -> method -> confirm -> processing
  const [category, setCategory] = useState(null);
  const [choice, setChoice] = useState(null); // { key, label }
  const [err, setErr] = useState(null);

  const pickCategory = (cat) => {
    setCategory(cat);
    if (cat.options) {
      setStep("method");
    } else {
      setChoice({ key: cat.key, label: tx("pc." + cat.key) });
      setStep("confirm");
    }
  };

  const pickMethod = (opt) => {
    setChoice(opt);
    setStep("confirm");
  };

  const confirmPay = async () => {
    setErr(null);
    setStep("processing");
    try {
      await onConfirm(choice.key);
      setStep("success");
    } catch (e) {
      setErr(e.message || tx("pay.failed"));
      setStep("confirm");
    }
  };

  const goBack = () => {
    if (step === "method") { setStep("category"); setCategory(null); }
    else if (step === "confirm") { setStep(category?.options ? "method" : "category"); setChoice(null); }
  };

  const title = step === "category" ? tx("pay.t1")
    : step === "method" ? tx("pc." + category.key)
    : step === "confirm" ? tx("pay.t2")
    : step === "success" ? tx("pay.t3")
    : tx("pay.t4");

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(17,24,39,0.5)" }}>
      <div className="card w-full max-w-sm p-5 relative">
        {step !== "processing" && (
          <button onClick={onClose} className="absolute top-3 right-3 text-sm opacity-60 hover:opacity-100">✕</button>
        )}
        <div className="font-display font-700 mb-1" style={{ color: "var(--gold)" }}>{title}</div>
        <div className="text-xs mb-4" style={{ color: "var(--ink-soft)" }}>{tx("amount")} <span className="font-mono">{taka(amount)}</span></div>

        {step === "category" && (
          <div className="space-y-2">
            {PAY_CATEGORIES.map(c => (
              <button key={c.key} onClick={() => pickCategory(c)}
                className="w-full flex items-center justify-between px-4 py-3 rounded-lg border text-sm font-500"
                style={{ borderColor: "var(--line)" }}>
                <span className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full" style={{ background: c.color }} />
                  {tx("pc." + c.key)}
                </span>
                <span style={{ color: "var(--ink-soft)" }}>›</span>
              </button>
            ))}
          </div>
        )}

        {step === "method" && (
          <div className="space-y-2">
            {category.options.map(o => (
              <button key={o.key} onClick={() => pickMethod(o)}
                className="w-full flex items-center justify-between px-4 py-3 rounded-lg border text-sm font-500"
                style={{ borderColor: "var(--line)" }}>
                <span className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full" style={{ background: o.color }} />
                  {o.label}
                </span>
                <span style={{ color: "var(--ink-soft)" }}>›</span>
              </button>
            ))}
            <button onClick={goBack} className="w-full py-2 rounded-lg border text-sm mt-1" style={{ borderColor: "var(--line)" }}>{tx("back")}</button>
          </div>
        )}

        {step === "confirm" && (
          <div>
            <p className="text-sm mb-4">
              {CURRENT_LANG === "bn"
                ? <><span className="font-600">{choice.label}</span> দিয়ে <span className="font-mono font-600">{taka(amount)}</span> টপ-আপ করবেন?</>
                : <>Top up <span className="font-mono font-600">{taka(amount)}</span> via <span className="font-600">{choice.label}</span>?</>}
            </p>
            {err && <p className="text-xs mb-3" style={{ color: "var(--brick)" }}>{err}</p>}
            <div className="flex gap-2">
              <button onClick={goBack} className="flex-1 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }}>{tx("no")}</button>
              <button disabled={busy} onClick={confirmPay} className="flex-1 btn-primary py-2 rounded-lg text-sm">{tx("yes")}</button>
            </div>
          </div>
        )}

        {step === "processing" && (
          <div className="py-6 text-center text-sm" style={{ color: "var(--ink-soft)" }}>
            {tx("confirming", { m: choice?.label })}
          </div>
        )}

        {step === "success" && (
          <div className="py-4 text-center">
            <div className="mx-auto mb-3 w-12 h-12 rounded-full flex items-center justify-center text-2xl"
              style={{ background: "var(--leaf)", color: "#fff" }}>✓</div>
            <p className="text-sm mb-1">
              <span className="font-mono font-600">{taka(amount)}</span> {tx("pay.added")}
            </p>
            <p className="text-xs mb-4" style={{ color: "var(--ink-soft)" }}>{tx("paidvia", { m: choice?.label })}</p>
            <button onClick={onClose} className="btn-primary w-full py-2 rounded-lg text-sm">{tx("done")}</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- Wallet: send money to another student / teacher ---------------- */
function SendMoneyCard({ balance, onLookup, onSend }) {
  const [toId, setToId] = useState("");
  const [recipient, setRecipient] = useState(null); // { name, externalId } once the ID is confirmed
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null); // { ok, text }

  const find = async () => {
    setMsg(null); setRecipient(null);
    if (!toId.trim()) return;
    setBusy(true);
    try { setRecipient(await onLookup(toId.trim())); }
    catch (e) { setMsg({ ok: false, text: e.message }); }
    finally { setBusy(false); }
  };

  const send = async () => {
    const n = Number(amount);
    if (!recipient || !(n > 0)) return;
    if (n > balance) { setMsg({ ok: false, text: tx("xfer.short") }); return; }
    if (!window.confirm(tx("xfer.confirm", { a: taka(n), n: recipient.name }))) return;
    setBusy(true); setMsg(null);
    try {
      await onSend(recipient.externalId, n, note.trim());
      setMsg({ ok: true, text: tx("xfer.ok", { a: taka(n), n: recipient.name }) });
      setToId(""); setRecipient(null); setAmount(""); setNote("");
    } catch (e) {
      setMsg({ ok: false, text: e.message });
    } finally { setBusy(false); }
  };

  return (
    <div className="card p-5 mt-5">
      <div className="font-display font-700 mb-1" style={{ color: "var(--gold)" }}>{tx("xfer.title")}</div>
      <p className="text-xs mb-3" style={{ color: "var(--ink-soft)" }}>{tx("xfer.sub")}</p>

      {!recipient ? (
        <form className="flex gap-2" onSubmit={e => { e.preventDefault(); find(); }}>
          <input value={toId} onChange={e => setToId(e.target.value)} placeholder={tx("xfer.id")}
            className="flex-1 min-w-0 px-3 py-2 rounded-lg border" style={{ borderColor: "var(--line)" }} />
          <button type="submit" disabled={busy || !toId.trim()} className="btn-primary px-4 rounded-lg text-sm disabled:opacity-50">{tx("xfer.find")}</button>
        </form>
      ) : (
        <div className="space-y-3">
          <div className="flex items-center justify-between gap-2 rounded-lg px-3 py-2" style={{ background: "var(--gold-soft)", color: "var(--teal-deep)" }}>
            <div className="text-sm font-700 truncate">{recipient.name} <span className="font-mono font-400 text-xs">({recipient.externalId})</span></div>
            <button type="button" onClick={() => { setRecipient(null); setMsg(null); }} className="text-xs font-600 underline">{tx("xfer.change")}</button>
          </div>
          <div className="flex gap-2">
            {[50, 100, 200].map(v => (
              <button key={v} type="button" onClick={() => setAmount(String(v))}
                className="flex-1 py-1.5 rounded-lg border text-sm font-mono" style={{ borderColor: "var(--line)" }}>{taka(v)}</button>
            ))}
          </div>
          <input type="number" min="1" value={amount} onChange={e => setAmount(e.target.value)} placeholder={tx("xfer.amount")}
            className="w-full px-3 py-2 rounded-lg border font-mono" style={{ borderColor: "var(--line)" }} />
          <input value={note} maxLength={40} onChange={e => setNote(e.target.value)} placeholder={`${tx("xfer.note")} — ${tx("xfer.note.ph")}`}
            className="w-full px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
          <button type="button" onClick={send} disabled={busy || !(Number(amount) > 0)} className="btn-primary w-full py-2.5 rounded-xl disabled:opacity-50">
            {busy ? tx("xfer.sending") : tx("xfer.send")}
          </button>
        </div>
      )}
      {msg && (
        <div className={`${msg.ok ? "success-banner" : "error-banner"} rounded-lg px-3 py-2 mt-3 text-sm`}>{msg.text}</div>
      )}
      <p className="text-[11px] mt-3" style={{ color: "var(--ink-soft)" }}>{tx("xfer.limit")}</p>
    </div>
  );
}
