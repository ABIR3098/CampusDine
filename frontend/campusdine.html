                        : { background: "var(--danger-bg, #FEF2F2)", color: "var(--danger-fg, #B91C1C)" };
                    return (
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="text-[11px] font-700 px-2 py-0.5 rounded-full" style={pillStyle}>{pill}</span>
                        {a !== "hidden" && (
                          <button onClick={() => updateItem(item.id, { availability: a === "sold_out" ? "available" : "sold_out" })}
                            className="text-xs px-2.5 py-1 rounded-lg border font-600" style={{ borderColor: "var(--line)" }}>
                            {a === "sold_out" ? "Mark available" : "Sold out"}
                          </button>
                        )}
                        <button onClick={() => updateItem(item.id, { availability: a === "hidden" ? "available" : "hidden" })}
                          className="text-xs px-2.5 py-1 rounded-lg border font-600" style={{ borderColor: "var(--line)" }}>
                          {a === "hidden" ? "Show" : "Hide"}
                        </button>
                      </div>
                    );
                  })()}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="text-xs mt-2" style={{ color: "var(--ink-soft)" }}>Edit a price or stock number and click outside the box to save. "Sold out" keeps an item on the menu but blocks ordering; "Hide" removes it from students' menu until you show it again.</p>
    </div>
  );
}

/* ---------------- Admin: Orders queue ---------------- */
function AdminOrders({ orders, advance }) {
  if (orders.length === 0) {
    return <div className="card p-10 text-center" style={{ color: "var(--ink-soft)" }}>Queue is empty.</div>;
  }
  // Feature: pre-order — ASAP orders (no pickup_time) need attention first,
  // then scheduled ones soonest-first, so the kitchen sees what's coming up next.
  const sorted = [...orders].sort((a, b) => {
    if (!a.pickup_time && !b.pickup_time) return b.id - a.id;
    if (!a.pickup_time) return -1;
    if (!b.pickup_time) return 1;
    return new Date(a.pickup_time) - new Date(b.pickup_time);
  });
  return (
    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
      {sorted.map(o => (
        <div key={o.token} className="card p-4">
          <div className="flex justify-between items-start mb-2">
            <span className="font-mono font-700 text-lg" style={{ color: "var(--gold)" }}>{o.token}</span>
            <span className="text-xs px-2 py-1 rounded-full font-600" style={{
              background: o.status === "Ready" ? "var(--leaf)" : o.status === "Cooking" ? "var(--gold)" : o.status === "Cancelled" ? "var(--brick)" : "var(--line)",
              color: o.status === "Received" ? "var(--ink)" : "#fff"
            }}>{o.status}</span>
          </div>
          {o.pickup_time && (
            <div className="text-xs mb-2 font-600" style={{ color: "var(--teal)" }}>
              Pickup: {new Date(o.pickup_time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
            </div>
          )}
          <div className="text-sm mb-3" style={{ color: "var(--ink-soft)" }}>
            {o.items.map(i => `${i.name} ×${i.qty}`).join(", ")}
          </div>
          {o.note && (
            <div className="text-sm mb-3 px-3 py-2 rounded-lg font-600"
              style={{ background: "var(--warn-bg, #FFFBEB)", color: "var(--warn-fg, #92400E)", border: "1px solid var(--warn-border, #FDE68A)" }}>
              📝 Note: {o.note}
            </div>
          )}
          <div className="flex justify-between items-center">
            <span className="font-mono text-sm">{taka(o.total)}</span>
            {o.status === "Cancelled" ? (
              <span className="text-xs flex items-center gap-1" style={{ color: "var(--brick)" }}><Icon path={I.x} className="w-4 h-4" /> Cancelled</span>
            ) : o.status !== "Ready" ? (
              <button onClick={() => advance(o.id)} className="btn-primary px-3 py-1.5 rounded-lg text-xs flex items-center gap-1">
                Advance <Icon path={I.arrow} className="w-3.5 h-3.5" />
              </button>
            ) : (
              <span className="text-xs flex items-center gap-1" style={{ color: "var(--leaf)" }}><Icon path={I.check} className="w-4 h-4" /> {o.picked_up_at ? "Collected" : "Ready — awaiting pickup"}</span>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

function AdminReports({ trend, forecast, call, apiBase, token }) {

  const daysAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d); };
  const [from, setFrom] = useState(() => daysAgo(29));
  const [to, setTo] = useState(() => iso(new Date()));

    setBusy(true); setError(null);

/* ---------------- Admin: Scan / verify a pickup token ---------------- */
function AdminVerify({ call, onCollected }) {
  const [code, setCode] = useState("");
  const [result, setResult] = useState(null);   // { order, problem, justCollected }
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [scanning, setScanning] = useState(false);
  const videoRef = useRef(null);
  const streamRef = useRef(null);

  const check = async (raw) => {
    const text = String(raw === undefined ? code : raw).trim();
    if (!text) return;
    setBusy(true); setError(null); setResult(null);
    try {
      const data = await call("/api/orders/verify", { method: "POST", body: { code: text } });
      setResult({ order: data.order, problem: data.problem || null, justCollected: false });
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const collect = async () => {
    if (!result) return;
    setBusy(true); setError(null);
    try {
      const data = await call("/api/orders/verify", { method: "POST", body: { code: result.order.token, collect: true } });
      setResult({ order: data.order, problem: null, justCollected: true });
      if (onCollected) onCollected(data.order);
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const stopScan = () => {
    if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
    setScanning(false);
  };
  useEffect(() => () => { if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); }, []);

  const startScan = async () => {
    setError(null);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setError("This browser can't open the camera here (the page must be on https:// or localhost). Type the token instead.");
      return;
    }
    try {
      streamRef.current = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      setScanning(true);
    } catch (e) {
      setError("Couldn't open the camera — allow camera access, or type the token instead.");
    }
  };

  // While the camera is on, look for a QR code in the video about 4 times a second
  useEffect(() => {
    if (!scanning) return;
    const video = videoRef.current;
    if (!video || !streamRef.current) return;
    video.srcObject = streamRef.current;
    video.play().catch(() => {});
    let stopped = false;
    const detector = ("BarcodeDetector" in window) ? new window.BarcodeDetector({ formats: ["qr_code"] }) : null;
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const tick = async () => {
      if (stopped) return;
      if (video.readyState >= 2 && video.videoWidth) {
        let text = null;
        try {
          if (detector) {
            const found = await detector.detect(video);
            if (found.length) text = found[0].rawValue;
          } else if (window.jsQR) {
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const hit = window.jsQR(img.data, img.width, img.height);
            if (hit) text = hit.data;
          }
        } catch (_) { /* keep trying */ }
        if (text && !stopped) { stopped = true; stopScan(); setCode(text); check(text); return; }
      }
      setTimeout(tick, 250);
    };
    tick();
    return () => { stopped = true; };
  }, [scanning]);

  const o = result && result.order;
  const okToHandOver = result && !result.problem && !result.justCollected;
  const banner = !result ? null
    : result.justCollected ? { bg: "var(--ok-bg, #F0FDF4)", fg: "var(--ok-fg, #15803D)", bd: "var(--ok-border, #BBF7D0)", text: "Handed over — marked as collected" }
    : result.problem ? (result.problem.code === "NOT_READY"
        ? { bg: "var(--warn-bg, #FFFBEB)", fg: "var(--warn-fg, #92400E)", bd: "var(--warn-border, #FDE68A)", text: result.problem.message }
        : { bg: "var(--danger-bg)", fg: "var(--danger-fg)", bd: "var(--danger-border)", text: result.problem.message + (result.problem.code === "ALREADY_COLLECTED" && o.picked_up_at ? " at " + new Date(o.picked_up_at).toLocaleString() : "") })
    : { bg: "var(--ok-bg, #F0FDF4)", fg: "var(--ok-fg, #15803D)", bd: "var(--ok-border, #BBF7D0)", text: "Genuine token, order is Ready — hand it over" };

  return (
    <div className="max-w-xl space-y-5">
      <div className="card p-5">

      )}

  );
}

function AdminFeedback({ summary }) {
  const { average = 0, count = 0, entries = [], distribution = {} } = summary;
  const [filter, setFilter] = useState("all");
  const [printKey, setPrintKey] = useState(0);

  const FILTERS = [
    ["all", "All"], ["order", "Orders"], ["general", "General"], ["low", "Needs attention"],
  ];
  const CAT = {
    food: "🍛 Food", service: "🛎️ Service", hygiene: "🧼 Hygiene", suggestion: "💡 Suggestion", other: "💬 Other",
  };
  const countFor = (key) => entries.filter(e => key === "all" ? true : key === "low" ? e.rating <= 2 : e.kind === key).length;
  const shown = entries.filter(e => filter === "all" ? true : filter === "low" ? e.rating <= 2 : e.kind === filter);
  const maxBar = Math.max(1, ...[1, 2, 3, 4, 5].map(n => distribution[n] || 0));
  const when = (d) => new Date(d).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

  return (
    <div>
      {printKey > 0 && (
        <PrintSheet key={printKey} title="Customer feedback"
          meta={`${FILTERS.find(f => f[0] === filter)[1]} · ${shown.length} of ${entries.length} entries · generated ${new Date().toLocaleString()}`}>
          <div className="ps-grid">
            {[
              ["Average rating", `${average.toFixed(1)} / 5`], ["Total reviews", count],
              ["Needs attention (1–2★)", countFor("low")], ["Orders / General", `${countFor("order")} / ${countFor("general")}`],
            ].map(([k, v]) => <div key={k} className="ps-tile"><div className="ps-k">{k}</div><div className="ps-v">{v}</div></div>)}
          </div>
          <h2>Rating breakdown</h2>
          <PsTable head={["Rating", "Reviews", ""]} numCols={[1]}
            rows={[5, 4, 3, 2, 1].map(n => [psStars(n), distribution[n] || 0, <div className="ps-bar" style={{ width: `${((distribution[n] || 0) / maxBar) * 100}%` }}></div>])} />
          <h2>Feedback</h2>
          <PsTable head={["Date", "From", "About", "Rating", "Comment"]} empty="No feedback matches this filter."
            rows={shown.map(e => [
              when(e.created_at), `${e.userName} (${e.userRole})`,
              e.kind === "order" ? `Order ${e.token}${e.items ? " — " + e.items : ""}` : String(CAT[e.category] || CAT.other).replace(/^\S+\s/, ""),
              psStars(e.rating), e.comment || "—",
            ])} />
        </PrintSheet>
      )}
      <div className="card p-6 mb-6 grid gap-6 md:grid-cols-[auto_1fr] items-center">
        <div className="flex items-center gap-6 flex-wrap">
          <div>
            <div className="text-xs uppercase tracking-wide mb-1" style={{ color: "var(--ink-soft)" }}>Average Rating</div>
            <div className="flex items-center gap-2">
              <span className="font-mono text-4xl font-700" style={{ color: "var(--gold)" }}>{average.toFixed(1)}</span>
              <StarPicker value={Math.round(average)} readOnly size="w-5 h-5" />
            </div>
          </div>
          <div className="border-l pl-6" style={{ borderColor: "var(--line)" }}>
            <div className="text-xs uppercase tracking-wide mb-1" style={{ color: "var(--ink-soft)" }}>Total Reviews</div>
            <div className="font-mono text-4xl font-700" style={{ color: "var(--ink)" }}>{count}</div>
          </div>
        </div>
        <div className="space-y-1.5 md:max-w-sm md:justify-self-end w-full">
          {[5, 4, 3, 2, 1].map(n => (
            <div key={n} className="flex items-center gap-2 text-xs">
              <span className="w-6 font-mono text-right" style={{ color: "var(--ink-soft)" }}>{n}★</span>
              <div className="rating-bar flex-1"><span style={{ width: `${((distribution[n] || 0) / maxBar) * 100}%` }} /></div>
              <span className="w-6 font-mono" style={{ color: "var(--ink-soft)" }}>{distribution[n] || 0}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="flex items-center justify-between gap-3 mb-3 flex-wrap">
        <div className="flex items-center gap-3">
          <div className="font-display font-700" style={{ color: "var(--gold)" }}>Recent Feedback</div>
          <button onClick={() => setPrintKey(k => k + 1)} className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border font-600" style={{ borderColor: "var(--line)", color: "var(--gold)" }}>
            <Icon path={I.printer} className="w-3.5 h-3.5" /> Print
          </button>
        </div>
        <div className="flex gap-2 flex-wrap">
          {FILTERS.map(([key, label]) => (
            <button key={key} onClick={() => setFilter(key)}
              className={`tab-btn px-3 py-1 rounded-full text-xs ${filter === key ? "active" : ""}`}>
              {label} · {countFor(key)}
            </button>
          ))}
        </div>
      </div>

      {shown.length === 0 ? (
        <div className="card p-10 text-center" style={{ color: "var(--ink-soft)" }}>
          {entries.length === 0 ? "No feedback submitted yet." : "No feedback matches this filter."}
        </div>
      ) : (
        <div className="space-y-3">
          {shown.map(e => (
            <div key={`${e.kind}-${e.id}`} className="card p-4"
              style={{ borderLeft: e.rating <= 2 ? "3px solid var(--brick)" : undefined }}>
              <div className="flex items-center justify-between mb-1.5 flex-wrap gap-2">
                <div className="flex items-center gap-3 flex-wrap">
                  <StarPicker value={e.rating} readOnly size="w-4 h-4" />
                  {e.kind === "order" ? (
                    <span className="font-mono text-xs px-2 py-0.5 rounded-full" style={{ background: "var(--gold-soft)", color: "var(--teal-deep)" }}>Order {e.token}</span>
                  ) : (
                    <span className="text-xs px-2 py-0.5 rounded-full" style={{ background: "var(--gold-soft)", color: "var(--teal-deep)" }}>{CAT[e.category] || CAT.other}</span>
                  )}
                </div>
                <span className="text-xs" style={{ color: "var(--ink-soft)" }}>{e.userName} · {e.userRole} · {when(e.created_at)}</span>
              </div>
              {e.items && <div className="text-xs" style={{ color: "var(--ink-soft)" }}>{e.items}</div>}
              {e.comment && <p className="text-sm mt-1" style={{ color: "var(--ink)" }}>"{e.comment}"</p>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function CouponEditor({ coupon, onSave }) {
  const toDateTimeInput = (value) => {
    if (!value) return "";
    const date = new Date(String(value).replace(" ", "T"));
    if (Number.isNaN(date.getTime())) return "";
    const pad = (number) => String(number).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  };
  const makeDraft = (item) => ({
    code: item.code || "",
    discountType: item.discount_type || "PERCENTAGE",
    discountValue: String(item.discount_value ?? ""),
    minOrderAmount: String(item.min_order_amount ?? 0),
    maxDiscount: item.max_discount == null ? "" : String(item.max_discount),
    usageLimit: item.usage_limit == null ? "" : String(item.usage_limit),
    expiryDate: toDateTimeInput(item.expiry_date),
    isActive: Boolean(Number(item.is_active)),
  });
  const [editing, setEditing] = useState(false);
  const [saving, setSaving] = useState(false);
  const [draft, setDraft] = useState(() => makeDraft(coupon));
  useEffect(() => setDraft(makeDraft(coupon)), [coupon]);

  const change = (field, value) => setDraft((current) => ({ ...current, [field]: value }));
  const save = async (event) => {
    event.preventDefault();
    setSaving(true);
    const saved = await onSave(coupon.id, {
      ...draft,
      discountValue: Number(draft.discountValue),
      minOrderAmount: Number(draft.minOrderAmount),
      maxDiscount: draft.maxDiscount === "" ? null : Number(draft.maxDiscount),
      usageLimit: draft.usageLimit === "" ? null : Number(draft.usageLimit),
      expiryDate: draft.expiryDate || null,
    });
    if (saved) setEditing(false);
    setSaving(false);
  };

  return (
    <div className="card p-4">
      <div className="flex items-start justify-between gap-3 flex-wrap">
        <div>
          <div className="font-display font-700 text-lg" style={{ color: "var(--gold)" }}>{coupon.code}</div>
          <div className="text-xs mt-1" style={{ color: "var(--ink-soft)" }}>
            {coupon.used_count || 0}{coupon.usage_limit ? ` / ${coupon.usage_limit}` : " used"} · {coupon.is_active ? "Active" : "Inactive"}
          </div>
        </div>
        {!editing && <button onClick={() => setEditing(true)} className="btn-primary px-3 py-2 rounded-lg text-sm">Edit coupon</button>}
      </div>
      {editing && (
        <form onSubmit={save} className="mt-4">
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>
              Coupon code
              <input required maxLength={50} value={draft.code} onChange={e => change("code", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-lg border text-sm uppercase" style={{ borderColor: "var(--line)" }} />
            </label>
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>
              Discount type
              <select value={draft.discountType} onChange={e => change("discountType", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }}>
                <option value="PERCENTAGE">Percentage</option>
                <option value="FIXED">Fixed amount</option>
              </select>
            </label>
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>
              Discount value {draft.discountType === "PERCENTAGE" ? "(%)" : "(৳)"}
              <input required type="number" min="0.01" max={draft.discountType === "PERCENTAGE" ? 100 : undefined} step="0.01"
                value={draft.discountValue} onChange={e => change("discountValue", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
            </label>
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>
              Minimum order (৳)
              <input type="number" min="0" step="0.01" value={draft.minOrderAmount}
                onChange={e => change("minOrderAmount", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
            </label>
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>
              Maximum discount (৳, optional)
              <input type="number" min="0.01" step="0.01" value={draft.maxDiscount}
                onChange={e => change("maxDiscount", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
            </label>
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>
              Usage limit (optional)
              <input type="number" min="1" step="1" value={draft.usageLimit}
                onChange={e => change("usageLimit", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
            </label>
            <label className="text-xs" style={{ color: "var(--ink-soft)" }}>
              Expires at (optional)
              <input type="datetime-local" value={draft.expiryDate} onChange={e => change("expiryDate", e.target.value)}
                className="w-full mt-1 px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }} />
            </label>
            <label className="flex items-center gap-2 text-sm self-end pb-2">
              <input type="checkbox" checked={draft.isActive} onChange={e => change("isActive", e.target.checked)} />
              Coupon active
            </label>
          </div>
          <div className="flex justify-end gap-2 mt-4">
            <button type="button" onClick={() => { setDraft(makeDraft(coupon)); setEditing(false); }}
              className="px-3 py-2 rounded-lg border text-sm" style={{ borderColor: "var(--line)" }}>Cancel</button>
            <button type="submit" disabled={saving} className="btn-primary px-3 py-2 rounded-lg text-sm disabled:opacity-50">
              {saving ? "Saving…" : "Save changes"}
            </button>
          </div>
        </form>
      )}
    </div>
  );
}

function ChatWorkspace({ role, userId, apiBase, sessionToken, refreshKey }) {
  const [conversations, setConversations] = useState([]);
  const [selectedUserId, setSelectedUserId] = useState(null);
  const [messages, setMessages] = useState([]);
  const [draft, setDraft] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const isAdmin = role === "admin";
  const selectedConversation = conversations.find(item => Number(item.user_id) === Number(selectedUserId));

  const chatCall = (path, options = {}) => api(apiBase, path, { ...options, token: sessionToken });
  const refreshConversations = async () => {
    const data = await chatCall("/api/chat/conversations");
    setConversations(data.conversations || []);
  };
  const refreshMessages = async (targetUserId = selectedUserId) => {
    if (isAdmin) {
      if (!targetUserId) {
        setMessages([]);
        return;
      }
      const data = await chatCall(`/api/chat/${targetUserId}/messages`);
      setMessages(data.messages || []);
      return;
    }
    const data = await chatCall("/api/chat/messages");
    setMessages(data.messages || []);
  };

  useEffect(() => {
    if (isAdmin) {
      refreshConversations().catch(e => setError(e.message));
    } else {
      refreshMessages().catch(e => setError(e.message));
    }
  }, [isAdmin, apiBase, sessionToken, refreshKey]);

  useEffect(() => {
    if (!isAdmin || selectedUserId || conversations.length === 0) return;
    setSelectedUserId(conversations[0].user_id);
  }, [isAdmin, selectedUserId, conversations]);

  useEffect(() => {
    if (!isAdmin || !selectedUserId) return;
    refreshMessages(selectedUserId).catch(e => setError(e.message));
  }, [isAdmin, apiBase, sessionToken, selectedUserId, refreshKey]);

  const sendMessage = async (event) => {
    event.preventDefault();
    const message = draft.trim();
    if (!message || busy) return;
    setBusy(true);
    setError("");
    try {
      await chatCall("/api/chat/messages", {
        method: "POST",
        body: { message, ...(isAdmin ? { userId: selectedUserId } : {}) },
      });
      setDraft("");
      await Promise.all([
        refreshMessages(selectedUserId),
        isAdmin ? refreshConversations() : Promise.resolve(),
      ]);
    } catch (e) {
      setError(e.message || tx("chat.sendfail"));
    } finally {
      setBusy(false);
    }
  };

  const heading = isAdmin
    ? selectedConversation?.name || "Choose a conversation"
    : tx("chat.admin");

  return (
    <section className="grid lg:grid-cols-[280px_minmax(0,1fr)] gap-4 min-h-[min(70vh,680px)]">
      {isAdmin && (
        <aside className="card p-3">
          <h2 className="font-display font-700 px-2 py-2" style={{ color: "var(--gold)" }}>Inbox</h2>
          {conversations.length === 0 ? (
            <p className="px-2 py-3 text-sm" style={{ color: "var(--ink-soft)" }}>No messages yet.</p>
          ) : (
            <div className="space-y-1">
              {conversations.map(item => (
                <button key={item.user_id} onClick={() => setSelectedUserId(item.user_id)}
                  className="w-full text-left p-3 rounded-lg transition-colors"
                  style={{ background: Number(selectedUserId) === Number(item.user_id) ? "var(--gold-soft)" : "transparent" }}>
                  <span className="flex items-center justify-between gap-2">
                    <span className="font-600 text-sm truncate">{item.name}</span>
                    {Number(item.unread_count) > 0 && (
                      <span className="min-w-5 h-5 px-1 rounded-full grid place-items-center text-[10px] text-white" style={{ background: "var(--brick)" }}>
                        {item.unread_count}
                      </span>
                    )}
                  </span>
                  <span className="block text-[11px] capitalize mt-0.5" style={{ color: "var(--ink-soft)" }}>{item.role}</span>
                  <span className="block text-xs mt-1 truncate" style={{ color: "var(--ink-soft)" }}>{item.last_message || "No messages"}</span>
                </button>
              ))}
            </div>
          )}
        </aside>
      )}
      <div className="card flex flex-col min-h-[min(70vh,680px)] overflow-hidden">
        <header className="px-4 py-3 border-b flex items-center justify-between gap-3" style={{ borderColor: "var(--line)" }}>
          <div>
            <h2 className="font-display font-700" style={{ color: "var(--gold)" }}>{heading}</h2>
            <p className="text-xs capitalize" style={{ color: "var(--ink-soft)" }}>
              {isAdmin ? selectedConversation?.role || "Admin inbox" : tx("chat.private")}
            </p>
          </div>
          {selectedConversation && <span className="text-xs" style={{ color: "var(--ink-soft)" }}>{tx("chat.support")}</span>}
        </header>
        {error && <p className="px-4 pt-3 text-sm" style={{ color: "var(--brick)" }}>{error}</p>}
        <div className="flex-1 overflow-y-auto p-4 space-y-3" aria-live="polite">
          {messages.length === 0 ? (
            <div className="h-full min-h-48 grid place-items-center text-center text-sm" style={{ color: "var(--ink-soft)" }}>
              {isAdmin && !selectedUserId ? "Select a student or teacher to open their conversation." : tx("chat.empty")}
            </div>
          ) : messages.map(message => {
            const mine = Number(message.sender_id) === Number(userId);
            return (
              <div key={message.id} className={`flex ${mine ? "justify-end" : "justify-start"}`}>
                <div className="max-w-[85%] rounded-xl px-3 py-2" style={{ background: mine ? "var(--gold-soft)" : "var(--bg)", color: "var(--ink)" }}>
                  <div className="text-[10px] font-700 mb-1" style={{ color: "var(--ink-soft)" }}>{mine ? tx("chat.you") : message.sender_name}</div>
                  <p className="text-sm whitespace-pre-wrap break-words">{message.message}</p>
                  <time className="block text-[10px] mt-1 text-right" style={{ color: "var(--ink-soft)" }}>
                    {new Date(message.created_at).toLocaleString()}
                  </time>
                </div>
              </div>
            );
          })}
        </div>
        <form onSubmit={sendMessage} className="p-3 border-t flex items-end gap-2" style={{ borderColor: "var(--line)" }}>
          <textarea value={draft} onChange={e => setDraft(e.target.value)} maxLength={4000} rows={2}
            disabled={isAdmin && !selectedUserId} placeholder={tx("chat.ph")}
            className="flex-1 resize-y px-3 py-2 rounded-lg border text-sm disabled:opacity-50"
            style={{ borderColor: "var(--line)" }} />
          <button type="submit" disabled={busy || !draft.trim() || (isAdmin && !selectedUserId)}
            className="btn-primary px-4 py-2 rounded-lg text-sm disabled:opacity-50">
            {busy ? tx("chat.sending") : tx("chat.send")}
          </button>
        </form>
      </div>
    </section>
  );
}

function Avatar({ src, name, size = 34, className = "" }) {
  const letter = (name || "?").trim().charAt(0).toUpperCase();
  const base = { width: size, height: size, borderRadius: 999, flexShrink: 0 };
  if (src) return <img src={src} alt={name || ""} className={className} style={{ ...base, objectFit: "cover" }} />;
  return (
    <div className={`grid place-items-center text-white font-700 ${className}`}
      style={{ ...base, fontSize: size * 0.4, background: "linear-gradient(135deg, var(--gold) 0%, var(--gold-hover) 100%)" }}>{letter}</div>
  );
}
// Reads an image file, crops it to a centred square and shrinks it to 256px (keeps the upload tiny).
function fileToAvatar(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("img"));
      img.onload = () => {
        const size = 256, side = Math.min(img.width, img.height);
        const c = document.createElement("canvas"); c.width = size; c.height = size;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

      <div className="text-xs uppercase tracking-wide mb-1" style={{ color: "var(--ink-soft)" }}>{label}</div>
      <div className="text-sm font-600" style={{ color: value ? "var(--ink)" : "var(--ink-soft)" }}>
        {value || placeholder || tx("notset")}
      </div>
    </div>
  );
}
function ProfileInput({ label, value, onChange, placeholder }) {
  return (
    <div>
      <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{label}</label>
      <input value={value} onChange={onChange} placeholder={placeholder}
        className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
    </div>
  );
}
function ProfileTab({ user, call, onUpdated }) {
  const [editing, setEditing] = useState(false);
  const [profile, setProfile] = useState({
    name: user.name, email: "", accountType: "regular", phone: "", address: "", department: "", fatherPhone: "", hallName: "", roomNumber: "", hallId: null,
  });
  const [walletBalance, setWalletBalance] = useState(user.walletBalance);
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [avatar, setAvatar] = useState(user.avatar || null);
  const [avatarChanged, setAvatarChanged] = useState(false);
  const fileRef = useRef(null);
  const [announcementText, setAnnouncementText] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [success, setSuccess] = useState(null);

  const loadProfile = () => call("/api/auth/me").then(data => {
    setProfile({
      name: data.name, email: data.email || "", accountType: data.accountType || "regular",
      phone: data.phone || "", address: data.address || "",
      department: data.department || "", fatherPhone: data.fatherPhone || "",
      hallName: data.hallName || "", roomNumber: data.roomNumber || "", hallId: data.hallId || null,
    });
    setWalletBalance(data.walletBalance);
    setAvatar(data.avatar || null); setAvatarChanged(false);
  }).catch(() => {});

  const pickPhoto = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setError(null);
    if (!/^image\/(png|jpe?g|webp|gif|bmp)$/i.test(file.type)) { setError(tx("pic.bad")); return; }
    try { setAvatar(await fileToAvatar(file)); setAvatarChanged(true); }
    catch (_) { setError(tx("pic.bad")); }
  };

  useEffect(() => { loadProfile(); }, []);

  const save = async () => {
    setError(null); setSuccess(null);
    if (!profile.name.trim()) { setError(tx("pe.name")); return; }
    if (newPassword && newPassword.length < 6) { setError(tx("pe.pw6")); return; }
    if (newPassword && !currentPassword) { setError(tx("pe.cur")); return; }
    if (newPassword && newPassword !== confirmPassword) { setError(tx("pe.match")); return; }
    setBusy(true);
    try {
      const body = {
        name: profile.name, phone: profile.phone, address: profile.address,
        department: profile.department, fatherPhone: profile.fatherPhone,
      };
      if (profile.email.trim()) body.email = profile.email.trim();
      if (user.role !== "admin") { body.roomNumber = profile.roomNumber; body.hallName = profile.hallName; }
      if (newPassword) { body.currentPassword = currentPassword; body.newPassword = newPassword; }
      if (avatarChanged) body.avatar = avatar;
      const data = await call("/api/auth/me", { method: "PUT", body });
      onUpdated(data);
      setProfile(p => ({ ...p, hallId: data.hallId || p.hallId }));
      setCurrentPassword(""); setNewPassword(""); setConfirmPassword("");
      setAvatarChanged(false);
      setSuccess(tx("pe.ok"));
      setEditing(false);
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const cancelEdit = () => {
    setError(null); setCurrentPassword(""); setNewPassword(""); setConfirmPassword("");
    setEditing(false);
    loadProfile();
  };

  const sendAnnouncement = async () => {
    if (!announcementText.trim()) return;
    setBusy(true);
    try {
      await call("/api/admin/announcement", { method: "POST", body: { message: announcementText.trim() } });
      setAnnouncementText("");
      setSuccess("Announcement sent to all users.");
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="max-w-lg">
      <div className="card p-6">
        <div className="flex items-center justify-between mb-5">
          <div className="font-display font-700 text-lg" style={{ color: "var(--gold)" }}>{tx("tab.profile")}</div>
          {!editing && (
            <button onClick={() => setEditing(true)}
              className="text-xs px-3 py-1.5 rounded-lg border font-600 flex items-center gap-1.5 transition-colors hover:bg-black/5"
              style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>
              <Icon path={I.edit} className="w-3.5 h-3.5" style={{ color: "var(--gold)" }} />
              {tx("edit")}
            </button>
          )}
        </div>
        <div className="flex flex-col items-center gap-2 mb-5">
          <Avatar src={avatar} name={profile.name} size={96} />
          {editing && (
            <>
              <input ref={fileRef} type="file" accept="image/*" onChange={pickPhoto} className="hidden" />
              <div className="flex items-center gap-2">
                <button type="button" onClick={() => fileRef.current && fileRef.current.click()}
                  className="text-xs px-3 py-1.5 rounded-lg border font-600 transition-colors hover:bg-black/5"
                  style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>
                  {avatar ? tx("pic.change") : tx("pic.add")}
                </button>
                {avatar && (
                  <button type="button" onClick={() => { setAvatar(null); setAvatarChanged(true); }}
                    className="text-xs px-3 py-1.5 rounded-lg border font-600 transition-colors hover:bg-black/5"
                    style={{ borderColor: "var(--line)", color: "var(--brick)" }}>
                    {tx("pic.remove")}
                  </button>
                )}
              </div>
              {avatarChanged && <div className="text-[11px]" style={{ color: "var(--ink-soft)" }}>{tx("pic.hint")}</div>}
            </>
          )}
        </div>
        <div className="space-y-4">
          {editing ? (
            <ProfileInput label={tx("fullname")} value={profile.name} onChange={e => setProfile({ ...profile, name: e.target.value })} />
          ) : (
            <ProfileField label={tx("fullname")} value={profile.name} />
          )}

          {editing ? (
            <ProfileInput label={tx("email")} value={profile.email} placeholder={tx("email.ph")}
              onChange={e => setProfile({ ...profile, email: e.target.value })} />
          ) : (
            <ProfileField label={tx("email")} value={profile.email} />
          )}

          <div className="grid grid-cols-2 gap-4">
            {editing ? (
              <>
                <ProfileInput label={tx("phone")} value={profile.phone} placeholder="01XXXXXXXXX"
                  onChange={e => setProfile({ ...profile, phone: e.target.value })} />
                <ProfileInput label={tx("fphone")} value={profile.fatherPhone} placeholder="01XXXXXXXXX"
                  onChange={e => setProfile({ ...profile, fatherPhone: e.target.value })} />
              </>
            ) : (
              <>
                <ProfileField label={tx("phone")} value={profile.phone} />
                <ProfileField label={tx("fphone")} value={profile.fatherPhone} />
              </>
            )}
          </div>

          {editing ? (
            <ProfileInput label={tx("address")} value={profile.address} placeholder={tx("addr.ph")}
              onChange={e => setProfile({ ...profile, address: e.target.value })} />
          ) : (
            <ProfileField label={tx("address")} value={profile.address} />
          )}

          {editing ? (
            <ProfileInput label={tx("dept")} value={profile.department} placeholder={tx("dept.ph")}
              onChange={e => setProfile({ ...profile, department: e.target.value })} />
          ) : (
            <ProfileField label={tx("dept")} value={profile.department} />
          )}

          <div className="grid grid-cols-2 gap-4">
            <div>
              <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("id")}</label>
              <input value={user.externalId} disabled
                className="w-full px-4 py-2.5 rounded-xl border opacity-60" style={{ borderColor: "var(--line)" }} />
            </div>
            <div>
              <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("role")}</label>
              <input value={tx("r." + user.role)} disabled
                className="w-full px-4 py-2.5 rounded-xl border opacity-60 capitalize" style={{ borderColor: "var(--line)" }} />
            </div>
          </div>

          {user.role === "admin" && (
            <div className="border-t pt-4" style={{ borderColor: "var(--line)" }}>
              <div className="text-xs uppercase tracking-wide mb-3" style={{ color: "var(--ink-soft)" }}>Admin announcement</div>
              <textarea value={announcementText} onChange={e => setAnnouncementText(e.target.value)} rows={4}
                placeholder="Type a campus-wide announcement..."
                className="w-full px-4 py-3 rounded-xl border resize-none" style={{ borderColor: "var(--line)" }} />
              <div className="mt-3 flex justify-end">
                <button onClick={sendAnnouncement} disabled={!announcementText.trim() || busy}
                  className="btn-primary px-4 py-2 rounded-lg text-sm disabled:opacity-50">Send announcement</button>
              </div>
            </div>
          )}

          {user.role !== "admin" && (
            <div className="border-t pt-4" style={{ borderColor: "var(--line)" }}>
              <div className="text-xs uppercase tracking-wide mb-3" style={{ color: "var(--ink-soft)" }}>{tx("hall")}</div>
              <div className="flex items-center gap-2 mb-3">
                <span className="text-xs px-2.5 py-1 rounded-full font-700"
                  style={profile.accountType === "hall" ? { background: "var(--gold-soft)", color: "var(--teal-deep)" } : { background: "var(--bg)", color: "var(--ink-soft)", border: "1px solid var(--line)" }}>
                  {profile.accountType === "hall" ? tx("acct.badge.hall") : tx("acct.badge.regular")}
                </span>
              </div>
              <div className="grid grid-cols-2 gap-4">
                {editing ? (
                  <>
                    <ProfileInput label={tx("hallname")} value={profile.hallName} placeholder={tx("hallname.ph")}
                      onChange={e => setProfile({ ...profile, hallName: e.target.value })} />
                    <ProfileInput label={tx("room")} value={profile.roomNumber} placeholder={tx("room.ph")}
                      onChange={e => setProfile({ ...profile, roomNumber: e.target.value })} />
                  </>
                ) : (
                  <>
                    <ProfileField label={tx("hallname")} value={profile.hallName} placeholder={tx("notres")} />
                    <ProfileField label={tx("room")} value={profile.roomNumber} placeholder={tx("notres")} />
                  </>
                )}
                <div className="col-span-2">
                  <label className="text-xs uppercase tracking-wide block mb-1.5" style={{ color: "var(--ink-soft)" }}>{tx("hallid")}</label>
                  <input value={profile.hallId || "—"} disabled
                    className="w-full px-4 py-2.5 rounded-xl border opacity-60 font-mono" style={{ borderColor: "var(--line)" }} />
                </div>
              </div>
              {!profile.hallId && (
                <p className="text-xs mt-2" style={{ color: "var(--ink-soft)" }}>{tx("hallhint")}</p>
              )}
            </div>
          )}

          {user.role !== "admin" && (
            <div className="ticket p-4">
              <div className="perf pl-4">
                <div className="text-xs opacity-70">{tx("wallet.bal")}</div>
                <div className="font-mono text-xl font-700">{taka(walletBalance)}</div>
              </div>
            </div>
          )}

          {editing && (
            <div className="border-t pt-4" style={{ borderColor: "var(--line)" }}>
              <div className="text-xs uppercase tracking-wide mb-3" style={{ color: "var(--ink-soft)" }}>{tx("chpw")}</div>
              <div className="space-y-2">
                <input value={currentPassword} onChange={e => setCurrentPassword(e.target.value)} type={showPw ? "text" : "password"} placeholder={tx("curpw")} autoComplete="current-password"
                  className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                <input value={newPassword} onChange={e => setNewPassword(e.target.value)} type={showPw ? "text" : "password"} placeholder={tx("newpw2")} autoComplete="new-password"
                  className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                <input value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} type={showPw ? "text" : "password"} placeholder={tx("cfpw")} autoComplete="new-password"
                  className="w-full px-4 py-2.5 rounded-xl border" style={{ borderColor: "var(--line)" }} />
                <label className="flex items-center gap-2 text-xs cursor-pointer select-none" style={{ color: "var(--ink-soft)" }}>
                  <input type="checkbox" checked={showPw} onChange={e => setShowPw(e.target.checked)} /> {tx("showpw")}
                </label>
              </div>
            </div>
          )}

          {error && <p className="text-sm" style={{ color: "#DC2626" }}>{error}</p>}
          {success && <p className="text-sm" style={{ color: "var(--leaf)" }}>{success}</p>}

          {editing && (
            <div className="flex gap-2">
              <button disabled={busy} onClick={save} className="btn-primary flex-1 py-2.5 rounded-xl">
                {busy ? tx("saving") : tx("save")}
              </button>
              <button disabled={busy} onClick={cancelEdit}
                className="px-5 py-2.5 rounded-xl border font-600 text-sm"
                style={{ borderColor: "var(--line)", color: "var(--ink-soft)" }}>
                {tx("cancel")}
              </button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [apiBase, setApiBase] = useState(DEFAULT_API_BASE);
  const [session, setSession] = useState(null); // { token, user:{id,name,role,walletBalance} }
  const [tab, setTab] = useState("menu");
  const [error, setError] = useState(null);
  const [success, setSuccess] = useState(null);
  const [lang, setLang] = useState(() => { try { return localStorage.getItem("cd_lang") === "bn" ? "bn" : "en"; } catch (e) { return "en"; } });
  const [busy, setBusy] = useState(false);
  const [connected, setConnected] = useState(false);
  const [lowBalanceDismissed, setLowBalanceDismissed] = useState(false);
  const [restaurant, setRestaurant] = useState(null); // the restaurant chosen after login (everyone)
  const restaurantRef = useRef(null); // lets refresh functions (also called from socket handlers) see the latest choice
  restaurantRef.current = restaurant;

  const [menu, setMenu] = useState([]);
  const [cart, setCart] = useState([]);
  const [orders, setOrders] = useState([]);
  const [wallet, setWallet] = useState({ balance: 0, transactions: [], loaded: false });
  const [calendar, setCalendar] = useState({});
  const [bill, setBill] = useState({ fullDays: 0, halfDays: 0, fullRate: 0, halfRate: 0, total: 0, paidDays: 0, paidAmount: 0, dueDays: 0, dueAmount: 0, walletBalance: 0 });
  const [calendarPaid, setCalendarPaid] = useState({});
  const [planBusy, setPlanBusy] = useState(false);
  const [overview, setOverview] = useState({});
  const [trend, setTrend] = useState([]);
  const [forecast, setForecast] = useState({});
  const [feedbackSummary, setFeedbackSummary] = useState({ average: 0, count: 0, entries: [] });
  const [coupons, setCoupons] = useState([]);
  const [feedbackBusy, setFeedbackBusy] = useState(false);
  const [myGeneralFeedback, setMyGeneralFeedback] = useState([]);
  const [generalBusy, setGeneralBusy] = useState(false);
  const [newFeedbackCount, setNewFeedbackCount] = useState(0);
  const [notifications, setNotifications] = useState([]);
  const [toastNotifications, setToastNotifications] = useState([]);
  const [notificationCenterOpen, setNotificationCenterOpen] = useState(false);
  const [chatRefreshKey, setChatRefreshKey] = useState(0);

  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth() + 1);
  const isCurrentMonth = year === now.getFullYear() && month === now.getMonth() + 1;

  const goPrevMonth = () => {
    if (month === 1) { setYear(y => y - 1); setMonth(12); } else { setMonth(m => m - 1); }
  };
  const goNextMonth = () => {
    if (month === 12) { setYear(y => y + 1); setMonth(1); } else { setMonth(m => m + 1); }
  };
  const goToday = () => { setYear(now.getFullYear()); setMonth(now.getMonth() + 1); };

  const socketRef = useRef(null);
  const showError = (e) => { setSuccess(null); setError(typeof e === "string" ? e : e.message); };
  const showSuccess = (msg) => { setError(null); setSuccess(msg); };
  const markAllNotificationsRead = () => setNotifications(prev => prev.map(item => ({ ...item, read: true })));
  const clearNotifications = () => setNotifications([]);
  const pushNotification = (kind, title, message) => {
    const id = Date.now() + Math.random();
    const item = { id, kind, title, message, read: false, createdAt: new Date().toISOString() };
    setNotifications(prev => [item, ...prev]);
    setToastNotifications(prev => [item, ...prev].slice(0, 3));
    setTimeout(() => {
      setToastNotifications(prev => prev.filter(entry => entry.id !== id));
    }, 5000);
  };

  const call = (path, opts) => api(apiBase, path, { ...opts, token: session && session.token });

  const mapMenu = (rows) => rows.map(m => ({ ...m, bn: m.name_bn }));
  const mapWallet = (data) => ({
    balance: data.balance,
    loaded: true,
    transactions: data.transactions.map(t => ({ label: t.label, amount: t.amount, time: new Date(t.created_at).toLocaleString() })),
  });
  const mapCalendar = (rows) => {
    const map = {};
    rows.forEach(r => { map[new Date(r.the_date).getDate()] = r.status; });
    return map;
  };
  const mapPaid = (rows) => {
    const map = {};
    rows.forEach(r => { if (r.paid) map[new Date(r.the_date).getDate()] = true; });
    return map;
  };

  const refreshMenu = async () => setMenu(mapMenu(await call("/api/menu")));

  const toggleFavorite = async (itemId, isFavorite) => {
    try {
      await call(`/api/menu/${itemId}/favorite`, { method: isFavorite ? "DELETE" : "POST" });
      await refreshMenu();
    } catch (e) { showError(e); }
  };
  const refreshWallet = async () => setWallet(mapWallet(await call("/api/wallet")));
  const refreshCalendar = async () => {
    const rows = await call(`/api/calendar?year=${year}&month=${month}`);
    setCalendar(mapCalendar(rows));
    setCalendarPaid(mapPaid(rows));
    setBill(await call(`/api/calendar/bill?year=${year}&month=${month}`));
  };
  const refreshMyOrders = async () => setOrders(await call("/api/orders/mine"));
  const restaurantQuery = () => (restaurantRef.current ? `?restaurant=${restaurantRef.current.id}` : "");
  const refreshAdminOrders = async () => setOrders(await call("/api/orders" + restaurantQuery()));
  const refreshOverview = async () => setOverview(await call("/api/admin/overview" + restaurantQuery()));
  const refreshCoupons = async () => {
    const data = await call("/api/coupon");
    setCoupons(data.coupons || []);
  };
  const refreshReports = async () => {
    setTrend(await call("/api/admin/reports/revenue-trend"));
    setForecast(await call("/api/admin/reports/forecast"));
  };
  const refreshFeedback = async () => setFeedbackSummary(await call("/api/admin/feedback"));
  const refreshMyGeneralFeedback = async () => setMyGeneralFeedback(await call("/api/feedback/mine"));

  const onAuth = (token, user) => {
    setSession({ token, user });
    setRestaurant(null); // everyone picks a restaurant first
    setTab(user.role === "admin" ? "overview" : "menu");
  };
  const logout = () => {
    if (socketRef.current) socketRef.current.disconnect();
    setSession(null); setRestaurant(null); setCart([]); setError(null); setNotificationCenterOpen(false);
    setWallet({ balance: 0, transactions: [], loaded: false }); setLowBalanceDismissed(false);
  };

  // Initial data load after login
  useEffect(() => {
    if (!session) return;
    (async () => {
      try {
        if (session.user.role === "admin") {
          await Promise.all([refreshMenu(), refreshAdminOrders(), refreshOverview(), refreshReports(), refreshFeedback(), refreshCoupons()]);
        } else {
          await Promise.all([refreshMenu(), refreshMyOrders(), refreshWallet(), refreshMyGeneralFeedback()]);
        }
      } catch (e) { showError(e); }
    })();
  }, [session]);

  // Admin: reload the queue and overview numbers for the restaurant they just picked / switched to
  useEffect(() => {
    if (!session || session.user.role !== "admin" || !restaurant) return;
    refreshAdminOrders().catch(() => {});
    refreshOverview().catch(() => {});
  }, [restaurant]);

  // Refetch the meal calendar & bill whenever the visible month changes
  useEffect(() => {
    if (!session || session.user.role === "admin") return;
    refreshCalendar().catch(showError);
  }, [session, year, month]);

  // Live updates via Socket.io
  useEffect(() => {
    if (!session) return;
    const socket = io(apiBase, { auth: { token: session.token } });
    socketRef.current = socket;
    socket.on("connect", () => setConnected(true));
    socket.on("disconnect", () => setConnected(false));
    socket.on("order:new", (order) => {
      if (session.user.role === "admin") {
        setOrders(prev => [order, ...prev]);
        pushNotification("order", "New order", `Order ${order.token} has been placed.`);
      }
    });
    socket.on("order:update", (order) => {
      setOrders(prev => prev.map(o => o.id === order.id
        ? { ...o, status: order.status, ...(order.picked_up_at !== undefined ? { picked_up_at: order.picked_up_at } : {}) } : o));
      if (order.picked_up_at && session.user.role !== "admin") {
        pushNotification("order", tx("n.collected.t"), tx("n.collected", { o: order.token || "#" + order.id }));
        return;
      }
      const label = order.status === "Received" ? tx("n.accepted")
        : order.status === "Cooking" ? tx("n.cooking")
        : order.status === "Ready" ? tx("n.ready")
        : tx("n.other", { s: lookup("status", order.status) });
      pushNotification("order", label, tx("n.status", { o: order.token || "#" + order.id, s: lookup("status", order.status) }));
    });
    // A student/teacher just sent feedback: refresh the admin's Feedback tab live
    socket.on("feedback:new", (payload) => {
      if (session.user.role !== "admin") return;
      refreshFeedback().catch(() => {});
      setNewFeedbackCount(c => c + 1);
      const who = payload.userName || "A user";
      const what = payload.kind === "order" ? `order ${payload.token}` : `the canteen (${payload.category})`;
      pushNotification("feedback", payload.updated ? "Feedback updated" : "New feedback", `${who} rated ${what} ${payload.rating}★`);
    });
    // Someone sent this user money: update the balance live
    socket.on("wallet:received", (payload) => {
      refreshWallet().catch(() => {});
      pushNotification("wallet", tx("n.received.t"), tx("n.received", { n: payload.from, a: taka(payload.amount) }));
    });
    socket.on("announcement", (payload) => {
      pushNotification("announcement", tx("n.announce"), payload.message || tx("n.announce.def"));
    });
    socket.on("chat:message", (payload) => {
      setChatRefreshKey(value => value + 1);
      if (Number(payload.senderId) !== Number(session.user.id)) {
        pushNotification("chat", tx("n.chat"), `${payload.senderName}: ${payload.message}`);
      }
    });
    // Queue positions of everyone's orders shift whenever any order is placed, cancelled or advanced
    // Admin changed an item (sold out / hidden / price): refresh the menu live
    socket.on("menu:changed", () => { refreshMenu().catch(() => {}); });
    socket.on("queue:changed", () => {
      if (session.user.role !== "admin") refreshMyOrders().catch(() => {});
    });
    return () => socket.disconnect();
  }, [session, apiBase]);

  const placeOrder = async (cartItems, paymentMethod, pickupTime, coupon, note) => {
    setBusy(true); setError(null);
    try {
      await call("/api/orders", {
        method: "POST",
        body: {
          items: cartItems.map(c => ({ id: c.id, qty: c.qty })),
          paymentMethod,
          pickupTime: pickupTime || undefined,
          couponId: coupon ? coupon.couponId : undefined,
          couponCode: coupon ? coupon.code : undefined,
          note: note && note.trim() ? note.trim() : undefined,
        },
      });
      setCart([]);
      await Promise.all([refreshMyOrders(), refreshMenu(), paymentMethod === "wallet" ? refreshWallet() : Promise.resolve()]);
      setTab("track");
    } catch (e) { showError(e); } finally { setBusy(false); }
  }; 
    // Order again: put the items of a past order back into the cart (current prices, capped by stock).
  const reorder = (order) => {
    const next = [...cart];
    const added = [];
    const skipped = [];
    for (const it of order.items) {
      const m = menu.find(x => (it.menuItemId != null ? x.id === it.menuItemId : x.name === it.name));
      if (!m || m.stock <= 0 || m.availability === "sold_out") { skipped.push(dispName(it.name)); continue; }
      const idx = next.findIndex(c => c.id === m.id);
      const have = idx >= 0 ? next[idx].qty : 0;
      const qty = Math.min(have + it.qty, m.stock);
      if (qty <= have) { skipped.push(dispName(it.name)); continue; }
      if (idx >= 0) next[idx] = { ...next[idx], qty }; else next.push({ ...m, qty });
      added.push(qty < have + it.qty ? `${dispName(m.name)} (${num(m.stock)}${tx("reorder.left")})` : dispName(m.name));
    }
    if (added.length === 0) { showError(tx("reorder.none")); return; }
    setCart(next);
    showSuccess(tx("reorder.added") + added.join(", ") + "." + (skipped.length ? tx("reorder.skipped") + skipped.join(", ") + "." : ""));
    setTab("menu");
  };

  const advanceOrder = async (id) => {
    try {
      await call(`/api/orders/${id}/advance`, { method: "PATCH" });
      await refreshAdminOrders();
    } catch (e) { showError(e); }
  };

  const cancelOrder = async (id) => {
    setBusy(true); setError(null); setSuccess(null);
    try {
      const cancelled = await call(`/api/orders/${id}/cancel`, { method: "PATCH" });
      await Promise.all([refreshMyOrders(), refreshMenu(), refreshWallet()]);
      showSuccess(
        cancelled.payment_method === "wallet"
          ? tx("msg.cancel.w", { t: cancelled.token, a: taka(cancelled.total) })
          : tx("msg.cancel", { t: cancelled.token })
      );
    } catch (e) { showError(e); } finally { setBusy(false); }
  };

  const submitFeedback = async (orderId, rating, comment) => {
    setFeedbackBusy(true); setError(null);
    try {
      await call(`/api/orders/${orderId}/feedback`, { method: "POST", body: { rating, comment } });
      await refreshMyOrders();
      return true;
    } catch (e) { showError(e); return false; } finally { setFeedbackBusy(false); }
  };

  const submitGeneralFeedback = async (category, rating, comment) => {
    setGeneralBusy(true); setError(null);
    try {
      await call("/api/feedback", { method: "POST", body: { category, rating, comment } });
      await refreshMyGeneralFeedback();
      return true;
    } catch (e) { showError(e); return false; } finally { setGeneralBusy(false); }
  };

  // Admin: opening the Feedback tab always pulls the latest and clears the unread badge
  useEffect(() => {
    if (!session || session.user.role !== "admin" || tab !== "feedback") return;
    refreshFeedback().catch(() => {});
    setNewFeedbackCount(0);
  }, [tab, session, newFeedbackCount]);

  const topUp = async (amount, method) => {
    setBusy(true); setError(null);
    try {
      await call("/api/wallet/topup", { method: "POST", body: { amount, method } });
    } catch (e) { showError(e); throw e; } finally { setBusy(false); }
    // The top-up already succeeded on the server; a refresh hiccup shouldn't look like a failed payment.
    try { await refreshWallet(); } catch (e) { showError(e); }
  };

  // Wallet transfer: look the person up first, then send. Errors bubble up so the card can show them.
  const lookupRecipient = (id) => call(`/api/wallet/recipient?id=${encodeURIComponent(id)}`);
  const sendMoney = async (toId, amount, note) => {
    await call("/api/wallet/transfer", { method: "POST", body: { toId, amount, note } });
    try { await refreshWallet(); } catch (e) { showError(e); }
  };

  const toggleDay = async (day, currentStatus) => {
    const next = currentStatus === "off" ? "full" : currentStatus === "full" ? "half" : "off";
    if (calendarPaid[day] && !window.confirm(tx("mp.confirm"))) return;
    try {
      const r = await call(`/api/calendar/${day}`, { method: "PUT", body: { year, month, status: next } });
      await refreshCalendar();
      if (r.refunded) await refreshWallet();
    } catch (e) { showError(e); }
  };
  const payMealPlan = async () => {
    setPlanBusy(true);
    try {
      const r = await call("/api/calendar/pay", { method: "POST", body: { year, month } });
      setSuccess(tx("mp.paid.ok", { a: taka(r.paid), d: num(r.days) }));
      await refreshCalendar(); await refreshWallet();
    } catch (e) { showError(e); } finally { setPlanBusy(false); }
  };
  const repeatLastMonth = async () => {
    setPlanBusy(true);
    try {
      const r = await call("/api/calendar/repeat", { method: "POST", body: { year, month } });
      setSuccess(tx("mp.repeat.ok", { n: num(r.added) }));
      await refreshCalendar();
    } catch (e) { showError(e); } finally { setPlanBusy(false); }
  };

  const updateMenuItem = async (id, patch) => {
    try {
      await call(`/api/menu/${id}`, { method: "PUT", body: patch });
      await refreshMenu();
    } catch (e) { showError(e); }
  };
  const updateCoupon = async (id, patch) => {
    try {
      await call(`/api/coupon/${id}`, { method: "PUT", body: patch });
      await refreshCoupons();
      showSuccess("Coupon updated successfully.");
      return true;
    } catch (e) {
      showError(e);
      return false;
    }
  };
  const addMenuItem = async (item) => {
    try {
      await call("/api/menu", { method: "POST", body: { ...item, restaurant: restaurant && restaurant.id } });
      await refreshMenu();
    } catch (e) { showError(e); }
  };

  // Language: admin pages are English-only for now; student/teacher pages follow the toggle.
  CURRENT_LANG = (session && session.user.role === "admin") ? "en" : lang;
  MENU_BN = {};
  menu.forEach(m => { if (m.bn) MENU_BN[m.name] = m.bn; });
  const toggleLang = () => {
    const next = lang === "bn" ? "en" : "bn";
    setLang(next);
    try { localStorage.setItem("cd_lang", next); } catch (e) {}
  };

  if (!session) return <Login apiBase={apiBase} setApiBase={setApiBase} onAuth={onAuth} onToggleLang={toggleLang} />;

  if (!restaurant) {
    return <RestaurantPicker role={session.user.role} userName={session.user.name} lang={lang}
      onPick={(r) => { setRestaurant(r); setTab(session.user.role === "admin" ? "overview" : "menu"); }} onLogout={logout} />;
  }

  // Each restaurant sells its own items; admin orders are also limited to the chosen restaurant
  const restaurantMenu = menu.filter(m => m.restaurant === restaurant.id);
  const restaurantOrders = session.user.role === "admin" ? orders.filter(o => o.restaurant === restaurant.id) : orders;
  const switchRestaurant = () => {
    if (cart.length > 0 && !window.confirm(session.user.role !== "admin" && lang === "bn"
      ? "রেস্টুরেন্ট বদলালে আপনার কার্ট খালি হয়ে যাবে। চালিয়ে যাবেন?"
      : "Switching restaurant will empty your cart. Continue?")) return;
    setCart([]);
    setRestaurant(null);
  };

  const toRate = orders.filter(o => o.status === "Ready" && !o.feedback).length;
  const userTabs = [
    { key: "menu", label: tx("nav.menu"), icon: I.menu },
    { key: "track", label: tx("nav.track"), icon: I.clock },
    { key: "calendar", label: tx("nav.calendar"), icon: I.calendar },
    { key: "wallet", label: tx("nav.wallet"), icon: I.wallet },
    { key: "spending", label: tx("nav.spending"), icon: I.chart },
    { key: "chat", label: tx("nav.chat"), icon: I.chat },
    { key: "feedback", label: tx("nav.feedback"), icon: I.star, badge: toRate },
    { key: "profile", label: tx("nav.profile"), icon: I.user },
  ];
  const adminTabs = [
    { key: "overview", label: "Overview", icon: I.dashboard },
    { key: "adminMenu", label: "Menu", icon: I.box },
    { key: "adminOrders", label: "Orders", icon: I.ticket },
    { key: "verify", label: "Scan token", icon: I.ticket },
    { key: "coupons", label: "Coupons", icon: I.ticket },
    { key: "chat", label: "Messages", icon: I.chat },
    { key: "reports", label: "Reports", icon: I.chart },
    { key: "feedback", label: "Feedback", icon: I.star, badge: newFeedbackCount },
    { key: "profile", label: "Profile", icon: I.user },
  ];

  const unreadNotifications = notifications.filter(item => !item.read).length;

  return (
    <div className="min-h-screen">
      <TopBar role={session.user.role} name={session.user.name} avatar={session.user.avatar}
        tabs={session.user.role === "admin" ? adminTabs : userTabs}
        active={tab} setActive={setTab} onLogout={logout} connected={connected} onToggleLang={toggleLang}
        notifications={notifications} notificationCount={unreadNotifications}
        notificationOpen={notificationCenterOpen}
        onToggleNotifications={() => setNotificationCenterOpen(v => !v)}
        onMarkAllRead={markAllNotificationsRead}
        onClearNotifications={clearNotifications}
      />
      <div className="fixed top-[76px] right-4 z-50 flex flex-col gap-2 w-[min(90vw,320px)] pointer-events-none">
        {toastNotifications.map(item => (
          <div key={item.id} className="pointer-events-auto rounded-xl border p-3 shadow-lg" style={{
            background: item.kind === "announcement" ? "rgba(22,163,74,0.10)" : "rgba(245,179,0,0.12)",
            borderColor: item.kind === "announcement" ? "rgba(22,163,74,0.35)" : "rgba(245,179,0,0.35)",
            color: "var(--ink)"
          }}>
            <div className="text-[10px] uppercase tracking-wide font-700" style={{ color: item.kind === "announcement" ? "var(--teal-deep)" : "var(--gold)" }}>{item.title}</div>
            <div className="text-sm mt-1 leading-relaxed">{item.message}</div>
          </div>
        ))}
      </div>
      <div className="max-w-6xl mx-auto px-5 pt-4 flex items-center justify-between gap-3 flex-wrap">
        <div className="flex items-center gap-2.5">
          <img src={restaurant.logo} alt="" style={{ width: 36, height: 36 }} />
          <div className="leading-tight">
            <div className="text-sm font-700">{restaurant.name}</div>
            {restaurant.subtitle && <div className="text-[11px] opacity-60">({restaurant.subtitle})</div>}
          </div>
        </div>
        <button className="btn-gold px-3 py-1.5 rounded-lg text-xs" onClick={switchRestaurant}>
          {session.user.role !== "admin" && lang === "bn" ? "রেস্টুরেন্ট বদলান" : "Switch restaurant"}
        </button>
      </div>
      <div className="max-w-6xl mx-auto p-5 pb-24 sm:pb-5 fade-in" key={tab}>
        {error && (
          <div className="error-banner rounded-xl px-4 py-3 mb-5 text-sm flex justify-between items-center">
            <span>{error}</span>
            <button onClick={() => setError(null)} className="font-700">✕</button>
          </div>
        )}
        {success && (
          <div className="success-banner rounded-xl px-4 py-3 mb-5 text-sm flex justify-between items-center">
            <span>{success}</span>
            <button onClick={() => setSuccess(null)} className="font-700">✕</button>
          </div>
        )}
        {session.user.role !== "admin" && wallet.loaded && wallet.balance < LOW_BALANCE_THRESHOLD && !lowBalanceDismissed && tab !== "wallet" && (
          <div className="warn-banner rounded-xl px-4 py-3 mb-5 text-sm flex justify-between items-center gap-3">
            <span>{tx("lowbal", { b: taka(wallet.balance) })}</span>
            <span className="flex items-center gap-3 shrink-0">
              <button onClick={() => setTab("wallet")} className="btn-primary px-3 py-1.5 rounded-lg text-xs">{tx("topup")}</button>
              <button onClick={() => setLowBalanceDismissed(true)} className="font-700">✕</button>
            </span>
          </div>
        )}

        {session.user.role !== "admin" && tab === "menu" && (
          <MenuOrder menu={restaurantMenu} cart={cart} setCart={setCart} placeOrder={placeOrder} walletBalance={wallet.balance} busy={busy}
            onToggleFavorite={toggleFavorite} apiBase={apiBase} sessionToken={session.token} />
        )}
        {session.user.role !== "admin" && tab === "track" && (
          <TrackOrder orders={orders} onSubmitFeedback={submitFeedback} feedbackBusy={feedbackBusy} onCancel={cancelOrder} cancelBusy={busy} onReorder={reorder} />
        )}
        {session.user.role !== "admin" && tab === "feedback" && (
          <FeedbackTab user={session.user} orders={orders} onSubmitOrder={submitFeedback} orderBusy={feedbackBusy}
            general={myGeneralFeedback} onSubmitGeneral={submitGeneralFeedback} generalBusy={generalBusy} />
        )}
        {session.user.role !== "admin" && tab === "calendar" && (
          <MealCalendar user={session.user} role={session.user.role} year={year} month={month} calendar={calendar} paidDays={calendarPaid} bill={bill} onToggle={toggleDay}
                        onPay={payMealPlan} onRepeat={repeatLastMonth} planBusy={planBusy}
                        onPrevMonth={goPrevMonth} onNextMonth={goNextMonth} onJumpToday={goToday} isCurrentMonth={isCurrentMonth} />
        )}
        {session.user.role !== "admin" && tab === "spending" && <SpendingTab call={call} user={session.user} />}
        {session.user.role !== "admin" && tab === "wallet" && (
          <WalletTab balance={wallet.balance} topUp={topUp} transactions={wallet.transactions} busy={busy}
            onLookup={lookupRecipient} onSend={sendMoney} />
        )}
        {tab === "chat" && (
          <ChatWorkspace role={session.user.role} userId={session.user.id} apiBase={apiBase}
            sessionToken={session.token} refreshKey={chatRefreshKey} />
        )}

        {session.user.role === "admin" && tab === "overview" && <AdminOverview overview={overview} orders={restaurantOrders} />}
        {session.user.role === "admin" && tab === "adminMenu" && (
          <AdminMenu menu={restaurantMenu} updateItem={updateMenuItem} addItem={addMenuItem} busy={busy} />
        )}
        {session.user.role === "admin" && tab === "adminOrders" && <AdminOrders orders={restaurantOrders} advance={advanceOrder} />}
        {session.user.role === "admin" && tab === "coupons" && <AdminCoupons coupons={coupons} onSave={updateCoupon} />}
        {session.user.role === "admin" && tab === "verify" && (
          <AdminVerify call={call} onCollected={(o) => setOrders(prev => prev.map(x => x.id === o.id ? { ...x, picked_up_at: o.picked_up_at } : x))} />
        )}
        {session.user.role === "admin" && tab === "reports" && <AdminReports trend={trend} forecast={forecast} call={call} apiBase={apiBase} token={session.token} />}
        {session.user.role === "admin" && tab === "feedback" && <AdminFeedback summary={feedbackSummary} />}

        {tab === "profile" && (
          <ProfileTab user={session.user} call={call}
            onUpdated={(u) => setSession(s => ({ ...s, user: { ...s.user, name: u.name, walletBalance: u.walletBalance, avatar: u.avatar || null, email: u.email || null, accountType: u.accountType, hallName: u.hallName || null, roomNumber: u.roomNumber || null, hallId: u.hallId || null } }))} />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
