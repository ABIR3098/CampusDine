<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusDine — Royal Campus Canteen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Hind+Siliguri:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --bg: #06080E;
    --panel: #0D131F;
    --panel-border: rgba(212, 175, 55, 0.22);
    --ink: #F4EFE6;
    --ink-soft: #9DAEC7;
    --teal: #3A0B12;
    --teal-deep: #1F0508;
    --gold: #D4AF37;
    --gold-bright: #F7E4A2;
    --gold-deep: #8E6B11;
    --brick: #D93829;
    --leaf: #3E9B66;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; scroll-behavior: smooth; }

  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
    background-image: 
      radial-gradient(ellipse at 50% 0%, rgba(58, 11, 18, 0.45), transparent 70%),
      radial-gradient(circle at 2px 2px, rgba(212, 175, 55, 0.08) 1px, transparent 0);
    background-size: 100% 100%, 28px 28px;
    min-height: 100vh;
  }

  .font-display { font-family: 'Cinzel', 'Hind Siliguri', serif; letter-spacing: 0.03em; }
  .font-classic { font-family: 'Playfair Display', serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  .gold-text {
    background: linear-gradient(135deg, #FFF0BD 0%, #D4AF37 50%, #9A6F0D 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.25); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }

  /* Classic Ticket Styling */
  .ticket {
    position: relative;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
    color: #F4EFE6;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }
  .ticket::before, .ticket::after {
    content: "";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 20px; height: 20px;
    background: var(--bg);
    border-radius: 50%;
  }
  .ticket::before { left: -10px; border-right: 1px solid var(--panel-border); }
  .ticket::after { right: -10px; border-left: 1px solid var(--panel-border); }
  .ticket .perf { border-left: 2px dashed rgba(212, 175, 55, 0.35); }

  /* UI Cards & Buttons */
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card:hover {
    border-color: rgba(212, 175, 55, 0.5);
    box-shadow: 0 8px 30px rgba(212, 175, 55, 0.06);
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 60%, var(--gold-deep) 100%);
    color: var(--teal-deep);
    font-family: 'Cinzel', serif;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.2s ease;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
  }
  .btn-primary:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
  }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { background: #2A303C; color: #5F6B7D; cursor: not-allowed; box-shadow: none; filter: none; }

  .btn-gold {
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-bright);
    font-family: 'Cinzel', serif;
    font-weight: 700;
    transition: all 0.2s ease;
  }
  .btn-gold:hover {
    background: var(--gold);
    color: var(--teal-deep);
  }

  .tab-btn {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
    color: var(--teal-deep);
    box-shadow: 0 2px 10px rgba(212, 175, 55, 0.25);
  }
  .tab-btn:not(.active) {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--ink-soft);
  }
  .tab-btn:not(.active):hover {
    border-color: var(--gold);
    color: var(--gold-bright);
  }

  .stepper-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--panel-border);
  }
  .stepper-dot.done { background: var(--gold); border-color: var(--gold); }
  .stepper-dot.current {
    background: var(--gold-bright);
    border-color: var(--gold-bright);
    box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.25);
  }

  .cal-cell {
    aspect-ratio: 1/1;
    border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; user-select: none;
    border: 1px solid var(--panel-border);
    background: var(--panel);
    transition: all 0.15s ease;
  }
  .cal-cell:hover { transform: translateY(-2px); border-color: var(--gold); }
  .cal-full { background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%); color: var(--gold-bright); border-color: var(--gold); }
  .cal-half { background: rgba(212, 175, 55, 0.15); color: var(--gold-bright); border-color: var(--gold); }

  .logo-badge {
    border: 1px solid var(--gold);
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-deep) 100%);
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
  }

  .divider-flourish { display: flex; align-items: center; justify-content: center; gap: 14px; color: var(--gold); }
  .divider-flourish::before, .divider-flourish::after {
    content: ""; flex: 1; max-width: 80px; border-bottom: 1px solid var(--panel-border);
  }

  .fade-in { animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  input, select { background: var(--panel); color: var(--ink); }
  input:focus, select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ---------------- Constants ---------------- */
const DEFAULT_API_BASE = (window.location.origin && window.location.origin !== "null")
  ? window.location.origin
  : "http://localhost:5000";
const LOW_STOCK_THRESHOLD = 10;
const CATEGORIES = [
  { id: "heavy", label: "Heavy Meals" },
  { id: "snacks", label: "Snacks" },
  { id: "drinks", label: "Drinks" },
];
const STATUSES = ["Received", "Cooking", "Ready"];

/* ---------------- API helper ---------------- */
async function api(apiBase, path, { method = "GET", body, token } = {}) {
  const res = await fetch(`${apiBase}${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* empty body */ }
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

/* ---------------- Icon Component ---------------- */
const Icon = ({ path, className = "w-5 h-5", style }) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"
       strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
    <path d={path} />
  </svg>
);
const I = {
  menu: "M3 6h18M3 12h18M3 18h18",
  cart: "M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6L22 8H6",
  clock: "M12 2a10 10 0 1 0 .001 20.001A10 10 0 0 0 12 2Zm1 5v5l4 2",
  wallet: "M3 7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Zm14 3h.01M3 9h18",
  calendar: "M8 2v4M16 2v4M3 9h18M4 4h16a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z",
  dashboard: "M4 4h7v7H4V4Zm9 0h7v4h-7V4Zm0 7h7v9h-7v-9ZM4 14h7v6H4v-6Z",
  box: "M21 8L12 3 3 8l9 5 9-5Zm0 0v8l-9 5-9-5V8m18 0-9 5-9-5",
  chart: "M4 19V5M4 19h16M8 15v4M12 11v8M16 7v12",
  bell: "M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9ZM13.7 21a2 2 0 0 1-3.4 0",
  plus: "M12 5v14M5 12h14",
  minus: "M5 12h14",
  check: "M20 6 9 17l-5-5",
  arrow: "M5 12h14M13 5l7 7-7 7",
  logout: "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
  user: "M20 21a8 8 0 1 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z",
  ticket: "M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z",
  plug: "M9 7V2m6 5V2M6 7h12l-1 6a5 5 0 0 1-10 0L6 7Zm4 11v3h4v-3",
};

/* ---------------- Helpers ---------------- */
const taka = (n) => `৳${Number(n || 0).toLocaleString("en-BD")}`;
function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); }
function monthLabel(ym) {
  const [y, m] = ym.split("-");
  return new Date(Number(y), Number(m) - 1).toLocaleString("default", { month: "short" });
}

/* ---------------- Login / Landing Screen ---------------- */
function Login({ apiBase, setApiBase, onAuth }) {
  const [role, setRole] = useState(null);
  const [mode, setMode] = useState("login");
  const [name, setName] = useState("");
  const [externalId, setExternalId] = useState("");
  const [password, setPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [resetMsg, setResetMsg] = useState(null);
  const [showAdvanced, setShowAdvanced] = useState(false);
  const authRef = useRef(null);

  const roles = [
    { key: "student", label: "Student", desc: "Order meals, track pickup, manage subscription.", icon: I.user },
    { key: "teacher", label: "Faculty Member", desc: "Faculty meal ordering with dedicated rates.", icon: I.user },
    { key: "admin", label: "Canteen Admin", desc: "Run orders, menu stock, and revenue reports.", icon: I.dashboard },
  ];

  const features = [
    { title: "Token Pickup", desc: "লাইনে না দাঁড়িয়ে অর্ডার করুন, টোকেন দিয়ে সরাসরি নিন।" },
    { title: "Digital Wallet", desc: "ক্যাশলেস পেমেন্ট, দ্রুত টপ-আপ এবং স্বচ্ছ ইতিহাস।" },
    { title: "Auto Subscription", desc: "মাসিক ডাইনিং বিলের হিসাব এখন অটোমেটিক।" },
    { title: "Live Tracking", desc: "রিয়েল-টাইমে জানুন খাবার তৈরির আপডেট।" },
  ];

  const sampleMenu = [
    { name: "Kacchi Biryani", bn: "কাচ্চি বিরিয়ানি", price: "৳ ১৬০", img: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?auto=format&fit=crop&w=500&q=80" },
    { name: "Special Beef Tehari", bn: "বিফ তেহারি", price: "৳ ৯০", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80" },
    { name: "Vintage Cold Brew", bn: "কোল্ড ব্রু কফি", price: "৳ ৪০", img: "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?auto=format&fit=crop&w=500&q=80" },
  ];

  const scrollToAuth = () => authRef.current && authRef.current.scrollIntoView({ behavior: "smooth" });

  const submit = async () => {
    setError(null);
    if (!externalId || !password || (mode === "register" && !name)) {
      setError("সবগুলো ফিল্ড সঠিকভাবে পূরণ করুন।");
      return;
    }
    setBusy(true);
    try {
      const data = mode === "login"
        ? await api(apiBase, "/api/auth/login", { method: "POST", body: { externalId, password } })
        : await api(apiBase, "/api/auth/register", { method: "POST", body: { name, externalId, role, password } });
      onAuth(data.token, data.user);
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  const submitReset = async () => {
    setError(null); setResetMsg(null);
    if (!externalId || !newPassword) { setError("সব তথ্য দিন।"); return; }
    if (newPassword.length < 6) { setError("পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে।"); return; }
    setBusy(true);
    try {
      await api(apiBase, "/api/auth/reset-password", { method: "POST", body: { externalId, newPassword } });
      setMode("login");
      setResetMsg("পাসওয়ার্ড আপডেট হয়েছে — নতুন পাসওয়ার্ড দিয়ে লগইন করুন।");
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="min-h-screen flex flex-col justify-between">
      <div className="text-center py-2.5 px-4 text-xs tracking-widest uppercase font-display border-b"
           style={{ background: "linear-gradient(90deg, var(--teal-deep), var(--teal), var(--teal-deep))", borderColor: "var(--panel-border)", color: "var(--gold-bright)" }}>
        ✨ আভিজাত্য ও সুস্বাদু খাবারের ডাইনিং প্ল্যাটফর্ম — CampusDine ✨
      </div>

      <header className="sticky top-0 z-30 backdrop-blur-md border-b" style={{ background: "rgba(6, 8, 14, 0.85)", borderColor: "var(--panel-border)" }}>
        <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
          <div className="flex items-center gap-3.5">
            <div className="logo-badge w-10 h-10 rounded-full grid place-items-center">
              <Icon path={I.ticket} className="w-5 h-5" style={{ color: "var(--gold)" }} />
            </div>
            <div>
              <span className="font-display gold-text text-xl font-800 tracking-wider block leading-none">CampusDine</span>
              <span className="text-[9px] uppercase tracking-[0.3em] block mt-1" style={{ color: "var(--ink-soft)" }}>Royal Campus Kitchen</span>
            </div>
          </div>
          <nav className="hidden md:flex items-center gap-8 text-xs font-display tracking-widest uppercase" style={{ color: "var(--ink-soft)" }}>
            <a href="#menu" className="hover:text-amber-400 transition-colors">Menu</a>
            <a href="#features" className="hover:text-amber-400 transition-colors">Features</a>
            <a href="#about" className="hover:text-amber-400 transition-colors">Story</a>
          </nav>
          <button onClick={scrollToAuth} className="btn-primary px-6 py-2.5 rounded-md text-xs">Sign In</button>
        </div>
      </header>

      <section className="relative py-28 px-6 text-center">
        <div className="max-w-3xl mx-auto space-y-6">
          <div className="inline-block px-4 py-1.5 rounded-full text-xs font-display uppercase tracking-[0.25em]"
               style={{ border: "1px solid var(--panel-border)", color: "var(--gold)" }}>
            Est. 2026 — Fine Campus Culinary
          </div>
          <h1 className="font-display text-4xl sm:text-6xl font-800 leading-tight">
            Order Ahead. Skip The Line.<br />
            <span className="gold-text italic font-classic font-normal">Dine Like Royalty.</span>
          </h1>
          <p className="max-w-xl mx-auto text-sm sm:text-base leading-relaxed" style={{ color: "var(--ink-soft)" }}>
            ক্যাম্পাস ডাইনিংয়ে আনুন স্বাচ্ছন্দ্য। ডিজিটাল টোকেন ও স্মার্ট ওয়ালেটের মাধ্যমে লাইন ছাড়া নিন আপনার পছন্দের খাবার।
          </p>
          <div className="flex flex-wrap justify-center gap-4 pt-4">
            <button onClick={scrollToAuth} className="btn-primary px-8 py-3.5 rounded-md text-xs">Get Started</button>
            <a href="#menu" className="btn-gold px-8 py-3.5 rounded-md text-xs inline-block">Explore Menu</a>
          </div>
        </div>
      </section>

      <section id="features" className="border-y py-12 px-6" style={{ borderColor: "var(--panel-border)", background: "rgba(212, 175, 55, 0.02)" }}>
        <div className="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
          {features.map((f, i) => (
            <div key={i} className="card p-6 text-center space-y-2">
              <div className="w-10 h-10 mx-auto rounded-full grid place-items-center mb-3" style={{ background: "rgba(212,175,55,0.1)", color: "var(--gold)" }}>❖</div>
              <h4 className="font-display font-700 text-sm" style={{ color: "var(--gold-bright)" }}>{f.title}</h4>
              <p className="text-xs leading-relaxed" style={{ color: "var(--ink-soft)" }}>{f.desc}</p>
            </div>
          ))}
        </div>
      </section>

      <section id="menu" className="max-w-6xl mx-auto px-6 py-24 w-full">
        <div className="text-center mb-14 space-y-3">
          <p className="font-display text-xs uppercase tracking-[0.3em]" style={{ color: "var(--gold)" }}>Crafted With Excellence</p>
          <h2 className="font-display text-3xl font-800">A Taste of Our Menu</h2>
          <div className="divider-flourish text-xs max-w-xs mx-auto">❖</div>
        </div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
          {sampleMenu.map((item, idx) => (
            <div key={idx} className="card overflow-hidden group">
              <div className="h-44 overflow-hidden relative" style={{ background: "var(--teal-deep)" }}>
                <img src={item.img} alt={item.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-85" />
                <div className="absolute inset-0" style={{ background: "linear-gradient(to top, var(--panel), transparent 60%)" }}></div>
              </div>
              <div className="p-5 relative">
                <div className="font-display font-700 text-base">{item.name}</div>
                <div className="text-xs mt-0.5" style={{ color: "var(--ink-soft)" }}>{item.bn}</div>
                <div className="font-mono text-sm font-600 mt-3" style={{ color: "var(--gold)" }}>{item.price}</div>
              </div>
            </div>
          ))}
          <div className="card p-6 flex flex-col items-center justify-center text-center space-y-3 border-dashed">
            <Icon path={I.menu} className="w-8 h-8" style={{ color: "var(--gold)" }} />
            <div className="font-display font-700 text-sm">Full Menu Inside</div>
            <p className="text-xs" style={{ color: "var(--ink-soft)" }}>লগইন করে রিয়েল-টাইম স্টক এবং খাবার অর্ডার করুন।</p>
          </div>
        </div>
      </section>

      <section ref={authRef} className="py-20 px-6 border-t" style={{ borderColor: "var(--panel-border)" }}>
        <div className="max-w-md mx-auto">
          <div className="text-center mb-8 space-y-2">
            <p className="font-display text-xs uppercase tracking-[0.3em]" style={{ color: "var(--gold)" }}>Portal Access</p>
            <h2 className="font-display text-2xl font-800">Sign In To CampusDine</h2>
          </div>

          <div className="card p-8 fade-in">
            {!role ? (
              <div className="space-y-3.5">
                {roles.map((r) => (
                  <button key={r.key} onClick={() => setRole(r.key)}
                    className="w-full flex items-center gap-4 p-4 rounded-lg border text-left transition-all hover:border-amber-400 group"
                    style={{ borderColor: "var(--panel-border)", background: "rgba(6, 8, 14, 0.4)" }}>
                    <div className="w-11 h-11 rounded-lg grid place-items-center shrink-0 logo-badge">
                      <Icon path={r.icon} className="w-5 h-5" style={{ color: "var(--gold)" }} />
                    </div>
                    <div>
                      <div className="font-display font-700 text-sm group-hover:text-amber-300">{r.label}</div>
                      <div className="text-xs mt-0.5" style={{ color: "var(--ink-soft)" }}>{r.desc}</div>

/* ---------------- Menu & Order Tab ---------------- */
function MenuOrder({ menu, cart, setCart, placeOrder, walletBalance, busy }) {
  const [cat, setCat] = useState("heavy");
  const filtered = menu.filter(i => i.category === cat);
  const [payMethod, setPayMethod] = useState("wallet");

  const add = (item) => setCart(prev => {
    const existing = prev.find(p => p.id === item.id);
    if (existing) return prev.map(p => p.id === item.id ? { ...p, qty: p.qty + 1 } : p);
    return [...prev, { ...item, qty: 1 }];
  });
  const dec = (item) => setCart(prev => prev.map(p => p.id === item.id ? { ...p, qty: p.qty - 1 } : p).filter(p => p.qty > 0));

  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const canPay = payMethod === "cash" || walletBalance >= total;

  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2">
        <div className="flex gap-2 mb-5">
          {CATEGORIES.map(c => (
            <button key={c.id} onClick={() => setCat(c.id)} className={`tab-btn px-4 py-2 rounded-full text-xs ${cat === c.id ? "active" : ""}`}>
              {c.label}
            </button>
          ))}
        </div>
        <div className="grid sm:grid-cols-2 gap-4">
          {filtered.map(item => {
            const out = item.stock <= 0;
            const inCart = cart.find(c => c.id === item.id);
            return (
              <div key={item.id} className={`card p-4 flex flex-col justify-between ${out ? "opacity-40" : ""}`}>
                <div>
                  <div className="flex items-start justify-between">
                    <div>
                      <div className="font-display font-700 text-amber-300">{item.name}</div>
                      <div className="text-xs text-gray-400 mt-0.5">{item.bn}</div>
                    </div>
                    {item.tag && !out && (
                      <span className="text-[10px] font-mono px-2 py-0.5 rounded-full bg-amber-400 text-slate-950 font-700">{item.tag}</span>
                    )}
                  </div>
                </div>
                <div className="mt-4 flex items-center justify-between">
                  <span className="font-mono font-700 text-lg">{taka(item.price)}</span>
                  {out ? (
                    <span className="text-xs text-red-400 font-600">Stock Out</span>
                  ) : inCart ? (
                    <div className="flex items-center gap-2">
                      <button onClick={() => dec(item)} className="w-7 h-7 rounded-full grid place-items-center border border-amber-400/30"><Icon path={I.minus} className="w-3.5 h-3.5" /></button>
                      <span className="font-mono w-5 text-center text-sm">{inCart.qty}</span>
                      <button onClick={() => add(item)} className="w-7 h-7 rounded-full grid place-items-center bg-amber-400 text-slate-950"><Icon path={I.plus} className="w-3.5 h-3.5" /></button>
                    </div>
                  ) : (
                    <button onClick={() => add(item)} className="btn-primary px-4 py-1.5 rounded-md text-xs">Add</button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div>
        <div className="card p-5 sticky top-20">
          <div className="font-display font-700 flex items-center gap-2 mb-4 text-amber-300">
            <Icon path={I.cart} className="w-5 h-5" /> Cart Summary
          </div>
          {cart.length === 0 ? (
            <p className="text-xs text-gray-400">কার্ট খালি — মেনু থেকে খাবার পছন্দ করুন।</p>
          ) : (
            <div className="space-y-2 mb-4">
              {cart.map(i => (
                <div key={i.id} className="flex justify-between text-xs">
                  <span>{i.name} × {i.qty}</span>
                  <span className="font-mono">{taka(i.price * i.qty)}</span>
                </div>
              ))}
            </div>
          )}
          <div className="border-t border-amber-400/20 pt-3 mb-4">
            <div className="flex justify-between font-700 text-sm">
              <span>Total Amount</span>
              <span className="font-mono text-amber-300">{taka(total)}</span>
            </div>
          </div>
          {cart.length > 0 && (
            <>
              <div className="flex gap-2 mb-4 text-xs">
                <button onClick={() => setPayMethod("wallet")} className={`flex-1 py-2 rounded-lg border ${payMethod === "wallet" ? "bg-amber-400 text-slate-950 font-700" : "border-amber-400/20"}`}>
                  Wallet
                </button>
                <button onClick={() => setPayMethod("cash")} className={`flex-1 py-2 rounded-lg border ${payMethod === "cash" ? "bg-amber-400 text-slate-950 font-700" : "border-amber-400/20"}`}>
                  Cash
                </button>
              </div>
              {payMethod === "wallet" && !canPay && (
                <p className="text-[11px] text-red-400 mb-3">পর্যাপ্ত ব্যালেন্স নেই, ওয়ালেট রিচার্জ করুন।</p>
              )}
              <button disabled={!canPay || busy} onClick={() => placeOrder(cart, payMethod)} className="btn-primary w-full py-2.5 rounded-lg text-xs">
                {busy ? "Placing Order..." : "Confirm & Get Token"}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function MealCalendar({ role, year, month, calendar, bill, onToggle }) {
  const total = daysInMonth(year, month);
  const monthName = new Date(year, month - 1).toLocaleString("default", { month: "long" });
  const firstWeekday = new Date(year, month - 1, 1).getDay();

  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2 card p-6">
        <div className="flex items-center justify-between mb-6">
          <div className="font-display font-700 text-lg text-amber-300">{monthName} {year}</div>
          <div className="text-xs text-gray-400">ট্যাপ করে মিল পর্যায় পরিবর্তন করুন: Off → Full → Half</div>
        </div>
        <div className="grid grid-cols-7 gap-2 mb-2 text-xs text-center font-600 text-gray-400">
          {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d, i) => <div key={i}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-2">
          {Array.from({ length: firstWeekday }).map((_, i) => <div key={"e" + i}></div>)}
          {Array.from({ length: total }).map((_, i) => {
            const day = i + 1;
            const status = calendar[day] || "off";
            return (
              <div key={day} onClick={() => onToggle(day, status)}
                   className={`cal-cell text-xs font-700 ${status === "full" ? "cal-full" : status === "half" ? "cal-half" : ""}`}>
                {day}
              </div>
            );
          })}
        </div>
        <div className="flex gap-4 mt-6 text-xs text-gray-400 justify-center">
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-amber-900 border border-amber-500"></span> Full Meal</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-amber-400/20 border border-amber-400"></span> Half Meal</span>
          <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded border border-gray-700"></span> Off</span>
        </div>
      </div>

      <div className="card p-6 h-fit">
        <div className="font-display font-700 mb-4 text-amber-300">Monthly Bill Summary</div>
        <div className="space-y-2 text-xs mb-4">
          <div className="flex justify-between"><span>Full Meal ({taka(bill.fullRate)})</span><span className="font-mono">{bill.fullDays} days</span></div>
          <div className="flex justify-between"><span>Half Meal ({taka(bill.halfRate)})</span><span className="font-mono">{bill.halfDays} days</span></div>
        </div>
        <div className="border-t border-amber-400/20 pt-3">
          <div className="flex justify-between font-700 text-sm">
            <span>Total Payable</span><span className="font-mono text-amber-300">{taka(bill.total)}</span>
          </div>
        </div>
        <p className="text-[11px] text-gray-400 mt-4 leading-relaxed">অটো-বিলিং হিসাব অনুযায়ী {role === "teacher" ? "Faculty" : "Student"} রেট প্রয়োগ করা হয়েছে।</p>
      </div>
    </div>
  );
}

            {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
          </select>
          <input placeholder="Price ৳" type="number" value={form.price} onChange={e => setForm({ ...form, price: e.target.value })} className="px-3 py-2 rounded-lg border text-xs" style={{ borderColor: "var(--panel-border)" }} />
          <div className="flex gap-2">
            <input placeholder="Stock" type="number" value={form.stock} onChange={e => setForm({ ...form, stock: e.target.value })} className="w-full px-3 py-2 rounded-lg border text-xs" style={{ borderColor: "var(--panel-border)" }} />
            <button disabled={busy} onClick={submit} className="btn-gold px-3 rounded-lg"><Icon path={I.check} className="w-4 h-4" /></button>
          </div>
        </div>
      )}

      <div className="card overflow-hidden">
        <table className="w-full text-xs text-left">
          <thead className="bg-amber-400 text-slate-950 font-display">
            <tr>
              <th className="p-3">Item</th>
              <th className="p-3">Category</th>
              <th className="p-3">Price (৳)</th>
              <th className="p-3">Stock</th>
            </tr>
          </thead>
          <tbody>
            {menu.map(item => (
              <tr key={item.id} className="border-t border-amber-400/10">
                <td className="p-3 font-600">{item.name} <div className="text-[10px] text-gray-400 font-normal">{item.bn}</div></td>
                <td className="p-3 capitalize">{item.category}</td>
                <td className="p-3">
                  <input type="number" defaultValue={item.price} onBlur={e => updateItem(item.id, { price: Number(e.target.value) })} className="w-20 px-2 py-1 rounded border font-mono" style={{ borderColor: "var(--panel-border)" }} />
                </td>
                <td className="p-3">
                  <input type="number" defaultValue={item.stock} onBlur={e => updateItem(item.id, { stock: Number(e.target.value) })} className="w-20 px-2 py-1 rounded border font-mono" style={{ borderColor: item.stock <= LOW_STOCK_THRESHOLD ? "var(--brick)" : "var(--panel-border)" }} />
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------------- Admin: Orders Queue ---------------- */
function AdminOrders({ orders, advance }) {
  if (orders.length === 0) return <div className="card p-10 text-center text-xs text-gray-400">Queue is empty.</div>;
  return (
    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
      {orders.map(o => (
        <div key={o.token || o.id} className="card p-5 flex flex-col justify-between">
          <div>
            <div className="flex justify-between items-center mb-2">
              <span className="font-mono font-700 text-lg text-amber-300">{o.token}</span>
              <span className="text-[10px] px-2.5 py-1 rounded-full bg-amber-400 text-slate-950 font-700">{o.status}</span>
            </div>
            <div className="text-xs text-gray-300 mb-3">{o.items?.map(i => `${i.name} ×${i.qty}`).join(", ")}</div>
          </div>
          <div className="flex justify-between items-center border-t border-amber-400/10 pt-3">
            <span className="font-mono text-xs">{taka(o.total)}</span>
            {o.status !== "Ready" ? (
              <button onClick={() => advance(o.id)} className="btn-primary px-3 py-1.5 rounded-md text-[11px] flex items-center gap-1">
                Advance <Icon path={I.arrow} className="w-3.5 h-3.5" />
              </button>
            ) : (
              <span className="text-xs text-emerald-400 flex items-center gap-1"><Icon path={I.check} className="w-4 h-4" /> Ready</span>
            )}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------------- Admin: Reports ---------------- */
function AdminReports({ trend, forecast }) {
  const max = Math.max(1, ...trend.map(r => r.revenue));
  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2 card p-6">
        <div className="font-display font-700 mb-6 text-amber-300">Revenue Trend</div>
        <div className="flex items-end gap-4 h-48 pt-6">
          {trend.map(r => (
            <div key={r.ym} className="flex-1 flex flex-col items-center gap-2">
              <div className="text-[10px] font-mono text-gray-400">{Math.round(r.revenue / 1000)}k</div>
              <div className="w-full rounded-t-md bg-gradient-to-t from-amber-600 to-amber-300" style={{ height: `${(r.revenue / max) * 130}px` }}></div>
              <div className="text-[11px] font-600">{monthLabel(r.ym)}</div>
            </div>
          ))}
        </div>
      </div>
      <div className="card p-6">
        <div className="font-display font-700 mb-2 text-amber-300">Demand Forecast</div>
        <p className="text-xs text-gray-400 mb-4">Subscription analytics derived</p>
        <div className="ticket p-5">
          <div className="perf pl-4">
            <div className="text-[10px] uppercase font-display opacity-70">Predicted Meals (Tomorrow)</div>
            <div className="font-mono text-3xl font-800 text-amber-300 mt-1">{forecast.predictedMealCount ?? 0}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------- App Core Entry ---------------- */
function App() {
  const [apiBase, setApiBase] = useState(DEFAULT_API_BASE);
  const [session, setSession] = useState(null);
  const [tab, setTab] = useState("menu");
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [connected, setConnected] = useState(false);

  const [menu, setMenu] = useState([]);
  const [cart, setCart] = useState([]);
  const [orders, setOrders] = useState([]);
  const [wallet, setWallet] = useState({ balance: 0, transactions: [] });
  const [calendar, setCalendar] = useState({});
  const [bill, setBill] = useState({ fullDays: 0, halfDays: 0, fullRate: 0, halfRate: 0, total: 0 });
  const [overview, setOverview] = useState({});
  const [trend, setTrend] = useState([]);
  const [forecast, setForecast] = useState({});

  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;

  const socketRef = useRef(null);
  const showError = (e) => setError(typeof e === "string" ? e : e.message);

  const call = (path, opts) => api(apiBase, path, { ...opts, token: session?.token });

  const mapMenu = (rows) => rows.map(m => ({ ...m, bn: m.name_bn }));
  const mapWallet = (data) => ({
    balance: data.balance,
    transactions: data.transactions.map(t => ({ label: t.label, amount: t.amount, time: new Date(t.created_at).toLocaleString() })),
  });
  const mapCalendar = (rows) => {
    const map = {};
    rows.forEach(r => { map[new Date(r.the_date).getDate()] = r.status; });
    return map;
  };

  const refreshMenu = async () => setMenu(mapMenu(await call("/api/menu")));
  const refreshWallet = async () => setWallet(mapWallet(await call("/api/wallet")));
  const refreshCalendar = async () => {
    setCalendar(mapCalendar(await call(`/api/calendar?year=${year}&month=${month}`)));
    setBill(await call(`/api/calendar/bill?year=${year}&month=${month}`));
  };
  const refreshMyOrders = async () => setOrders(await call("/api/orders/mine"));
  const refreshAdminOrders = async () => setOrders(await call("/api/orders"));
  const refreshOverview = async () => setOverview(await call("/api/admin/overview"));
  const refreshReports = async () => {
    setTrend(await call("/api/admin/reports/revenue-trend"));
    setForecast(await call("/api/admin/reports/forecast"));
  };

  const onAuth = (token, user) => {
    setSession({ token, user });
    setTab(user.role === "admin" ? "overview" : "menu");
  };

  const logout = () => {
    if (socketRef.current) socketRef.current.disconnect();
    setSession(null); setCart([]); setError(null);
  };

  useEffect(() => {
    if (!session) return;
    (async () => {
      try {
        if (session.user.role === "admin") {
          await Promise.all([refreshMenu(), refreshAdminOrders(), refreshOverview(), refreshReports()]);
        } else {
          await Promise.all([refreshMenu(), refreshMyOrders(), refreshWallet(), refreshCalendar()]);
        }
      } catch (e) { showError(e); }
    })();
  }, [session]);

  useEffect(() => {
    if (!session) return;
    const socket = io(apiBase, { auth: { token: session.token } });
    socketRef.current = socket;
    socket.on("connect", () => setConnected(true));
    socket.on("disconnect", () => setConnected(false));
    socket.on("order:new", (order) => {
      if (session.user.role === "admin") setOrders(prev => [order, ...prev]);
    });
    socket.on("order:update", (order) => {
      setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: order.status } : o));
    });
    return () => socket.disconnect();
  }, [session, apiBase]);

  const placeOrder = async (cartItems, paymentMethod) => {
    setBusy(true); setError(null);
    try {
      await call("/api/orders", { method: "POST", body: { items: cartItems.map(c => ({ id: c.id, qty: c.qty })), paymentMethod } });
      setCart([]);
      await Promise.all([refreshMyOrders(), refreshMenu(), paymentMethod === "wallet" ? refreshWallet() : Promise.resolve()]);
      setTab("track");
    } catch (e) { showError(e); } finally { setBusy(false); }
  };

  const advanceOrder = async (id) => {
    try {
      await call(`/api/orders/${id}/advance`, { method: "PATCH" });
      await refreshAdminOrders();
    } catch (e) { showError(e); }
  };

  const topUp = async (amount) => {
    setBusy(true); setError(null);
    try {
      await call("/api/wallet/topup", { method: "POST", body: { amount } });
      await refreshWallet();
    } catch (e) { showError(e); } finally { setBusy(false); }
  };

  const toggleDay = async (day, currentStatus) => {
    const next = currentStatus === "off" ? "full" : currentStatus === "full" ? "half" : "off";
    try {
      await call(`/api/calendar/${day}`, { method: "PUT", body: { year, month, status: next } });
      await refreshCalendar();
    } catch (e) { showError(e); }
  };

  const updateMenuItem = async (id, patch) => {
    try {
      await call(`/api/menu/${id}`, { method: "PUT", body: patch });
      await refreshMenu();
    } catch (e) { showError(e); }
  };
  const addMenuItem = async (item) => {
    try {
      await call("/api/menu", { method: "POST", body: item });
      await refreshMenu();
    } catch (e) { showError(e); }
  };

  if (!session) return <Login apiBase={apiBase} setApiBase={setApiBase} onAuth={onAuth} />;

  const userTabs = [
    { key: "menu", label: "Menu & Order", icon: I.menu },
    { key: "track", label: "Track Order", icon: I.clock },
    { key: "calendar", label: "Meal Calendar", icon: I.calendar },
    { key: "wallet", label: "Wallet", icon: I.wallet },
  ];
  const adminTabs = [
    { key: "overview", label: "Overview", icon: I.dashboard },
    { key: "adminMenu", label: "Menu", icon: I.box },
    { key: "adminOrders", label: "Orders Queue", icon: I.ticket },
    { key: "reports", label: "Reports", icon: I.chart },
  ];

  return (
    <div className="min-h-screen">
      <TopBar role={session.user.role} name={session.user.name}
              tabs={session.user.role === "admin" ? adminTabs : userTabs}
              active={tab} setActive={setTab} onLogout={logout} connected={connected} />
      
      <main className="max-w-6xl mx-auto p-6 fade-in" key={tab}>
        {error && (
          <div className="p-4 rounded-lg mb-6 text-xs flex justify-between items-center border bg-red-950/40 border-red-500/40 text-red-300">
            <span>{error}</span>
            <button onClick={() => setError(null)} className="font-700 text-sm">✕</button>
          </div>
        )}

        {session.user.role !== "admin" && tab === "menu" && (
          <MenuOrder menu={menu} cart={cart} setCart={setCart} placeOrder={placeOrder} walletBalance={wallet.balance} busy={busy} />
        )}
        {session.user.role !== "admin" && tab === "track" && <TrackOrder orders={orders} />}
        {session.user.role !== "admin" && tab === "calendar" && (
          <MealCalendar role={session.user.role} year={year} month={month} calendar={calendar} bill={bill} onToggle={toggleDay} />
        )}
        {session.user.role !== "admin" && tab === "wallet" && (
          <WalletTab balance={wallet.balance} topUp={topUp} transactions={wallet.transactions} busy={busy} />
        )}

        {session.user.role === "admin" && tab === "overview" && <AdminOverview overview={overview} orders={orders} />}
        {session.user.role === "admin" && tab === "adminMenu" && (
          <AdminMenu menu={menu} updateItem={updateMenuItem} addItem={addMenuItem} busy={busy} />
        )}
        {session.user.role === "admin" && tab === "adminOrders" && <AdminOrders orders={orders} advance={advanceOrder} />}
        {session.user.role === "admin" && tab === "reports" && <AdminReports trend={trend} forecast={forecast} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
