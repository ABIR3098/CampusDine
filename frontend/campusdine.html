                <td className="p-3">{item.is_active === 0 || item.is_active === false ? <button onClick={() => updateItem(item.id, { isActive: true })} className="text-emerald-600 text-[11px]">Restore</button> : <button onClick={() => window.confirm(`Hide ${item.name} from the menu? Past orders are kept.`) && updateItem(item.id, { isActive: false })} className="text-red-400 text-[11px]">Archive</button>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------------- Admin: Orders Queue ---------------- */
function AdminCoupons({ coupons, createCoupon, toggleCoupon }) {
  const blank = { code: "", discountType: "PERCENTAGE", discountValue: "", minOrderAmount: "", maxDiscount: "", usageLimit: "", expiryDate: "" };
  const [form, setForm] = useState(blank);
  const box = "px-3 py-2 rounded-lg border text-xs";
  const bd = { borderColor: "var(--panel-border)" };
  const submit = async () => { if (!form.code || !form.discountValue) return; if (await createCoupon(form)) setForm(blank); };
  return (
    <div className="space-y-4">
      <div className="font-display font-700 text-lg text-amber-300">Coupons</div>
      <div className="card p-4 grid sm:grid-cols-4 gap-3">
        <input placeholder="CODE" value={form.code} onChange={e => setForm({ ...form, code: e.target.value.toUpperCase() })} className={box} style={bd} />
        <select value={form.discountType} onChange={e => setForm({ ...form, discountType: e.target.value })} className={box} style={bd}><option value="PERCENTAGE">% off</option><option value="FIXED">৳ off</option></select>
        <input type="number" min="0" placeholder="Value" value={form.discountValue} onChange={e => setForm({ ...form, discountValue: e.target.value })} className={box} style={bd} />
        <input type="number" min="0" placeholder="Min order ৳" value={form.minOrderAmount} onChange={e => setForm({ ...form, minOrderAmount: e.target.value })} className={box} style={bd} />
        <input type="number" min="0" placeholder="Max discount ৳" value={form.maxDiscount} onChange={e => setForm({ ...form, maxDiscount: e.target.value })} className={box} style={bd} />
        <input type="number" min="1" placeholder="Usage limit" value={form.usageLimit} onChange={e => setForm({ ...form, usageLimit: e.target.value })} className={box} style={bd} />
        <input type="date" value={form.expiryDate} onChange={e => setForm({ ...form, expiryDate: e.target.value })} className={box} style={bd} title="Expiry date" />
        <button onClick={submit} className="btn-primary px-4 py-2 rounded-lg text-xs">Create coupon</button>
      </div>
      <div className="card overflow-hidden">
        <table className="w-full text-xs text-left">
          <thead className="bg-amber-400 text-slate-950 font-display"><tr><th className="p-3">Code</th><th className="p-3">Discount</th><th className="p-3">Min order</th><th className="p-3">Used</th><th className="p-3">Expires</th><th className="p-3">Status</th></tr></thead>
          <tbody>
            {coupons.length === 0 && <tr><td colSpan="6" className="p-6 text-center text-gray-400">No coupons yet.</td></tr>}
            {coupons.map(c => (
              <tr key={c.id} className="border-t border-amber-400/10">
                <td className="p-3 font-mono font-700">{c.code}</td>
                <td className="p-3">{c.discount_type === "PERCENTAGE" ? `${c.discount_value}%` : taka(c.discount_value)}{c.max_discount ? ` (max ${taka(c.max_discount)})` : ""}</td>
                <td className="p-3">{taka(c.min_order_amount)}</td>
                <td className="p-3">{c.used_count}{c.usage_limit ? ` / ${c.usage_limit}` : ""}</td>
                <td className="p-3">{c.expiry_date ? new Date(c.expiry_date).toLocaleDateString() : "Never"}</td>
                <td className="p-3"><button onClick={() => toggleCoupon(c.id, !c.is_active)} className={`px-3 py-1 rounded-full border text-[11px] ${c.is_active ? "border-emerald-500/50 text-emerald-600" : "border-gray-400 text-gray-400"}`}>{c.is_active ? "Active" : "Disabled"}</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------------- Admin: Reports ---------------- */
function AdminReports({ trend, forecast, daily, topItems, exportCsv, call, showError }) {
  const max = Math.max(1, ...trend.map(r => r.revenue));
  const dmax = Math.max(1, ...daily.map(r => r.revenue));
  return (
    <div className="grid lg:grid-cols-3 gap-6">
      <div className="lg:col-span-2 card p-6">
        <div className="font-display font-700 mb-6 text-amber-300">Revenue Trend</div>
        <div className="flex items-end gap-4 h-48 pt-6">
          {trend.map(r => (
            <div key={r.ym} className="flex-1 flex flex-col items-center gap-2">
              <div className="text-[10px] font-mono text-gray-400">{r.revenue >= 1000 ? `${(r.revenue / 1000).toFixed(1)}k` : Math.round(r.revenue)}</div>
              <div className="w-full max-w-[5rem] rounded-t-md bg-amber-400" style={{ border: "2px solid var(--ink)", borderBottom: 0, height: `${(r.revenue / max) * 130}px` }}></div>
              <div className="text-[11px] font-600">{monthLabel(r.ym)}</div>
            </div>
          ))}
        </div>
      </div>
      <div className="card p-6">
        <div className="font-display font-700 mb-2 text-amber-300">Demand Forecast</div>
        <p className="text-xs text-gray-400 mb-4">Subscription analytics derived</p>
        <div className="ticket p-5">
          <div className="perf pl-4">
            <div className="text-[10px] uppercase font-display opacity-70">Predicted Meals (Tomorrow)</div>
            <div className="font-mono text-3xl font-800 text-amber-300 mt-1">{forecast.predictedMealCount ?? 0}</div>
          </div>
        </div>
        <button onClick={exportCsv} className="mt-4 w-full px-3 py-2 rounded-lg border border-amber-400/40 text-xs">Export all orders (CSV)</button>
      </div>
      <div className="lg:col-span-2 card p-6">
        <div className="font-display font-700 mb-4 text-amber-300">Last 7 Days</div>
        <div className="flex items-end gap-3 h-36">
          {daily.map(d => (
            <div key={d.day} className="flex-1 flex flex-col items-center gap-1" title={`${d.orders} orders`}>
              <div className="text-[10px] font-mono text-gray-400">{d.orders}</div>
              <div className="w-full rounded-t-md bg-emerald-500" style={{ height: `${Math.max(3, (d.revenue / dmax) * 80)}px` }}></div>
              <div className="text-[10px]">{d.day.slice(5)}</div>
            </div>
          ))}
        </div>
      </div>
      <div className="card p-6">
        <div className="font-display font-700 mb-3 text-amber-300">Top Sellers (30 days)</div>
        {topItems.length === 0 ? <p className="text-xs text-gray-400">No sales yet.</p> : <div className="space-y-2">{topItems.map((t, i) => <div key={t.name} className="flex justify-between text-xs"><span>{i + 1}. {t.name}</span><span className="font-mono">{t.sold} sold</span></div>)}</div>}
      </div>
      <KitchenInsights call={call} showError={showError} />
    </div>
  );
}

function AdminReviews({ reviews }) {
  return <div className="space-y-4"><div className="flex items-center justify-between"><div className="font-display font-700 text-lg text-amber-300">Customer Reviews</div><span className="text-xs text-gray-400">{reviews.length} review{reviews.length === 1 ? "" : "s"}</span></div>{reviews.length === 0 ? <div className="card p-10 text-center text-xs text-gray-400">No customer reviews yet.</div> : <div className="grid md:grid-cols-2 gap-4">{reviews.map(review => <div key={review.id} className="card p-5"><div className="flex justify-between gap-3"><div><div className="font-700 text-sm">{review.menu_name}</div><div className="text-[11px] text-gray-400">{review.user_name} · {review.external_id}</div></div><div className="text-amber-500 tracking-widest">{"★".repeat(review.rating)}<span className="text-gray-300">{"★".repeat(5 - review.rating)}</span></div></div><p className="text-sm mt-4" style={{ color: "var(--ink-soft)" }}>{review.review || "No written review"}</p><div className="text-[10px] text-gray-400 mt-3">{new Date(review.created_at).toLocaleString()}</div></div>)}</div>}</div>;
}

/* ---------------- App Core Entry ---------------- */
function App() {
  const [apiBase, setApiBase] = useState(DEFAULT_API_BASE);
  const [session, setSession] = useState(null);
  const [tab, setTab] = useState("menu");
  const [lang, setLang] = useState(() => { try { return localStorage.getItem("campusdine_lang") || "en"; } catch (e) { return "en"; } });
  LANG = lang; // read by tr() while rendering
  const toggleLang = () => { const next = lang === "bn" ? "en" : "bn"; try { localStorage.setItem("campusdine_lang", next); } catch (e) { /* storage blocked */ } setLang(next); };
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [connected, setConnected] = useState(false);

  const [menu, setMenu] = useState([]);
  const [cart, setCart] = useState([]);
  const [orders, setOrders] = useState([]);
  const [wallet, setWallet] = useState({ balance: 0, transactions: [] });
  const [calendar, setCalendar] = useState({});
  const [bill, setBill] = useState({ fullDays: 0, halfDays: 0, fullRate: 0, halfRate: 0, total: 0 });
  const [overview, setOverview] = useState({});
  const [trend, setTrend] = useState([]);
  const [forecast, setForecast] = useState({});
  const [favorites, setFavorites] = useState([]);
  const [availableCoupons, setAvailableCoupons] = useState([]);
  const [adminReviews, setAdminReviews] = useState([]);
  const [receivingNumber, setReceivingNumber] = useState("");
  const [demoTopup, setDemoTopup] = useState(true);
  const [booting, setBooting] = useState(true);
  const [darkMode, setDarkMode] = useState(() => { try { return localStorage.getItem("campusdine_dark") === "1"; } catch(e) { return false; } });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", darkMode ? "dark" : "light");
    try { localStorage.setItem("campusdine_dark", darkMode ? "1" : "0"); } catch(e) {}
  }, [darkMode]);
  const [notifs, setNotifs] = useState({ list: [], unread: 0 });
  const [toasts, setToasts] = useState([]);
  const [daily, setDaily] = useState([]);
  const [topItems, setTopItems] = useState([]);
  const [adminCoupons, setAdminCoupons] = useState([]);
  const orderKeyRef = useRef(null);

  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;

  const socketRef = useRef(null);
  const pushToast = (message) => { const id = Date.now() + Math.random(); setToasts(t => [...t, { id, message }]); setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 6000); };
  const showError = (e) => setError(typeof e === "string" ? e : e.message);

  const call = (path, opts) => api(apiBase, path, { ...opts, token: session?.token }).catch(e => {
    if (e.status === 401 && /token/i.test(e.message)) { logout(); e.message = "Your session expired. Please log in again."; }
    throw e;
  });

  // public settings (receiving number etc.) + restore the session after a page refresh
  useEffect(() => {
    api(apiBase, "/api/config").then(c => { setReceivingNumber(c.receivingNumber || ""); setDemoTopup(c.demoTopup !== false); }).catch(() => {});
    let saved = null;
    try { saved = sessionStorage.getItem("campusdine_token"); } catch (e) { /* storage blocked */ }
    if (!saved) { setBooting(false); return; }
    api(apiBase, "/api/auth/me", { token: saved })
      .then(data => { setSession({ token: saved, user: data.user }); setTab(data.user.role === "admin" ? "overview" : "menu"); })
      .catch(() => { try { sessionStorage.removeItem("campusdine_token"); } catch (e) {} })
      .finally(() => setBooting(false));
  }, []);

  const mapMenu = (rows) => rows.map(m => ({ ...m, bn: m.name_bn }));
  const mapWallet = (data) => ({
    balance: data.balance,
    transactions: data.transactions.map(t => ({ id: t.id, label: t.label, amount: t.amount, time: new Date(t.created_at).toLocaleString() })),
  });
  const mapCalendar = (rows) => {
    const map = {};
    rows.forEach(r => { map[Number(String(r.the_date).slice(8, 10))] = r.status; });
    return map;
  };

  const refreshMenu = async () => setMenu(mapMenu(await call(session?.user?.role === "admin" ? "/api/menu?includeArchived=true" : "/api/menu")));
  const refreshWallet = async () => setWallet(mapWallet(await call("/api/wallet")));
  const removeTransaction = async (id) => { if (!id || !window.confirm(id === "all" ? "Remove all wallet entries from your history?" : "Remove this entry from your wallet history?")) return; try { await call(id === "all" ? "/api/wallet/transactions" : `/api/wallet/transactions/${id}`, { method: "DELETE" }); await refreshWallet(); } catch (e) { showError(e); } };
  const refreshCalendar = async () => {
    setCalendar(mapCalendar(await call(`/api/calendar?year=${year}&month=${month}`)));
    setBill(await call(`/api/calendar/bill?year=${year}&month=${month}`));
  };
  const refreshMyOrders = async () => setOrders(await call("/api/orders/mine"));
  const refreshFavorites = async () => { const data = await call("/api/favorites"); setFavorites(data.favorites || []); };
  const refreshCoupons = async () => { const data = await call("/api/coupons/available"); setAvailableCoupons(data.coupons || []); };
  const refreshAdminOrders = async () => setOrders(await call("/api/orders"));
  const refreshOverview = async () => setOverview(await call("/api/admin/overview"));
  const refreshReports = async () => {
    setTrend(await call("/api/admin/reports/revenue-trend"));
    setForecast(await call("/api/admin/reports/forecast"));
    setDaily(await call("/api/admin/reports/daily"));
    setTopItems(await call("/api/admin/reports/top-items"));
  };
  const refreshAdminCoupons = async () => { const data = await call("/api/coupons"); setAdminCoupons(data.coupons || []); };
  const refreshNotifs = async () => { const data = await call("/api/notifications/history"); setNotifs({ list: data.notifications || [], unread: data.unread || 0 }); };
  const readNotifs = async () => { try { await call("/api/notifications/read-all", { method: "POST" }); setNotifs(p => ({ unread: 0, list: p.list.map(n => ({ ...n, read: true })) })); } catch (e) { /* non-critical */ } };
  const refreshAdminReviews = async () => { const data = await call("/api/ratings/admin/reviews"); setAdminReviews(data.reviews || []); };

  const onAuth = (token, user) => {
    try { sessionStorage.setItem("campusdine_token", token); } catch (e) { /* storage blocked */ }
    setSession({ token, user });
    setTab(user.role === "admin" ? "overview" : "menu");
  };

  const logout = () => {
    if (socketRef.current) socketRef.current.disconnect();
    try { sessionStorage.removeItem("campusdine_token"); } catch (e) {}
    setSession(null); setCart([]); setError(null); setNotifs({ list: [], unread: 0 }); setOrders([]);
  };

  useEffect(() => {
    if (!session) return;
    (async () => {
      try {
        if (session.user.role === "admin") {
          await Promise.all([refreshMenu(), refreshAdminOrders(), refreshOverview(), refreshReports(), refreshAdminReviews(), refreshAdminCoupons()]);
        } else {
          await Promise.all([refreshMenu(), refreshMyOrders(), refreshWallet(), refreshCalendar(), refreshFavorites(), refreshCoupons(), refreshNotifs()]);
        }
      } catch (e) { showError(e); }
    })();
  }, [session?.token]);

  useEffect(() => {
    if (!session) return;
    const socket = io(apiBase, { auth: { token: session.token } });
    socketRef.current = socket;
    socket.on("connect", () => setConnected(true));
    socket.on("disconnect", () => setConnected(false));
    const isAdmin = session.user.role === "admin";
    socket.on("order:new", (order) => {
      if (!isAdmin) return;
      setOrders(prev => prev.some(o => o.id === order.id) ? prev : [order, ...prev]);
      pushToast(`New order ${shortToken(order.token)} from ${order.customer || "a customer"}`);
      api(apiBase, "/api/admin/overview", { token: session.token }).then(setOverview).catch(() => {});
    });
    socket.on("order:update", (order) => {
      setOrders(prev => prev.map(o => o.id === order.id ? { ...o, status: order.status, ...(order.refundAmount !== undefined ? { refund_amount: order.refundAmount } : {}), ...(order.picked_up_at !== undefined ? { picked_up_at: order.picked_up_at } : {}) } : o));
    });
    socket.on("stock:low", (item) => { if (isAdmin) { pushToast(item.stock === 0 ? `${item.name} is SOLD OUT` : `Low stock: ${item.name} (${item.stock} left)`); api(apiBase, "/api/admin/overview", { token: session.token }).then(setOverview).catch(() => {}); } });
    socket.on("notification", (n) => {
      setNotifs(p => ({ unread: p.unread + 1, list: [n, ...p.list].slice(0, 30) }));
      pushToast(n.message);
      if (!isAdmin) {
        api(apiBase, "/api/wallet", { token: session.token }).then(d => setWallet(mapWallet(d))).catch(() => {});
        api(apiBase, "/api/orders/mine", { token: session.token }).then(setOrders).catch(() => {}); // picks up treats / group orders other people placed for you
      }
    });
    return () => socket.disconnect();
  }, [session?.token, apiBase]);

  const toggleFavorite = async (item) => {
    try { const exists = favorites.some(f => f.id === item.id); await call(`/api/favorites/${item.id}`, { method: exists ? "DELETE" : "POST" }); await refreshFavorites(); } catch (e) { showError(e); }
  };

  const placeOrder = async (cartItems, paymentMethod, coupon, total, extra = {}) => {
    setBusy(true); setError(null);
    // Same cart + same payment = same key, so a double-click / network retry can never create two orders.
    const sig = JSON.stringify([cartItems.map(c => [c.id, c.qty]), paymentMethod, coupon?.code || "", extra.pickupSlot || "", extra.mealDate || ""]);
    if (!orderKeyRef.current || orderKeyRef.current.sig !== sig) orderKeyRef.current = { sig, key: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random()}` };
    try {
      const order = await call("/api/orders", { method: "POST", body: { items: cartItems.map(c => ({ id: Number(c.id), qty: Number(c.qty) })), couponCode: coupon?.code, paymentMethod, pickupSlot: extra.pickupSlot || undefined, mealDate: extra.mealDate || undefined, idempotencyKey: orderKeyRef.current.key } });
      orderKeyRef.current = null;
      if (order.savings > 0) pushToast(`🌱 You saved ${taka(order.savings)} with the last-hour deal!`);
      if (paymentMethod === "bkash" || paymentMethod === "nagad") {
        try {
          const payment = await call(`/api/payment/${paymentMethod}/initiate`, { method: "POST", body: { orderId: order.id } });
          const paymentUrl = payment.paymentUrl || payment.redirectUrl;
          if (paymentUrl) window.open(paymentUrl, "_blank", "noopener");
        } catch (e) { showError(`Order placed, but online payment could not start: ${e.message} You can pay at pickup or cancel the order in Track Order.`); }
      }
      setCart([]);
      await Promise.all([refreshMyOrders(), refreshMenu(), paymentMethod === "wallet" ? refreshWallet() : Promise.resolve(), refreshCoupons()]);
      setTab("track");
    } catch (e) { showError(e); } finally { setBusy(false); }
  };

  const reorder = (order) => {
    const missing = [];
    setCart(prev => {
      let next = [...prev];
      (order.items || []).forEach(it => {
        const m = menu.find(x => x.id === it.menu_item_id);
        if (!m || m.stock <= 0) { missing.push(it.name); return; }
        const qty = Math.min(it.qty, m.stock, 20);
        const ex = next.find(p => p.id === m.id);
        next = ex ? next.map(p => p.id === m.id ? { ...p, qty: Math.min(p.qty + qty, m.stock, 20) } : p) : [...next, { ...m, qty }];
      });
      return next;
    });
    setTab("menu");
    setTimeout(() => pushToast(missing.length ? `Added to cart. Unavailable now: ${missing.join(", ")}` : "Items added to your cart"), 0);
  };

  const gatewayTopUp = async (method, amount) => {
    const data = await call(`/api/payment/${method}/wallet-topup`, { method: "POST", body: { amount: Number(amount) } });
    if (data.redirectUrl || data.paymentUrl) window.open(data.redirectUrl || data.paymentUrl, "_blank", "noopener");
    await refreshWallet();
    return data;
  };

  useEffect(() => { window.__campusApiBase = apiBase; window.__campusToken = session?.token || ""; }, [apiBase, session]);

  const advanceOrder = async (id) => {
    try {
      await call(`/api/orders/${id}/advance`, { method: "PATCH" });
      await refreshAdminOrders();
    } catch (e) { showError(e); }
  };

  const topUp = async (amount) => {
    setBusy(true); setError(null);
    try {
      await call("/api/wallet/topup", { method: "POST", body: { amount } });
      await refreshWallet();
    } catch (e) { showError(e); } finally { setBusy(false); }
  };

  const toggleDay = async (day, currentStatus) => {
    const next = currentStatus === "off" ? "full" : currentStatus === "full" ? "half" : "off";
    try {
      await call(`/api/calendar/${day}`, { method: "PUT", body: { year, month, status: next } });
      await refreshCalendar();
    } catch (e) { showError(e); }
  };

  const adminCancel = async (order) => {
    if (!window.confirm(`Cancel order ${shortToken(order.token)}? The customer gets a full refund.`)) return;
    try { await call(`/api/orders/${order.id}/admin-cancel`, { method: "PATCH" }); await Promise.all([refreshAdminOrders(), refreshOverview(), refreshMenu()]); } catch (e) { showError(e); }
  };
  const createCoupon = async (f) => {
    const body = { code: f.code, discountType: f.discountType, discountValue: Number(f.discountValue) };
    if (f.minOrderAmount) body.minOrderAmount = Number(f.minOrderAmount);
    if (f.maxDiscount) body.maxDiscount = Number(f.maxDiscount);
    if (f.usageLimit) body.usageLimit = Number(f.usageLimit);
    if (f.expiryDate) body.expiryDate = `${f.expiryDate} 23:59:59`;
    try { await call("/api/coupons", { method: "POST", body }); await refreshAdminCoupons(); return true; } catch (e) { showError(e); return false; }
  };
  const toggleCoupon = async (id, isActive) => { try { await call(`/api/coupons/${id}`, { method: "PUT", body: { isActive } }); await refreshAdminCoupons(); } catch (e) { showError(e); } };
  const adminCollect = async (order) => {
    try { await call("/api/orders/pickup", { method: "POST", body: { code: order.token } }); await Promise.all([refreshAdminOrders(), refreshOverview()]); } catch (e) { showError(e); }
  };
  const exportAdminCsv = async () => { try { await downloadFile("/api/admin/reports/orders.csv", "orders.csv"); } catch (e) { showError(e); } };
  const updateMenuItem = async (id, patch) => {
    try {
      await call(`/api/menu/${id}`, { method: "PUT", body: patch });
      await refreshMenu();
    } catch (e) { showError(e); }
  };
  const addMenuItem = async (item) => {
    try {
      await call("/api/menu", { method: "POST", body: item });
      await refreshMenu();
    } catch (e) { showError(e); }
  };

  if (booting) return <div className="min-h-screen grid place-items-center text-xs" style={{ color: "var(--ink-soft)" }}>Loading…</div>;
  if (!session) return <Login apiBase={apiBase} setApiBase={setApiBase} onAuth={onAuth} />;

  const activeOrderCount = orders.filter(o => ACTIVE_STATUSES.includes(o.status) || o.status === "Ready").length;
  const userTabs = [
    { key: "menu", label: "Menu & Order", icon: I.menu },
    { key: "track", label: activeOrderCount > 0 ? `Track Order (${activeOrderCount})` : "Track Order", icon: I.clock },
    { key: "friends", label: "Friends", icon: I.user },
    { key: "calendar", label: "Calendar & Classes", icon: I.calendar },
    { key: "wallet", label: "Wallet", icon: I.wallet },
    { key: "me", label: "My Stats", icon: I.chart },
    { key: "profile", label: "Profile & Alerts", icon: I.user },
  ];
  const adminTabs = [
    { key: "overview", label: "Overview", icon: I.dashboard },
    { key: "adminMenu", label: "Menu", icon: I.box },
    { key: "adminOrders", label: "Orders Queue", icon: I.ticket },
    { key: "adminPickup", label: "Pickup", icon: I.check },
    { key: "reports", label: "Reports", icon: I.chart },
    { key: "coupons", label: "Coupons", icon: I.ticket },
    { key: "reviews", label: "Reviews", icon: I.ticket },
    { key: "adminSettings", label: "Settings", icon: I.dashboard },
  ];

  return (
    <div className="min-h-screen">
      <TopBar role={session.user.role} name={session.user.name}
              tabs={session.user.role === "admin" ? adminTabs : userTabs}
              active={tab} setActive={setTab} onLogout={logout} connected={connected} lang={lang} toggleLang={toggleLang}
              darkMode={darkMode} setDarkMode={setDarkMode}
              notifs={session.user.role === "admin" ? null : notifs} onReadNotifs={readNotifs} />
      
      <main className="max-w-6xl mx-auto p-6 fade-in" key={tab}>
        {error && (
          <div className="p-4 rounded-lg mb-6 text-xs flex justify-between items-center border bg-red-950/40 border-red-500/40 text-red-300">
            <span>{error}</span>
            <button onClick={() => setError(null)} className="font-700 text-sm">✕</button>
          </div>
        )}

        {session.user.role !== "admin" && tab === "menu" && (
          <MenuOrder menu={menu} cart={cart} setCart={setCart} placeOrder={placeOrder} walletBalance={wallet.balance} busy={busy} favorites={favorites} toggleFavorite={toggleFavorite} call={call} receivingNumber={receivingNumber} availableCoupons={availableCoupons} refreshMenu={refreshMenu} />
        )}
        {session.user.role !== "admin" && tab === "track" && <TrackOrder orders={orders} call={call} refreshOrders={refreshMyOrders} refreshWallet={refreshWallet} reorder={reorder} meId={session.user.id} />}
        {session.user.role !== "admin" && tab === "friends" && <FriendsTab call={call} menu={menu} me={session.user.id} showError={showError} refreshWallet={refreshWallet} refreshOrders={refreshMyOrders} />}
        {session.user.role !== "admin" && tab === "me" && <MeTab call={call} showError={showError} />}
        {session.user.role !== "admin" && tab === "calendar" && (
          <><MealCalendar role={session.user.role} year={year} month={month} calendar={calendar} bill={bill} onToggle={toggleDay} /><ClassRoutine call={call} showError={showError} /></>
        )}
        {session.user.role !== "admin" && tab === "wallet" && (
          <WalletTab balance={wallet.balance} topUp={topUp} gatewayTopUp={gatewayTopUp} removeTransaction={removeTransaction} receivingNumber={receivingNumber} transactions={wallet.transactions} busy={busy} demoTopup={demoTopup} />
        )}
        {session.user.role !== "admin" && tab === "profile" && <ProfileTab call={call} user={session.user} onUserUpdate={user => setSession(prev => ({ ...prev, user }))} />}

        {session.user.role === "admin" && tab === "overview" && <AdminOverview overview={overview} orders={orders} call={call} />}
        {session.user.role === "admin" && tab === "adminMenu" && (
          <AdminMenu menu={menu} updateItem={updateMenuItem} addItem={addMenuItem} busy={busy} />
        )}
        {session.user.role === "admin" && tab === "adminOrders" && <AdminOrders orders={orders} advance={advanceOrder} cancel={adminCancel} collect={adminCollect} />}
        {session.user.role === "admin" && tab === "adminPickup" && <AdminPickup orders={orders} call={call} showError={showError} collect={adminCollect} />}
        {session.user.role === "admin" && tab === "adminSettings" && <AdminSettings call={call} showError={showError} />}
        {session.user.role === "admin" && tab === "reports" && <AdminReports trend={trend} forecast={forecast} daily={daily} topItems={topItems} exportCsv={exportAdminCsv} call={call} showError={showError} />}
        {session.user.role === "admin" && tab === "coupons" && <AdminCoupons coupons={adminCoupons} createCoupon={createCoupon} toggleCoupon={toggleCoupon} />}
        {session.user.role === "admin" && tab === "reviews" && <AdminReviews reviews={adminReviews} />}
      </main>
      <div className="fixed bottom-4 right-4 z-50 space-y-2 max-w-xs">
        {toasts.map(t => <div key={t.id} className="px-4 py-3 rounded-xl text-xs shadow-lg border fade-in" style={{ background: "#fff", borderColor: "var(--ink)", color: "var(--ink)" }}>{t.message}</div>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
